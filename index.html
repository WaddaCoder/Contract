 is freed; merely wait and nothing changes.", "plain": "<b>S.135:</b> a contract between creditor and principal debtor to <b>compound, give time, or not to sue</b> discharges the surety <b>unless the surety assents</b>. <b>S.136:</b> where the time is given by a contract with a <b>third person</b> rather than the debtor, the surety is <b>not</b> discharged (illustration: an overdue bill holder contracting with M). <b>S.137:</b> <b>mere forbearance</b> to sue the debtor, in the absence of a provision to the contrary, does <b>not</b> discharge the surety (a year’s delay in suing).", "cases": [], "links": [{"l": "S.134", "m": 12, "sec": "S.134"}, {"l": "S.63: remission by promisee", "m": 9, "sec": "S.63"}], "blocks": [{"h": "S.135 Discharge of surety when creditor compounds with, gives time to, or agrees not to sue, principal debtor.", "paras": [{"t": "A contract between the creditor and the principal debtor, by which the creditor makes a composition with, or promises to give time to, or not to sue, the principal debtor discharges the surety, unless the surety assents to such contract.", "l": 0}], "ills": []}, {"h": "S.136 Surety not discharged when agreement made with third person to give time to principal debtor.", "paras": [{"t": "Where a contract to give time to the principal debtor is made by the creditor with a third person, and not with the principal debtor, the surety is not discharged.", "l": 0}], "ills": [{"t": "C, the holder of an overdue bill of exchange drawn by A as surety for B, and accepted by B, contracts with M to give time to B. A is not discharged.", "l": 0}]}, {"h": "S.137 Creditor's forbearance to sue does not discharge surety.", "paras": [{"t": "Mere forbearance on the part of the creditor to sue the principal debtor or to enforce any other remedy against him does not, in the absence of any provision in the guarantee to the contrary, discharge the surety.", "l": 0}], "ills": [{"t": "B owes to C a debt guaranteed by A. The debt becomes payable. C does not sue B for year after the debt has become payable. A is not discharged from his suretyship.", "l": 0}]}]}, {"secs": ["138"], "code": "S.138", "term": "Release of one co-surety", "sub": "the others are not discharged", "hook": "Freeing one guarantor does not free his fellows, and it does not free him from them.", "plain": "A release by the creditor of <b>one co-surety</b> does <b>not discharge the others</b>, and does not free the released surety from his responsibility <b>to the other sureties</b>.", "cases": [], "links": [{"l": "S.146: contribution", "m": 12, "sec": "S.145–147"}], "blocks": [{"h": "S.138 Release of one co-surety does not discharge others.", "paras": [{"t": "Where there are co-sureties, a release by the creditor of one of them does not discharge the others; neither does it free the surety so released from his responsibility to the other sureties .", "l": 0}], "ills": []}]}, {"secs": ["139"], "code": "S.139", "term": "Creditor’s act or omission impairing the surety’s remedy", "sub": "inconsistent act or omitted duty discharges", "hook": "If the creditor spoils the surety’s eventual remedy against the debtor, the surety is out.", "plain": "If the creditor does any act <b>inconsistent with the surety’s rights</b>, or omits to do an act his duty to the surety requires, and the surety’s <b>eventual remedy</b> against the principal debtor is thereby <b>impaired</b>, the surety is discharged. Illustrations: prepaying the last two ship-building instalments (A discharged); the creditor’s loss of control over security; an apprentice’s master failing to check the cash monthly as promised (A not liable).", "cases": [], "links": [{"l": "S.140–141: surety’s rights", "m": 12, "sec": "S.140–141"}, {"l": "S.133", "m": 12, "sec": "S.133"}], "blocks": [{"h": "S.139 Discharge of surety by creditor's act or omission impairing surety's eventual remedy.", "paras": [{"t": "If the creditor does any act which is inconsistent with the rights of the surety, or omits to do any act which his duty to the surety requires him to do, and the eventual remedy of the surety himself against the principal debtor is thereby impaired, the surety is discharged.", "l": 0}], "ills": [{"t": "(a) B contracts to build a ship for C for a given sum, to be paid by instalments as the work reaches certain stages. A becomes surety to C for B's due performance of the contract. C, without the knowledge of A, prepays to B the last two instalments. A is discharged by this prepayment.", "l": 0}, {"t": "(b) C lends money to B on the security of a joint and several promissory note made in C's favour by B, and by A as surety for B, together with a bill of sale of B's furniture, which gives power to C to sell the furniture, and apply the proceeds in discharge of the note. Subsequently, C sells the furniture, but, owing to his misconduct and wilful negligence, only a small price is realized. A is discharged from liability on the note.", "l": 0}, {"t": "(c) A puts M as apprentice to B, and gives a guarantee to B for M's fidelity. B promises on his part that he will, at least once a month, see M make up the cash. B omits to see this done as promised, and M embezzles. A is not liable to B on his guarantee.", "l": 0}]}]}, {"secs": ["140", "141"], "code": "S.140–141", "term": "Surety’s rights after payment; benefit of securities", "sub": "subrogation to the creditor’s rights", "hook": "Pay the debt and step into the creditor’s shoes, including the collateral he held.", "plain": "<b>S.140:</b> when the guaranteed debt is due or default has occurred, the surety, <b>on payment or performance of all he is liable for</b>, is invested with <b>all the creditor’s rights</b> against the principal debtor. <b>S.141:</b> the surety is entitled to the <b>benefit of every security</b> the creditor has against the debtor when the guarantee is given, whether he knows of it or not; if the creditor <b>loses or parts with it without the surety’s consent</b>, the surety is discharged <b>to the extent of its value</b>. Illustrations: cancelling a mortgage of furniture (A discharged); withdrawing execution (discharged); giving up a <i>further</i> security obtained later (A <b>not</b> discharged).", "cases": [], "links": [{"l": "S.145: indemnity", "m": 12, "sec": "S.145–147"}, {"l": "S.139", "m": 12, "sec": "S.139"}], "blocks": [{"h": "S.140 Rights of surety on payment or performance.", "paras": [{"t": "Where a guaranteed debt has become due, or default of the principal debtor to perform a guaranteed duty has taken place, the surety, upon payment or performance of all that he is liable for, is invested with all the rights which the creditor had against the principal debtor.", "l": 0}], "ills": []}, {"h": "S.141 Surety's right to benefit of creditor's securities.", "paras": [{"t": "A surety is entitled to the benefit of every security which the creditor has against the principal debtor at the time when the contract of suretyship is entered into, whether the surety knows of the existence of such security or not; and, if the creditor loses, or, without the consent of the surety, parts with such security, the surety is discharged to the extent of the value of the security.", "l": 0}], "ills": [{"t": "(a) C advances to B, his tenant, 2,000 Rupees on the guarantee of A.C has also, a further security for the 2,000 Rupees by a mortgage of B's furniture. C cancels the mortgage. B becomes insolvent, and C sues A on his guarantee. A is discharged from liability to the amount of the value of the furniture.", "l": 0}, {"t": "(b) C, a creditor, whose advance to B is secured by a decree, receives also a guarantee for that advance from A. C afterwards takes B's goods in execution under the decree, and then, without the knowledge of A, withdraws the execution. A is discharged.", "l": 0}, {"t": "(c) A, as surety for B, makes a bond jointly with B to C, to secure a loan from C to B. Afterwards, C obtains from B a further security for the same debt. Subsequently, C gives up the further security. A is not discharged.", "l": 0}]}]}, {"secs": ["142", "143"], "code": "S.142–143", "term": "Guarantee obtained by misrepresentation or concealment", "sub": "invalid", "hook": "A guarantor has the right to be told the truth, and to be told what matters.", "plain": "<b>S.142:</b> a guarantee obtained by <b>misrepresentation</b> by the creditor, or with his knowledge and assent, concerning a <b>material part</b> of the transaction, is <b>invalid</b>. <b>S.143:</b> a guarantee obtained by the creditor <b>keeping silence as to material circumstances</b> is invalid. Illustrations: not telling C that a clerk had previously failed to account (invalid); a private agreement that the debtor pay above market price to clear an old debt (invalid). <b>Note:</b> unlike the general rule in S.17 and the Explanation to S.19, the Act makes silence in guarantees specifically invalidating; the contrast is my reading of the text.", "cases": [], "links": [{"l": "S.17: fraud", "m": 4, "sec": "S.17"}, {"l": "S.18: misrepresentation", "m": 4, "sec": "S.18"}, {"l": "S.19", "m": 4, "sec": "S.19"}], "blocks": [{"h": "S.142 Guarantee obtained by misrepresentation invalid.", "paras": [{"t": "Any guarantee which has been obtained by means of misrepresentation made by the creditor, or with his knowledge and assent, concerning a material part of the transaction, is invalid.", "l": 0}], "ills": []}, {"h": "S.143 Guarantee obtained by concealment invalid.", "paras": [{"t": "Any guarantee which the creditor has obtained by means of keeping silence as to material circumstances is invalid.", "l": 0}], "ills": [{"t": "(a) A engages B as clerk to collect money for him. B fails to account for some of his receipts, and A in consequence calls upon him to furnish security his duly accounting. C gives his guarantee for B's duly accounting. A does not acquaint C with B's previous conduct. B afterwards makes default. The guarantee is invalid.", "l": 0}, {"t": "(b) A guarantees to C payment for iron to be supplied by him to B to the amount of 2,000 tons. B and C have privately agreed that B should pay five Rupees per ton beyond the market price, such excess to be applied in liquidation of an old debt. This agreement is concealed from A. A is not liable as a surety.", "l": 0}]}]}, {"secs": ["144"], "code": "S.144", "term": "Guarantee conditional on a co-surety joining", "sub": "invalid if he does not join", "hook": "If the guarantee was to bite only once a second surety signed, it never bites if he never signs.", "plain": "Where a guarantee is given on the contract that the creditor <b>shall not act on it until another person has joined as co-surety</b>, it is <b>not valid if that person does not join</b>.", "cases": [], "links": [{"l": "S.146", "m": 12, "sec": "S.145–147"}], "blocks": [{"h": "S.144 Guarantee on contract that creditor shall not act on it until co-surety joins.", "paras": [{"t": "Where a person gives a guarantee upon a contract that the creditor shall not act upon it until another person has joined in it as co-surety, the guarantee is not valid if that other person does not join.", "l": 0}], "ills": []}]}, {"secs": ["145", "146", "147"], "code": "S.145–147", "term": "Surety’s indemnity from the debtor; contribution among co-sureties", "sub": "implied indemnity; equal shares; limits respected", "hook": "After paying, the surety looks to the debtor first and then to his fellow sureties for their share.", "plain": "<b>S.145:</b> in every guarantee there is an <b>implied promise by the principal debtor to indemnify the surety</b>, who may recover what he has <b>rightfully</b> paid but not what he paid wrongfully. <b>S.146:</b> co-sureties for the same debt, jointly or severally, with or without knowledge of each other, must <b>contribute equally</b> absent a contract to the contrary (Rs 3,000 owed: Rs 1,000 each). <b>S.147:</b> co-sureties bound in <b>different sums</b> pay equally <b>as far as their limits permit</b>. The illustrations (a) to (c) in S.147 work through bonds of Rs 10,000, 20,000 and 40,000 with default amounts of different sizes.", "cases": [], "links": [{"l": "S.140", "m": 12, "sec": "S.140–141"}, {"l": "S.125: indemnity-holder", "m": 12, "sec": "S.125"}, {"l": "S.138", "m": 12, "sec": "S.138"}], "blocks": [{"h": "S.145 Implied promise to indemnify surety.", "paras": [{"t": "In every contract of guarantee there is an implied promise by the principal debtor to indemnify the surety; and the surety is entitled to recover from the principal debtor whatever sum he has rightfully paid under the guarantee, but no sums which he has paid wrongfully.", "l": 0}], "ills": [{"t": "(a) B is indebted to C, and A is surety for the debt. C demands payment from A, and on his refusal sues him for the amount. A defends the suit, having reasonable grounds for doing so, but is compelled to pay the amount of the debt with costs. He can recover from B the amount paid by him for costs, as well as the principal debt.", "l": 0}, {"t": "(b) C lends B a sum of money, and A, at the request of B, accepts a bill of exchange drawn by B upon A to secure the amount. C, the holder of the bill, demands payment of it from A, and, on A's refusal to pay, sues him upon the bill. A, not having reasonable grounds for so doing, defends the suit, and has to pay the amount of the bill and costs. He can recover from B the amount of the bill, but not the sum paid for costs, as there was no real ground for defending the action.", "l": 0}, {"t": "(c) A guarantees to C, to the extent of 2,000 Rupees, payment for rice to be supplied by C to B. C supplies to B rice to a less amount than 2,000 Rupees, but obtains from A payment of the sum of 2,000 Rupees in respect of the rice supplied. A cannot recover from B more than the price of the rice actually supplied.", "l": 0}]}, {"h": "S.146 Co-sureties liable to contribute equally.", "paras": [{"t": "Where two or more persons are co-sureties for the same debt or duty, either jointly or severally, and whether under the same or different contracts, and whether with or without the knowledge of each other, the co-sureties, in the absence of any contract to the contrary, are liable, as between themselves, to pay each an equal share of the whole debt, or of that part of it which remains unpaid by the principal debtor .", "l": 0}], "ills": [{"t": "(a) A, B and C are sureties to D for the sum of 3,000 rupees lent to E. E makes default in payment. A, B and C are liable, as between themselves, to pay 1,000 rupees each.", "l": 0}, {"t": "(b) A, B and C are sureties to D for the sum of 1,000 rupees lent to E, and there is a contract between A, B and C that A is to be responsible to the extent of one-quarter, B to the extent of one-quarter and C to the extent of one-half. E makes default in payment. As between the sureties, A is liable to pay 250 rupees, B 250 rupees, and C 500 rupees.", "l": 0}]}, {"h": "S.147 Liability of co-sureties bound in different sums.", "paras": [{"t": "Co-sureties who are bound in different sums are liable to pay equally as far as the limits of their respective obligations permit.", "l": 0}], "ills": [{"t": "(a) A, B and C, as sureties for D, enter into three several bonds, each in a different penalty, namely, A in the penalty of 10,000 rupees, B in that of 20,000 rupees, C in that of 40,000 Rupees, conditioned for D's duly accounting to E. D makes default to the extent of 30,000 rupees. A, B and C are each liable to pay 10,000 rupees.", "l": 0}, {"t": "(b) A, B and C, as sureties for D, enter into three several bonds, each in a different penalty, namely, A in the penalty of 10,000 rupees, B in that of 20,000 rupees, C in that of 40,000 rupees, conditioned for D's duly accounting to E. D makes default to the extent of 40,000 rupees. A is liable to pay 10,000 rupees, and B and C 15,000 rupees each.", "l": 0}, {"t": "(c) A, B and C, as sureties for D, enter into three several bonds, each in a different penalty, namely, A in the penalty of 10,000 rupees, B in that of 20,000 rupees, C in that of 40,000 rupees, conditioned for D's duly accounting to E. D makes default to the extent of 70,000 rupees. A, B and C have to pay each the full penalty of his bond.", "l": 0}]}]}], "spar": [{"q": "A promises to indemnify B against any loss if C sues B. What is the difference between A’s promise and A guaranteeing C’s debt to B?", "a": "<b>Indemnity (S.124)</b> is a two-party promise to save the promisee from loss, from the promisor’s own conduct or anyone else’s. <b>Guarantee (S.126)</b> is a <b>three-party</b> structure: a surety answers for a principal debtor’s default to a creditor. The usual textbook contrast is that a guarantor’s liability is secondary and an indemnifier’s is primary; that gloss is textbook commentary, not text of the Act."}, {"q": "C promises A in writing to pay for goods already delivered to B, in default of B, and gets nothing in return. Enforceable?", "a": "<b>Void.</b> S.127 illustration (c): past delivery by A, with no new consideration for C’s promise, leaves no consideration. Contrast illustration (b), where A <b>forbears to sue</b> for a year at C’s request: that is sufficient consideration. The benefit need only go to the principal debtor, S.127."}, {"q": "The creditor, without telling the surety, agrees to give the debtor six months more to pay. Is the surety still liable? What if the surety agreed?", "a": "<b>Discharged</b> under S.135 if the arrangement is a contract between the creditor and the principal debtor, <b>unless the surety assents</b>. If time is given by a contract with a <i>third person</i>, S.136 says no discharge; and <b>mere forbearance</b> to sue (S.137) does not discharge either. These three sections are the classic trap."}, {"q": "Surety A guarantees a running supply account to the extent of Rs 10,000. Can A revoke it after A has sold half? When does the death of A matter?", "a": "<b>Yes, for the future only</b>: S.130 allows revocation by notice to the creditor as to <b>future transactions</b> (illustration (b): A remains liable on a bill already accepted). <b>S.131:</b> A’s death operates as revocation as to future transactions unless the contract says otherwise."}, {"q": "A, B and C stand as sureties for E’s Rs 3,000 debt; A pays everything. What can A recover, and from whom?", "a": "<b>From E:</b> S.145, implied indemnity for sums rightfully paid. <b>From B and C:</b> S.146, equal shares between co-sureties, here Rs 1,000 each absent a contrary contract. If their bonds were different sums, S.147 applies and each pays equally up to the limit of their bond."}]}, "13": {"n": 13, "intro": "Chapter IX: bailment and pledge. Bailment (S.148–171) covers duties of bailor and bailee, mixing of goods, return, finders’ rights and liens. Pledge (S.172–181) covers the pawnee’s rights on default and the special rules for pledges by mercantile agents and by persons holding under voidable contracts.", "boundary": "<b>Boundary.</b> Finder’s liability as bailee is flagged in S.71 (Module 10, extra reading). The sale of goods by non-owners and “mercantile agent” come from the Sale of Goods Act (Modules 15 and 17). Agency in general is Module 14.", "recall": "<b>Quick recall</b>Care: <b>ordinary prudence</b> (S.151). Particular lien: <b>skill or labour</b> (S.170); general lien: <b>five classes</b> (S.171). Pledge = bailment as security (S.172). On default: <b>sue + retain</b>, or <b>sell on notice</b> (S.176); redeem <b>before sale</b> (S.177). Good title: mercantile agent (S.178), voidable contract (S.178A).", "rails": [{"secs": ["148", "149"], "code": "S.148–149", "term": "Bailment defined; how delivery is made", "sub": "delivery for a purpose, to be returned", "hook": "Bailment is lending without giving: the goods travel, the title stays.", "plain": "<b>S.148:</b> bailment is the <b>delivery of goods</b> by one person (bailor) to another (bailee) <b>for some purpose</b>, upon a <b>contract</b> that they shall, when the purpose is accomplished, be <b>returned or disposed of</b> as the bailor directs. The <b>Explanation</b>: a person already holding another’s goods who contracts to hold them as bailee becomes bailee. <b>S.149:</b> delivery is made by <b>anything that puts the goods in the possession</b> of the intended bailee or a person authorized to hold them for him.", "cases": [{"n": "Coggs v Bernard", "c": "(1703) 2 Ld Raym 909, 92 ER 107 (KB)", "t": "A man who carried barrels of brandy without reward was held liable as a bailee for negligent handling. Holt CJ treated the duty as arising from taking custody, and set out the classes of bailment later reflected in the Act.", "v": 1}], "links": [{"l": "S.172: pledge", "m": 13, "sec": "S.172–174"}, {"l": "S.71: finder as bailee", "m": 10, "sec": "S.71"}, {"l": "S.151: care", "m": 13, "sec": "S.151–152"}], "blocks": [{"h": "S.148 \"Bailment\", \"bailor\", and \"bailee\" defined.", "paras": [{"t": "A \"bailment\" is the delivery of goods by one person to another for some purpose, upon a contract that they shall, when the purpose is accomplished, be returned or otherwise disposed of according to the directions of the person delivering them. The person delivering the goods is called the \"bailor\". The person to whom they are delivered is called the \"bailee\".", "l": 0}, {"t": "Explanation.– If a person already in possession of the goods of another contracts to hold them as a bailee, he thereby becomes the bailee, and the owner becomes the bailor, of such goods although they may not have been delivered by way of bailment.", "l": 0}], "ills": []}, {"h": "S.149 Delivery to bailee how made.", "paras": [{"t": "The delivery to the bailee may be made by doing anything which has the effect of putting the goods in the possession of the intended bailee or of any person authorized to hold them on his behalf.", "l": 0}], "ills": []}]}, {"secs": ["150"], "code": "S.150", "term": "Bailor’s duty to disclose faults", "sub": "known faults; strict liability if bailed for hire", "hook": "Lend a vicious horse without a warning and you pay for the bite.", "plain": "The bailor must <b>disclose faults he is aware of</b> that <b>materially interfere with use</b> or expose the bailee to <b>extraordinary risks</b>; failing which he is responsible for damage arising <b>directly</b> from them. If the goods are <b>bailed for hire</b>, the bailor is responsible for such damage <b>whether or not he knew</b> of the faults. Illustrations: a known vicious horse lent without warning (A responsible); an unsafe carriage hired out (B responsible although B was unaware).", "cases": [], "links": [{"l": "S.148", "m": 13, "sec": "S.148–149"}, {"l": "S.151", "m": 13, "sec": "S.151–152"}], "blocks": [{"h": "S.150 Bailor’s duty to disclose faults in goods bailed.", "paras": [{"t": "The bailor is bound to disclose to the bailee faults in the goods bailed, of which the bailor is aware, and which materially interfere with the use of them, or expose the bailee to extraordinary risks; and if he does not make such disclosure, he is responsible for damage arising to the bailee directly from such faults.", "l": 0}, {"t": "If the goods are bailed for hire, the bailor is responsible for such damage, whether he was or was not aware of the existence of such faults in the goods bailed.", "l": 0}], "ills": [{"t": "(a) A lends a horse, which he knows to be vicious, to B. He does not disclose the fact that the horse is vicious. The horse runs away. B is thrown and injured. A is responsible to B for damage sustained.", "l": 0}, {"t": "(b) A hires a carriage of B. The carriage is unsafe, though B is not aware of it, and A is injured. B is responsible to A for the injury.", "l": 0}]}]}, {"secs": ["151", "152"], "code": "S.151–152", "term": "Bailee’s standard of care; when not liable", "sub": "the care of an ordinary prudent man of his own goods", "hook": "The bailee must care for your goods as a prudent person would care for his own.", "plain": "<b>S.151:</b> in <b>all cases</b> of bailment the bailee must take as much care as a <b>man of ordinary prudence</b> would take of his own goods of the <b>same bulk, quality and value</b>. <b>S.152:</b> in the absence of a special contract, the bailee is <b>not responsible</b> for loss, destruction or deterioration if he took that care. <b>Note:</b> the Act applies one standard to gratuitous and paid bailments alike, which differs from the English tiering in <i>Coggs v Bernard</i>; that comparison is textbook commentary.", "cases": [{"n": "Coggs v Bernard", "c": "(1703) 2 Ld Raym 909, 92 ER 107 (KB)", "t": "A gratuitous bailee was liable for negligence in handling the goods. English law later distinguished standards by benefit; the Act uses one standard of ordinary prudence.", "v": 1}], "links": [{"l": "S.161: default in returning", "m": 13, "sec": "S.160–162"}, {"l": "S.150", "m": 13, "sec": "S.150"}], "blocks": [{"h": "S.151 Care to be taken by bailee.", "paras": [{"t": "In all cases of bailment the bailee is bound to take as much care of the goods bailed to him as a man of ordinary prudence would, under similar circumstances, take of his own goods of the same bulk, quality and value as the goods bailed .", "l": 0}], "ills": []}, {"h": "S.152 Bailee when not liable for loss, etc., of thing bailed.", "paras": [{"t": "The bailee, in the absence of any special contract, is not responsible for the loss, destruction or deterioration of the thing bailed, if he has taken the amount of care of it described in section 151.", "l": 0}], "ills": []}]}, {"secs": ["153", "154"], "code": "S.153–154", "term": "Act inconsistent with the bailment; unauthorised use", "sub": "bailor may terminate; bailee liable for damage", "hook": "Use the horse for something other than agreed, and you insure it for the owner.", "plain": "<b>S.153:</b> the contract of bailment is <b>avoidable at the bailor’s option</b> if the bailee does any act with regard to the goods <b>inconsistent with its conditions</b> (a horse hired for riding being driven in a carriage). <b>S.154:</b> if the bailee makes <b>any use not according to the conditions</b>, he must <b>compensate the bailor for any damage</b> arising from or during such use. Illustrations: letting a family member ride the horse lent for B’s own riding (B liable though C rode with care); marching to a different town than agreed (liable for the accidental fall).", "cases": [], "links": [{"l": "S.151", "m": 13, "sec": "S.151–152"}, {"l": "S.160", "m": 13, "sec": "S.160–162"}], "blocks": [{"h": "S.153 Termination of bailment by bailee's act inconsistent with conditions.", "paras": [{"t": "A contract of bailment is avoidable at the option of the bailor, if the bailee does any act with regard to the goods bailed, inconsistent with the conditions of the bailment.", "l": 0}], "ills": [{"t": "A lets to B, for hire, a horse for his own riding. B drives the horse in his carriage. This is, at the option of A, a termination of the bailment.", "l": 0}]}, {"h": "S.154 Liability of bailee making unauthorised use of goods bailed.", "paras": [{"t": "If the bailee makes any use of the goods bailed, which is not according to the conditions of the bailment, he is liable to make compensation to the bailor for any damage arising to the goods from or during such use of them.", "l": 0}], "ills": [{"t": "(a) A lends a horse to B for his own riding only. B allows C, a member of his family, to ride the horse. C rides with care, but the horse accidentally falls and is injured. B is liable to make compensation to A for the injury done to the horse.", "l": 0}, {"t": "(b) A hires a horse in [Karachi] from B expressly to march to [Hyderabad]. A rides with due care, but marches to [Khairpur] instead. The horse accidentally falls and is injured. A is liable to make compensation to B for the injury to the horse.", "l": 0}]}]}, {"secs": ["155", "156", "157"], "code": "S.155–157", "term": "Mixture of goods", "sub": "with consent: shared interest; without consent: separable or not", "hook": "Mix without asking and you carry the cost of unmixing it, or of losing it.", "plain": "<b>S.155:</b> mixture <b>with the bailor’s consent</b>: bailor and bailee have an interest <b>proportionate to their shares</b>. <b>S.156:</b> without consent but <b>separable</b>: property stays with each; the bailee bears the <b>cost of separation</b> and any damage. <b>S.157:</b> without consent and <b>impossible to separate</b>: the bailor is <b>compensated for the loss</b>. Illustrations: 100 marked bales of cotton mixed with the bailee’s own; a barrel of Cape flour worth Rs 45 mixed with country flour worth Rs 25.", "cases": [], "links": [{"l": "S.151", "m": 13, "sec": "S.151–152"}, {"l": "S.154", "m": 13, "sec": "S.153–154"}], "blocks": [{"h": "S.155 Effect of mixture, with bailor's consent, of his goods with bailee's.", "paras": [{"t": "If the bailee, with the consent of the bailor, mixes the goods of the bailor with his own goods, the bailor and the bailee shall have an interest, in proportion to their respective shares, in the mixture thus produced.", "l": 0}], "ills": []}, {"h": "S.156 Effect of mixture, without bailor's consent, when the goods can be separated.", "paras": [{"t": "If the bailee, without the consent of the bailor, mixes the goods of the bailor with his own goods, and the goods can be separated or divided, the property in the goods remains in the parties respectively; but the bailee is bound to bear the expense of separation or division, and any damage arising from the mixture.", "l": 0}], "ills": [{"t": "A bails 100 bales of cotton marked with a particular mark to B. B, without A's consent, mixes the 100 bales with other bales of his own, bearing a different mark. A is entitled to have his 100 bales returned, and B is bound to bear all the expense incurred in the separation of the bales, and any other incidental damage.", "l": 0}]}, {"h": "S.157 Effect of mixture, without bailor's consent, when the goods cannot be separated.", "paras": [{"t": "If the bailee, without the consent of the bailor, mixes the goods of the bailor with his own goods, in such a manner that it is impossible to separate the goods bailed from the other goods and deliver them back, the bailor is entitled to be compensated by the bailee for the loss of the goods.", "l": 0}], "ills": [{"t": "A bails a barrel of Cape flour worth Rupees 45 to B. B, without A's consent, mixes the flour with country flour of his own, worth only Rupees 25 a barrel. B must compensate A for the loss of his flour.", "l": 0}]}]}, {"secs": ["158"], "code": "S.158", "term": "Repayment of necessary expenses", "sub": "where the bailee gets no remuneration", "hook": "The unpaid bailee is at least not out of pocket.", "plain": "Where the conditions of bailment require the bailee to <b>keep, carry, or do work on</b> the goods and he receives <b>no remuneration</b>, the bailor must repay the <b>necessary expenses</b> incurred for the purpose.", "cases": [], "links": [{"l": "S.170: lien for services", "m": 13, "sec": "S.170–171"}], "blocks": [{"h": "S.158 Repayment by bailor of necessary expenses.", "paras": [{"t": "Where, by the conditions of the bailment, the goods are to be kept or to be carried, or to have work done upon them by the bailee for the bailor, and the bailee is to receive no remuneration, the bailor shall repay to the bailee the necessary expenses incurred by him for the purpose of the bailment.", "l": 0}], "ills": []}]}, {"secs": ["159"], "code": "S.159", "term": "Restoration of goods lent gratuitously", "sub": "the lender may recall; must indemnify if reliance would cause loss", "hook": "A free loan can be called back, but not at the borrower’s unfair cost.", "plain": "The lender of a thing for use may <b>at any time require its return</b> if the loan was <b>gratuitous</b>, even though lent for a specified time or purpose. But if, on the faith of a loan for a specified time or purpose, the borrower so acted that early return would cause him <b>loss exceeding the benefit he derived</b>, the lender who compels return must <b>indemnify the borrower</b> for the excess.", "cases": [], "links": [{"l": "S.162: termination on death", "m": 13, "sec": "S.160–162"}], "blocks": [{"h": "S.159 Restoration of goods lent gratuitously.", "paras": [{"t": "The lender of a thing for use may at any time require its return, if the loan was gratuitous, even though he lent it for a specified time or purpose. But, if, on the faith of such loan made for a specified time or purpose, the borrower has acted in such a manner that the return of the thing lent before the time agreed upon would cause him loss exceeding the benefit actually derived by him from the loan, the lender must, if he compels the return, indemnify the borrower for the amount in which the loss so occasioned exceeds the benefit so derived.", "l": 0}], "ills": []}]}, {"secs": ["160", "161", "162"], "code": "S.160–162", "term": "Return of goods; default; death in gratuitous bailment", "sub": "return without demand; liability from default; death ends gratuitous bailment", "hook": "When the job is done, the goods go back without being asked.", "plain": "<b>S.160:</b> the bailee must <b>return or deliver</b> according to directions, <b>without demand</b>, as soon as the time has expired or the purpose has been accomplished. <b>S.161:</b> if by his <b>default</b> the goods are not returned, delivered or tendered at the proper time, he is responsible for <b>any loss, destruction or deterioration from that time</b>. <b>S.162:</b> a <b>gratuitous</b> bailment is terminated by the <b>death of either</b> bailor or bailee.", "cases": [], "links": [{"l": "S.152", "m": 13, "sec": "S.151–152"}, {"l": "S.163", "m": 13, "sec": "S.163"}], "blocks": [{"h": "S.160 Return of goods bailed on expiration of time or accomplishment of purpose.", "paras": [{"t": "It is the duty of the bailee to return, or deliver according to the bailor's directions, the goods bailed, without demand, as soon as the time for which they were bailed has expired, or the purpose for which they were bailed has accomplished.", "l": 0}], "ills": []}, {"h": "S.161 Bailee's responsibility when goods are not duly returned.", "paras": [{"t": "If, by the default of the bailee, the goods are not returned, delivered or tendered at the proper time, he is responsible to the bailor for any loss, destruction or deterioration of the goods from that time .", "l": 0}], "ills": []}, {"h": "S.162 Termination of gratuitous bailment by death.", "paras": [{"t": "A gratuitous bailment is terminated by the death either of the bailor or of the bailee.", "l": 0}], "ills": []}]}, {"secs": ["163"], "code": "S.163", "term": "Increase or profit from goods bailed", "sub": "goes to the bailor", "hook": "The calf belongs to the owner of the cow.", "plain": "Absent a contract to the contrary, the bailee must <b>deliver to the bailor</b> any <b>increase or profit</b> accrued from the goods. Illustration: a cow left with B has a calf; B must deliver the calf too.", "cases": [], "links": [{"l": "S.160", "m": 13, "sec": "S.160–162"}], "blocks": [{"h": "S.163 Bailor entitled to increase or profit from goods bailed.", "paras": [{"t": "In the absence of any contract to the contrary, the bailee is bound to deliver to the bailor, or according to his directions, any increase or profit which may have accrued from the goods bailed.", "l": 0}], "ills": [{"t": "A leaves a cow in the custody of B to be taken care of. The cow has a calf. B is bound to deliver the calf as well as the cow to A.", "l": 0}]}]}, {"secs": ["164", "165", "166", "167"], "code": "S.164–167", "term": "Bailor’s title; joint owners; innocent redelivery; competing claimants", "sub": "who may take the goods back", "hook": "A bailee who returns the goods to the bailor in good faith is safe, even if the bailor had no title.", "plain": "<b>S.164:</b> the bailor is responsible to the bailee for loss from the bailor <b>not being entitled</b> to make the bailment, receive back the goods, or direct them. <b>S.165:</b> where <b>several joint owners</b> bail goods, the bailee may redeliver to <b>one</b> without the consent of all, unless agreed otherwise. <b>S.166:</b> if the bailor lacks title and the bailee <b>in good faith</b> redelivers to him, the bailee is <b>not responsible to the owner</b>. <b>S.167:</b> a person other than the bailor who claims the goods may <b>apply to the Court</b> to stop delivery and decide title.", "cases": [], "links": [{"l": "S.178A: voidable title", "m": 13, "sec": "S.178A"}, {"l": "S.28 SGA: sale by non-owner", "m": 17, "sec": "S.28"}], "blocks": [{"h": "S.164 Bailor's responsibility to bailee.", "paras": [{"t": "The bailor is responsible to the bailee for any loss which the bailee may sustain by reason that the bailor was not entitled to make the bailment, or to receive back the goods or to give directions, respecting them.", "l": 0}], "ills": []}, {"h": "S.165 Bailment by several joint owners.", "paras": [{"t": "If several joint owners of goods bail them, the bailee may deliver them back to, or according to the directions of, one joint owner without the consent of all, in the absence of any agreement to the contrary.", "l": 0}], "ills": []}, {"h": "S.166 Bailee not responsible on re-delivery to bailor without title.", "paras": [{"t": "If the bailor has no title to the goods, and the bailee, in good faith, delivers them back to, or according to the directions of, the bailor, the bailee is not responsible to the owner in respect of such delivery .", "l": 0}], "ills": []}, {"h": "S.167 Right of third person claiming goods bailed.", "paras": [{"t": "If a person, other than the bailor, claims goods bailed, he may apply to the Court to stop the delivery of the goods to the bailor, and to decide the title to the goods.", "l": 0}], "ills": []}]}, {"secs": ["168", "169"], "code": "S.168–169", "term": "Right of the finder; sale of lost goods", "sub": "retain for expenses; may sue only for a promised reward; sale in limited cases", "hook": "Finders are not paid for trouble, unless the owner promised a reward, but they may keep the goods until they are.", "plain": "<b>S.168:</b> the finder has <b>no right to sue</b> for compensation for trouble and expense, but may <b>retain the goods</b> until paid; where the owner has offered a <b>specific reward</b>, the finder may <b>sue for it</b> and retain the goods until paid. <b>S.169:</b> for a thing <b>commonly the subject of sale</b>, if the owner cannot be found with reasonable diligence or refuses to pay lawful charges, the finder may sell it (1) if it is in danger of perishing or losing most of its value, or (2) if his lawful charges amount to <b>two-thirds</b> of its value.", "cases": [{"n": "Armory v Delamirie", "c": "(1722) 1 Str 505, 93 ER 664 (KB)", "t": "A chimney sweep’s boy who found a jewel had a good claim against a goldsmith who kept the stones. A finder holds against everyone but the true owner.", "v": 1}, {"n": "Bridges v Hawkesworth", "c": "(1851) 21 LJQB 75 (QB)", "t": "A customer found banknotes on a shop floor and handed them over. The finder had a better right than the shopkeeper, though not as against the true owner.", "v": 1}], "links": [{"l": "S.71: finder is bailee", "m": 10, "sec": "S.71"}, {"l": "S.8: acceptance of reward offer", "m": 2, "sec": "S.8"}], "blocks": [{"h": "S.168 Right of finder of goods; may sue for specific reward offered.", "paras": [{"t": "The finder of goods has no right to sue the owner for compensation for trouble and expense voluntarily incurred by him to preserve the goods and to find out the owner; but he may retain the goods against the owner until he receives such compensation; and, where the owner has offered a specific reward for the return of goods lost, the finder may sue for such reward, and may retain the goods until he receives it.", "l": 0}], "ills": []}, {"h": "S.169 When finder of thing commonly on sale may sell it.", "paras": [{"t": "When a thing which is commonly the subject of sale is lost, if the owner cannot with reasonable diligence be found, or if he refuses, upon demand, to pay the lawful charges of the finder, the finder may sell it–", "l": 0}, {"t": "(1) when the thing is in danger of perishing or of losing the greater part of its value, or,", "l": 1}, {"t": "(2) when the lawful charges of the finder, in respect of the thing found, amount to two-thirds of its value.", "l": 1}], "ills": []}]}, {"secs": ["170", "171"], "code": "S.170–171", "term": "Particular lien; general lien", "sub": "retain for skill and labour; general lien only for bankers, factors and the like", "hook": "The tailor can hold the coat until paid, unless he promised credit.", "plain": "<b>S.170:</b> a bailee who has rendered <b>service involving labour or skill</b> in respect of the goods has, absent contrary contract, a right to <b>retain them until paid</b>. Illustrations: a jeweller cutting a diamond (can retain); a tailor who promised three months’ credit (cannot). <b>S.171:</b> only <b>bankers, factors, wharfingers, advocates of a High Court and policy-brokers</b> may retain goods as security for a <b>general balance of account</b>, absent contrary contract; no one else without an express contract.", "cases": [], "links": [{"l": "S.158", "m": 13, "sec": "S.158"}, {"l": "S.46–55 SGA: unpaid seller", "m": 19, "sec": "S.46"}], "blocks": [{"h": "S.170 Bailee's particular lien.", "paras": [{"t": "Where the bailee has, in accordance with the purpose of the bailment, rendered any service involving the exercise of labour or skill in respect of the goods bailed, he has, in the absence of a contract to the contrary, a right to retain such goods until he receives due remuneration for the services he has rendered in respect of them.", "l": 0}], "ills": [{"t": "(a) A delivers a rough diamond to B, A jeweller, to be cut and polished, which is accordingly done. B is entitled to retain the stone till he is paid for the services he has rendered.", "l": 0}, {"t": "(b) A gives cloth to B, a tailor, to make into a coat. B promises A to deliver the coat as soon as it is finished, and to give a three months' credit for the price. B is not entitled to retain the coat until he is paid.", "l": 0}]}, {"h": "S.171 General lien of bankers, factors, wharfingers, attorneys and policy- brokers.", "paras": [{"t": "Bankers, factors, wharfingers, advocate of a High Court and policy- brokers may, in the absence of a contract to the contrary, retain, as a security for a general balance of account, any goods bailed to them; but no other persons have a right to retain, as a security for such balance, goods bailed to them, unless there is an express contract to that effect .", "l": 0}], "ills": []}]}, {"secs": ["172", "173", "174"], "code": "S.172–174", "term": "Pledge defined; pawnee’s retainer", "sub": "bailment as security; retention for the debt, interest and expenses", "hook": "A pledge is a bailment that secures a debt.", "plain": "<b>S.172:</b> bailment of goods <b>as security for payment of a debt or performance of a promise</b> is <b>pledge</b>; the bailor is the <b>pawnor</b>, the bailee the <b>pawnee</b>. <b>S.173:</b> the pawnee may retain the goods for the debt, <b>interest</b>, and <b>necessary expenses</b> of possession or preservation. <b>S.174:</b> he may not retain for <b>any other debt</b> unless contracted, but such a contract is <b>presumed for subsequent advances</b>.", "cases": [], "links": [{"l": "S.148", "m": 13, "sec": "S.148–149"}, {"l": "S.175–177", "m": 13, "sec": "S.175–177"}], "blocks": [{"h": "S.172 \"Pledge\", \"Pawnor\" and \"Pawnee\" defined", "paras": [{"t": "The bailment of goods as security for payment of a debt or performance of a promise is called \"pledge\". The bailor is in this case called the \"pawnor\". The bailee is called the \"pawnee\".", "l": 0}], "ills": []}, {"h": "S.173 Pawnee's right of retainer", "paras": [{"t": "The pawnee may retain the goods pledged, not only for payment of the debt or the performance of the promise, but for the interest of the debt, and all necessary expenses incurred by him in respect of the possession or for the preservation of the goods pledged.", "l": 0}], "ills": []}, {"h": "S.174 Pawnee not to retain for debt or promise other than that for which goods pledged", "paras": [{"t": "Presumption in case of subsequent advances.– The pawnee shall not, in the absence of a contract to that effect retain the goods pledged for any debt or promise other than the debt or promise for which they are pledged; but such contract, in the absence of anything to the contrary, shall be presumed in regard to subsequent advances made by the pawnee.", "l": 0}], "ills": []}]}, {"secs": ["175", "176", "177"], "code": "S.175–177", "term": "Extraordinary expenses; pawnor’s default; right to redeem", "sub": "sue and retain, or sell on reasonable notice; redeem before sale", "hook": "Default does not forfeit the pledge: the pawnee sells with notice, and the pawnor can redeem until the sale.", "plain": "<b>S.175:</b> the pawnee may recover <b>extraordinary expenses</b> incurred for preservation. <b>S.176:</b> on the pawnor’s default the pawnee may <b>sue on the debt and retain the goods as collateral</b>, or <b>sell</b> them after <b>reasonable notice</b>; if the sale yields less, the pawnor still owes the balance; if more, the pawnee pays over the <b>surplus</b>. <b>S.177:</b> after default at the stipulated time, the pawnor may <b>redeem at any time before actual sale</b>, paying also expenses arising from the default.", "cases": [], "links": [{"l": "S.173", "m": 13, "sec": "S.172–174"}, {"l": "S.178", "m": 13, "sec": "S.178–179"}], "blocks": [{"h": "S.175 Pawnee's right as to extraordinary expenses incurred", "paras": [{"t": "The pawnee is entitled to receive from the pawnor extraordinary expenses incurred by him for the preservation of the goods pledged.", "l": 0}], "ills": []}, {"h": "S.176 Pawnee’s right where pawnor makes default", "paras": [{"t": "If the pawnor makes default in payment of the debt, or performance, at the stipulated time of the promise, in respect of which the goods were pledged, the pawnee may bring a suit against the pawnor upon the debt or promise, and retain the goods pledged as a collateral security; or he may sell the thing pledged, on giving the pawnor reasonable notice of the sale.", "l": 0}, {"t": "If the proceeds of such sale are less than the amount due in respect of the debt or promise, the pawnor is still liable to pay the balance. If the proceeds of the sale are greater than the amount so due, the pawnee shall pay over the surplus to the pawnor.", "l": 0}], "ills": []}, {"h": "S.177 Defaulting pawnor's right to redeem", "paras": [{"t": "If a time is stipulated for the payment of the debt, or performance of the promise, for which the pledge is made, and the pawnor makes default in payment of the debt or performance of the promise at the stipulated time, he may redeem the goods pledged at any subsequent time before the actual sale of them ; but he must, in that case, pay, in addition, any expenses which have arisen from his default.", "l": 0}], "ills": []}]}, {"secs": ["178", "179"], "code": "S.178–179", "term": "Pledge by mercantile agent; pawnor with limited interest", "sub": "valid pledge by agent in ordinary course; limited interest, limited pledge", "hook": "The owner lets the agent hold the goods, so the agent’s pledge to an innocent pawnee binds the owner.", "plain": "<b>S.178:</b> a <b>mercantile agent</b> in possession of goods or documents of title <b>with the owner’s consent</b>, acting in the <b>ordinary course of business</b>, makes a pledge as valid as if expressly authorized, if the pawnee acts in <b>good faith</b> and without <b>notice</b> that the pawnor lacks authority. The <b>Explanation</b> adopts the Sale of Goods Act definitions of “mercantile agent” and “documents of title”. <b>S.179:</b> where the pawnor has only a <b>limited interest</b>, the pledge is valid to the extent of that interest.", "cases": [], "links": [{"l": "S.2(8) SGA: mercantile agent", "m": 15, "sec": "S.2(8)"}, {"l": "S.28–31 SGA: sale by non-owners", "m": 17, "sec": "S.28"}, {"l": "S.178A", "m": 13, "sec": "S.178A"}], "blocks": [{"h": "S.178 Pledge by mercantile agent 178A Pledge by person in possession under voidable contract", "paras": [{"t": "Where a mercantile agent is, with the consent of the owner, in possession of goods or the documents of title to goods, any pledge made by him, when acting in the ordinary course of business of a mercantile agent, shall be as valid as if he were expressly authorized by the owner of the goods to make the same; provided that the pawnee acts in good faith and has not at the time of the pledge notice that the pawnor has not authority to pledge.", "l": 0}, {"t": "Explanation.– In this section, the expressions „mercantile agent' and „documents of title' shall have the meanings assigned to them in the Sale of Goods Act, 1930 .", "l": 0}], "ills": []}, {"h": "S.179 Pledge where pawnor has only a limited interest Suits by Bailees or Bailors against Wrong-doers", "paras": [{"t": "Where a person pledges goods in which he has only a limited interest, the pledge is valid to the extent of that interest.", "l": 0}], "ills": []}]}, {"secs": ["178A"], "code": "S.178A", "term": "Pledge by a person in possession under a voidable contract", "sub": "good title to a pawnee in good faith if the contract was not yet rescinded", "hook": "A voidable contract, not yet avoided, still passes good title to an innocent pawnee.", "plain": "Where the pawnor obtained possession <b>under a contract voidable under S.19 or S.19A</b>, but the contract <b>had not been rescinded at the time of the pledge</b>, the pawnee acquires <b>good title</b>, provided he acts in <b>good faith</b> and <b>without notice</b> of the pawnor’s defect of title. <b>Note:</b> the extracted text has a stray closing bracket and the printed word “panwnor’s”; kept as printed.", "cases": [], "links": [{"l": "S.19: voidable contracts", "m": 4, "sec": "S.19"}, {"l": "S.19A: undue influence", "m": 4, "sec": "S.19A"}, {"l": "S.30 SGA: voidable contract", "m": 17, "sec": "S.30"}], "blocks": [{"h": "S.178A Pledge by person in possession under voidable contract", "paras": [{"t": "When the pawnor has obtained possession of the goods pledged by him under a contract voidable under section 19 or section 19A, but the contract has not been rescinded at the time of the pledge, the pawnee acquires a good title to the goods, provided he acts in good faith and without notice of the panwnor‟s defect title.]", "l": 0}], "ills": []}]}, {"secs": ["180", "181"], "code": "S.180–181", "term": "Suits against wrong-doers; apportioning the recovery", "sub": "either bailor or bailee may sue; shared according to interests", "hook": "Both owner and holder can chase the thief, and divide what they win.", "plain": "<b>S.180:</b> if a third person <b>wrongfully deprives the bailee</b> of use or possession or injures the goods, the bailee may use the owner’s remedies, and <b>either bailor or bailee</b> may sue the third person. <b>S.181:</b> whatever is recovered is dealt with between bailor and bailee <b>according to their respective interests</b>.", "cases": [], "links": [{"l": "S.164", "m": 13, "sec": "S.164–167"}], "blocks": [{"h": "S.180 Suit by bailor or bailee against wrong-doer.", "paras": [{"t": "If a third person wrongfully deprives the bailee of the use or possession of the goods bailed, or does them any injury, the baliee is entitled to use such remedies as the owner might have used in the like case if no bailment had been made; and either the bailor or the bailee may bring a suit against a third person for such deprivation or injury.", "l": 0}], "ills": []}, {"h": "S.181 Apportionment of relief or compensation obtained by such suits.", "paras": [{"t": "Whatever is obtained by way of relief or compensation in any such suit shall, as between the bailor and the bailee, be dealt with according to their respective interests.", "l": 0}], "ills": []}]}], "spar": [{"q": "A lends B a horse for a day, knowing it is vicious and not warning B. B is thrown. Compare the position if A had hired the horse out.", "a": "<b>Gratuitous loan:</b> A is liable for damage directly from faults he <b>knew</b> of and did not disclose (S.150, first paragraph, illustration (a)). <b>Hire:</b> A is liable <b>whether or not he knew</b> (second paragraph, illustration (b)). So the hired-carriage bailor is liable even when ignorant. The difference between lending and hiring is the knowledge requirement."}, {"q": "B, a gratuitous bailee, takes ordinary prudent care of A’s goods, but they are stolen. Is B liable? Does it matter that B is unpaid?", "a": "<b>No.</b> S.152: absent a special contract, the bailee is not responsible if he took the care S.151 requires. S.151 applies in <b>all cases of bailment</b>, paid or gratuitous, so the Act uses a single standard. <b>Textbook commentary:</b> English law formerly varied the standard with the benefit to each party (<i>Coggs v Bernard</i>); that is background and not text of the Act."}, {"q": "A tailor holds a customer’s finished coat. The customer has not paid; the tailor earlier promised three months’ credit. May he keep the coat? What about a banker holding a customer’s goods for an unpaid general balance?", "a": "<b>Tailor: no</b> (S.170, illustration (b)). A particular lien arises for labour and skill, but not against a contrary contract, and a promise of credit is inconsistent with a right to hold the goods until paid. <b>Banker: yes,</b> S.171 gives a general lien to bankers, factors, wharfingers, High Court advocates and policy-brokers, unless the contract excludes it."}, {"q": "A pawnor defaults on a loan secured by a watch. What may the pawnee do, and what happens to any surplus or shortfall?", "a": "S.176: the pawnee may <b>sue on the debt and keep the watch as collateral</b>, <b>or sell it after reasonable notice</b>. If the sale yields <b>less</b>, the pawnor still owes the balance; if <b>more</b>, the surplus goes to the pawnor. Until the actual sale, the pawnor may <b>redeem</b> by paying the debt and expenses of the default (S.177)."}, {"q": "A agent in possession of A’s goods with A’s consent pledges them without A’s authority. Who wins, A or the pawnee?", "a": "<b>The pawnee</b>, if the agent was a <b>mercantile agent</b> acting in the <b>ordinary course</b> of a mercantile agent’s business and the pawnee acted in <b>good faith</b> without notice of lack of authority (S.178). Definitions come from the Sale of Goods Act, so this ties Module 13 to Module 15. <b>Open to argument:</b> what counts as the “ordinary course”; no case on that is cited here."}]}, "14": {"n": 14, "intro": "Chapter X: agency (S.182–238). The Act covers who may be an agent, the extent and delegation of authority, ratification, termination, the agent’s duties and the principal’s duties, and the effect of agency on third persons: disclosed and undisclosed principals, pretended agents, holding out and fraud.", "boundary": "<b>Boundary.</b> Bailment-related lien is Module 13. Pledge by a mercantile agent is S.178, in Module 13, with definitions in the Sale of Goods Act (Module 15). Partnership is outside this Act (the extraction shows stray fragments of the Partnership Act that are ignored).", "recall": "<b>Quick recall</b>Authority: <b>express/implied</b> (S.187), emergency (S.189). No delegation (S.190). Ratification: <b>knowledge, whole, no third-party prejudice</b> (S.198–200). Termination: S.201; interest S.202. Duties: <b>directions/custom, skill, accounts, no self-dealing</b> (S.211–216). Third parties: <b>S.230 presumptions</b>, S.231 undisclosed principal, S.237 holding out, S.238 agent’s fraud.", "rails": [{"secs": ["182", "183", "184", "185"], "code": "S.182–185", "term": "Agent and principal; who may employ and be an agent; consideration", "sub": "the cast of agency", "hook": "Agency is one person speaking with another’s voice, and it needs no payment to begin.", "plain": "<b>S.182:</b> an <b>agent</b> is a person employed to <b>do any act for another or to represent another in dealings with third persons</b>; the other is the <b>principal</b>. <b>S.183:</b> any person of the <b>age of majority</b> (under the law to which he is subject) and <b>sound mind</b> may employ an agent. <b>S.184:</b> as between principal and third persons <b>anyone</b> may be an agent, but a minor or person of unsound mind cannot become an agent so as to be <b>responsible to his principal</b>. <b>S.185:</b> <b>no consideration</b> is necessary to create an agency.", "cases": [], "links": [{"l": "S.11: capacity", "m": 3, "sec": "S.11"}, {"l": "S.2(d): consideration", "m": 1, "sec": "S.2(d)"}], "blocks": [{"h": "S.182 \"Agent\" and \"principal\" defined.", "paras": [{"t": "An \"agent\" is a person employed to do any act for another or to represent another in dealings with third persons. The person for whom such act is done, or who is so represented, is called the \"principal\".", "l": 0}], "ills": []}, {"h": "S.183 Who may employ agent.", "paras": [{"t": "Any person who is of the age of majority according to the law to which he is subject, and who is of sound mind, may employ an agent.", "l": 0}], "ills": []}, {"h": "S.184 Who may be an agent.", "paras": [{"t": "As between the principal and third persons any person may become an agent, but no person who is not of the age of majority and of sound mind can become an agent, so as to be responsible to his principal according to the provisions in that behalf herein contained.", "l": 0}], "ills": []}, {"h": "S.185 Consideration not necessary.", "paras": [{"t": "No consideration is necessary to create an agency.", "l": 0}], "ills": []}]}, {"secs": ["186", "187"], "code": "S.186–187", "term": "Express and implied authority", "sub": "words spoken or written; or inferred from circumstances", "hook": "Authority is given by words, or read from the way people have been dealing.", "plain": "<b>S.186:</b> authority may be <b>express or implied</b>. <b>S.187:</b> express when given by <b>words spoken or written</b>; implied when <b>inferred from the circumstances</b>, which include things spoken or written and the <b>ordinary course of dealing</b>. Illustration: B manages A’s shop and habitually orders from C in A’s name and pays from A’s funds with A’s knowledge; B has implied authority to do so.", "cases": [{"n": "Hely-Hutchinson v Brayhead", "c": "[1968] 1 QB 549 (CA)", "t": "A chairman who acted as chief executive with the board’s knowledge had actual authority, implied from the board’s conduct over a long period.", "v": 1}], "links": [{"l": "S.188", "m": 14, "sec": "S.188–189"}, {"l": "S.237: holding out", "m": 14, "sec": "S.237"}], "blocks": [{"h": "S.186 Agent's authority may be expressed or implied.", "paras": [{"t": "The authority of an agent may be expressed or implied .", "l": 0}], "ills": []}, {"h": "S.187 Definitions of express and implied authority.", "paras": [{"t": "An authority is said to be express when it is given by words spoken or written. An authority is said to be implied when it is to be inferred from the circumstances of the case; and things spoken or written, or the ordinary course of dealing, may be accounted circumstances of the case.", "l": 0}], "ills": [{"t": "A owns a shop in [Quetta], living himself in [Karachi], and visiting the shop occasionally. The shop is managed by B, and he is in the habit of ordering goods from C in the name of A for the purposes of the shop, and of paying for them out of A's funds with A's knowledge. B has an implied authority from A to order goods from C in the name of A for the purposes of the shop.", "l": 0}]}]}, {"secs": ["188", "189"], "code": "S.188–189", "term": "Extent of authority; emergency", "sub": "everything necessary or usual; acts in emergency", "hook": "An agent has the powers needed to do the job, and the powers a prudent person would use in an emergency.", "plain": "<b>S.188:</b> authority to do an act includes every <b>lawful thing necessary</b> for it; authority to <b>carry on a business</b> includes every lawful thing <b>necessary or usually done</b> in conducting it. Illustrations: an agent recovering a debt may adopt any legal process and give a discharge; a ship-builder’s agent may buy timber and hire workmen. <b>S.189:</b> in an <b>emergency</b>, an agent may do all acts a person of <b>ordinary prudence</b> would do in his own case to protect the principal from loss (repairing goods; selling perishable provisions).", "cases": [], "links": [{"l": "S.187", "m": 14, "sec": "S.186–187"}, {"l": "S.214: duty to communicate", "m": 14, "sec": "S.211–214"}], "blocks": [{"h": "S.188 Extent of agent's authority.", "paras": [{"t": "An agent having an authority to do an act has authority to do every lawful thing which is necessary in order to do such act.", "l": 0}, {"t": "An agent having an authority to carry on a business has authority to do every lawful thing necessary for the purpose, or usually done in the course of conducting such business.", "l": 0}], "ills": [{"t": "(a) A is employed by B, residing in London, to recover at [Karachi] a debt due to B. A may adopt any legal process necessary for the purpose of recovering the debt, and may give a valid discharge for the same.", "l": 0}, {"t": "(b) A constitutes B his agent to carry on his business of a ship-builder. B may purchase timber and other materials, and hire workmen, for the purposes of carrying on the business.", "l": 0}]}, {"h": "S.189 Agent's authority in an emergency. Sub-Agents", "paras": [{"t": "An agent has authority, in an emergency, to do all such acts for the purpose of protecting his principal from loss as would be done by a person of ordinary prudence, in his own case, under similar circumstances.", "l": 0}], "ills": [{"t": "(a) An agent for sale may have goods repaired if it be necessary.", "l": 0}, {"t": "(b) A consigns provisions to B at [Lahore], with directions to send them immediately to C at [Rawalpindi] B may sell the provisions at [Rawalpindi], if they will not bear the journey to [Rawalpindi] without spoiling.", "l": 0}]}]}, {"secs": ["190", "191", "192", "193"], "code": "S.190–193", "term": "Delegation; sub-agents", "sub": "no delegation unless custom or necessity; effect of proper and improper appointment", "hook": "An agent cannot hand off personal duties; if he does it properly, the principal is bound, if improperly, the agent is the principal.", "plain": "<b>S.190:</b> an agent <b>cannot employ another</b> to perform acts he undertook to perform <b>personally</b>, unless <b>custom of trade</b> allows or the <b>nature of the agency</b> requires it. <b>S.191:</b> a <b>sub-agent</b> is a person employed by, and acting under the <b>control</b> of, the original agent in the business of the agency. <b>S.192:</b> where a sub-agent is <b>properly appointed</b>, the principal is represented by him and bound by his acts; the agent is responsible to the principal for the sub-agent’s acts; the sub-agent is responsible to the agent, and to the principal only for <b>fraud or wilful wrong</b>. <b>S.193:</b> where appointed <b>without authority</b>, the agent stands as <b>principal to the sub-agent</b> and is responsible to the principal and third persons; the principal is not bound or represented.", "cases": [], "links": [{"l": "S.194–195: substituted agent", "m": 14, "sec": "S.194–195"}, {"l": "S.188", "m": 14, "sec": "S.188–189"}], "blocks": [{"h": "S.190 When agent cannot delegate.", "paras": [{"t": "An agent cannot lawfully employ another to perform acts which he has expressly or impliedly undertaken to perform personally, unless by the ordinary custom of trade a sub-agent may, or, from the nature of the agency, a sub-agent must, be employed.", "l": 0}], "ills": []}, {"h": "S.191 \"Sub-agent\" defined.", "paras": [{"t": "A \"sub-agent\" is a person employed by, and acting under the control of, the original agent in the business of the agency.", "l": 0}], "ills": []}, {"h": "S.192 Representation of principal by sub-agent properly appointed Agent's responsibility for sub-agent. Sub-agent's responsibility", "paras": [{"t": "Where a sub-agent is properly appointed, the principal is, so far as regards third persons, represented by the sub-agent, and is bound by and responsible for his acts, as if he were an agent originally appointed by the principal.", "l": 0}, {"t": "Agent's responsibility for sub-agent.– The agent is responsible to the principal for the acts of the sub-agent.", "l": 0}, {"t": "Sub-agent's responsibility.– The sub-agent is responsible for his acts to the agent, but not to the principal, except in case of fraud or wilful wrong.", "l": 0}], "ills": []}, {"h": "S.193 Agent's responsibility for sub-agent appointed without authority.", "paras": [{"t": "Where an agent, without having authority to do so, has appointed a person to act as a sub- agent, the agent stands towards such person in the relation of a principal to an agent, and is responsible for his acts both to the principal and to third persons; the principal is not represented by or responsible for the acts of the person so employed, nor is that person responsible to the principal.", "l": 0}], "ills": []}]}, {"secs": ["194", "195"], "code": "S.194–195", "term": "Persons named by an agent with authority to name", "sub": "an agent of the principal, not a sub-agent", "hook": "If the agent may choose someone to act, that person acts directly for the principal.", "plain": "<b>S.194:</b> where an agent with express or implied authority to <b>name another</b> person to act for the principal does so, that person is <b>not a sub-agent but an agent of the principal</b> for the part entrusted to him. Illustrations: a solicitor naming an auctioneer; a merchant instructing a solicitor to sue. <b>S.195:</b> in selecting him, the agent must exercise the discretion of a <b>man of ordinary prudence</b> in his own case; if he does, he is <b>not responsible</b> for that person’s acts or negligence (a surveyor chosen with care who buys an unseaworthy ship; an auctioneer in good credit who becomes insolvent).", "cases": [], "links": [{"l": "S.192", "m": 14, "sec": "S.190–193"}], "blocks": [{"h": "S.194 Relation between principal and person duly appointed by agent to act in business of agency.", "paras": [{"t": "Where an agent, holding an express or implied authority to name another person to act for the principal in the business of the agency, has named another person accordingly, such person is not a sub-agent, but an agent of the principal for such part of the business of the agency as is entrusted to him.", "l": 0}], "ills": [{"t": "(a) A directs B, his solicitor, to sell his estate by auction, and to employ an auctioneer for the purpose.– B names C, an auctioneer, to conduct the sale. C is not a sub-agent, but is A's agent for the conduct of the sale.", "l": 0}, {"t": "(b) A authorises B, a merchant in [Chittagong,] to recover the moneys due to A from C & Co. B instructs D, a solicitor, to take legal proceedings against C & Co. for the recovery of the money. D is not a sub-agent, but is solicitor for A.", "l": 0}]}, {"h": "S.195 Agent's duty in naming such person.", "paras": [{"t": "In selecting such agent for his principal, an agent is bound to exercise the same amount of discretion as a man of ordinary prudence would exercise in his own case; and, if he does this, he is not responsible to the principal for the acts or negligence of the agent so selected.", "l": 0}], "ills": [{"t": "(a) A instructs B, a merchant, to buy a ship for him. B employs a ship surveyor of good reputation to choose a ship for A. The surveyor makes the choice negligently and the ship turns out to be unseaworthy and is lost. B is not, but the surveyor is, responsible to A.", "l": 0}, {"t": "(b) A consigns goods to B, a merchant, for sale. B in due course, employs an auctioneer in good credit to sell the goods of A, and allows the auctioneer to receive the proceeds of the sale. The auctioneer afterwards becomes insolvent without having accounted for the proceeds. B is not responsible to A for the proceeds. Ratification", "l": 0}]}]}, {"secs": ["196", "197"], "code": "S.196–197", "term": "Ratification: election; express and implied", "sub": "an unauthorised act may be adopted or disowned", "hook": "Adopt the act and it becomes as if you had authorised it from the start.", "plain": "<b>S.196:</b> where acts are done by one person on behalf of another <b>without his knowledge or authority</b>, he may elect to <b>ratify or disown</b> them; if he ratifies, the same effects follow as if done by authority. <b>S.197:</b> ratification may be <b>express or implied from conduct</b>. Illustrations: selling goods bought for him without authority on his own account (implied ratification); accepting interest on a loan made without authority.", "cases": [], "links": [{"l": "S.198–200: limits on ratification", "m": 14, "sec": "S.198–200"}, {"l": "S.237", "m": 14, "sec": "S.237"}], "blocks": [{"h": "S.196 Right of person as to acts done for him without his authority. Effect of ratification", "paras": [{"t": "Where acts are done by one person on behalf of another, but without his knowledge or authority, he may elect to ratify or to disown such acts. If he ratify them, the same effects will follow as if they had been performed by his authority.", "l": 0}], "ills": []}, {"h": "S.197 Ratification may be expressed or implied", "paras": [{"t": "Ratification may be expressed or may be implied in the conduct of the person on whose behalf the acts are done.", "l": 0}], "ills": [{"t": "(a) A, without authority, buys goods for B. Afterwards B sells them to C on his own account; B's conduct implies a ratification of the purchase made for him by A.", "l": 0}, {"t": "(b) A, without B's authority, lends B's money to C. Afterwards B accepts interest on the money from C. B's conduct implies a ratification of the loan.", "l": 0}]}]}, {"secs": ["198", "199", "200"], "code": "S.198–200", "term": "Ratification: knowledge, whole transaction, third parties", "sub": "full knowledge; all or nothing; cannot prejudice third parties", "hook": "Ratify with your eyes open, take the whole transaction, and not to the harm of a third person.", "plain": "<b>S.198:</b> no valid ratification if the ratifier’s <b>knowledge of the facts is materially defective</b>. <b>S.199:</b> ratifying an unauthorised act <b>ratifies the whole transaction</b> of which it was part. <b>S.200:</b> an unauthorised act which, if authorised, would <b>subject a third person to damages</b> or <b>terminate a third person’s right or interest</b> cannot be made to have that effect by ratification. Illustrations: an unauthorised demand for delivery of a chattel (cannot be ratified to make C liable for damages); an unauthorised notice terminating a lease on three months’ notice (cannot bind A).", "cases": [], "links": [{"l": "S.196–197", "m": 14, "sec": "S.196–197"}], "blocks": [{"h": "S.198 Knowledge requisite for valid ratification", "paras": [{"t": "No valid ratification can be made by a person whose knowledge of the facts of the case is materially defective.", "l": 0}], "ills": []}, {"h": "S.199 Effect of ratifying unauthorized act forming part of a transaction", "paras": [{"t": "A person ratifying any unauthorized act done on his behalf ratifies the whole of the transaction of which such act formed a part.", "l": 0}], "ills": []}, {"h": "S.200 Ratification of unauthorized act cannot injure third person", "paras": [{"t": "An act done by one person on behalf of another, without such other person's authority, which, if done with authority, would have the effect of subjecting a third person to damages, or of terminating any right or interest of a third person, cannot, by ratification, be made to have such effect.", "l": 0}], "ills": [{"t": "(a) A, not being authorized thereto by B, demands, on behalf of B, the delivery of a chattle, the property of B, from C, who is in possession of it. This demand cannot be ratified by B, so as to make C liable for damages for his refusal to deliver.", "l": 0}, {"t": "(b) A holds a lease from B, terminable on three months' notice. C, an unauthorized person, gives notice of termination to A. The notice cannot be ratified by B, so as to be binding on A.", "l": 0}]}]}, {"secs": ["201"], "code": "S.201", "term": "Termination of agency", "sub": "revocation; renunciation; completion; death; unsound mind; insolvency", "hook": "Six ways an agency ends.", "plain": "An agency is terminated by (1) the principal <b>revoking</b> authority; (2) the agent <b>renouncing</b>; (3) the business of the agency being <b>completed</b>; (4) either party <b>dying or becoming of unsound mind</b>; (5) the principal being <b>adjudicated insolvent</b>. S.201 lists these in one sentence.", "cases": [], "links": [{"l": "S.202–204: limits on revocation", "m": 14, "sec": "S.202–204"}, {"l": "S.208", "m": 14, "sec": "S.205–208"}], "blocks": [{"h": "S.201 Termination of agency", "paras": [{"t": "An agency is terminated by the principal revoking his authority; or by the agent renouncing the business of the agency; or by the business of the agency being completed; or by either the principal or agent dying or becoming of unsound mind; or by the principal being adjudicated an insolvent under the provisions of any Act for the time being in force for the relief of insolvent debtors.", "l": 0}], "ills": []}]}, {"secs": ["202", "203", "204"], "code": "S.202–204", "term": "Agency coupled with an interest; revocation before and during exercise", "sub": "cannot terminate to the prejudice of the agent’s interest", "hook": "You cannot cut off an agent who holds an interest in the very thing he is selling.", "plain": "<b>S.202:</b> where the agent has <b>an interest in the property</b> forming the subject-matter, the agency cannot, absent express contract, be terminated to the <b>prejudice of that interest</b> (an agent authorised to sell A’s land and pay his own debts out of the proceeds; death or insanity do not end it). <b>S.203:</b> subject to S.202, the principal may revoke <b>at any time before the authority has been exercised</b> so as to bind him. <b>S.204:</b> he cannot revoke <b>after partial exercise</b> as to acts and obligations arising from acts already done (illustrations on buying cotton in the agent’s own name or in the principal’s name).", "cases": [], "links": [{"l": "S.201", "m": 14, "sec": "S.201"}, {"l": "S.205–206", "m": 14, "sec": "S.205–208"}], "blocks": [{"h": "S.202 Termination of agency where agent has an interest in subject-matter", "paras": [{"t": "Where the agent has himself an interest in the property which forms the subject- matter of the agency, the agency cannot, in the absence of an express contract, be terminated to the prejudice of such interest.", "l": 0}], "ills": [{"t": "(a) A gives authority to B to sell A's land, and to pay himself, out of the proceeds, the debts due to him from A. A cannot revoke this authority nor can it be terminated by his insanity or death.", "l": 0}, {"t": "(b) A consigns 1,000 bales of cotton to B, who has made advances to him on such cotton, and desires B to sell the cotton, and to repay himself, out of the price, the amount of his own advances. A cannot revoke this authority, nor is it terminated by his insanity or death.", "l": 0}]}, {"h": "S.203 When principal may revoke agent's authority", "paras": [{"t": "The principal may, save as is otherwise provided by the last preceding section, revoke the authority given to his agent at any time before the authority has been exercised so as to bind the principal.", "l": 0}], "ills": []}, {"h": "S.204 Revocation where authority has been partly exercised", "paras": [{"t": "The principal cannot revoke the authority given to his agent after the authority has been partly exercised so far as regards such acts and obligations as arise from acts already done in the agency.", "l": 0}], "ills": [{"t": "(a) A authorizes B to buy 1,000 bales of cotton on account of A, and to pay for it out of A's money remaining in B's hands. B buys 1,000 bales of cotton in his own name, so as to make himself personally liable for the price. A cannot revoke B's authority so far as regards payment for the cotton.", "l": 0}, {"t": "(b) A authorizes B to buy 1,000 bales of cotton on account of A, and to pay for it out of A's money remaining in B's hands. B buys 1,000 bales of cotton in A's name and so as not to render himself personally liable for the price. A can revoke B's authority to pay for the cotton.", "l": 0}]}]}, {"secs": ["205", "206", "207", "208"], "code": "S.205–208", "term": "Compensation; notice; implied revocation; when termination takes effect", "sub": "compensation for wrongful end; reasonable notice; effect when known", "hook": "Ending an agency without good cause or notice may cost damages; and termination binds only once known.", "plain": "<b>S.205:</b> where there is an <b>express or implied contract</b> that the agency continue for a period, the party who revokes or renounces <b>without sufficient cause</b> must compensate the other. <b>S.206:</b> <b>reasonable notice</b> must be given, otherwise damage must be made good. <b>S.207:</b> revocation or renunciation may be <b>express or implied</b> from conduct (A empowers B to let a house, then lets it himself). <b>S.208:</b> termination takes effect as against the agent and third persons only when it <b>becomes known to them</b> (illustrations: sale after the revocation letter was sent but before it was received; payment after the principal’s death before hearing of it).", "cases": [], "links": [{"l": "S.4: communication of revocation", "m": 2, "sec": "S.4"}, {"l": "S.201", "m": 14, "sec": "S.201"}], "blocks": [{"h": "S.205 Compensation for revocation by principal or renunciation by agent", "paras": [{"t": "Where there is an express or implied contract that the agency should be continued for any period of time, the principal must make compensation to the agent, or the agent to the principal, as the case may be, for any previous revocation or renunciation of the agency without sufficient cause.", "l": 0}], "ills": []}, {"h": "S.206 Notice of revocation or renunciation", "paras": [{"t": "Reasonable notice must be given of such revocation or renunciation; otherwise the damage thereby resulting to the principal or the agent, as the case may be, must be made good to the one by the other.", "l": 0}], "ills": []}, {"h": "S.207 Revocation and renunciation may be expressed or implied", "paras": [{"t": "Revocation and renunciation may be expressed or may be implied in the conduct of the principal or agent respectively.", "l": 0}], "ills": [{"t": "A empowers B to let A's house. Afterwards A lets it himself. This is an implied revocation of B's authority.", "l": 0}]}, {"h": "S.208 When termination of agent's authority takes effect as to agent, and as to third persons", "paras": [{"t": "The termination of the authority of an agent does not, so far as regards the agent, take effect before it becomes known to him, or, so far as regards third persons, before it becomes known to them.", "l": 0}], "ills": [{"t": "(a) A directs B to sell goods for him, and agrees to give B five per cent. commission on the price fetched by the goods. A afterwards, by letter, revokes B's authority. B, after the letter is sent, but before he receives it, sells the goods for 100 Rupees. The sale is binding on A, and B is entitled to five Rupees as his commission.", "l": 0}, {"t": "(b) A, at [Quetta], by letter, directs B to sell from him some cotton lying in a warehouse in [Karachi], and afterwards, by letter, revokes his authority to sell, and directs B to send the cotton to [Quetta]. B, after receiving the second letter, enters into a contract with C, who knows of the first letter, but not of
