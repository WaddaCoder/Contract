 the promisor of his intention to do so .", "l": 0}], "ills": []}]}], "spar": [{"q": "A promises to deliver goods to B on 1 March. A dies on 28 February. Separately, A promises to paint a portrait for B and dies before finishing. What happens in each under S.37?", "a": "<b>Goods:</b> “promises bind the representatives of the promisors”, so A’s representatives must deliver and B must pay (illustration (a)). <b>Portrait:</b> the promise depends on A’s personal skill, so under S.37 illustration (b) the contract <b>cannot be enforced by either side</b> (see also S.40: a promise to paint a picture must be performed personally). The test is whether a contrary intention, or the personal nature of the promise, appears."}, {"q": "A arrives at B’s warehouse on the due date with the cotton but adds: “Sign this note waiving all complaints about quality, or I leave.” B refuses. Has A made a valid offer of performance under S.38?", "a": "<b>No.</b> S.38(1) requires the offer to be <b>unconditional</b>. A’s waiver demand is a condition, so the tender fails and A does not enjoy S.38’s protection (that a refused offer leaves the promisor not responsible and with his rights intact). A proper tender also needs the right time and place and a reasonable opportunity for B to see that the goods match the contract."}, {"q": "A singer wilfully misses the sixth night of a two-month contract. (1) The manager immediately rescinds. (2) The manager lets her sing the seventh night with his assent, then wants to rescind. What does S.39 allow in each?", "a": "<b>(1) Permitted:</b> illustration (a) says B “is at liberty to put an end to the contract”. <b>(2) Not permitted:</b> by assenting to the seventh night, B has “signified his acquiescence in the continuance of the contract” and cannot put an end to it, though he is <b>entitled to compensation</b> for the damage from the sixth night (illustration (b)). The key phrase in S.39 is “unless he has signified, by words or conduct, his acquiescence”."}, {"q": "A agrees to build a house for B at a fixed price. Next, A and B agree that A will hand over stock-in-trade to B against B’s security for payment. In which order do the promises fall due, and why?", "a": "<b>S.52:</b> where the order is not fixed, perform in the order <b>the nature of the transaction requires</b>. <b>House:</b> A builds first, then B pays (illustration (a)). <b>Stock-in-trade:</b> B gives security first, because the nature of the transaction requires A to have security before he delivers up his stock (illustration (b)). If the contract <i>expressly</i> fixes an order, that order governs."}, {"q": "A hires B’s ship to carry A’s cargo but provides none. B sues A for freight. A sues B for failing to sail. Using S.54, who wins?", "a": "<b>B.</b> S.54: where one reciprocal promise cannot be performed until the other is, and the promisor of the latter fails, he <b>cannot claim performance</b> of the reciprocal promise and must <b>compensate</b> the other for loss. Illustration (a) is exactly this: A, who provided no cargo, cannot claim B’s performance and must compensate B. Compare S.53 where the <i>prevented</i> party may rescind."}, {"q": "A contracts to deliver machinery by 1 June, “time is of the essence”. He delivers on 5 June. B accepts without comment and later sues for the 4-day delay. Under S.55, can B recover?", "a": "<b>Probably not.</b> Because time was of the essence, the contract became <b>voidable</b> at B’s option on the missed date. But S.55’s third limb says that if the promisee <b>accepts performance at another time</b>, he <b>cannot claim compensation</b> for the delay <b>unless he gives notice</b> of his intention to do so <b>at the time of acceptance</b>. B accepted without notice, so his claim fails. <i>Open to argument</i> on what counts as sufficient notice, which the section leaves open."}]}, "8": {"n": 8, "intro": "Chapter IV: what happens when a promise cannot be performed. S.56 is the whole law of impossibility and frustration under the Act: initial impossibility, supervening impossibility and compensation. S.57 and S.58 save the lawful parts of contracts that are partly illegal.", "boundary": "<b>Boundary.</b> Refunds after a contract becomes void are in S.65 (Module 9). Unlawful objects generally are in S.23–24 (Module 5). Contingent contracts on impossible events are S.36 (Module 6).", "recall": "<b>Quick recall</b>S.56 has <b>three limbs</b>: impossible in itself = void; later impossible/unlawful = void then; knowing promisor = compensates the ignorant promisee. S.57: reciprocal legal and illegal. S.58: alternatives, legal branch only.", "rails": [{"secs": ["56"], "code": "S.56", "term": "Impossible agreements; supervening impossibility; compensation", "sub": "three rules in one section", "hook": "Promise the moon and it is void at birth. Promise something possible that dies later, and the contract dies with it. Know it was impossible and say nothing, and you pay.", "plain": "Three separate rules. <b>(1) Initial impossibility:</b> an agreement to do an act <b>impossible in itself</b> is void. <b>(2) Supervening impossibility:</b> a contract to do an act which, <b>after the contract is made</b>, becomes impossible, or becomes unlawful by an event the promisor could not prevent, <b>becomes void when</b> the act becomes impossible or unlawful. <b>(3) Compensation:</b> a promisor who <b>knew, or with reasonable diligence might have known</b>, that the act was impossible or unlawful, when the promisee did not know, must compensate the promisee for loss from non-performance. Illustrations: discovering treasure by magic (void); A going mad before a marriage (void); a bigamist promising marriage (compensation); war declared on the port country (void); an actor too ill to perform on several occasions (void for those occasions).", "cases": [{"n": "Taylor v Caldwell", "c": "(1863) 3 B & S 826 (QB)", "t": "A music hall burned down a week before the concerts hired in it. Its continued existence was an implied condition of the contract, so both sides were excused.", "v": 1}, {"n": "Krell v Henry", "c": "[1903] 2 KB 740 (CA)", "t": "A flat was hired to watch the coronation procession, which was cancelled. Watching the procession was the foundation of the contract, so the hirer owed no further rent.", "v": 1}, {"n": "Paradine v Jane", "c": "(1647) Aleyn 26, 82 ER 897 (KB)", "t": "A tenant was held liable for rent although enemy forces had occupied the land. It shows the old rule of absolute contractual liability that Taylor v Caldwell softened.", "v": 1}, {"n": "Satyabrata Ghose v Mugneeram Bangur", "c": "AIR 1954 SC 44 (Supreme Court of India)", "t": "Frustration falls within S.56, and “impossible” is read in a practical sense rather than literal physical impossibility. S.56 is positive law and does not depend on the parties’ intention.", "v": 1}], "links": [{"l": "S.65: restitution after a contract becomes void", "m": 9, "sec": "S.65"}, {"l": "S.2(g), S.2(j): void agreement, contract that becomes void", "m": 1, "sec": "S.2(j)"}, {"l": "S.36: contingent on impossible event", "m": 6, "sec": "S.36"}, {"l": "S.20: mistake of both parties", "m": 4, "sec": "S.20"}], "feeds": "Not expressly void", "exam": 1, "blocks": [{"h": "S.56 Agreement to do impossible act. Contract to do act afterwards becoming impossible or unlawful. Compensation for loss through non-performance of act known to be impossible or unlawful.", "paras": [{"t": "An agreement to do an act impossible in itself is void.", "l": 0}, {"t": "Contract to do act afterwards becoming impossible or unlawful.– A contract to do an act which, after the contract is made, becomes impossible, or, by reason of some event which the promissor could not prevent, unlawful, becomes void when the act becomes impossible or unlawful.", "l": 0}, {"t": "Compensation for loss through non-performance of act known to be impossible or unlawful.– Where one person has promised to do something which he knew, or, with reasonable diligence, might have known, and which the promisee did not know to be impossible or unlawful, such promisor must make compensation to such promisee for any loss which such promisee sustains through the non- performance of the promise.", "l": 0}], "ills": [{"t": "(a) A agrees with B to discover treasure by magic. The agreement is void.", "l": 0}, {"t": "(b) A and B contract to marry each other. Before the time fixed for the marriage, A goes mad. The contract becomes void.", "l": 0}, {"t": "(c) A contracts to marry B, being already married to C, and being forbidden by the law to which he is subject to practise polygamy. A must make compensation to B for the loss caused to her by the non-performance of his promise.", "l": 0}, {"t": "(d) A contracts to take in cargo for B at a foreign port. A's Government afterwards declares war against the country in which the port is situated. The contract becomes void when war is declared.", "l": 0}, {"t": "(e) A contracts to act at a theatre for six months in consideration of a sum, paid in advance by B. On several occasions A is too ill to act. The contract to act on those occasions becomes void.", "l": 0}]}]}, {"secs": ["57"], "code": "S.57", "term": "Reciprocal promises: some legal, some illegal", "sub": "the legal set stands, the illegal set falls", "hook": "Sort the wheat from the chaff: the lawful promises survive, the unlawful ones are cut away.", "plain": "Where parties reciprocally promise, firstly, to do certain things that are <b>legal</b>, and secondly, under specified circumstances, certain things that are <b>illegal</b>, the first set is a <b>contract</b> and the second a <b>void agreement</b>. Illustration: A sells B a house for Rs 10,000, but if B uses it as a gambling house he must pay Rs 50,000. The sale and price form a contract; the Rs 50,000 promise is void.", "cases": [], "links": [{"l": "S.24: unlawful in part", "m": 5, "sec": "S.24"}, {"l": "S.58: alternative promises", "m": 8, "sec": "S.58"}], "feeds": "Not expressly void", "blocks": [{"h": "S.57 Reciprocal promise to do things legal, and also other things illegal.", "paras": [{"t": "Where persons reciprocally promise, firstly, to do certain things which are legal, and, secondly, under specified circumstances, to do certain other things which are illegal, the first set of promises is a contract, but the second is a void agreement.", "l": 0}], "ills": [{"t": "A and B agree that A shall sell B a house for 10,000 Rupees but that, if B uses it as a gambling house, he shall pay A 50,000 rupees for it. The first set of reciprocal promises, namely, to sell the house and to pay 10,000 rupees for it, is a contract. The second set is for an unlawful object, namely, that B may use the house as a gambling house, and is a void agreement.", "l": 0}]}]}, {"secs": ["58"], "code": "S.58", "term": "Alternative promise, one branch illegal", "sub": "only the legal branch is enforceable", "hook": "Rice or smuggled opium? The court will hold you to the rice.", "plain": "In an <b>alternative promise</b>, one branch legal and the other illegal, the <b>legal branch alone</b> can be enforced. Illustration: A pays B Rs 1,000 for which B will deliver rice or smuggled opium. It is a valid contract to deliver rice and a void agreement as to the opium.", "cases": [], "links": [{"l": "S.57: reciprocal promises", "m": 8, "sec": "S.57"}, {"l": "S.24: unlawful in part", "m": 5, "sec": "S.24"}], "blocks": [{"h": "S.58 Alternative promise, one branch being illegal.", "paras": [{"t": "In the case of an alternative promise, one branch of which is legal and the other illegal, the legal branch alone can be enforced.", "l": 0}], "ills": [{"t": "A and B agree that A shall pay B 1,000 Rupees for which B shall afterwards deliver to A either rice or smuggled opium. This is a valid contract to deliver rice, and a void agreement as to the opium.", "l": 0}]}]}], "spar": [{"q": "A hires B’s hall for a concert. The hall is destroyed by fire before the date, through no fault of either party. Can B sue for the hire fee? What section and what case?", "a": "<b>No.</b> The contract <b>becomes void when the act becomes impossible</b> (S.56, second paragraph). The English root is <i>Taylor v Caldwell</i> (1863): continued existence of the hall was an implied condition. In Pakistan and India the doctrine rests on the <b>statute itself</b>, not on implied terms (<i>Satyabrata Ghose</i>, AIR 1954 SC 44, an Indian authority; no Pakistani authority has been verified). Money already paid then falls under S.65 (Module 9)."}, {"q": "A, a bigamist, promises to marry B, who does not know of the first marriage. Marriage is impossible. Is the agreement simply void, or does anything more follow?", "a": "<b>More follows.</b> The third paragraph of S.56 requires the promisor to <b>compensate</b> a promisee who did not know, where the promisor knew or with reasonable diligence might have known of the impossibility or unlawfulness. This is illustration (c). It is a statutory liability for loss, not damages for breach, and it applies only where the promisee was <b>ignorant</b>."}, {"q": "A watches a coronation from B’s flat; the coronation is cancelled. Is the contract “impossible” when the flat still exists? Apply Krell v Henry and the Supreme Court’s approach to the word “impossible”.", "a": "The flat exists, but the <b>foundation</b> is gone. <i>Krell v Henry</i> [1903] held the contract discharged. Under S.56 the Indian Supreme Court read “impossible” in the <b>practical</b> sense, covering loss of the object the parties had in view. <b>Open to argument:</b> how far this extends to mere hardship or increased cost, which the cases treat as <i>not</i> enough."}, {"q": "A agrees to deliver rice or smuggled opium for Rs 1,000. Which part is enforceable? Contrast S.57.", "a": "<b>Only the rice branch</b> (S.58). It is an <i>alternative</i> promise: either/or. <b>S.57</b> is different: the promises are <i>reciprocal</i> and the illegal set is triggered by specified circumstances, as with the house that must be paid for at Rs 50,000 if used as a gambling house. In both, the lawful part survives and the unlawful part is void."}]}, "9": {"n": 9, "intro": "Chapter IV (the later sections): how a contract ends other than by performance. S.59–61 are the three rules on applying a part-payment among several debts; S.62–63 let the parties substitute, alter, waive or accept less; S.64–66 govern rescission of voidable contracts; S.65 requires restitution of advantages under void agreements; S.67 excuses the promisor where the promisee hampers performance.", "boundary": "<b>Boundary.</b> Void and voidable contracts are in Modules 4–5. Breach is in Module 11 (S.73–75). Quasi-contractual restitution under S.68–72 is Module 10, which is beyond the syllabus.", "recall": "<b>Quick recall</b>Appropriation: <b>debtor</b> (S.59), then <b>creditor</b> (S.60), then <b>oldest first</b> (S.61). S.62 novation, S.63 remit/extend/accept less, S.64 rescission, S.65 restitution, S.66 communicate like an offer, S.67 promisee hindrance excuses.", "rails": [{"secs": ["59"], "code": "S.59", "term": "Application of payment: debtor indicates", "sub": "the debtor chooses first", "hook": "First come, first served in choosing: the debtor names the debt, and the creditor who accepts the money is bound by it.", "plain": "A debtor owing <b>several distinct debts</b> to one person who pays, <b>expressly or by circumstances implying</b> which debt it is for, must have the payment <b>applied accordingly</b>, if accepted. Illustrations: paying exactly the Rs 1,000 due on the promissory note on its due date; paying the exact sum the creditor had demanded in a letter.", "cases": [], "links": [{"l": "S.60: creditor chooses", "m": 9, "sec": "S.60"}, {"l": "S.61: neither chooses", "m": 9, "sec": "S.61"}], "blocks": [{"h": "S.59 Application of payment, where debt to be discharged is indicated.", "paras": [{"t": "Where a debtor, owing several distinct debts to one person, makes a payment to him, either with express intimation, or under circumstances implying that the payment is to be applied to the discharge of some particular debt, the payment, if accepted, must be applied accordingly.", "l": 0}], "ills": [{"t": "(a) A owes B, among other debts, 1,000 Rupees upon a promissory note which falls due on the first June. He owes B no other debt of that amount. On the first June A pays to B 1,000 Rupees. The payment is to be applied to the discharge of the promissory note.", "l": 0}, {"t": "(b) A owes to B, among other debts the sum of 567 Rupees. B writes to A and demands payment of this sum. A sends to B 567 Rupees. This payment is to be applied to the discharge of the debt of which B had demanded payment.", "l": 0}]}]}, {"secs": ["60"], "code": "S.60", "term": "Application of payment: debtor silent", "sub": "the creditor chooses, even time-barred debts", "hook": "If the debtor stays silent, the creditor holds the pen.", "plain": "Where the debtor has <b>not intimated</b> and circumstances do not show which debt, the creditor <b>may apply it at his discretion</b> to <b>any lawful debt actually due and payable</b>, <b>whether or not time-barred</b> by limitation law.", "cases": [], "links": [{"l": "S.59: debtor chooses", "m": 9, "sec": "S.59"}, {"l": "S.61: nobody chooses", "m": 9, "sec": "S.61"}], "blocks": [{"h": "S.60 Application of payment, where debt to be discharged is not indicated.", "paras": [{"t": "Where the debtor has omitted to intimate and there are no other circumstances indicating to which debt the payment is to be applied, the creditor may apply it at his discretion to any lawful debt actually due and payable to him from the debtor, whether its recovery is or is not barred by the law in force for the time being as to the limitation of suits.", "l": 0}], "ills": []}]}, {"secs": ["61"], "code": "S.61", "term": "Application of payment: neither party appropriates", "sub": "oldest first; equal debts pro rata", "hook": "When nobody decides, time decides: the oldest debt is paid first.", "plain": "Where <b>neither party</b> appropriates, the payment goes to the debts <b>in order of time</b>, whether or not time-barred. If the debts are of <b>equal standing</b>, the payment is applied <b>proportionately</b> to each.", "cases": [], "links": [{"l": "S.59–60", "m": 9, "sec": "S.59"}], "blocks": [{"h": "S.61 Application of payment where neither party appropriates.", "paras": [{"t": "Where neither party makes any appropriation the payment shall be applied in discharge of the debts in order of time, whether they are or are not barred by the law in force for the time being as to the limitation of suits. If the debts are of equal standing, the payment shall be applied in discharge of each proportionately.", "l": 0}], "ills": []}]}, {"secs": ["62"], "code": "S.62", "term": "Novation, rescission and alteration", "sub": "a new contract replaces the old", "hook": "Swap the contract for a new one and the old one simply need not be performed.", "plain": "If the parties agree to <b>substitute a new contract</b>, or to <b>rescind or alter</b> it, the <b>original contract need not be performed</b>. Illustrations: A, B and C agree that C becomes B’s debtor instead of A (the old debt ends); a mortgage for Rs 5,000 in place of a Rs 10,000 debt (a new contract); B telling A to credit C, but C not assenting (no novation, B still owes C).", "cases": [], "links": [{"l": "S.63: remission", "m": 9, "sec": "S.63"}, {"l": "S.2(h): contract", "m": 1, "sec": "S.2(h)"}], "exam": 1, "blocks": [{"h": "S.62 Effect of novation, rescission and alteration of contract.", "paras": [{"t": "If the parties to a contract agree to substitute a new contract for it, or to rescind or alter it, the original contract need not be performed.", "l": 0}], "ills": [{"t": "(a) A owes money to B under a contract. It is agreed between A, B and C that B shall thenceforth accept C as his debtor, instead of A. The old debt of A to B is at an end, and a new debt from C to B has been contracted.", "l": 0}, {"t": "(b) A owes B 10,000 Rupees. A enters into an arrangement with B, and gives B a mortgage of his (A's) estate for 5,000 Rupees, in place of the debt of 10,000 Rupees. This is a new contract and extinguishes the old.", "l": 0}, {"t": "(c) A owes B 1,000 Rupees under a contract. B owes C 1,000 Rupees. B orders A to credit C with 1,000 Rupees in his books, but C does not assent to the arrangement. B still owes C 1,000 Rupees, and no new contract has been entered into.", "l": 0}]}]}, {"secs": ["63"], "code": "S.63", "term": "Promisee may dispense with or remit performance", "sub": "waiver, extension or accord and satisfaction", "hook": "The one who is owed can forgive, extend or accept less, and the Act says so in plain words.", "plain": "Every promisee may <b>dispense with or remit</b>, wholly or in part, performance; <b>extend the time</b>; or <b>accept any satisfaction he thinks fit</b> instead. Illustrations: A paid Rs 2,000 at the due place in full satisfaction of Rs 5,000 (whole debt discharged); a third party C paying Rs 1,000 accepted in full satisfaction of A’s Rs 5,000 debt (discharge); a composition among creditors. <b>Contrast with English law:</b> under <i>Foakes v Beer</i> part-payment of a debt is no consideration for the creditor’s promise to forgo the rest, but S.63 and its illustrations reach the opposite result here.", "cases": [{"n": "Foakes v Beer", "c": "(1884) 9 App Cas 605 (HL)", "t": "English rule: a promise to accept part-payment of a debt already due is not supported by consideration, so the creditor could still claim the balance. Illustrations (b) and (c) to S.63 point the other way in the Act.", "v": 1}], "links": [{"l": "S.62: novation", "m": 9, "sec": "S.62"}, {"l": "S.2(d): consideration", "m": 1, "sec": "S.2(d)"}, {"l": "S.25: without consideration", "m": 5, "sec": "S.25"}], "blocks": [{"h": "S.63 Promisee may dispense with or remit performance of promise.", "paras": [{"t": "Every promisee may dispense with or remit, wholly or in part, the performance of the promise made to him or may extend the time for such performance , or may accept instead of it any satisfaction which he thinks fit.", "l": 0}], "ills": [{"t": "(a) A promises to paint a picture for B. B afterwards forbids him to do so. A is no longer bound to perform the promise.", "l": 0}, {"t": "(b) A owes B 5,000 Rupees. A pays to B, and B accepts, in satisfaction of the whole debt, 2,000 Rupees paid at the time and place at which the 5,000 Rupees were payable. The whole debt is discharged.", "l": 0}, {"t": "(c) A owes B 5,000 Rupees. C pays to B 1,000 Rupees, and B accepts them, in satisfaction of his claim on A. This payment is a discharge of the whole claim .", "l": 0}, {"t": "(d) A owes B, under a contract, a sum of money, the amount of which has not been ascertained. A, without ascertaining the amount, gives to B, and B, in satisfaction thereof, accepts, the sum of 2,000 Rupees. This is a discharge of the whole debt, whatever may be its amount.", "l": 0}, {"t": "(e) A owes B 2,000 Rupees and is also indebted to other creditors. A makes an arrangement with his creditors, including B, to pay them a [composition] of eight annas in the Rupees upon their respective demands. Payment to be of 1,000 Rupees is a discharge of B's demand.", "l": 0}]}]}, {"secs": ["64"], "code": "S.64", "term": "Consequences of rescinding a voidable contract", "sub": "the other side is released; benefits restored", "hook": "Cancel a voidable contract and you must hand back what you took.", "plain": "When the person who has the option <b>rescinds</b> a voidable contract: (1) the other party <b>need not perform</b> any promise of his; (2) the rescinding party must, if he has received any benefit, <b>restore it so far as may be</b> to the person from whom it came.", "cases": [], "links": [{"l": "S.19: voidable contracts", "m": 4, "sec": "S.19"}, {"l": "S.65: void agreements", "m": 9, "sec": "S.65"}, {"l": "S.66: communicating rescission", "m": 9, "sec": "S.66"}], "exam": 1, "blocks": [{"h": "S.64 Consequences of rescission of voidable contract.", "paras": [{"t": "When a person at whose option a contract is voidable rescinds it, the other party thereto need not perform any promise therein contained in which he is promisor. The party rescinding a voidable contract shall, if he have received any benefit thereunder from another party to such contract, restore such benefit, so far as may be, to the person from whom it was received .", "l": 0}], "ills": []}]}, {"secs": ["65"], "code": "S.65", "term": "Restoring advantage under a void agreement or contract that becomes void", "sub": "restore or compensate", "hook": "If the deal turns out to be void, the money (or goods) must go back where they came from.", "plain": "When an agreement is <b>discovered to be void</b>, or a contract <b>becomes void</b>, any person who received an <b>advantage</b> under it must <b>restore it or make compensation</b> to the person from whom he received it. Illustrations: A paid B Rs 1,000 for a promise to marry C, who was already dead (B must repay); B retaining 130 maunds of rice delivered under a contract for 250 (B must pay for what he kept); a singer who wilfully absents herself (damages), against a singer too ill to sing (refund the advance but no compensation for lost profit). <b>Note:</b> the printed text has “contact” for “contract”, as in the source.", "cases": [], "links": [{"l": "S.56: contract becomes void", "m": 8, "sec": "S.56"}, {"l": "S.20: void for mistake", "m": 4, "sec": "S.20"}, {"l": "S.64: voidable", "m": 9, "sec": "S.64"}], "exam": 1, "blocks": [{"h": "S.65 Obligation of person who has received advantage under void agreement or contract that becomes void.", "paras": [{"t": "When an agreement is discovered to be void, or when a contact becomes void, any person who has received any advantage under such agreement or contract is bound to restore it, or to make compensation for it to the person from whom he received it.", "l": 0}], "ills": [{"t": "(a) A pays B 1,000 rupees in consideration of B's promising to marry C, A's daughter. C is dead at the time of promise. The agreement is void, but B must repay A the 1,000 rupees.", "l": 0}, {"t": "(b) A contracts with B to deliver to him 250 maunds of rice before the first of May. A delivers 130 maunds only before that day, and none after. B retains the 130 maunds after the first of May. He is bound to pay A for them.", "l": 0}, {"t": "(c) A, a singer, contracts with B, the manager of a theatre, to sing at his theatre for two nights in every week during the next two months, and B engages to pay her a hundred rupees for each night's performance. On the sixth night, A wilfully absents herself from the theatre, and B, in consequence, rescinds the contract. B must pay A for the five nights on which she had sung.", "l": 0}, {"t": "(d) A contracts to sing for B at a concert for 1,000 rupees which are paid in advance. A is too ill to sing. A is not bound to make compensation to B for the loss of the profits which B would have made if A had been able to sing, but must refund to B the 1,000 rupees paid in advance.", "l": 0}]}]}, {"secs": ["66"], "code": "S.66", "term": "Communicating or revoking rescission", "sub": "same rules as for a proposal", "hook": "Rescission travels the same road as an offer: communicated, revoked, same rules.", "plain": "Rescission of a voidable contract is <b>communicated or revoked</b> in the same manner, and subject to the same rules, as the <b>communication or revocation of a proposal</b>.", "cases": [], "links": [{"l": "S.4: when communication is complete", "m": 2, "sec": "S.4"}, {"l": "S.5: revocation", "m": 2, "sec": "S.5"}, {"l": "S.64", "m": 9, "sec": "S.64"}], "blocks": [{"h": "S.66 Mode of communicating or revoking rescission of voidable contract.", "paras": [{"t": "The rescission of a voidable contract may be communicated or revoked in the same manner, and subject to the same rules, as apply to the communication or revocation of a proposal .", "l": 0}], "ills": []}]}, {"secs": ["67"], "code": "S.67", "term": "Promisee’s neglect to afford reasonable facilities", "sub": "the promisor is excused", "hook": "If you will not show the builder where the roof leaks, you cannot blame him for not mending it.", "plain": "If a promisee <b>neglects or refuses to afford the promisor reasonable facilities</b> for performance, the promisor is <b>excused</b> as to any non-performance caused by that. Illustration: B will not point out to A, who has contracted to repair B’s house, the places needing repair.", "cases": [], "links": [{"l": "S.53: preventing the event", "m": 7, "sec": "S.53"}, {"l": "S.51: reciprocal readiness", "m": 7, "sec": "S.51"}], "blocks": [{"h": "S.67 Effect of neglect of promisee to afford promisor reasonable facilities for performance.", "paras": [{"t": "If any promisee neglects or refuses to afford the promisor reasonable facilities for the performance of his promise, the promisor is excused by such neglect or refusal as to any non-performance caused thereby.", "l": 0}], "ills": [{"t": "A contracts with B to repair B's house. B neglects or refuses to point out to A the places in which his house requires repair. A is excused for the non-performance of the contract if it is caused by such neglect or refusal.", "l": 0}]}]}], "spar": [{"q": "A owes B Rs 5,000 on two notes, one old and one recent. A sends Rs 5,000 with no word on which. B wants it on the recent one. Who decides?", "a": "<b>B, the creditor</b> (S.60): the debtor gave no intimation and nothing else shows the debt. B may apply it to any lawful debt due, even a time-barred one. Had A said which note, S.59 binds B once he accepts. Had <i>neither</i> chosen, S.61 would send it to the <b>older debt</b> first."}, {"q": "A owes B Rs 5,000. B accepts Rs 2,000 from A, at the due time and place, in full satisfaction. Is the balance still owed? Contrast English law.", "a": "<b>No</b>, on the Act: S.63 illustration (b) says the whole debt is discharged, and (c) says the same where a third party pays part. <b>English law</b> (<i>Foakes v Beer</i> (1884)) would say the balance is still owed unless fresh consideration is given. <b>Open to argument:</b> how S.63 fits with the definition of consideration in S.2(d); the usual teaching treats the illustrations as an express statutory exception, which is a textbook reading, not the Act’s own words."}, {"q": "A contract is induced by fraud and B rescinds it. B had already received goods worth Rs 10,000 from A. What must B do?", "a": "<b>Restore the benefit</b> (S.64, second sentence), so far as may be. A, meanwhile, <b>need not perform</b> any promise of his (first sentence). Rescission must be communicated like a proposal (S.66). S.65 is for <i>void</i> agreements, not voidable ones that are rescinded; the two sections are close cousins and examiners like to test that line."}, {"q": "A pays Rs 1,000 in advance to a singer B, who then falls ill and cannot sing. Can A get the money back? Can A claim A’s lost profit on the concert?", "a": "<b>Refund yes; lost profit no.</b> S.65 illustration (d): the singer is not bound to compensate for profits the promisee would have made but must refund the Rs 1,000. The contract became void under S.56, and S.65 supplies the restitutionary consequence."}]}, "10": {"n": 10, "x": true, "intro": "Chapter V: obligations “resembling those created by contract”, namely claims where the law imposes a duty to pay or return without any agreement. This module is flagged as <b>extra reading</b>, beyond the LAW-202 syllabus.", "boundary": "<b>Boundary.</b> This sits outside the syllabus. For restitution after void agreements see S.65 (Module 9); for the finder’s duties as a bailee see Module 13.", "recall": "<b>Quick recall</b>S.68 necessaries; S.69 interested payer; S.70 non-gratuitous benefit; S.71 finder = bailee; S.72 mistake or coercion = repay.", "rails": [{"secs": ["68"], "code": "S.68", "term": "Necessaries supplied to a person incapable of contracting", "sub": "reimbursement from his property, not his person", "hook": "The grocer who feeds the lunatic’s family is repaid from the lunatic’s estate, though no contract ever existed.", "plain": "If a person <b>incapable of contracting</b>, or anyone he is <b>legally bound to support</b>, is supplied with <b>necessaries suited to his condition in life</b>, the supplier is entitled to be <b>reimbursed from the property</b> of the incapable person. Illustrations: necessaries to B, a lunatic; necessaries to B’s wife and children.", "cases": [], "links": [{"l": "S.11: capacity to contract", "m": 3, "sec": "S.11"}, {"l": "S.70: non-gratuitous act", "m": 10, "sec": "S.70"}], "blocks": [{"h": "S.68 Claim for necessaries supplied to person incapable of contracting, or on his account.", "paras": [{"t": "If a person, incapable of entering into a contract, or any one whom he is legally bound to support, is supplied by another person with necessaries suited to his condition in life, the person who has furnished such supplies is entitled to be reimbursed from the property of such incapable person.", "l": 0}], "ills": [{"t": "(a) A supplies B, a lunatic, with necessaries suitable to his condition in life. A is entitled to be reimbursed from B's property.", "l": 0}, {"t": "(b) A supplies the wife and children of B, a lunatic, with necessaries suitable to their condition in life. A is entitled to be reimbursed from B's property.", "l": 0}]}]}, {"secs": ["69"], "code": "S.69", "term": "Reimbursement of a person paying another’s legal debt", "sub": "the interested payer", "hook": "Pay the debt that threatens your own lease, and you may claim it back from the one who should have paid.", "plain": "A person <b>interested in the payment</b> of money which another is <b>bound by law to pay</b>, and who therefore pays it, is entitled to be <b>reimbursed by the other</b>. Illustration: a lessee pays the revenue arrears of the zamindar-lessor to save his lease from annulment on sale.", "cases": [], "links": [{"l": "S.70", "m": 10, "sec": "S.70"}, {"l": "S.72", "m": 10, "sec": "S.72"}], "blocks": [{"h": "S.69 Reimbursement of person paying money due by another in payment of which he is interested.", "paras": [{"t": "A person who is interested in the payment of money which another is bound by law to pay, and who therefore pays it, is entitled to be reimbursed by the other.", "l": 0}], "ills": [{"t": "B holds land in [Sind,] on a lease granted by A, the zamindar. The revenue payable by A to the Government being in arrear, his lands is advertised for sale by the Government. Under the revenue law, the consequence of such sale will be the annulment of B's lease. B, to prevent the sale and the consequent annulment of his own lease, pays to the Government the sum due from A. A is bound to make good to B the amount so paid.", "l": 0}]}]}, {"secs": ["70"], "code": "S.70", "term": "Benefit from a non-gratuitous act", "sub": "compensate or restore", "hook": "If you enjoy a benefit that was not meant as a gift, you pay for it.", "plain": "Where a person <b>lawfully</b> does something for another or delivers something to him, <b>not intending to do so gratuitously</b>, and the other <b>enjoys the benefit</b>, the latter must <b>compensate or restore</b>. Illustrations: goods left at B’s house by mistake which B treats as his own (B must pay); A saves B’s property from fire but intended it gratuitously (no claim).", "cases": [], "links": [{"l": "S.72: mistake or coercion", "m": 10, "sec": "S.72"}, {"l": "S.65: void agreements", "m": 9, "sec": "S.65"}], "blocks": [{"h": "S.70 Obligation of person enjoying benefit of non- gratuitous act.", "paras": [{"t": "Where a person lawfully does anything for another person, or delivers anything to him, not intending to do so gratuitously, and such other person enjoys the benefit thereof, the latter is bound to make compensation to the former in respect of, or to restore, the thing so done or delivered.", "l": 0}], "ills": [{"t": "(a) A, a tradesman, leaves goods at B's house by mistake. B treats the goods as his own. He is bound to pay A for them.", "l": 0}, {"t": "(b) A saves B's property from fire. A is not entitled to compensation from B, if the circumstances show that he intended to act gratuitously.", "l": 0}]}]}, {"secs": ["71"], "code": "S.71", "term": "Responsibility of finder of goods", "sub": "same as a bailee", "hook": "Pick up what is not yours and you inherit a bailee’s duties.", "plain": "A person who <b>finds goods</b> belonging to another and takes them into custody has the <b>same responsibility as a bailee</b>.", "cases": [], "links": [{"l": "S.151–152: care by a bailee", "m": 13, "sec": "S.151–152"}, {"l": "S.148: bailment defined", "m": 13, "sec": "S.148–149"}], "blocks": [{"h": "S.71 Responsibility of finder of goods.", "paras": [{"t": "A person who finds goods belonging to another and takes them into his custody, is subject to the same responsibility as a bailee.", "l": 0}], "ills": []}]}, {"secs": ["72"], "code": "S.72", "term": "Money paid or thing delivered by mistake or under coercion", "sub": "repay or return", "hook": "What you got by someone else’s mistake or under pressure, you give back.", "plain": "A person to whom money has been <b>paid or anything delivered by mistake or under coercion</b> must <b>repay or return</b> it. Illustrations: A and B jointly owe C; A pays, and B, not knowing, pays again (C repays B); a railway company’s illegal charge for releasing goods (recoverable to the extent illegal).", "cases": [], "links": [{"l": "S.15: coercion", "m": 4, "sec": "S.15"}, {"l": "S.20–22: mistake", "m": 4, "sec": "S.20"}], "blocks": [{"h": "S.72 Liability of person to whom money is paid or thing delivered by mistake or under coercion.", "paras": [{"t": "A person to whom money has been paid or any thing delivered by mistake or under coercion, must repay or return it.", "l": 0}], "ills": [{"t": "(a) A and B jointly owe 100 rupees to C. A alone pays the amount to C, and B, not knowing this fact, pays 100 rupees over again to C. C is bound to repay the amount to B.", "l": 0}, {"t": "(b) A railway company refuses to deliver up certain goods to the consignee, except upon the payment of an illegal charge for carriage. The consignee pays the sum charged in order to obtain the goods. He is entitled to recover so much of the charge as was illegally excessive.", "l": 0}]}]}], "spar": [{"q": "A, a tailor, supplies clothes to B, who is of unsound mind, suited to B’s station. Is A paid? From what source? Is there a contract?", "a": "<b>Paid, from B’s property</b> (S.68, illustration (a)). <b>No contract</b> exists, because B cannot contract. The Act places the claim among relations “resembling those created by contract”, not in contract itself. The remedy is against B’s <i>property</i>, not B personally."}, {"q": "A saves B’s house from a fire. Can A claim a reward under S.70?", "a": "<b>Not if A acted gratuitously</b>: S.70 requires the act to be done <b>not intending to be gratuitous</b>, and illustration (b) says exactly this. Where A in fact meant to be paid, the benefit must also have been <b>enjoyed</b> by B. <b>Open to argument:</b> how courts decide intent from the surrounding circumstances; none of the cases verified here deal with it."}, {"q": "C wrongly collects Rs 100 twice from a pair of joint debtors. How does S.72 help B?", "a": "<b>B recovers the second Rs 100</b>. S.72, illustration (a): C received money <b>by mistake</b> and is bound to repay it. S.72 does not require the mistake to be fundamental or the payment to be under a contract."}]}, "11": {"n": 11, "intro": "Chapter VI: the remedy of damages. S.73 sets out the measure for breach (natural and foreseeable loss). S.74 deals with stipulated penalties and liquidated damages in a single, distinctive rule. S.75 preserves a claim for compensation where a party rightly rescinds.", "boundary": "<b>Boundary.</b> Specific performance and injunctions are in the Specific Relief Act and are not in this Act. Breach of sale-of-goods contracts is Module 20.", "recall": "<b>Quick recall</b>S.73: <b>natural + known</b> loss, no remote loss, mitigate. S.74: <b>reasonable compensation up to</b> the named sum, loss need not be proved; bonds payable in full. S.75: rightful rescission + damages.", "rails": [{"secs": ["73"], "code": "S.73", "term": "Compensation for loss or damage caused by breach", "sub": "natural and foreseeable loss only", "hook": "Two tests, two doors: the loss that flows naturally, and the loss you knew about when you signed.", "plain": "On breach, the injured party may recover compensation for loss that (1) <b>naturally arose in the usual course of things</b> from the breach, or (2) the parties <b>knew, when they made the contract, to be likely</b> to result. <b>No compensation</b> for <b>remote and indirect</b> loss. A second paragraph extends the same compensation to the failure to discharge an <b>obligation resembling those created by contract</b>. The <b>Explanation</b> requires the court to take into account the <b>means of remedying</b> the inconvenience (mitigation). The long list of illustrations (a)–(r) is shown in full in the statute text below, covering market-price differences, carrier delay, sub-contracts and lost profits.", "cases": [{"n": "Hadley v Baxendale", "c": "(1854) 9 Exch 341 (Exch)", "t": "A mill was stopped waiting for a repaired crankshaft that was delivered late. Lost profits were not recoverable, because the carrier had not been told the mill depended on prompt return. This is the source of the two-limb test now in S.73.", "v": 1}, {"n": "West Pakistan Industrial Development Corporation v Aziz Qureshi", "c": "Supreme Court of Pakistan (year and reporter not confirmed)", "t": "Compensation under S.73 covers actual, foreseeable loss and aims to put the injured party in the position it would have been in without the breach. Named in a LUMS Law Journal article; details not checked against the report.", "v": 2}], "links": [{"l": "S.74: stipulated sums", "m": 11, "sec": "S.74"}, {"l": "S.75: rightful rescission", "m": 11, "sec": "S.75"}, {"l": "S.39: refusal to perform", "m": 7, "sec": "S.39"}], "exam": 1, "blocks": [{"h": "S.73 Compensation for loss or damage caused by breach of contract. created by contract.", "paras": [{"t": "When a contract has been broken, the party who suffers by such breach is entitled to receive, from the party who has broken the contract, compensation for any loss or damage caused to him thereby, which naturally arose in the usual course of things from such breach, or which the parties knew, when they made the contract, to be likely to result from the breach of it.", "l": 0}, {"t": "Such compensation is not to be given for any remote and indirect loss or damage sustained by reason of the breach.", "l": 0}, {"t": "Compensation for failure to discharge obligation resembling those created by contract. – When an obligation resembling those created by contract has been incurred and has not been discharged, any person injured by the failure to discharge it is entitled to receive the same compensation from the party in default, as if such person had contracted to discharge it and had broken his contract.", "l": 0}, {"t": "Explanation.– In estimating the loss or damage arising from a breach of contract, the means which existed of remedying the inconvenience caused by the non- performance of the contract must be taken into account.", "l": 0}], "ills": [{"t": "(a) A contracts to sell and deliver 50 maunds of saltpetre to B, at a certain price to be paid on delivery. A breaks his promise. B is entitled to receive from A, by way of compensation, the sum, if any, by which the contract price falls short of the price for which B might have obtained 50 maunds of saltpetre of like quality at the time when the saltpetre ought to have been delivered.", "l": 0}, {"t": "(b) A hires B's ship to go to [Karachi,] and there take on board, on the first of January, a cargo which A is to provide and to bring it to [Chittagong,] the freight to be paid when earned. B's ship does not go to [Karachi,] but A has opportunities of procuring suitable conveyance for the cargo upon terms as advantageous as those on which he had chartered the ship. A avails himself of those opportunities, but is put to trouble and expense in doing so. A is entitled to receive compensation from B in respect of such trouble and expense.", "l": 0}, {"t": "(c) A contracts to buy of B, at a stated price, 50 maunds of rice, no time being fixed for delivery. A afterwards informs B that he will not accept the rice if tendered to him. B is entitled to receive from A, by way of compensation, the amount, if any, by which the contract price exceeds that which B can obtain for the rice at the time when A informs B that he will not accept it.", "l": 0}, {"t": "(d) A contracts to buy B's ship for 60,000 Rupees, but breaks his promise. A must pay to B, by way of compensation, the excess, if any, of the contract price over the price which B can obtain for the ship at the time of the breach of the promise.", "l": 0}, {"t": "(e) A, the owner of a boat, contracts with B to take a cargo of jute to [Mymensingh,] for sale at that place, starting on a specified day. The boat owing to some avoidable cause, does not start at the time appointed, where by the arrival of the cargo at [Mymensingh,] is delayed beyond the time when it would have arrived if the boat had sailed according to the contract. After that date, and before the arrival of the cargo, the price of jute falls. The measure of the compensation payable to B by A is the difference between the price which B could have obtained for the cargo at [Mymensingh,] at the time when it would have arrived if forwarded in due course, and its market price at the time when it actually arrived.", "l": 0}, {"t": "(f) A contracts to repair B's house in a certain manner, and receives payment in advance. A repairs the house, but not according to contract. B is entitled to recover from A the cost of making the repairs conform to the contract.", "l": 0}, {"t": "(g) A contracts to let his ship to B for a year, from the first of January, for a certain price. Freights rise, and, on the first of January, the hire obtainable for the ship is higher than the contract price. A breaks his promise. He must pay to B, by way of compensation, a sum equal to the difference between the contract price and the price for which B could hire a similar ship for a year on and from the first of January.", "l": 0}, {"t": "(h) A contracts to supply B with a certain quantity of iron at a fixed price, being a higher price than that for which A could procure and deliver the iron. B wrongfully refuses to receive the iron. B must pay to A, by way of compensation, the difference between the contract price of the iron and the sum for which A could have obtained and delivered it.", "l": 0}, {"t": "(i) A delivers to B, a common carrier, a machine, to be conveyed, without delay, to A's mill informing B that his mill is stopped for want of the machine. B unreasonably delays the delivery of the machine, and A, in consequence, losses a profitable contract with the Government. A is entitled to receive from B, by way of compensation, the average amount of profit which would have been made by the working of the mill during the time that delivery of it was delayed, but not the loss sustained through the loss of the Government contract.", "l": 0}, {"t": "(j) A, having contracted with B to supply B with 1,000 tons of iron at 100 Rupees a ton, to be delivered at a stated time, contracts with C for the purchase of 1,000 tons of iron at 80 Rupees a ton, telling C that he does so for the purpose of performing his contract with B. C fails to perform his contract with A, who cannot procure other iron, and B, in consequence, rescinds the contract. C must pay to A 20,000 Rupees, being the profit which A would have made by the performance of his contract with B.", "l": 0}, {"t": "(k) A contracts with B to make and deliver to B, by a fixed day, for a specified price, a certain piece of machinery. A does not deliver the piece of machinery at the time specified, and, in consequence of this, B is obliged to procure another at a higher price than that which he was to have paid to A, and is prevented from performing a contract which B had made with a third person at the time of his contract with A (but which had not been then communicated to A), and is compelled to make compensation for breach of that contract. A must pay to B, by way of compensation, the difference between the contract price of the piece of machinery and the sum paid by B for another, but not the sum paid by B to the third person by way of compensation.", "l": 0}, {"t": "(l) A, a builder, contracts to erect and finish a house by the first of January, in order that B may give possession of it at that time to C, to whom B has contracted to let it. A is informed of the contract between B and C. A builds the house so badly that, before the first of January, if falls down and has to be rebuilt by B, who, in consequence, losses the rent which he was to have received from C, and is obliged to make compensation to C for the breach of his contract. A must make compensation to B for the cost of rebuilding the house, for the rent lost, and for the compensation made to C.", "l": 0}, {"t": "(m) A sells certain merchandise to B, warranting it to be of a particular quality, and B, in reliance upon this warranty, sells it to C with a similar warranty. The goods prove to be not according to the warranty, and B becomes liable to pay C a sum of money by way of compensation. B is entitled to be reimbursed this sum by A.", "l": 0}, {"t": "(n) A contracts to pay a sum of money to B on a day specified. A does not pay the money on that day; B, in consequence of not receiving the money on that day, is unable to pay his debts, and is totally ruined. A is not liable to make good to B anything except the principal sum he contracted to pay, together with interest up to the day of payment.", "l": 0}, {"t": "(o) A contracts to deliver 50 maunds of saltpetre to B on the first of January, at a certain price. B afterwards, before the first of January, contracts to sell the saltpetre to C at a price higher than the market price of the first of January. A breaks his promise. In estimating the compensation payable by A to B, the market price of the first of January, and not the profit which would have arisen to B from the sale to C, is to be taken into account.", "l": 0}, {"t": "(p) A contracts to sell and deliver 500 bales of cotton to B on a fixed day, A knows nothing of B's mode of conducting his business. A breaks his promise, and B, having no cotton, is obliged to close his mill. A is not responsible to B for the loss caused to B by the closing of the mill.", "l": 0}, {"t": "(q) A contracts to sell and deliver to B, on the first of January, certain cloth which B intends to manufacture into caps of a particular kind, for which there is no demand, except at that season. The cloth is not delivered till after the appointed time, and too late to be used that year in making caps. B is entitled to receive from A, by way of compensation, the difference between the contract price of the cloth and its market price at the time of delivery, but not the profits which he expected to obtain by making caps, nor the expenses which he has been put to in making preparation for the manufacture.", "l": 0}, {"t": "(r) A, a ship-owner, contracts with B to convey him from [Karachi] to Sydney in A's ship, sailing on the first of January, and B pays to A, by way of deposit, one-half of his passage-money. The ship does not sail on the first of January, and B, after being, in consequence, detained in [Karachi] for some time, and thereby put to some expense, proceeds to Sydney in another vessel, and, in consequence, arriving too late in Sydney, loses a sum of money. A is liable to repay to B his deposit, with interest, and the expense to which he is put by his detention in [Karachi] and the excess, if any, of the passage-money paid for the second ship over that agreed upon for the first, but not the sum of money which B lost by arriving in Sydney too late.", "l": 0}]}]}, {"secs": ["74"], "code": "S.74", "term": "Compensation where a penalty is stipulated", "sub": "reasonable compensation up to the named sum", "hook": "The contract names a price for breach; the court asks what is reasonable and never goes above the number.", "plain": "If a sum is named as payable on breach, or any other penalty stipulated, the complaining party gets <b>reasonable compensation not exceeding the amount named</b>, <b>whether or not actual damage or loss is proved</b>. The first <b>Explanation</b> says a stipulation for increased interest from default may be a penalty. The <b>Exception</b>: bail-bonds, recognizances, and bonds for public duty are payable in full. A second <b>Explanation</b> says a contract with Government does not by itself involve a public duty. Illustrations (a)–(g): Rs 1,000 stipulated for non-payment of Rs 500 (reasonable amount only); a recognizance of Rs 500 (whole sum); a 75 per cent default rate (penalty); an instalment acceleration clause (not a penalty in (f), a penalty in (g)).", "cases": [{"n": "Province of West Pakistan v Mistri Patel & Co", "c": "Supreme Court of Pakistan (year and reporter not confirmed)", "t": "Under S.74 the English distinction between liquidated damages and penalties is not applied. The court awards reasonable compensation up to the named sum, and a forfeiture was refused where the Government had in fact made a profit on resale. Named in a LUMS Law Journal article; details not checked against the report.", "v": 2}, {"n": "Sandoz Limited v Federation of Pakistan", "c": "Supreme Court of Pakistan (year and reporter not confirmed)", "t": "Actual damages were awarded under S.73, but a claim for liquidated damages under S.74 failed because the breach was not proved. Named in a LUMS Law Journal article; details not checked against the report.", "v": 2}], "links": [{"l": "S.73: general damages", "m": 11, "sec": "S.73"}, {"l": "S.23–24", "m": 5, "sec": "S.23"}], "exam": 1, "blocks": [{"h": "S.74 Compensation for breach of contract where penalty stipulated for.", "paras": [{"t": "When a contract has been broken, if a sum is named in the contract as the amount to be paid in case of such breach, or if the contract contains any other stipulation by way of penalty, the party complaining of the breach is entitled, whether or not actual damage or loss is proved to have been caused thereby, to receive from the party who has broken the contract reasonable compensation not exceeding the amount so named or, as the case may be, the penalty stipulated for.", "l": 0}, {"t": "Explanation.– A stipulation for increased interest from the date of default may be stipulation by way of penalty.]", "l": 0}, {"t": "Exception.– When any person enters into any bail-bond, recognizance or other instrument of the same nature, or, under the provisions of any law, or under the orders of the [Federal Government], or of any [Provincial Government] gives any bond for the performance of any public duty or act in which the public are interested, he shall be liable, upon breach of the condition of any such instrument, to pay the whole sum mentioned therein.", "l": 0}, {"t": "Explanation.– A person who enters into a contract with Government does not necessarily thereby undertake any public duty, or promise to do an act in which the public are interested.", "l": 0}], "ills": [{"t": "(a) A contracts with B to pay B Rupees 1,000, if he fails to pay B Rupees 500 on a given day. A fails pay B Rupees 500 on that day. B is entitled to recover from A such compensation, not exceeding Rupees 1,000, as the Court considers reasonable.", "l": 0}, {"t": "(b) A contracts with B that, if A practices as a surgeon within [Peshawar] he will pay B Rupees 5,000. A practices as a surgeon in [Peshawar]. B is entitled to such compensation, not exceeding Rupees 5,000, as the Court considers reasonable.", "l": 0}, {"t": "(c) A gives a recognizance binding him in a penalty of Rupees 500 to appear in court on a certain day. He forfeits his recognizance. He is liable to pay the whole penalty.", "l": 0}, {"t": "(d) [A gives B a bond for the repayment of Rupees 1,000 with interest at 12 per cent. at the end of six months, with a stipulation that in case of default, interest shall be payable at the rate of 75 per cent. from the date of default. This is a stipulation by way of penalty, and B is only entitled to recover from A such compensation as the Court considers reasonable.", "l": 0}, {"t": "(e) A, who owes money to B, a money-lender, undertakes to repay him by delivering to him 10 maunds of grain on a certain date, and stipulates that, in the event of his not delivering the stipulated amount by the stipulated date, he shall be liable to deliver 20 maunds. This is a stipulation by way of penalty, and B is only entitled to reasonable compensation in case of breach.", "l": 0}, {"t": "(f) A undertakes to repay B a loan of Rupees 1,000 by five equal monthly instalments with a stipulation that, in default of payment of any installment, the whole shall become due. This stipulation is not by way of penalty, and the contract may be enforced according to its terms.", "l": 0}, {"t": "(g) A borrows Rupees 100 from B and gives him a bond for Rupees 200 payable by five yearly instalments of Rupees 40, with a stipulation that, in default of payment of any installment, the whole shall become due. This is a stipulation by way of penalty.]", "l": 0}]}]}, {"secs": ["75"], "code": "S.75", "term": "Compensation to the party who rightly rescinds", "sub": "rescission plus damages", "hook": "Walking out of a broken contract does not cost you your claim for loss.", "plain": "A person who <b>rightly rescinds</b> a contract is entitled to compensation for <b>damage sustained through non-fulfilment</b>. Illustration: a singer who wilfully absents herself on the sixth night; the manager rescinds and may claim compensation.", "cases": [], "links": [{"l": "S.64: consequences of rescission", "m": 9, "sec": "S.64"}, {"l": "S.39", "m": 7, "sec": "S.39"}], "blocks": [{"h": "S.75 Party rightfully rescinding contract entitled to compensation.", "paras": [{"t": "A person who rightly rescinds a contract is entitled to compensation for any damage which he has sustained through the non-fulfilment of the contract.", "l": 0}], "ills": [{"t": "A, a singer, contract with B, the manager of a theatre, to sing at his theatre for two nights in every week during the next two months, and B engages to pay her 100 Rupees for each night's performance. On the sixth night, A wilfully absents herself from the theatre, and B, in consequence, rescinds the contract. B is entitled to claim compensation for the damage which he has sustained through the non-fulfilment of the contract.", "l": 0}]}]}], "spar": [{"q": "A mill owner sends a broken part by carrier, telling him nothing about the stopped mill. Delivery is delayed. Can he recover lost profits? What test applies?", "a": "<b>Probably not.</b> S.73 allows loss that arises <b>naturally</b> or that the parties <b>knew was likely</b> when contracting. The classic English decision is <i>Hadley v Baxendale</i> (1854), whose rule S.73 codifies. If the carrier had been told the mill was stopped, illustration (i) shows loss of a profitable contract becomes recoverable."}, {"q": "A promises B Rs 1,000 if A fails to pay B Rs 500 on a given day. A fails. What does B get?", "a": "<b>Reasonable compensation up to Rs 1,000</b> (S.74, illustration (a)), not automatically Rs 1,000. The court decides what is reasonable, and B need not prove actual loss. This differs from the English penalty rule, which strikes penalties out altogether; the contrast is a textbook comparison, not text of the Act."}, {"q": "A recognizance of Rs 500 for appearance in court is forfeited. How much is payable?", "a": "<b>The whole Rs 500.</b> The <b>Exception</b> to S.74 (illustration (c)) makes bail-bonds and recognizances payable in full, with no reasonable-compensation filter."}, {"q": "B wrongfully refuses delivery under a contract to supply iron at a price higher than A can obtain it for. What is A’s measure?", "a": "<b>The difference</b> between the contract price and the market price at the time of the breach (S.73, illustration (h)). The Explanation then limits the sum to what could not be avoided by reasonable steps, which is the statutory root of the duty to mitigate."}]}, "12": {"n": 12, "intro": "Chapter VIII: indemnity (S.124–125) and guarantee (S.126–147). Indemnity is a promise to save from loss. Guarantee has three parties, with a distinctive code on consideration, extent of liability, continuing guarantees, discharge of the surety, rights after payment, and co-sureties.", "boundary": "<b>Boundary.</b> Bailment and pledge are in Module 13. General rules on consideration and misrepresentation are in Modules 3–4. The Act’s Chapter VIII does not include sureties in a company law context.", "recall": "<b>Quick recall</b>Guarantee: <b>three parties</b>, oral or written (S.126). Surety = <b>co-extensive</b> (S.128). Discharged by: <b>variance</b> (S.133), <b>release of debtor</b> (S.134), <b>giving time by contract</b> (S.135), <b>impairing his remedy</b> (S.139), <b>losing securities</b> (S.141). Not discharged by: forbearance (S.137), release of co-surety (S.138). After paying: indemnity (S.145), contribution (S.146–147).", "rails": [{"secs": ["124"], "code": "S.124", "term": "Contract of indemnity defined", "sub": "promise to save from loss", "hook": "An indemnity is a safety net woven by the promisor himself.", "plain": "A contract by which one party promises to <b>save the other from loss</b> caused by the <b>conduct of the promisor himself or of any other person</b>. Illustration: A indemnifies B against proceedings C may take against B over Rs 200. <b>Note:</b> the Act’s definition is narrower than the modern commercial idea of indemnity; that comparison is textbook commentary, not text of the Act.", "cases": [], "links": [{"l": "S.125: indemnity-holder’s rights", "m": 12, "sec": "S.125"}, {"l": "S.126: guarantee", "m": 12, "sec": "S.126"}], "blocks": [{"h": "S.124 \"Contract of indemnity\" defined.", "paras": [{"t": "A contract by which one party promises to save the other from loss caused to him by the conduct of the promisor himself, or by the conduct of any other person, is called a \"contract of indemnity\".", "l": 0}], "ills": [{"t": "A contracts to indemnify B against the consequences of any proceedings which C may take against B in respect of a certain sum of 200 Rupees. This is a contract of indemnity.", "l": 0}]}]}, {"secs": ["125"], "code": "S.125", "term": "Rights of the indemnity-holder when sued", "sub": "damages, costs, compromise sums", "hook": "What the indemnified person can claw back: damages, prudent costs, and sensible compromises.", "plain": "The promisee, <b>acting within the scope of his authority</b>, can recover from the promisor: (1) <b>all damages</b> he is compelled to pay in a suit on a matter covered by the indemnity; (2) <b>all costs</b> of the suit, if he did not contravene the promisor’s orders and acted as prudently as if there were no indemnity, <b>or</b> the promisor authorized him; (3) <b>sums paid on a compromise</b> not contrary to the promisor’s orders and prudent, <b>or</b> authorized by the promisor.", "cases": [], "links": [{"l": "S.124", "m": 12, "sec": "S.124"}, {"l": "S.145: surety’s implied indemnity", "m": 12, "sec": "S.145–147"}], "blocks": [{"h": "S.125 Rights of indemnity- holder when sued.", "paras": [{"t": "The promisee in a contract of indemnity, acting within the scope of his authority, is entitled to recover from the promisor–", "l": 0}, {"t": "(1) all damages which he may be compelled to pay in any suit in respect of any matter to which the promise to indemnify applies;", "l": 1}, {"t": "(2) all costs which he may be compelled to pay in any such suit if, in bringing or defending it, he did not contravene the orders of the promisor, and acted as it would have been prudent for him to act in the absence of any contract of indemnity, or if the promisor authorized him to bring or defend the suit;", "l": 1}, {"t": "(3) all sums which he may have paid under the terms of any compromise of any such suit, if the compromise was not contrary to the orders of the promisor, and was one which it would have been prudent for the promisee to make in the absence of any contract of indemnity, or if the promisor authorized him to compromise the suit.", "l": 1}], "ills": []}]}, {"secs": ["126"], "code": "S.126", "term": "Contract of guarantee; surety, principal debtor, creditor", "sub": "a promise to answer for another’s default", "hook": "Three parties, one safety net: the surety promises the creditor to answer if the debtor does not.", "plain": "A <b>contract of guarantee</b> is a contract to <b>perform the promise, or discharge the liability, of a third person in case of his default</b>. The giver is the <b>surety</b>, the defaulter the <b>principal debtor</b>, the recipient the <b>creditor</b>. A guarantee may be <b>oral or written</b>.", "cases": [], "links": [{"l": "S.127: consideration", "m": 12, "sec": "S.127"}, {"l": "S.128: extent of liability", "m": 12, "sec": "S.128"}, {"l": "S.124: indemnity", "m": 12, "sec": "S.124"}], "blocks": [{"h": "S.126 \"Contract of guarantee\", \"surety\", \"principal debtor\" and \"creditor\"", "paras": [{"t": "A \"contract of guarantee\" is a contract to perform the promise, or discharge the liability, of a third person in case of his default. The person who gives the guarantee is called the \"surety\": the person in respect of whose default the guarantee is given is called the \"principal debtor\", and the person to whom the guarantee is given is called the \"creditor\". A guarantee may be either oral or written.", "l": 0}], "ills": []}]}, {"secs": ["127"], "code": "S.127", "term": "Consideration for guarantee", "sub": "benefit to the principal debtor suffices", "hook": "The surety need not receive anything himself: what the debtor receives is enough.", "plain": "<b>Anything done, or any promise made, for the benefit of the principal debtor</b> may be sufficient consideration to the surety. Illustrations: A delivers goods on credit to B because C guarantees payment (sufficient); A forbears from suing B for a year at C’s request, and C promises to pay on B’s default (sufficient); C promises to pay for goods already delivered, without any consideration (void).", "cases": [], "links": [{"l": "S.2(d): consideration", "m": 1, "sec": "S.2(d)"}, {"l": "S.25: without consideration", "m": 5, "sec": "S.25"}], "blocks": [{"h": "S.127 Consideration for guarantee.", "paras": [{"t": "Anything done, or any promise made, for the benefit of the principal debtor may be a sufficient consideration to the surety for giving the guarantee.", "l": 0}], "ills": [{"t": "(a) B requests A to sell and deliver to him goods on credit. A agrees to do so, provided C will guarantee the payment of the price of the goods. C promises to guarantee the payment in consideration of A's promise to deliver the goods. This is a sufficient consideration for C's promise.", "l": 0}, {"t": "(b) A sells and delivers goods to B. C afterwards requests A to forbear to sue B for the debt for a year, and promises that if he does so, C will pay for them in defaults of payment by B. A agrees to forbear as requested. This is a sufficient consideration for C's promise.", "l": 0}, {"t": "(c) A sells and delivers goods to B. C afterwards, without consideration, agrees to pay for them in default of B. The agreement is void.", "l": 0}]}]}, {"secs": ["128"], "code": "S.128", "term": "Surety’s liability", "sub": "co-extensive with the principal debtor’s", "hook": "The surety walks exactly as far as the debtor does, unless the contract says otherwise.", "plain": "The surety’s liability is <b>co-extensive</b> with that of the principal debtor, <b>unless otherwise provided</b> by the contract. Illustration: A guarantees payment of a bill by acceptor C; A is liable for the amount, interest and charges.", "cases": [{"n": "Bank of Bihar v Damodar Prasad", "c": "AIR 1969 SC 297 (Supreme Court of India)", "t": "A surety’s liability arises immediately on default of the principal debtor. The creditor need not first exhaust remedies against the debtor, and the surety has no right to restrain execution without some special equity.", "v": 1}], "links": [{"l": "S.126", "m": 12, "sec": "S.126"}, {"l": "S.133–139: discharge", "m": 12, "sec": "S.133"}], "blocks": [{"h": "S.128 Surety's liability.", "paras": [{"t": "The liability of the surety is co-extensive with that of the principal debtor, unless it is otherwise provided by the contract.", "l": 0}], "ills": [{"t": "A guarantees to B the payment of a bill of exchange by C, the acceptor. The bill is dishonoured by C. A is liable not only for the amount of the bill but also for any interest and charges which may have become due on it.", "l": 0}]}]}, {"secs": ["129", "130", "131"], "code": "S.129–131", "term": "Continuing guarantee; revocation by notice or death", "sub": "covers a series; ends by notice or death for the future", "hook": "A guarantee for a running account can be switched off, but only for the future.", "plain": "<b>S.129:</b> a guarantee extending to a <b>series of transactions</b> is a <b>continuing guarantee</b> (illustrations: collection of zamindari rents up to Rs 5,000; tea supplied to C up to £100 and so on; five sacks of flour, with the guarantee held to have covered only the first transaction). <b>S.130:</b> it may at any time be <b>revoked by the surety, as to future transactions, by notice to the creditor</b>. <b>S.131:</b> the <b>death of the surety</b> revokes it as to future transactions, unless the contract provides otherwise.", "cases": [], "links": [{"l": "S.126", "m": 12, "sec": "S.126"}, {"l": "S.133: variance", "m": 12, "sec": "S.133"}], "blocks": [{"h": "S.129 \"Continuing guarantee\".", "paras": [{"t": "A guarantee which extends to a series of transactions is called a \"continuing guarantee\".", "l": 0}], "ills": [{"t": "(a) A, in consideration that B will employ C in collecting the rent of B's zamindari, promises B to be responsible, to the amount of 5,000 Rupees, for the due collection and payment by C of those rents. This is a continuing guarantee.", "l": 0}, {"t": "(b) A guarantees payment to B, a tea-dealer, to the amount of £ 100, for any tea he may from time to time supply to C. B supplies C with tea to above the value of £ 100, and C pay B for it. Afterwards B supplies C with tea to the value of £ 200. C fails to pay. The guarantee given by A was a continuing guarantee, and he is accordingly liable to B to the extent of £ 100.", "l": 0}, {"t": "(c) A guarantees payment to B of the price of five sacks of flour to be delivered by B to C and to be paid for in a month. B delivers five sacks to C. C pays for them. Afterwards B delivers four sacks to C, which C does not pay for. The guarantee given by A was not a continuing guarantee, and accordingly he is not liable for the price of the four sacks.", "l": 0}]}, {"h": "S.130 Revocation of continuing guarantee.", "paras": [{"t": "A continuing guarantee may at any time be revoked by the surety, as to future transactions, by notice to the creditor.", "l": 0}], "ills": [{"t": "(a) A, in consideration of B's discounting, at A's request, bills of exchange for C, guarantees to B, for twelve months, the due payment of all such bills to the extent of 5,000 Rupees. B discounts bills for C to the extent of 2,000 Rupees. Afterwards, at the end of three months, A revokes the guarantee. This revocation discharges A from all liability to B for any subsequent discount. But A is liable to B for the 2,000 Rupees, on default of C.", "l": 0}, {"t": "(b) A guarantees to B, to the extent of 10,000 Rupees, that C shall pay all the bills that B shall draw upon him. B draws upon C. C accepts the bill. A gives notice of revocation. C dishonours the bill at maturity. A is liable upon his guarantee.", "l": 0}]}, {"h": "S.131 Revocation of continuing guarantee by surety's death.", "paras": [{"t": "The death of the surety operates, in the absence of any contract to the contrary, as a revocation of a continuing guarantee, so far as regards future transactions.", "l": 0}], "ills": []}]}, {"secs": ["132"], "code": "S.132", "term": "Two persons primarily liable; arrangement that one is surety", "sub": "creditor’s rights unaffected", "hook": "The private deal between co-obligors does not shrink the creditor’s rights, even if the creditor knew of it.", "plain": "Where two persons contract with a third to undertake a liability and <b>also agree between themselves</b> that one will be liable only on the other’s default, the third person’s rights against <b>each of them</b> are <b>not affected</b>, even if the third person knew of the second arrangement. Illustration: a joint and several promissory note made by A as surety for B, known to C; A cannot use that as an answer to C’s suit.", "cases": [], "links": [{"l": "S.128", "m": 12, "sec": "S.128"}], "blocks": [{"h": "S.132 Liability of two persons primarily liable, not affected by arrangement between them that one shall be surety on other’s default.", "paras": [{"t": "Where two persons contract with a third person to undertake a certain liability, and also contract with each other that one of them shall be liable only on the default of the other, the third person not being a party to such contract, the liability of each of such two persons to the third person under the first contract is not affected by the existence of the second contract, although such third person may have been aware of its existence.", "l": 0}], "ills": [{"t": "A and B make a joint and several promissory note to C. A makes it, in fact, as surety for B, and C knows this at the time when the note is made. The fact that A, to the knowledge of C, made the note as surety for B, is no answers to a suit by C against A upon the note.", "l": 0}]}]}, {"secs": ["133"], "code": "S.133", "term": "Discharge by variance in the principal contract", "sub": "any variance without consent discharges for later transactions", "hook": "Change the deal behind the surety’s back and he walks away from what follows.", "plain": "Any <b>variance, made without the surety’s consent</b>, in the terms of the contract between the principal debtor and the creditor <b>discharges the surety</b> as to transactions <b>subsequent to the variance</b>. Illustrations include a raised salary and shared overdraft losses (A discharged); a changed statutory office (A discharged); a changed method of remuneration; a change to cash supply on a continuing guarantee; and a loan paid out earlier than agreed (A discharged).", "cases": [], "links": [{"l": "S.134–139: other discharges", "m": 12, "sec": "S.134"}, {"l": "S.128", "m": 12, "sec": "S.128"}], "blocks": [{"h": "S.133 Discharge of surety by variance in terms of contract.", "paras": [{"t": "Any variance, made without the surety's consents, in the terms of the contract between the principal [debtor] and the creditor, discharges the surety as to transactions subsequent to the variance.", "l": 0}], "ills": [{"t": "(a) A becomes surety to C for B's conduct as a manager in C's bank. Afterwards, B and C contract, without A's consent, that B's salary shall be raised, and that he shall become liable for one-fourth of the losses on overdrafts. B allows a customer to overdraw, and the bank loses a sum of money. A is discharged from his suretyship by the variance made without his consent, and is not liable to make good this loss.", "l": 0}, {"t": "(b) A guarantees C against the misconduct of B in an office to which B is appointed by C, and of which the duties are defined by an Act of the Legislature. By a subsequent Act, the nature of the office is materially altered. Afterwards, B misconducts himself. A is discharged by the change from future liability under his guarantee, though the misconduct of B is in respect of a duty not affected by the later Act.", "l": 0}, {"t": "(c) C agrees to appoint B as his clerk to sell goods at a yearly salary, upon A's becoming surety to C for B's duly accounting for moneys received by him as such clerk. Afterwards, without A's knowledge or consent, C and B agree that B should be paid by a commission on the goods sold by him and not by a fixed salary. A is not liable for subsequent misconduct of B.", "l": 0}, {"t": "(d) A gives to C a continuing guarantee to the extent of 3,000 Rupees for any oil supplied by C to B on credit. Afterwards B becomes embarrassed, and, without the knowledge of A, B and C contract that C shall continue to supply B with oil for ready money, and that the payments shall be applied to the then existing debts between B and C. A is not liable on his guarantee for any goods supplied after this new arrangement.", "l": 0}, {"t": "(e) C contracts to lend B 5,000 Rupees on the 1st March. A guarantees repayment. C pays the 5,000 Rupees to B on the 1st January. A is discharged from his liability, as the contract has been varied inasmuch as C might sue B for the money before the 1st of March.", "l": 0}]}]}, {"secs": ["134"], "code": "S.134", "term": "Discharge by release or discharge of principal debtor", "sub": "contract of release or act with that legal effect", "hook": "If the debtor is let go, so is the guarantor.", "plain": "The surety is discharged by any contract between the creditor and the principal debtor by which the debtor is <b>released</b>, or by any <b>act or omission of the creditor</b> whose legal consequence is the <b>discharge of the debtor</b>. Illustrations: the debtor assigning property to creditors for a release (surety discharged); B diverting the water A needs, preventing A’s crop (C discharged); B failing to supply the timber for the house A builds (C discharged).", "cases": [], "links": [{"l": "S.133", "m": 12, "sec": "S.133"}, {"l": "S.135", "m": 12, "sec": "S.135–137"}], "blocks": [{"h": "S.134 Discharge of surety by release or discharge of principal debtor.", "paras": [{"t": "The surety is discharged by any contract between the creditor and the principal debtor, by which the principal debtor is released, or by any act or omission of the creditor, the legal consequence of which is the discharge of the principal debtor.", "l": 0}], "ills": [{"t": "(a) A gives a guarantee to C for goods to be supplied by C to B. C supplies goods to B, and afterwards B becomes embarrassed and contracts with his creditors (including C) to assign to them his property in consideration of their releasing him from their demands. Here B is released from his debt by the contract with C, and A is discharged from his surety ship.", "l": 0}, {"t": "(b) A contracts with B to grow a crop of indigo on A's land and to deliver it to B at a fixed rate, and C guarantees A's performance of this contract. B diverts a stream of water which is necessary for irrigation of A's land and thereby prevents him from raising the indigo. C is no longer liable on his guarantee.", "l": 0}, {"t": "(c) A contracts with B for a fixed price to build a house for B within a stipulated time, B supplying the necessary timber. C guarantees A's performance of the contract. B omits to supply the timber. C is discharged from his suretyship.", "l": 0}]}]}, {"secs": ["135", "136", "137"], "code": "S.135–137", "term": "Composition, time, forbearance", "sub": "agreement with the debtor discharges; bare forbearance does not", "hook": "Give the debtor time by contract and the surety
