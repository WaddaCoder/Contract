: {"n": 17, "intro": "The central question of sale: when does ownership move, who bears the risk, and when can a buyer get good title from a seller who is not the owner. S.19–26 give the rules on passing of property; S.27 deals with risk; S.28–31 state the nemo dat rule and its four exceptions: mercantile agents, joint owners, voidable contracts, and sellers or buyers left in possession.", "boundary": "<b>Boundary.</b> Formation is Module 15; conditions and warranties are Module 16; delivery and acceptance are Module 18; the unpaid seller’s rights, including sub-sales (S.54), are Module 19. Pledge by a mercantile agent is S.178 of the Contract Act (Module 13).", "recall": "<b>Quick recall</b><b>Unascertained</b>: no property until ascertained (S.19). <b>Specific, deliverable, unconditional</b>: property at contract (S.21). Otherwise <b>intention</b> (S.20), <b>appropriation</b> (S.24), <b>approval</b> (S.25), <b>right of disposal</b> (S.26). <b>Risk follows property</b> (S.27). <b>Nemo dat</b> (S.28) with exceptions: agent (S.28 proviso), joint owner (S.29), voidable (S.30), possession (S.31).", "rails": [{"secs": ["19"], "code": "S.19", "term": "Unascertained goods: property cannot pass until ascertained", "sub": "no property in goods not yet identified", "hook": "You cannot own “some” of a pile until someone decides which part is yours.", "plain": "Where there is a contract for the sale of <b>unascertained goods</b>, <b>no property</b> is transferred to the buyer <b>unless and until the goods are ascertained</b>.", "cases": [{"n": "Re Wait", "c": "[1927] 1 Ch 606 (CA)", "t": "A buyer of 500 tons from a larger cargo could not claim property before the goods were ascertained. The citation was confirmed on a database page, but the outcome is stated here from the standard textbook account and was not confirmed from the page.", "v": 2}], "links": [{"l": "S.24: appropriation", "m": 17, "sec": "S.24"}, {"l": "S.2(13): specific goods", "m": 15, "sec": "S.2(13), (14)"}], "blocks": [{"h": "S.19 Goods must be ascertained", "paras": [{"t": "Where there is a contract for the sale of unascertained goods, no property in the goods is transferred to the buyer unless and until the goods are ascertained.", "l": 0}], "ills": []}]}, {"secs": ["20"], "code": "S.20", "term": "Property passes when the parties intend", "sub": "intention from terms, conduct and circumstances", "hook": "Ownership moves when the parties meant it to move, and the next sections are rules for finding that intention.", "plain": "<b>S.20(1):</b> for <b>specific or ascertained goods</b>, property passes at <b>such time as the parties intend</b>. <b>S.20(2):</b> intention is found from the <b>terms of the contract</b>, the <b>conduct of the parties</b> and the <b>circumstances</b>. <b>S.20(3):</b> unless a different intention appears, the rules in the next sections are <b>rules for ascertaining the intention</b>. The printed text refers to “section 20 to 24”; kept as printed.", "cases": [], "links": [{"l": "S.21–26", "m": 17, "sec": "S.21"}, {"l": "S.4: sale v agreement to sell", "m": 15, "sec": "S.4"}], "exam": 1, "blocks": [{"h": "S.20 Property passes when intended to pass", "paras": [{"t": "(1) Where there is a contract for the sale of specific or ascertained goods the property in them is transferred to the buyer at such time as the parties to the contract intend in to the transferred.", "l": 1}, {"t": "(2) For the purpose of ascertaining the intention of the parties regard shall be had to the terms of the contract, the conduct of the parties and the circumstance of the case.", "l": 1}, {"t": "(3) Unless a different intention appears, the rules contained in section 20 to 24 are rules for ascertaining the intention of the parties as to the time at which the property in the goods is to pass to the buyer.", "l": 1}], "ills": []}]}, {"secs": ["21"], "code": "S.21", "term": "Specific goods in a deliverable state", "sub": "unconditional contract: property passes at once", "hook": "Point at the horse, agree, done: the horse is yours now, even if you pay or collect later.", "plain": "Where there is an <b>unconditional contract</b> for specific goods <b>in a deliverable state</b>, the property passes <b>when the contract is made</b>, and it is <b>immaterial</b> whether the time of <b>payment</b> or <b>delivery</b>, or both, is postponed.", "cases": [], "links": [{"l": "S.27: risk", "m": 17, "sec": "S.27"}, {"l": "S.22–23", "m": 17, "sec": "S.22–23"}], "exam": 1, "blocks": [{"h": "S.21 Specific goods in a deliverable state", "paras": [{"t": "Where there is an unconditional contract for the sale of specific goods in a deliverable state, the property in the goods passes to the buyer when the contract is made, and it is immaterial whether the time of payment of the price or the time of delivery of the goods, or both, is postponed.", "l": 0}], "ills": []}]}, {"secs": ["22", "23"], "code": "S.22–23", "term": "Goods to be put in deliverable state; seller to weigh or test", "sub": "property waits for the act and notice to the buyer", "hook": "If the seller still has a job to do on the goods, ownership waits until it is done and the buyer knows.", "plain": "<b>S.22:</b> for specific goods the seller must <b>do something to put into a deliverable state</b>; property does not pass until that is done <b>and the buyer has notice</b>. <b>S.23:</b> for specific goods in a deliverable state, where the seller must <b>weigh, measure, test or do some act to ascertain the price</b>, property does not pass until the act is done <b>and the buyer has notice</b>.", "cases": [], "links": [{"l": "S.21", "m": 17, "sec": "S.21"}], "blocks": [{"h": "S.22 Specific goods to be put into a deliverable state", "paras": [{"t": "Where there is a contract for the sale of specific goods and the seller is bound to do something of the goods for the purpose of putting them into a deliverable state, the property does not pass until such thing is done and the buyer has notice thereof.", "l": 0}], "ills": []}, {"h": "S.23 Specific goods in a deliverable state, when the seller has to do anything thereto in order to ascertain price", "paras": [{"t": "Where there is a contract for the sale of specific goods in a deliverable state, but the seller is bound to weigh, measure, test or do some other act or thing with reference to the goods for the purpose of ascertaining the price, the property does not pass until such act or thing is done and the buyer has notice thereof.", "l": 0}], "ills": []}]}, {"secs": ["24"], "code": "S.24", "term": "Unascertained or future goods: appropriation", "sub": "unconditional appropriation with assent; delivery to carrier", "hook": "The goods become the buyer’s when the seller sets them aside for the contract with the buyer’s assent, and handing them to a carrier usually counts.", "plain": "<b>S.24(1):</b> for <b>unascertained or future goods by description</b>, property passes when goods of that description <b>in a deliverable state</b> are <b>unconditionally appropriated</b> to the contract, by the seller with the buyer’s assent or by the buyer with the seller’s; assent may be <b>express or implied</b>, before or after appropriation. <b>S.24(2):</b> delivery by the seller to the buyer or to a <b>carrier or other bailee</b> for transmission, <b>without reserving the right of disposal</b>, is deemed unconditional appropriation.", "cases": [], "links": [{"l": "S.19", "m": 17, "sec": "S.19"}, {"l": "S.26", "m": 17, "sec": "S.26"}, {"l": "S.40: delivery to carrier", "m": 18, "sec": "S.40–41"}], "exam": 1, "blocks": [{"h": "S.24 Sale of unascertained goods and appropriation.", "paras": [{"t": "(1) Where there is a contract for the sale of unascertained or future goods by description and goods of that description and in a deliverable state are unconditionally appropriated to the contract, either by the seller with the assent of the buyer or by the buyer with the assent of the seller, the property in the goods thereupon passes to the buyer, Such assent may be express or implied, and may be given either before or after the appropriation is made.", "l": 1}, {"t": "(2) Delivery to carrier.– Where, in pursuance of the contract, the seller delivers the goods to the buyer or to a carrier to other bailee (whether named by the buyer or not) for the purpose of transmission to the buyer, and does not reserve the right to disposal, he is deemed to have unconditionally appropriated the goods to the contract.", "l": 1}], "ills": []}]}, {"secs": ["25"], "code": "S.25", "term": "Goods on approval or “on sale or return”", "sub": "property passes on approval, adoption, or lapse of time", "hook": "Take it home on trial and you become owner when you approve it, act like an owner, or hold it too long.", "plain": "When goods are delivered on <b>approval</b> or <b>sale or return</b>, property passes to the buyer: (a) when he <b>signifies approval or acceptance</b> to the seller or does <b>any other act adopting the transaction</b>; (b) if he <b>retains the goods without giving notice of rejection</b>, on expiry of the <b>fixed time</b> for return, or if none was fixed, of a <b>reasonable time</b>.", "cases": [], "links": [{"l": "S.43: acceptance", "m": 18, "sec": "S.42–44"}, {"l": "S.8 Contract Act: acceptance by conduct", "m": 2, "sec": "S.8"}], "blocks": [{"h": "S.25 Goods sent on approval or \"on sale or return\".", "paras": [{"t": "When goods are delivered to the buyer on approval or \"on sale or return\" of other similar terms, the property therein passes to the buyer–", "l": 0}, {"t": "(a) when he signifies his approval or acceptance to the seller or does any other act adopting the transaction;", "l": 1}, {"t": "(b) if he does not signify his approval or acceptance to the seller but retains the does without giving of rejection, then, if a time has been fixed for the return of the goods, on the expiration of such time, and, if no time has been fixed, on the expiration of a reasonable time.", "l": 1}], "ills": []}]}, {"secs": ["26"], "code": "S.26", "term": "Reservation of the right of disposal", "sub": "seller keeps control until conditions are met; bills of lading", "hook": "The seller can ship the goods but keep the key until paid.", "plain": "<b>S.26(1):</b> the seller may, by terms of the contract or appropriation, <b>reserve the right of disposal</b> until conditions are fulfilled; property does not pass until then, <b>even after delivery to the buyer or a carrier</b>. <b>S.26(2):</b> goods shipped or sent by rail with a bill of lading or railway receipt <b>deliverable to the seller’s order or his agent</b>: the seller is <b>prima facie deemed to reserve</b> the right (bracketed in the printed text). <b>S.26(3):</b> where the seller draws a bill of exchange on the buyer and sends the bill of lading or railway receipt with it, the buyer must <b>return the document if he does not honour the bill</b>; wrongful retention means the property does not pass.", "cases": [], "links": [{"l": "S.24(2)", "m": 17, "sec": "S.24"}, {"l": "S.2(3): document of title", "m": 15, "sec": "S.2(2), (3)"}, {"l": "S.47: unpaid seller’s rights", "m": 19, "sec": "S.47"}], "blocks": [{"h": "S.26 Reservation of right of disposal.", "paras": [{"t": "(1) Where there is a contract for the sale of specific goods or where goods are subsequently appropriated to the contract, the seller may, be the terms of the contract or appropriation, reserve the right of disposal of the goods until certain conditions are fulfilled. In such case, notwithstanding the delivery of the goods to a buyer, or to a carrier or other bailee for the purpose of transmission to the buyer, the property in the goods does not pass to the buyer until the imposed by the seller are fulfilled.", "l": 1}, {"t": "[(2) Where goods are shipped or are dispatched by railway and are by the bill of lading or by railway receipt deliverable to the order of the seller or his agent the seller is prima facie deemed to reserve the right of disposal].", "l": 0}, {"t": "(3) Where the seller of goods draws on the buyer for the price and transmits the bill of exchange and [bill of landing or railway receipt] to the buyer together, to secure acceptance or payment of the bill of exchange, the buyer is bound to return the [bill of lading or railway receipt] if he does not honour the bill of exchange and if he wrongfully retains the [bill of lading or railway receipt] the property in the goods does not pass to him.", "l": 1}], "ills": []}]}, {"secs": ["27"], "code": "S.27", "term": "Risk prima facie passes with property", "sub": "at the seller’s risk until property passes; buyer’s risk after", "hook": "Risk follows ownership, unless the contract says otherwise or someone delays delivery.", "plain": "Unless otherwise agreed, the goods remain at the <b>seller’s risk</b> until the property is transferred; when it is transferred, they are at the <b>buyer’s risk</b> <b>whether delivery has been made or not</b>. <b>Proviso 1:</b> where delivery has been delayed <b>through the fault of either party</b>, the goods are at the risk of the party in fault for any loss that might not have occurred but for the fault. <b>Proviso 2:</b> the duties of a seller or buyer as a <b>bailee</b> are unaffected. The printed text repeats a clause in the middle of the sentence; kept as printed.", "cases": [], "links": [{"l": "S.8: perishing before risk passes", "m": 15, "sec": "S.8"}, {"l": "S.151 Contract Act: bailee’s care", "m": 13, "sec": "S.151–152"}, {"l": "S.40(3): sea transit", "m": 18, "sec": "S.40–41"}], "blocks": [{"h": "S.27 Risk prima facie passes with property.", "paras": [{"t": "Unless otherwise agreed, the goods remain at the seller's risk until the property therein is transferred to the buyer, but when the property therein is transferred to the buyer, but when the property therein is transferred to the buyer, the goods are at the buyer's risk whether delivery has been made or not: Provided that, where delivery has been delayed through the fault of either buyer or seller, the goods are at the risk of the party in fault as regards any loss which might not have occurred but for such fault: Provided also that nothing in this section shall affect the duties or liabilities of either seller or buyer as a bailee of the goods of the other party.", "l": 0}], "ills": []}]}, {"secs": ["28"], "code": "S.28", "term": "Sale by a person who is not the owner (nemo dat)", "sub": "no better title than the seller had, with exceptions", "hook": "You cannot give what you do not have, unless the owner lets you appear to have it.", "plain": "Subject to the Act and other law, where goods are sold by a person <b>not the owner</b> and not selling with the owner’s authority or consent, the buyer <b>acquires no better title than the seller had</b>, <b>unless the owner is by his conduct precluded</b> from denying the seller’s authority. <b>Proviso:</b> a <b>mercantile agent</b> in possession of the goods or documents of title <b>with the owner’s consent</b>, acting in the <b>ordinary course of business</b> of a mercantile agent, passes a sale as valid as if authorised, provided the buyer acts in <b>good faith</b> and without notice of lack of authority.", "cases": [{"n": "Cundy v Lindsay", "c": "(1878) 3 App Cas 459 (HL)", "t": "A rogue posed as a respected firm to obtain goods, then sold them to an innocent buyer. No contract had been formed with the rogue, so title never passed, and the innocent buyer had to return the goods.", "v": 1}], "links": [{"l": "S.2(8): mercantile agent", "m": 15, "sec": "S.2(8)"}, {"l": "S.178 Contract Act", "m": 13, "sec": "S.178–179"}, {"l": "S.29–31", "m": 17, "sec": "S.29"}, {"l": "S.237 Contract Act: holding out", "m": 14, "sec": "S.237"}], "exam": 1, "blocks": [{"h": "S.28 Sale by person not the owner", "paras": [{"t": "Subject to the provisions of this Act and of any other law for the time being in force, where goods are sole by a person who is not the owner thereof and who does not sell them under the authority or with the consent of the owner, the buyer acquires no better title to the goods than the seller had, unless the owner of the goods is by his conduct precluded from denying the seller's authority to sell:", "l": 0}, {"t": "Provided that, where a mercantile agent is, with the consent of the owner, in possession of the goods or of a document of title to the goods, any sale made by him, when acting in the ordinary course of business of a mercantile agent, shall be as valid as if he were expressly authorised by the owner of the goods to make the same; provided that the buyer acts in goods faith and has not at the time of the contract of sale notice that the seller has not authority to sell.", "l": 1}], "ills": []}]}, {"secs": ["29"], "code": "S.29", "term": "Sale by one of several joint owners", "sub": "joint owner in sole possession with permission: good title to a good-faith buyer", "hook": "One co-owner left in charge of the goods can pass them to a buyer who does not know better.", "plain": "If one of several <b>joint owners</b> has <b>sole possession by permission of the co-owners</b>, the property passes to a person who buys from him <b>in good faith</b> and without notice that the seller lacks authority to sell.", "cases": [], "links": [{"l": "S.28", "m": 17, "sec": "S.28"}, {"l": "S.165 Contract Act: joint owners as bailors", "m": 13, "sec": "S.164–167"}], "blocks": [{"h": "S.29 Sale by one of joint owners", "paras": [{"t": "If one of several joint owners of goods has the sole possession of the by permission of the co- owners, the property in the goods is transferred to any person who buys them of such joint owner in good faith and has not at the time of the contract of sale notice that the seller has not authority to sell.", "l": 0}], "ills": []}]}, {"secs": ["30"], "code": "S.30", "term": "Sale by a person in possession under a voidable contract", "sub": "good title if the contract was not yet rescinded and the buyer is in good faith", "hook": "The fraudster’s victim must rescind before the goods are resold; after that, the innocent buyer wins.", "plain": "When the seller obtained possession under a contract <b>voidable under S.19 or S.19-A</b> of the Contract Act, but the contract <b>had not been rescinded</b> at the time of sale, the buyer gets <b>good title</b> if he buys <b>in good faith and without notice</b> of the seller’s defect of title.", "cases": [{"n": "Phillips v Brooks", "c": "[1919] 2 KB 243 (KB)", "t": "A rogue obtained a ring by posing as a well-known person and pledged it. The contract was voidable for fraud, not void for mistake, so title passed to him and then to the innocent pawnee.", "v": 1}, {"n": "Lewis v Averay", "c": "[1972] 1 QB 198 (CA)", "t": "An impostor bought a car with a cheque that bounced and resold it. The mistake as to identity did not make the contract void, so the innocent buyer kept the car.", "v": 1}], "links": [{"l": "S.19, S.19A Contract Act", "m": 4, "sec": "S.19"}, {"l": "S.178A Contract Act: same rule for pledge", "m": 13, "sec": "S.178A"}, {"l": "S.64 Contract Act: rescission", "m": 9, "sec": "S.64"}], "exam": 1, "blocks": [{"h": "S.30 Sale by person in possession under voidable contact.", "paras": [{"t": "When the seller of goods has obtained possession thereof under a contract voidable under section 19 or section 19-A of the Contract Act, 1872, but the contract has not been rescinded at the time of the sale, the buyer acquires a goods title to the goods, provided he buys them in goods faith and without notice of the seller's defect of title.", "l": 0}], "ills": []}]}, {"secs": ["31"], "code": "S.31", "term": "Seller or buyer still in possession after sale", "sub": "delivery or transfer to a good-faith taker has the effect of authority", "hook": "If the seller keeps the goods or the documents after selling, a second buyer or pledgee in good faith can take free.", "plain": "<b>S.31(1):</b> where a person having <b>sold</b> goods <b>continues in possession</b> of the goods or documents of title, a delivery or transfer by him or his mercantile agent under a sale, pledge or other disposition to a person who takes <b>in good faith and without notice of the previous sale</b> has the effect as if expressly authorised by the owner. <b>S.31(2):</b> where a person having <b>bought or agreed to buy</b> goods obtains possession <b>with the seller’s consent</b>, a delivery or transfer by him or his mercantile agent to a person taking <b>in good faith and without notice of the seller’s lien or right</b> has effect as if the lien did not exist.", "cases": [], "links": [{"l": "S.28", "m": 17, "sec": "S.28"}, {"l": "S.54: sub-sale by buyer", "m": 19, "sec": "S.54"}, {"l": "S.178 Contract Act", "m": 13, "sec": "S.178–179"}], "blocks": [{"h": "S.31 Seller or buyer in possession after sale.", "paras": [{"t": "(1) Where a person, having sold goods, continues or is in possession of the goods or of the documents of title to the goods, the delivery or transfer by that person or by mercantile agent acting for him, of the goods or documents of title under any sale, pledge or other disposition thereof to any person receiving the same in good faith and without notice of the previous sale shall have the same effect as if the person making the delivery or transfer were expressly authorised by the owner of the goods to make the same.", "l": 1}, {"t": "(2) Where a person, having bought or agreed to buy goods, obtains, with the consent of the seller, possession of the goods or the documents of title to the goods, the delivery or transfer by that person or by a mercantile agent acting for him, of the goods or documents of title under any sale, pledge or other disposition thereof to any person receiving the same in good faith and without notice of any lien or other right of the original seller in respect of the goods shall have effects as if such lien or right did not exist.", "l": 1}], "ills": []}]}], "spar": [{"q": "A agrees to sell B 100 bags of rice from his warehouse stock of 1,000 bags. Fire destroys the warehouse. Who bears the loss?", "a": "<b>A.</b> The goods are <b>unascertained</b>: no property passes until they are ascertained (S.19), and no appropriation has occurred (S.24). Risk follows property (S.27), so A bears it. An English authority is <i>Re Wait</i> [1927] 1 Ch 606, cited here as flagged; its holding comes from the textbook account."}, {"q": "A sells B a specific horse unconditionally. Payment and delivery are both postponed for a month. The horse dies before delivery. Who bears the loss?", "a": "<b>B</b>, if the horse was in a deliverable state. S.21: property passes <b>when the contract is made</b>, regardless of postponed payment or delivery. S.27: once property has passed, the goods are at the <b>buyer’s risk whether delivery has been made or not</b>. If delivery had been delayed through A’s fault, the first proviso shifts the loss to A as the party in fault."}, {"q": "A takes a camera “on approval” for 7 days and does not reply. Who owns it on day 8?", "a": "<b>A</b>, if the time fixed for return has expired and A retained the camera without giving notice of rejection (S.25(b)). If A had signified approval or done an act adopting the transaction before then, property passed earlier (S.25(a)). If no time had been fixed, property passes after a <b>reasonable time</b>."}, {"q": "A rogue obtains goods from B by fraud and sells them to C, who buys in good faith, before B rescinds. Who wins? What if B rescinded first?", "a": "<b>C wins</b> under S.30 if B had not yet rescinded and C acted in good faith without notice of the defect. If B rescinded <b>first</b> (and communicated it, Contract Act S.66), the rogue had no title to pass and C loses; S.28 (nemo dat) then applies. Compare <i>Lewis v Averay</i> [1972] 1 QB 198 on voidable versus void."}, {"q": "A sells his car to B but keeps the car and registration papers, then sells it again to C, who is unaware of the first sale. Who gets the car?", "a": "<b>C</b>, if C took in good faith and without notice: S.31(1) gives the second disposition the same effect as if authorised by the owner. B is left with a claim against A. This is the exception that rewards the buyer who obtains possession."}, {"q": "A rogue poses as a reputable firm to obtain goods on credit and sells them to an innocent buyer. Compare this with a rogue who poses as a famous actor and pays by cheque.", "a": "<b>First case:</b> no contract, so no title passes to the rogue (<i>Cundy v Lindsay</i> (1878)); the innocent buyer loses. <b>Second case:</b> the contract is only voidable for fraud (<i>Phillips v Brooks</i> [1919]; <i>Lewis v Averay</i> [1972]); title passes, and S.30 protects the innocent buyer. The difference turns on whether the identity mistake negatives the contract, a fine and <b>contested</b> line in English law."}]}, "18": {"n": 18, "intro": "Chapter on performance of the contract of sale. S.32–33 set the basic duties, S.34–41 govern delivery (including part delivery, place and time, wrong quantity, instalments, and carriers), and S.42–45 deal with the buyer’s examination, acceptance, rejection and neglect of delivery.", "boundary": "<b>Boundary.</b> Passing of property and risk is Module 17. The unpaid seller’s rights are Module 19. Damages and suits for breach are Module 20. Reciprocal promises generally are in Module 7 (Contract Act, S.51–54).", "recall": "<b>Quick recall</b>Delivery and payment are <b>concurrent</b> (S.33). Excess/short/mixed: <b>reject or accept at contract rate</b> (S.38). Instalments: <b>depends</b> (S.39). Carrier = prima facie buyer (S.40). Acceptance <b>three ways</b> (S.43). No duty to return rejected goods (S.44). Neglect: <b>loss + custody</b> (S.45).", "rails": [{"secs": ["32", "33"], "code": "S.32–33", "term": "Duties of seller and buyer; concurrent conditions", "sub": "deliver and pay at the same time", "hook": "Cash on delivery is the default: goods and money change hands together.", "plain": "<b>S.32:</b> it is the <b>duty of the seller to deliver</b> the goods and of the <b>buyer to accept and pay</b> for them, in accordance with the terms of the contract. <b>S.33:</b> unless otherwise agreed, <b>delivery and payment are concurrent conditions</b>: the seller must be <b>ready and willing to give possession</b> in exchange for the price, and the buyer <b>ready and willing to pay</b> in exchange for possession.", "cases": [], "links": [{"l": "S.51 Contract Act: reciprocal readiness", "m": 7, "sec": "S.51"}, {"l": "S.46–48: unpaid seller", "m": 19, "sec": "S.46"}, {"l": "S.11: time of payment", "m": 16, "sec": "S.11"}], "blocks": [{"h": "S.32 Duties of seller and buyer", "paras": [{"t": "It is duty of the seller to deliver the goods of the buyer to accept and pay for them, in accordance with the terms of the contract of sale.", "l": 0}], "ills": []}, {"h": "S.33 Payment and delivery are concurrent conditions.", "paras": [{"t": "Unless otherwise agreed, delivery of the goods and payment of the price are concurrent conditions, that is to say, the seller shall be ready and wiling to give possession of the goods to the buyer in exchange for the price, and the buyer shall be ready and willing to pay the price in exchange for possession of the goods.", "l": 0}], "ills": []}]}, {"secs": ["34", "35"], "code": "S.34–35", "term": "Delivery; part delivery", "sub": "anything agreed or putting buyer in possession; part delivery of the whole", "hook": "Delivery is whatever the parties agree to treat as delivery, or whatever puts the goods in the buyer’s hands.", "plain": "<b>S.34:</b> delivery may be made by doing <b>anything the parties agree shall be treated as delivery</b>, or which has the effect of <b>putting the goods in the possession of the buyer or a person authorised to hold them for him</b>. <b>S.35:</b> a delivery of <b>part</b>, in progress of delivery of the <b>whole</b>, has the same effect for <b>passing property</b> as delivery of the whole; but part delivery with an intention of <b>severing it from the whole</b> does not operate as delivery of the remainder.", "cases": [], "links": [{"l": "S.2(2): delivery defined", "m": 15, "sec": "S.2(2), (3)"}, {"l": "S.149 Contract Act: delivery to bailee", "m": 13, "sec": "S.148–149"}, {"l": "S.49: part delivery and lien", "m": 19, "sec": "S.48–50"}], "blocks": [{"h": "S.34 Delivery.", "paras": [{"t": "Delivery of goods sold may be made by doing anything which the parties agree shall be treated as delivery or which has the effect of putting the goods in the possession of the buyer or of any person authorised to hold them on his behalf.", "l": 0}], "ills": []}, {"h": "S.35 Effect of part delivery.", "paras": [{"t": "A delivery of party of goods, in progress of the delivery of the whole, has the same effect, for the purpose of passing the property in such goods, as a delivery of the whole; but a delivery of part of the goods, with an intention of severing it from the whole, does not operate as a delivery of the remainder.", "l": 0}], "ills": []}]}, {"secs": ["36", "37"], "code": "S.36–37", "term": "Buyer to apply for delivery; rules as to delivery", "sub": "place, time, third person holding goods, reasonable hour, expenses", "hook": "Unless agreed, the buyer collects the goods where they are, at a reasonable hour.", "plain": "<b>S.36:</b> apart from express contract, the seller need not deliver until the <b>buyer applies</b>. <b>S.37(1):</b> whether the buyer collects or the seller sends depends on the contract; apart from contract, goods are delivered <b>at the place where they are at the time of sale</b> (or agreement), or if not in existence, where they are <b>made or produced</b>. <b>S.37(2):</b> if the seller must send but no time is fixed, he must send within a <b>reasonable time</b>. <b>S.37(3):</b> goods in the possession of a <b>third person</b>: no delivery until that person <b>acknowledges to the buyer</b> that he holds them for him (documents of title are unaffected). <b>S.37(4):</b> demand or tender must be at a <b>reasonable hour</b> (a question of fact). <b>S.37(5):</b> unless otherwise agreed, the expenses of putting the goods in a deliverable state are the <b>seller’s</b>.", "cases": [], "links": [{"l": "S.46–50 Contract Act: time and place of performance", "m": 7, "sec": "S.46"}, {"l": "S.33", "m": 18, "sec": "S.32–33"}, {"l": "S.22–23: property and deliverable state", "m": 17, "sec": "S.22–23"}], "blocks": [{"h": "S.36 Buyer to apply for delivery", "paras": [{"t": "Apart from any express contract, the seller of goods is not bound to deliver them until the buyer applies for delivery.", "l": 0}], "ills": []}, {"h": "S.37 Rules as to delivery.", "paras": [{"t": "(1) Whether it is for the buyer to take possession of the goods or for the seller to send them to the buyer is a question depending in each case on the contract, express or implied, between the parties. Apart from any such contract, goods sold are to be delivered at the place at which they are at the time of the sale, and goods agreed to be sold are to be delivered at the place at which they are at the time of the agreement to sell, or if not them in existence, at the place at which they are manufactured or produced.", "l": 1}, {"t": "(2) Where under the contract of sale the seller is bound to send the goods to the buyer, but no time for sending them is fixed, the seller is bound to send them within a reasonable time.", "l": 1}, {"t": "(3) Where the goods at the time of sale are in the possession of a third person, there is no delivery by seller to buyer unless and until such third person acknowledges to the buyer that he holds the goods on his behalf: Provided that nothing in this section shall affect the operation of the issue or transfer of any document of title to goods.", "l": 1}, {"t": "(4) Demand or tender of delivery may be treated as ineffectual unless made at a reasonable hour. What is a reasonable hour is a question of fact.", "l": 1}, {"t": "(5) Unless otherwise agreed, the expenses of and incidental to putting the goods into a deliverable state shall be borne by the seller.", "l": 1}], "ills": []}]}, {"secs": ["38"], "code": "S.38", "term": "Delivery of wrong quantity", "sub": "less: may reject; more: accept contract quantity or reject; mixed goods", "hook": "Short, excess, or mixed delivery gives the buyer a choice, subject to usage of trade.", "plain": "<b>S.38(1):</b> if the seller delivers <b>less</b> than contracted, the buyer may <b>reject</b>; if he accepts, he pays <b>at the contract rate</b>. <b>S.38(2):</b> if <b>more</b>, the buyer may accept the contract quantity and reject the rest, or (if separation would be difficult or time-consuming, in the bracketed words) reject the whole; if he accepts the whole, he pays at the contract rate. <b>S.38(3):</b> goods <b>mixed with goods of a different description</b>: accept the conforming goods and reject the rest, or reject the whole. <b>S.38(4):</b> all of this is subject to <b>usage of trade, special agreement or course of dealing</b>.", "cases": [{"n": "Re Moore and Landauer", "c": "[1921] 2 KB 519 (CA)", "t": "Canned fruit was to be packed thirty tins to the case; about half arrived in cases of twenty-four. The buyers could reject the whole consignment although market value was unaffected, because the packing was part of the description.", "v": 1}], "links": [{"l": "S.16: description", "m": 16, "sec": "S.16"}, {"l": "S.13(2): acceptance", "m": 16, "sec": "S.13"}, {"l": "S.43: acceptance", "m": 18, "sec": "S.42–44"}], "blocks": [{"h": "S.38 Delivery of wrong quantity.", "paras": [{"t": "(1) Where the seller delivers to the buyer a quantity of goods less than he contracted to sell, the buyer may reject them, but if the buyer accept the goods so delivered he shall pay for them at the contract rate.", "l": 1}, {"t": "(2) Where the seller delivers to the buyer a quantity of goods larger than he contracted to sell, the buyer may accept the goods included in the contract and reject the rest, or [if the goods delivered are such that it is difficult or time consuming to separate the quantity contracted for,] he may reject the whole. If the buyer accept the whole of the goods so delivered, he shall pay for them at the contract rate.", "l": 1}, {"t": "(3) Where the seller delivers to the buyer the goods he contracted to sell mixed with goods of a different description not included in the contract, the buyer may accept the goods which are in accordance with the contract and reject the rest, or may reject the whole.", "l": 1}, {"t": "(4) The provisions of this section are subject to any usage of trade, special agreement or course of dealing between the parties.", "l": 1}], "ills": []}]}, {"secs": ["39"], "code": "S.39", "term": "Instalment deliveries", "sub": "no duty to accept instalments; severable or entire breach depends on the contract", "hook": "Late or defective instalments: repudiation of the lot, or just a claim for damages, depending on the contract and the circumstances.", "plain": "<b>S.39(1):</b> unless otherwise agreed, the buyer need <b>not accept delivery by instalments</b>. <b>S.39(2):</b> where goods are to be delivered by <b>stated instalments, separately paid for</b>, and the seller makes no or defective delivery of one or more, or the buyer neglects or refuses to take or pay for one or more, it is a <b>question in each case</b>, depending on the terms and circumstances, whether the breach is a <b>repudiation of the whole</b> or a <b>severable breach</b> giving rise only to compensation.", "cases": [{"n": "Maple Flock v Universal Furniture Products", "c": "[1934] 1 KB 148 (CA)", "t": "The leading English case on when a breach in one instalment justifies treating the whole contract as repudiated. The test is usually stated in terms of the ratio of the breach to the whole contract and the likelihood of repetition. The citation was confirmed, but the page I used did not state the holding; the test is from the textbook account.", "v": 2}], "links": [{"l": "S.12–13: condition and warranty", "m": 16, "sec": "S.12"}, {"l": "S.39 Contract Act: refusal to perform wholly", "m": 7, "sec": "S.39"}], "blocks": [{"h": "S.39 Instalment delivers.", "paras": [{"t": "(1) Unless otherwise agreed, the buyer of goods is not bound to accept delivery thereof by instalments.", "l": 1}, {"t": "(2) Where there is a contract for the sale of goods to be delivered by stated instalments which are to be separately paid for and the seller makes no delivery or defective delivery in respect of one or more instalments, or the buyer neglects or reduces to take delivery of or pay for one or more instalments, it is a question in each case depending on the terms of the contract and the circumstances of the case, whether the breach of contract is a repudiation of the whole contract, or whether it is a severable breach giving rise to a claim for compensation, but not to a right to treat the whole contract as repudiated.", "l": 1}], "ills": []}]}, {"secs": ["40", "41"], "code": "S.40–41", "term": "Delivery to carrier or wharfinger; risk at distant place", "sub": "prima facie delivery to the buyer; reasonable contract of carriage; insurance during sea transit", "hook": "Handing the goods to the carrier is usually handing them to the buyer, if the seller made a reasonable contract of carriage.", "plain": "<b>S.40(1):</b> delivery to a <b>carrier</b> (named by the buyer or not) or <b>wharfinger</b> for transmission or safe custody is <b>prima facie delivery to the buyer</b>. <b>S.40(2):</b> unless authorised otherwise, the seller must make a <b>reasonable contract</b> with the carrier on the buyer’s behalf; if not, and goods are lost or damaged in transit, the buyer may <b>decline to treat the delivery as made to himself</b> or hold the seller liable in damages. <b>S.40(3):</b> for a route involving <b>sea transit</b> where it is usual to insure, the seller must give the buyer <b>notice enabling him to insure</b>; otherwise the goods are at the <b>seller’s risk</b> during sea transit. <b>S.41:</b> where the seller agrees to deliver at his own risk at a distant place, the buyer still takes the <b>risk of deterioration necessarily incident to transit</b>.", "cases": [], "links": [{"l": "S.24(2): appropriation by delivery to carrier", "m": 17, "sec": "S.24"}, {"l": "S.27: risk", "m": 17, "sec": "S.27"}, {"l": "S.53: stoppage in transit", "m": 19, "sec": "S.51–53"}], "blocks": [{"h": "S.40 Delivery to carrier or wharfinger.", "paras": [{"t": "(1) Where, in pursuance of a contract of sale, the seller is authorised or required to send the goods to the buyer, delivery of the goods to a carrier, whether named by the buyer or not, for the purpose of transmission to the buyer or delivery of the goods to a wharfinger for sale custody, is a prima facie deemed to be delivery of the goods to the buyer.", "l": 1}, {"t": "(2) Unless otherwise authorised by the buyer, the seller shall make such contract with the carrier or wharfinger on behalf of the buyer as may be reasonable having regard to the nature of the goods and the other circumstances of the case. If the seller omits so to do and the goods are lost or damaged in course of transit or whilst in the custody of the wharfinger, the buyer may decline to treat the delivery to the carrier or wharfinger as a delivery to himself, or may hold the seller responsible in damages.", "l": 1}, {"t": "(3) Unless otherwise agreed, where goods are sent by the seller to the buyer by a route involving sea transit, in circumstances in which it is usual to insure, the seller shall such notice to the buyer as may enable him to insure them during their sea transit, and if the seller fails so to do, the goods shall be deemed to be at his risk during such sea transit.", "l": 1}], "ills": []}, {"h": "S.41 Risk where goods are delivered at distant place.", "paras": [{"t": "Where the seller of goods agrees to deliver them at his own risk at a place other than where they, are when sold, the buyer shall, nevertheless, unless otherwise agreed, take any risk of deterioration in the goods necessarily incident to the course of transit.", "l": 0}], "ills": []}]}, {"secs": ["42", "43", "44"], "code": "S.42–44", "term": "Examination; acceptance; rejected goods", "sub": "reasonable opportunity to examine; three ways to be deemed to accept; no duty to return", "hook": "The buyer can inspect before being deemed to accept, and rejection is effective by telling the seller.", "plain": "<b>S.42(1):</b> where goods are delivered which the buyer <b>has not previously examined</b>, he is not deemed to have accepted until he has had a <b>reasonable opportunity of examining</b> them. <b>S.42(2):</b> unless otherwise agreed, the seller must afford the opportunity on request. <b>S.43:</b> the buyer is <b>deemed to have accepted</b> when he (1) <b>intimates acceptance</b>; (2) after delivery does any act <b>inconsistent with the seller’s ownership</b>; or (3) after a <b>reasonable time</b> retains the goods without intimating rejection. <b>S.44:</b> a buyer who <b>rightfully refuses</b> to accept need not <b>return</b> the goods; it is enough to <b>intimate refusal</b>.", "cases": [], "links": [{"l": "S.13(2): acceptance turns condition into warranty", "m": 16, "sec": "S.13"}, {"l": "S.18: sample", "m": 16, "sec": "S.18"}, {"l": "S.25: approval", "m": 17, "sec": "S.25"}], "exam": 1, "blocks": [{"h": "S.42 Buyer's right of examining the goods.", "paras": [{"t": "(1) Where goods are delivered to the buyer which he has not previously examined, he is not deemed to have accepted them unless and until he has had a reasonable opportunity of examining them for the purpose of ascertaining whether they are conformity with the contract.", "l": 1}, {"t": "(2) Unless otherwise agreed, when the seller tenders delivery of goods to the buyer, he is bound, on request, to afford the buyer a reasonable opportunity of examining the goods for the purpose of ascertaining whether they are in conformity with the contract.", "l": 1}], "ills": []}, {"h": "S.43 Acceptance.", "paras": [{"t": "The buyer is deemed to have accepted the goods when he intimates to the seller, that he has accepted them, or when the goods have been delivered to him and he does any act in relation to them which is inconsistent with the ownership of the seller, or when, after the lapse of a reasonable time he retains the goods without intimating to the seller that he has rejected them.", "l": 0}], "ills": []}, {"h": "S.44 Buyer not bound to return rejected goods.", "paras": [{"t": "Unless otherwise agreed, where goods are delivered to the buyer and he refuses to accept them, having the right so to do, he is not bound to return them to the seller, but it is sufficient if he intimates to the seller that he refuses to accept them.", "l": 0}], "ills": []}]}, {"secs": ["45"], "code": "S.45", "term": "Buyer neglecting or refusing delivery", "sub": "liable for loss and for reasonable care and custody charge", "hook": "If the seller is ready and the buyer does not collect, the buyer pays for the delay.", "plain": "When the seller is <b>ready and willing to deliver</b> and requests the buyer to take delivery, and the buyer does not do so <b>within a reasonable time</b>, he is liable for <b>any loss caused by his neglect or refusal</b> and a <b>reasonable charge for care and custody</b>. <b>Proviso:</b> nothing affects the seller’s rights where the neglect or refusal amounts to a <b>repudiation</b>.", "cases": [], "links": [{"l": "S.55: re-sale", "m": 19, "sec": "S.55"}, {"l": "S.56: damages for non-acceptance", "m": 20, "sec": "S.56"}, {"l": "S.73 Contract Act", "m": 11, "sec": "S.73"}], "blocks": [{"h": "S.45 Liability of buyer for neglecting or refusing delivery of goods.", "paras": [{"t": "When the seller is ready and willing to deliver the goods and requests the buyer to take delivery, and the buyer does not within a reasonable time after such request take delivery of the goods, he is liable to the seller for any loss occasioned by his neglect or refusal to take delivery, and also for a reasonable charge for the care and custody of the goods: Provided that nothing in this section shall affect the rights of the seller where the neglect or refusal of the buyer to take delivery amounts to a repudiation of the contract.", "l": 0}], "ills": []}]}], "spar": [{"q": "A agrees to deliver 100 bags of cement to B for Rs 50,000. A tenders delivery but B asks A to wait for payment until next week. Can A insist on payment first?", "a": "<b>Yes.</b> S.33: unless otherwise agreed, delivery and payment are <b>concurrent conditions</b>; A need only be ready and willing to give possession in exchange for the price. A is not in default if B is not ready to pay. B’s refusal after a request for delivery engages S.45."}, {"q": "B orders 100 bags and A delivers 80. B takes the 80 and uses them. What does B pay? What if A had delivered 120?", "a": "<b>Short delivery:</b> B may reject (S.38(1)), but having accepted the 80 he pays <b>at the contract rate</b> for them. <b>Excess:</b> B may accept the 100 and reject the 20, or, where separation is difficult or time-consuming (bracketed words), reject all 120; if he accepts all 120, he pays at the contract rate. All subject to trade usage (S.38(4))."}, {"q": "B buys goods to be delivered in 10 monthly instalments, separately paid for. The second instalment is defective. Can B cancel the whole contract?", "a": "<b>It depends</b> (S.39(2)): whether it is a repudiation or a severable breach turns on the terms and circumstances. English authority such as <i>Maple Flock</i> [1934] looks at how serious the breach is relative to the contract and how likely it is to recur; the case is cited here as flagged. Without that test the Act gives no formula."}, {"q": "A buyer receives goods and sells half to a customer before inspecting. Has he accepted? Can he still reject the rest?", "a": "<b>Probably yes for the half he resold:</b> S.43 deems acceptance on any act inconsistent with the seller’s ownership. S.42(1) protects a buyer until he has had a <b>reasonable opportunity to examine</b>, but resale before inspection is an act inconsistent with ownership. For the unsold half, acceptance depends on S.43 and the passage of reasonable time. Cross-check S.13(2): once accepted in a non-severable contract, a breach of condition is treated as breach of warranty."}, {"q": "The seller ships goods by sea but gives the buyer no notice allowing him to insure. The ship sinks. Who bears the loss?", "a": "<b>The seller</b>, under S.40(3): if the seller fails to give the notice, the goods are deemed at his risk during sea transit, where it is usual to insure and unless otherwise agreed. This displaces the normal result of S.27 that risk follows property."}]}, "19": {"n": 19, "intro": "The unpaid seller’s rights against the goods. S.46 defines who is an unpaid seller; S.47 lists the rights; S.48–50 govern lien; S.51–53 govern stoppage in transit; S.54 deals with sub-sales and pledges by the buyer; S.55 permits resale and states its consequences.", "boundary": "<b>Boundary.</b> Suits for the price and damages are in Module 20. Delivery and acceptance are in Module 18. The nemo dat exceptions are in Module 17. The bailee’s lien in the Contract Act is in Module 13.", "recall": "<b>Quick recall</b>Three rights: <b>lien</b> (in possession), <b>stoppage</b> (buyer insolvent, goods in transit), <b>resale</b> (S.47). Lien is lost by <b>delivery to carrier without reserving disposal</b>, <b>buyer’s possession</b>, <b>waiver</b> (S.50); not by a decree. Contract <b>not rescinded</b> by lien or stoppage (S.55(1)) unless seller reserved resale (S.55(4)).", "rails": [{"secs": ["46"], "code": "S.46", "term": "“Unpaid seller” defined", "sub": "price not fully paid or tendered; conditional payment dishonoured", "hook": "An unpaid seller is one who has not been paid in full, or who was paid by a cheque that bounced.", "plain": "The seller is an <b>unpaid seller</b> when (a) <b>the whole of the price has not been paid or tendered</b>; or (b) a <b>bill of exchange or other negotiable instrument</b> was received as <b>conditional payment</b> and the condition has not been fulfilled, by <b>dishonour</b> of the instrument or otherwise. In this Chapter, “seller” includes anyone <b>in the position of a seller</b>, such as an agent to whom the bill of lading has been endorsed, or a consignor or agent who has himself paid, or is directly responsible for, the price. <b>Source note:</b> the extraction numbers the sub-clauses oddly ((1), (1), (2)); read as (a) and (b).", "cases": [], "links": [{"l": "S.2(7): insolvent", "m": 15, "sec": "S.2(4), (7)"}, {"l": "S.33: concurrent conditions", "m": 18, "sec": "S.32–33"}, {"l": "S.47", "m": 19, "sec": "S.47"}], "blocks": [{"h": "S.46 \"Unpaid seller\" defined.", "paras": [{"t": "(1) The seller of goods is deemed to be an \"unpaid seller\" within the meaning of this Act–", "l": 1}, {"t": "(1) when the whole of the price has not been paid or tendered;", "l": 1}, {"t": "(2) when a bill of exchange or other negotiable instrument has been received as conditional payment, and the condition on which it was received has not been fulfilled By reason of the dishonor of the instrument or otherwise. In this Chapter, the term \"seller\" includes any person who is in the position of a seller, as, for instance, an agent of the seller to whom the bill of landing has been endorsed, or a consignor or agent who has himself paid, or is directly responsible for, the price.", "l": 1}], "ills": []}]}, {"secs": ["47"], "code": "S.47", "term": "Unpaid seller’s rights", "sub": "lien, stoppage in transit, and resale; right of withholding if property has not passed", "hook": "Even after ownership passes, an unpaid seller keeps three weapons: hold the goods, chase them in transit, and resell.", "plain": "Subject to the Act and other law, <b>notwithstanding that property has passed</b> to the buyer, the unpaid seller, as such, has by implication of law: (a) a <b>lien</b> on the goods <b>for the price while in possession</b>; (b) <b>in case of the buyer’s insolvency</b>, a right of <b>stopping the goods in transit</b> once he has parted with possession; and (c) a <b>right of resale</b> as limited by the Act. Where <b>property has not passed</b>, the seller has in addition a <b>right of withholding delivery</b> similar to and co-extensive with his rights of lien and stoppage in transit. <b>Source note:</b> the extraction merges the sub-clauses; I read the structure from the sections that follow. A side-heading, “Unpaid Seller’s Lien”, trails this section in the printed text.", "cases": [], "links": [{"l": "S.48–50: lien", "m": 19, "sec": "S.48–50"}, {"l": "S.51–53: stoppage", "m": 19, "sec": "S.51–53"}, {"l": "S.55: resale", "m": 19, "sec": "S.55"}], "exam": 1, "blocks": [{"h": "S.47 Unpaid seller's rights.", "paras": [{"t": "(1) Subject to the provisions of the Act and of any law for the time being in force, notwithstanding that the property in the goods may have passed to the buyer, the unpaid seller of goods, as such, has by implications of law–", "l": 1}, {"t": "(1) a lien on the goods for the price while he is in possession of them;", "l": 1}, {"t": "(2) in case of the insolvency of the buyer a right of stopping the transit he parted. a right of re-sale as limited by this Act.", "l": 1}, {"t": "(3) Where the property in goods has not passed to the buyer, the unpaid seller has, in addition to his other remedies, a right of withholding delivery similar to and co-extensive with his rights of lien and stoppage in transit where the property has passed to the buyer.", "l": 1}], "ills": []}]}, {"secs": ["48", "49", "50"], "code": "S.48–50", "term": "Seller’s lien: when it exists, part delivery, how it ends", "sub": "retain possession until paid; ends by delivery to carrier, buyer’s possession, waiver", "hook": "The lien lasts only as long as the seller keeps the goods or has not waived it.", "plain": "<b>S.48:</b> the unpaid seller in possession may <b>retain possession until payment or tender</b> where (a) goods sold <b>without stipulation as to credit</b>; (b) sold on credit but the <b>credit term has expired</b>; (c) the <b>buyer becomes insolvent</b>. He may exercise the lien even if in possession <b>as agent or bailee for the buyer</b>. <b>S.49:</b> after <b>part delivery</b>, the lien may be exercised on the remainder unless the part delivery shows an <b>agreement to waive</b>. <b>S.50:</b> the lien is lost (a) on <b>delivery to a carrier or other bailee</b> for the buyer without reserving the right of disposal; (b) when the <b>buyer or his agent lawfully obtains possession</b>; (c) by <b>waiver</b>. He does <b>not lose</b> the lien merely by obtaining a <b>decree for the price</b>.", "cases": [], "links": [{"l": "S.170–171 Contract Act: bailee’s liens", "m": 13, "sec": "S.170–171"}, {"l": "S.26: right of disposal", "m": 17, "sec": "S.26"}, {"l": "S.40: delivery to carrier", "m": 18, "sec": "S.40–41"}], "exam": 1, "blocks": [{"h": "S.48 Seller's lien.", "paras": [{"t": "(1) Subject to the provisions of this Act, the unpaid seller of goods who is in possession of them is entitled to retain possession of them until payment or tender of the price in the following cases, namely:–", "l": 1}, {"t": "(1) where the goods have been sold without any stipulation as to credit;", "l": 1}, {"t": "(2) where the goods have been sold on credit, but the term of has expired;", "l": 1}, {"t": "where the buyer becomes insolvent.", "l": 1}, {"t": "(3) The seller may exercise his right of lien notwithstanding that he is in possession of the goods as agent or bailee for the buyer.", "l": 1}], "ills": []}, {"h": "S.49 Part delivery.", "paras": [{"t": "Where an unpaid seller has made part delivery of the goods, he may exercise his right of lien on the remainder, unless such part delivery has been made under such circumstance as to show an agreement to waive the lien.", "l": 0}], "ills": []}, {"h": "S.50 Termination of lien.", "paras": [{"t": "(1) The unpaid seller of goods loses his lien thereon–", "l": 1}, {"t": "(1) when he delivers the goods to a carrier or other bailee for the purpose of transmission to the buyer without reserving the right of disposal of the goods;", "l": 1}, {"t": "(2) when the buyer or his agent lawfully obtains possession of the goods;", "l": 1}, {"t": "by waiver thereof.", "l": 1}, {"t": "(3) The unpaid seller of goods, having a lien thereon, does not lose his lien by reason only that he has obtained a decree for the price of the goods.", "l": 1}], "ills": []}]}, {"secs": ["51", "52", "53"], "code": "S.51–53", "term": "Stoppage in transit: right, duration, how exercised", "sub": "buyer’s insolvency; transit begins on delivery to carrier and ends on buyer’s possession; take possession or give notice", "hook": "If the buyer goes bust while the goods are on the road, the seller can pull them back.", "plain": "<b>S.51:</b> when the buyer <b>becomes insolvent</b>, the unpaid seller who has <b>parted with possession</b> may <b>resume possession</b> while the goods are <b>in transit</b> and retain them until payment or tender. <b>S.52</b> defines the duration of transit: it begins on <b>delivery to a carrier or other bailee</b> for transmission and ends when the <b>buyer or his agent takes delivery</b>; it ends if the buyer obtains delivery <b>before arrival at destination</b>; it ends if, after arrival, the carrier <b>acknowledges holding for the buyer</b>; <b>rejected goods</b> remain in transit even if the seller refuses to take them back; goods delivered to a <b>ship chartered by the buyer</b> raise a question of fact; <b>wrongful refusal</b> by the carrier ends transit; <b>part delivery</b> leaves the remainder stoppable unless it shows an agreement to give up the whole. <b>S.53:</b> stoppage is effected by <b>taking actual possession</b> or by <b>giving notice</b> to the carrier or bailee (or his principal, in time to reach the servant or agent through reasonable diligence); the bailee must then <b>re-deliver at the seller’s expense</b>. A side-heading, “Transfer by Buyer and Seller”, trails S.53 in the printed text.", "cases": [], "links": [{"l": "S.2(7): insolvency", "m": 15, "sec": "S.2(4), (7)"}, {"l": "S.50", "m": 19, "sec": "S.48–50"}, {"l": "S.54", "m": 19, "sec": "S.54"}], "exam": 1, "blocks": [{"h": "S.51 Right of stoppage in transit.", "paras": [{"t": "Subject to the provisions of this Act, when the buyer of goods becomes insolvent, the unpaid seller who has parted with the possession of the goods has the right of stopping them in transit, that is to say, he may resume possession of the goods as long as they are in the course of transit, and may retain them until the payment or tender of the price.", "l": 0}], "ills": []}, {"h": "S.52 Duration of transit.", "paras": [{"t": "(1) Goods are deemed to be in course of transit from the time when they are delivered to a carrier or other bailee for the purpose of transmission to the buyer, until the buyer or his agent in that behalf takes delivery of them from such carrier or other bailee.", "l": 1}, {"t": "(2) If the buyer or his agent in that behalf obtains delivery of the goods before their arrival at the appointed destination, the transit is at an end.", "l": 1}, {"t": "(3) If, after the arrival of the goods at the appointed destination, the carrier or other bailee acknowledges to the buyer or his agent that he holds the goods on his behalf and continues in possession of them as bailee for the buyer or his agent, the transit is at an end it is immaterial that a further destination for the goods may have been indicated by the buyer.", "l": 1}, {"t": "(4) If the goods are rejected by the buyer and the carrier or other bailee continues in possession of them, the transit is not deemed to be at an end, even if the seller has refused to receive them back.", "l": 1}, {"t": "(5) When goods are delivered to a ship chartered by the buyer, it is a question depending on the circumstances of the particular case, whether they are in the possession of the master as a carrier or as agent of the buyer.", "l": 1}, {"t": "(6) Where the carrier or other bailee wrongfully refuses to deliver the goods to the buyer or his agent in that behalf, the transit is deemed to be at an end.", "l": 1}, {"t": "(7) Where part delivery of the goods has been made to the buyer or his agent in that behalf, the remainder of the goods may be stopped in transit, unless such part Delivery has been given in such circumstances as to show an agreement to give up possession of the whole of the goods.", "l": 1}], "ills": []}, {"h": "S.53 How stoppage in transit is effected.", "paras": [{"t": "(1) The unpaid seller may exercise his right of stoppage in transit either by taking actual possession of the goods, or by giving notice of his claim to the carrier of other bailee in whose possession the goods are. Such notice may be given either to the person in actual possession of the goods or to his principal. In the later case the notice, to be effectual, shall be given at such time and in such circumstances that the principal, by the exercise of reasonable diligence, may communicate it to his servant or agent in time to prevent a delivery to the buyer", "l": 1}, {"t": "(2) When notice of stoppage in transit is given by the seller to the carrier or other bailee in possession of the goods, he shall re-deliver the goods to or according to the directions of the seller. The expenses of such re-delivery shall be borne by the seller.", "l": 1}], "ills": []}]}, {"secs": ["54"], "code": "S.54", "term": "Effect of sub-sale or pledge by the buyer", "sub": "the seller’s rights survive unless he assented; good-faith transferee of documents of title", "hook": "A sub-buyer usually takes subject to the seller’s rights, unless he got the documents of title in good faith for value.", "plain": "<b>S.54(1):</b> the unpaid seller’s lien or stoppage right is <b>not affected by any sale or other disposition by the buyer</b> unless the seller <b>assented</b>. <b>Proviso:</b> where a <b>document of title</b> has been issued or lawfully transferred to a person as buyer or owner, and he transfers it to a person who takes <b>in good faith and for consideration</b>, then, if by way of <b>sale</b>, the seller’s right of lien or stoppage is <b>defeated</b>; if by way of <b>pledge or other disposition for value</b>, it can be exercised only <b>subject to the rights of the transferee</b>. <b>S.54(2):</b> where the transfer is by <b>pledge</b>, the unpaid seller may require the pledgee to satisfy the amount secured <b>first out of any other goods or securities</b> of the buyer in the pledgee’s hands.", "cases": [], "links": [{"l": "S.31(2): buyer in possession", "m": 17, "sec": "S.31"}, {"l": "S.178 Contract Act", "m": 13, "sec": "S.178–179"}, {"l": "S.2(3): document of title", "m": 15, "sec": "S.2(2), (3)"}], "blocks": [{"h": "S.54 Effect of sub-sale or pledge by buyer.", "paras": [{"t": "(1). Subject to the provisions of this Act, the unpaid seller's right of lien or stoppage in transit is not affected by any sale or other disposition of the goods which the buyer may have made, unless the seller has assented thereto: Provided that where a document of title to goods has been issued or lawfully transferred to any person as buyer or owner of the goods, and that person transfers the documents to a person who takes the documents in good faith and for consideration, then, if such last mentioned transfer was by way of sale, the unpaid seller's right of lien or stoppage in transit is defeated, and if such last mentioned transfer was by way of pledge or other disposition for value, the unpaid seller's right of lien or stoppage in transit can only be exercised subject to the rights of the transferee.", "l": 1}, {"t": "(2) Where the transfer is by way of pledge, the unpaid seller may require the pledge to have the amount secured by the pledge satisfied in the first instance, as far as possible, out of any other goods or securities of the buyer in the hands of the pledgee and available against the buyer.", "l": 1}], "ills": []}]}, {"secs": ["55"], "code": "S.55", "term": "Sale not generally rescinded by lien or stoppage; resale", "sub": "resale on notice or for perishables; good title to resale buyer; reserved right of resale", "hook": "Exercising lien or stoppage does not cancel the contract, but the seller can resell and claim the shortfall.", "plain": "<b>S.55(1):</b> a contract is <b>not rescinded</b> by the mere exercise of lien or stoppage. <b>S.55(2):</b> where the goods are <b>perishable</b>, or the seller who has exercised lien or stoppage <b>gives notice of intention to resell</b> and the buyer does not pay or tender within a reasonable time, the seller may <b>resell within a reasonable time</b> and recover <b>damages for any loss</b> from the original buyer; the buyer is <b>not entitled to any profit</b> on the resale. If notice is <b>not</b> given, the seller is <b>not entitled to recover such damages</b> and the buyer is <b>entitled to the profit</b>, if any, on the resale. <b>S.55(3):</b> a resale buyer gets <b>good title</b> against the original buyer even without notice. <b>S.55(4):</b> where the seller <b>expressly reserves a right of resale</b> on default and resells, the original contract is <b>rescinded</b>, without prejudice to damages.", "cases": [], "links": [{"l": "S.45: buyer neglecting delivery", "m": 18, "sec": "S.45"}, {"l": "S.57: damages for non-acceptance", "m": 20, "sec": "S.57–58"}, {"l": "S.28–31: title", "m": 17, "sec": "S.28"}], "blocks": [{"h": "S.55 Sale not generally rescinded by lien or stoppage in transit.", "paras": [{"t": "(1) Subject to the provision of this section, a contract of sale is not rescinded by the mere exercise by an unpaid seller of his right of lien or stoppage in transit.", "l": 1}, {"t": "(2) Where the goods are of a perishable nature, or where the unpaid seller who has exercised his right of lien or stoppage in transit gives notice to the buyer of his intention to re-sell, the unpaid seller may, if the buyer does not within a reasonable time pay or tender the price, re-sell the goods within a reasonable time and recover from the original buyer damages for any loss occasioned by his breach of contract, but the buyer shall not be entitled to any profit which may occur on the re-sale. If such notice is not given, the unpaid seller shall not be entitled to recover such damages and the buyer shall be entitled to the profit, if any, on the re-sale.", "l": 1}, {"t": "(3) Where in unpaid seller who has exercised his right of lien or stoppage in transit re-sells the goods, the buyer acquires a good title thereto as against the original buyer, notwithstanding that no notice of the re-sale has been given to the original buyer.", "l": 1}, {"t": "(4) Where the seller expressly reserves a right of re-sale in case the buyer should make default, and, on the buyer making default, re-sells the goods, the original contract of sale is thereby rescinded, but without prejudice to any claim which the seller may have for damages.", "l": 1}], "ills": []}]}], "spar": [{"q": "A sells goods to B on 30 days’ credit. On day 10, B is declared insolvent. A still holds the goods. Can A refuse delivery?", "a": "<b>Yes.</b> S.48(c): the unpaid seller in possession may retain possession where the <b>buyer becomes insolvent</b>, even though the credit period has not expired. Lien is exercisable <b>notwithstanding</b> the credit stipulation. A must be an unpaid seller (S.46) and in possession; the property may have passed (S.47)."}, {"q": "A ships goods to B by rail. While they are in transit, B is declared insolvent. A telegraphs the railway to hold them. Is that effective? Does it end the contract?", "a": "<b>Effective</b>, if the goods are still in the course of transit (S.52) and notice reaches the carrier or its principal in time (S.53(1)). The carrier must then re-deliver at A’s expense (S.53(2)). <b>The contract is not rescinded</b> (S.55(1)); A may resell on notice (S.55(2)) and sue for any shortfall, and the buyer takes no profit."}, {"q": "A has delivered goods to a carrier; B, the buyer, has resold them to C in good faith. A discovers B is insolvent. Can A still stop the goods?", "a": "<b>Generally yes</b>: S.54(1) says the seller’s rights are not affected by the buyer’s sub-sale unless the seller assented. <b>Exception:</b> if C took a <b>document of title</b> from B (as buyer or owner) in good faith and for consideration, and the transfer was a <b>sale</b>, the seller’s rights are defeated (proviso)."}, {"q": "A, an unpaid seller, resells perishable goods stopped in transit for less than B’s contract price. What can A recover? Who keeps a profit?", "a": "<b>A</b> may recover damages for the loss (S.55(2)); the original buyer is <b>not entitled to any profit</b> on resale. Had A given <b>no notice</b> of resale, A could not recover such damages and B would be entitled to any profit (S.55(2)). The resale buyer gets good title either way (S.55(3))."}]}, "20": {"n": 20, "intro": "Suits for breach of the contract of sale (S.56–62), followed by a short miscellaneous block (S.63–65). S.56–59 give the seller’s suit for the price, damages for non-acceptance and non-delivery, and specific performance; S.60 limits the remedy for breach of warranty; S.61 deals with repudiation before the due date; S.62 deals with interest and special damages. S.63–65 cover exclusion of implied terms, reasonable time, changes in duty or tax, and auctions.", "boundary": "<b>Boundary.</b> The unpaid seller’s real rights against the goods are in Module 19. The measure of damages comes from the Contract Act (S.73, Module 11). S.66–70 are repeals, savings and the mode of giving public notice; they are not covered here beyond this footnote: S.66 and S.69 are shown as repealed by the Repealing Act, 1938; S.67 and S.70 are savings; S.68 prescribes how public notice is given.", "recall": "<b>Quick recall</b>Price: only if <b>property passed</b> or <b>fixed-day price</b> (S.56). Otherwise <b>damages</b> (S.57–58). Warranty breach: <b>deduct or sue</b>, no rejection (S.60). Repudiation: <b>wait or rescind</b> (S.61). Auction: <b>hammer falls</b>, bids retractable until then (S.65).", "rails": [{"secs": ["56"], "code": "S.56", "term": "Suit for the price", "sub": "property passed and buyer refuses to pay; or price payable on a fixed day", "hook": "The seller can sue for the price only when the buyer owns the goods, or the price was due on a fixed day regardless of delivery.", "plain": "<b>S.56(1):</b> where <b>property has passed</b> and the buyer wrongfully neglects or refuses to pay according to the contract, the seller may <b>sue for the price</b>. <b>S.56(2):</b> where the price is <b>payable on a day certain irrespective of delivery</b> and the buyer wrongfully neglects or refuses to pay, the seller may sue for the price <b>although property has not passed</b> and the goods have not been appropriated.", "cases": [], "links": [{"l": "S.19–26: passing of property", "m": 17, "sec": "S.19"}, {"l": "S.57: damages for non-acceptance", "m": 20, "sec": "S.57–58"}, {"l": "S.45: buyer neglecting delivery", "m": 18, "sec": "S.45"}], "exam": 1, "blocks": [{"h": "S.56 Suit of price.", "paras": [{"t": "(1). Where under a contract of sale the property in the goods has passed to the buyer and the buyer wrongfully neglects or refuses to pay for the goods according to the terms of the contract, the seller may sue him for the price of the goods.", "l": 1}, {"t": "(2) Where under a contract of sale the price is payable on a day certain irrespective of delivery and the buyer wrongfully neglects or refuses to pay such price, the seller may sue him for the price although the property in the goods has not passed and the goods have not been appropriated to the contract.", "l": 1}], "ills": []}]}, {"secs": ["57", "58"], "code": "S.57–58", "term": "Damages for non-acceptance; damages for non-delivery", "sub": "the seller’s and the buyer’s damages remedies", "hook": "If the buyer refuses to take the goods, the seller claims damages; if the seller refuses to deliver, the buyer claims damages.", "plain": "<b>S.57:</b> where the buyer wrongfully neglects or refuses to <b>accept and pay for</b> the goods, the seller may sue for <b>damages for non-acceptance</b>. <b>S.58:</b> where the seller wrongfully neglects or refuses to <b>deliver</b>, the buyer may sue for <b>damages for non-delivery</b>. The Act states the remedies; the <b>measure</b> of damages comes from S.73 of the Contract Act (Module 11), which Sale of Goods Act S.3 keeps in force.", "cases": [{"n": "Hadley v Baxendale", "c": "(1854) 9 Exch 341 (Exch)", "t": "Loss recoverable is limited to what arises naturally or was within the parties’ contemplation. This is the source of the test now in S.73 of the Contract Act.", "v": 1}], "links": [{"l": "S.73 Contract Act: measure of damages", "m": 11, "sec": "S.73"}, {"l": "S.3: Contract Act applies", "m": 15, "sec": "S.3"}, {"l": "S.56", "m": 20, "sec": "S.56"}], "exam": 1, "blocks": [{"h": "S.57 Damages for non-acceptance.", "paras": [{"t": "Where the buyer wrongfully neglects or refuses to accept and pay for the goods, the seller may sue him for damages for non-acceptance.", "l": 0}], "ills": []}, {"h": "S.58 Damages for non-delivery.", "paras": [{"t": "Where the seller wrongfully neglects or refuses to deliver the goods to the buyer, the buyer, may sue the seller for damages for non- delivery.", "l": 0}], "ills": []}]}, {"secs": ["59"], "code": "S.59", "term": "Specific performance", "sub": "court may direct performance of a contract for specific or ascertained goods", "hook": "The court can order the goods to be handed over rather than leaving the buyer with damages.", "plain": "<b>Subject to the Specific Relief Act, 1877 (Chapter II)</b>, in a suit for breach of a contract to deliver <b>specific or ascertained goods</b>, the court may, <b>on the plaintiff’s application</b>, direct by decree that the contract be <b>performed specifically</b>, without giving the defendant the option of retaining the goods on payment of damages. The decree may be unconditional or on <b>terms as to damages, payment of the price or otherwise</b>, and the application may be made <b>at any time before the decree</b>. <b>Note:</b> the printed text refers to the Specific Relief Act, 1877; whether that reference is current needs checking against the present law.", "cases": [], "links": [{"l": "S.2(13): specific goods", "m": 15, "sec": "S.2(13), (14)"}, {"l": "S.58", "m": 20, "sec": "S.57–58"}], "blocks": [{"h": "S.59 Specific performance.", "paras": [{"t": "Subject to the provisions of Chapter II of the Specific Relief Act, 1877, in any suit for breach of contract to deliver specific or ascertained goods, the Court may, if it thinks fit, on the applications of the plaintiff, by its decree direct that the contract shall be performed specifically, without giving the defendant the option of retaining the goods on payment of damages. The decree may be unconditional, or upon such terms and conditions as to damages, payment of the price or otherwise, as the Court may deem just, and the application of the plaintiff may be made at any time before the decree.", "l": 0}], "ills": []}]}, {"secs": ["60"], "code": "S.60", "term": "Remedy for breach of warranty", "sub": "no rejection; diminish or extinguish price, or sue for damages", "hook": "If the breach is only of warranty, you keep the goods and deduct from the price or claim damages.", "plain": "<b>S.60(1):</b> on a breach of <b>warranty</b> by the seller, or where the buyer <b>elects or is compelled</b> to treat a breach of condition as breach of warranty (S.13), the buyer is <b>not entitled to reject</b> on that ground alone, but may (a) <b>set up the breach in diminution or extinction of the price</b>, or (b) <b>sue for damages</b> for breach of warranty. <b>S.60(2):</b> setting it up against the price does <b>not prevent</b> a later suit for the same breach if he has suffered <b>further damage</b>. The printed text has the sub-clauses run together; the structure above reads them as (a) and (b).", "cases": [], "links": [{"l": "S.12–13: condition and warranty", "m": 16, "sec": "S.12"}, {"l": "S.43: acceptance", "m": 18, "sec": "S.42–44"}], "exam": 1, "blocks": [{"h": "S.60 Remedy for breach of warranty.", "paras": [{"t": "(1) Where there is a breach of warranty by the seller, or where the buyer elects or is compelled to treat any breach of a condition on the part of the seller as a breach of warranty, the buyer is not by reason only or such breach of warranty entitled to reject the goods; but he may–", "l": 1}, {"t": "(1) set up against the seller the breach of warranty in diminution or extinction of the price; or sue the seller for damages for breach of warranty.", "l": 1}, {"t": "(2) The fact that a buyer has set up a breach of warranty in diminution or extinction of the price does not prevent him from suing for the same breach of warranty if he has suffered further damage.", "l": 1}], "ills": []}]}, {"secs": ["61"], "code": "S.61", "term": "Repudiation before the due date", "sub": "wait for delivery date, or treat as rescinded and sue", "hook": "If one side says it will not perform, the other can wait or treat the contract as over and claim damages.", "plain": "Where either party <b>repudiates before the date of delivery</b>, the other may either treat the contract as <b>subsisting</b> and wait until the date of delivery, or treat it as <b>rescinded</b> and sue for damages for the breach. The choice is for the innocent party.", "cases": [{"n": "Hochster v De la Tour", "c": "(1853) 2 E & B 678 (QB)", "t": "A courier told before the start date that his services would not be needed could sue at once without waiting for the performance date. This is the English source of the idea of anticipatory breach.", "v": 1}], "links": [{"l": "S.39 Contract Act: refusal to perform", "m": 7, "sec": "S.39"}, {"l": "S.75 Contract Act: rightful rescission", "m": 11, "sec": "S.75"}, {"l": "S.39 SGA: instalments", "m": 18, "sec": "S.39"}], "blocks": [{"h": "S.61 Repudiation or contract before due data", "paras": [{"t": "Where either party to a contract of sale repudiates the contract before the date of delivery, the other may either treat the contract as subsisting and wait till the date of delivery, or he may treat the contract as rescinded and sue for damages for the breach.", "l": 0}], "ills": []}]}, {"secs": ["62"], "code": "S.62", "term": "Interest and special damages; recovery of money paid", "sub": "preserves the right to interest and special damages; court may award interest on the price", "hook": "Interest, special damages and refund of money paid on failed consideration are preserved; the court can add interest on the price.", "plain": "<b>S.62(1):</b> nothing in the Act affects the right of seller or buyer to recover <b>interest or special damages</b> where recoverable by law, or to <b>recover money paid where the consideration has failed</b>. <b>S.62(2):</b> in the absence of a contrary contract, the court may award <b>interest at such rate as it thinks fit</b> on the price: (a) to the <b>seller</b>, from the date of <b>tender</b> or from when the price was payable; (b) to the <b>buyer</b> suing for refund of the price on the seller’s breach, from the date <b>payment was made</b>.", "cases": [], "links": [{"l": "S.65 Contract Act: restitution", "m": 9, "sec": "S.65"}, {"l": "S.73 Contract Act", "m": 11, "sec": "S.73"}], "blocks": [{"h": "S.62 Interest by way of damages and special damages.", "paras": [{"t": "(1) Nothing in this Act shall affect the right of the seller or the buyer to recover interest or special damages in any case where by law interest or special damages may be recoverable, or to recover the money paid where the consideration for the payment of it has failed.", "l": 1}, {"t": "(2) In the absence of a contact to the contract, the Court may award interest at such rate as it thinks fit on the amount of the price–", "l": 1}, {"t": "(a) to the seller in a suit by him for the amount of the price from the date of the tender of the goods or from the date on which the price was payable;", "l": 1}, {"t": "(b) to the buyer in a suit by him for the refund of the price in case of a breach of the contract on the part of the seller from the date on which the payment was made.", "l": 1}], "ills": []}]}, {"secs": ["63"], "code": "S.63", "term": "Exclusion of implied terms", "sub": "express agreement, course of dealing or binding usage", "hook": "Implied terms are defaults, and the parties can contract out of them.", "plain": "Where any right, duty or liability arises under a contract of sale <b>by implication of law</b>, it may be <b>negatived or varied</b> by <b>express agreement</b>, by the <b>course of dealing</b>, or by <b>usage</b> if the usage binds both parties.", "cases": [], "links": [{"l": "S.14–18: implied terms", "m": 16, "sec": "S.14–15"}, {"l": "S.17(4): express terms", "m": 16, "sec": "S.17"}], "blocks": [{"h": "S.63 Exclusion of implied terms and conditions.", "paras": [{"t": "Where any right, duty or liability would arise under a contract of sale by implication of law, it may be negatived or varied by express agreement or by the course of dealing between the parties, or by usage, if the usage is such as to bind both parties to the contract.", "l": 0}], "ills": []}]}, {"secs": ["64"], "code": "S.64", "term": "Reasonable time is a question of fact", "sub": "wherever the Act speaks of reasonable time", "hook": "“Reasonable time” is a matter of evidence, not a rule of law.", "plain": "Wherever the Act refers to a <b>reasonable time</b>, what is reasonable is a <b>question of fact</b>.", "cases": [], "links": [{"l": "S.37(2)", "m": 18, "sec": "S.36–37"}, {"l": "S.43", "m": 18, "sec": "S.42–44"}, {"l": "S.55(2)", "m": 19, "sec": "S.55"}], "blocks": [{"h": "S.64 Reasonable time a question of fact.", "paras": [{"t": "Where in this Act any reference is made to a reasonable time, the question what is a reasonable time is a question of fact.", "l": 0}], "ills": []}]}, {"secs": ["64-A"], "code": "S.64-A", "term": "Change in duty or tax after the contract", "sub": "seller may add increases, buyer may deduct decreases", "hook": "If customs, excise or sales tax changes after you contract, the price moves with it, unless the contract says otherwise.", "plain": "If a <b>duty of customs or excise (or tax)</b> on goods is <b>imposed, increased, decreased or remitted after the making of the contract</b>, without a stipulation as to payment of duty or tax: (a) where it takes effect so that the duty or tax is paid, the <b>seller may add</b> the equivalent amount to the contract price and recover it; (b) where a decrease or remission takes effect so that less is paid, the <b>buyer may deduct</b> the equivalent. The <b>Explanation</b> says “tax” means tax payable under the <b>Sales Tax Act, 1951</b>. The printed section has many bracketed insertions marking later amendments; kept as printed.", "cases": [], "links": [{"l": "S.9: price", "m": 15, "sec": "S.9"}], "blocks": [{"h": "S.64-A In contracts of sale amount of increased or decreased duty to be added or deducted", "paras": [{"t": "In the event of any duty of customs or excise [or tax] on any goods being imposed, increased, decreased or remitted after the making of any contract for the sale of such goods without stipulation [as to the payment of duty or tax where duty or tax] was not chargeable at the time of the making of the contract, or for the sale of such goods [duty paid or tax paid where duty or tax] was chargeable at that time,–", "l": 0}, {"t": "(a) if such imposition or increase so takes effect that [the duty or tax or in
