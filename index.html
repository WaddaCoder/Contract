 the second, for the sale to him of the cotton. C pays B the money, with which B absconds. C's payment is good as against A.", "l": 0}, {"t": "(c) A directs B, his agent, to pay certain money to C. A dies, and D takes out probate to his will. B, after A's death, but before hearing of it, pays the money to C. The payment is good as against D, the executor.", "l": 0}]}]}, {"secs": ["209", "210"], "code": "S.209–210", "term": "Agent’s duty on principal’s death or insanity; sub-agents", "sub": "protect interests; sub-agents fall with the agent", "hook": "When the principal dies or loses capacity, the agent protects what he holds and the sub-agents lose their authority with his.", "plain": "<b>S.209:</b> when the agency ends by the principal’s <b>death or unsoundness of mind</b>, the agent must take <b>all reasonable steps</b> for the protection and preservation of the interests entrusted to him, on behalf of the representatives. <b>S.210:</b> termination of an agent’s authority terminates the authority of all <b>sub-agents</b> he appointed (subject to the rules on termination).", "cases": [], "links": [{"l": "S.201", "m": 14, "sec": "S.201"}, {"l": "S.208", "m": 14, "sec": "S.205–208"}], "blocks": [{"h": "S.209 Agent's duty on termination of agency by principal's death or insanity", "paras": [{"t": "When an agency is terminated by the principal dying or becoming of unsound mind, the agent is bound to take, on behalf of the representatives of his late principal, all reasonable steps for the protection and preservation of the interests entrusted to him.", "l": 0}], "ills": []}, {"h": "S.210 Termination of sub-agent's authority Agent's Duty to Principal", "paras": [{"t": "The termination of the authority of an agent causes the termination (subject to the rules herein contained regarding the termination of an agent's authority) of the authority of all sub-agents appointed by him.", "l": 0}], "ills": []}]}, {"secs": ["211", "212", "213", "214"], "code": "S.211–214", "term": "Agent’s duties: directions or custom; skill; accounts; communication", "sub": "follow directions; reasonable skill and diligence; account; ask when in doubt", "hook": "The agent follows instructions or custom, uses reasonable skill and diligence, keeps accounts, and asks when in difficulty.", "plain": "<b>S.211:</b> conduct the business per the principal’s <b>directions</b>, or else per the <b>custom</b> at that place; if he acts otherwise he must make good any loss and <b>account for any profit</b>. <b>S.212:</b> bring the <b>skill generally possessed</b> by persons in similar business (unless the principal has notice of his want of skill), always with <b>reasonable diligence</b>, and compensate for <b>direct</b> consequences of neglect, want of skill or misconduct, not remote ones. <b>S.213:</b> render <b>proper accounts on demand</b>. <b>S.214:</b> in cases of <b>difficulty</b>, use all reasonable diligence to communicate with the principal and seek instructions.", "cases": [], "links": [{"l": "S.189: emergency", "m": 14, "sec": "S.188–189"}, {"l": "S.73: damages", "m": 11, "sec": "S.73"}], "blocks": [{"h": "S.211 Agent's duty in conducting principal's business", "paras": [{"t": "An agent is bound to conduct the business of his principal according to the directions given by the principal, or, in the absence of any such directions, according to the custom which prevails in doing business of the same kind at the place where the agent conducts such business. When the agent acts otherwise, if any loss be sustained, he must make it good to his principal, and, if any profit accrues, he must account for it.", "l": 0}], "ills": [{"t": "(a) A, an agent engaged in carrying on for B a business, in which it is the custom to invest from time to time, at interest, the moneys which may be in hand, omits to make such investment. A must make good to B the interest usually obtained by such investments.", "l": 0}, {"t": "(b) B, a broker, in whose business it is not the custom to sell on credit, sells goods of A on credit to C, whose credit at the time was very high. C, before payment, becomes insolvent. B must make good the loss to A.", "l": 0}]}, {"h": "S.212 Skill and diligence required from agent", "paras": [{"t": "An agent is bound to conduct the business of the agency with as much skill as is generally possessed by persons engaged in similar business, unless the principal has notice of his want of skill. The agent is always bound to act with reasonable diligence, and to use such skill as he possesses; and to make compensation to his principal in respect of the direct consequences of his own neglect, want of skill or misconduct, but not in respect of loss or damage which are indirectly or remotely caused by such neglect, want of skill or misconduct.", "l": 0}], "ills": [{"t": "(a) A, a merchant in [Islamabad] has an agent, B, in London to whom a sum of money is paid on A's account, with orders to remit. B retains the money for a considerable time. A, in consequence of not receiving the money, becomes insolvent. B is liable for the money and interest from the day on which it ought to have been paid, according to the usual rate, and for any further direct loss– as e.g., by variation of rate of exchange– but not further.", "l": 0}, {"t": "(b) A, an agent for the sale of goods, having authority to sell on credit, sells to B on credit, without making the proper and usual enquiries as to the solvency of B. B, at the time of such sale, is insolvent. A must make compensation to his principal in respect of any loss thereby sustained.", "l": 0}, {"t": "(c) A, an insurance-broker employed by B to effect an insurance on a ship, omits to see that the usual clauses are inserted in the policy. The ship is afterwards lost. In consequence of the omission of the clauses nothing can be recovered from the underwriters. A is bound to make good the loss to B.", "l": 0}, {"t": "(d) A, a merchant in England, directs B, his agent at [Karachi], who accepts the agency, to send him 100 bales of cotton by a certain ship. B, having it in his power to send the cotton, omits to do so. The ship arrives safely in England. Soon after her arrival the price of cotton rises. B is bound to make good to A the profit which he might have made by the 100 bales of cotton at the time the ship arrived, but not any profit he might have made by the subsequent rise.", "l": 0}]}, {"h": "S.213 Agent's accounts", "paras": [{"t": "An agent is bound to render proper accounts to his principal on demand.", "l": 0}], "ills": []}, {"h": "S.214 Agent’s duty to communicate with principal", "paras": [{"t": "It is the duty of an agent, in cases of difficulty, to use all reasonable diligence in communication with his principal, and in seeking to obtain his instructions.", "l": 0}], "ills": []}]}, {"secs": ["215", "216"], "code": "S.215–216", "term": "Agent dealing on his own account", "sub": "repudiation; account of benefit", "hook": "A man cannot serve two masters, the principal and himself, without telling the principal.", "plain": "<b>S.215:</b> if an agent deals on his own account in the business of the agency <b>without the principal’s consent</b> and without disclosing all material circumstances, the principal may <b>repudiate</b> if a material fact was <b>dishonestly concealed</b> or the dealing was <b>disadvantageous</b> to him. Illustrations: an agent buys the estate he was to sell, concealing a mine. <b>S.216:</b> if the agent deals on his own account <b>without the principal’s knowledge</b>, the principal may claim <b>any benefit</b> resulting (an agent told to buy a house who buys it himself can be compelled to sell it to the principal at cost).", "cases": [], "links": [{"l": "S.211", "m": 14, "sec": "S.211–214"}], "blocks": [{"h": "S.215 Right of principal when agent deals, on his own account, in business of agency without principal's consent", "paras": [{"t": "If an agent deals on his own account in the business of the agency, without first obtaining the consent of his principal and acquainting him with all material circumstances which have come to his own knowledge on the subject, the principal may repudiate the transaction, if the case shows either that any material fact has been dishonestly concealed from him by the agent, or that the dealings of the agent have been disadvantageous to him.", "l": 0}], "ills": [{"t": "(a) A directs B to sell A's estate. B buys the estate for himself in the name of C. A, on discovering that B has bought the estate for himself, may repudiate the sale, if he can show that B has dishonestly concealed any material fact, or that the sale has been disadvantageous to him.", "l": 0}, {"t": "(b) A directs B to sell A's estate. B, on looking over the estate before selling it, finds a mine on the estate which is unknown to A. B informs A that he wishes to buy the estate for himself, but conceals the discovery of the mine. A allows B to buy in ignorance of the existence of the mine. A, on discovering that B knew of the mine at the time he bought the estate, may either repudiate or adopt the sale at his option.", "l": 0}]}, {"h": "S.216 Principal's right to benefit gained by agent dealing on his own account in business of agency", "paras": [{"t": "If an agent, without the knowledge of his principal, deals in the business of the agency on his own account instead of on account of his principal, the principal is entitled to claim from the agent any benefit which may have resulted to him from the transaction.", "l": 0}], "ills": [{"t": "A directs B, his agent, to buy a certain house for him. B tells A it cannot be bought, and buys the house for himself. A may, on discovering that B has bought the house, compel him to sell it to A at the price he gave for it.", "l": 0}]}]}, {"secs": ["217", "218", "219", "220", "221"], "code": "S.217–221", "term": "Retainer; payment over; remuneration; misconduct; lien", "sub": "what the agent keeps and what he must hand over", "hook": "Pay over what you collect, subtract what you are owed, and keep a lien until it is settled.", "plain": "<b>S.217:</b> the agent may <b>retain</b> from sums received for the principal his advances, expenses and remuneration. <b>S.218:</b> subject to that, he must <b>pay over</b> all sums received. <b>S.219:</b> absent special contract, remuneration is not due until the <b>completion of the act</b>, but an agent may detain money received on goods sold even if not all goods are sold. <b>S.220:</b> no remuneration for <b>misconducted</b> business. <b>S.221:</b> absent contrary contract, a <b>lien</b> over the principal’s goods, papers and property (moveable or immoveable) until commission, disbursements and services are paid.", "cases": [], "links": [{"l": "S.170–171: lien of bailee", "m": 13, "sec": "S.170–171"}, {"l": "S.222", "m": 14, "sec": "S.222–225"}], "blocks": [{"h": "S.217 Agent's right of retainer out of sums received on principal's account", "paras": [{"t": "An agent may retain, out of any sums received on account of the principal in the business of the agency, all moneys due to himself in respect of advances made or expenses properly incurred by him in conducting such business, and also such remuneration as may be payable to him for acting as agent.", "l": 0}], "ills": []}, {"h": "S.218 Agent's duty to pay sums received for principal", "paras": [{"t": "Subject to such deductions, the agent is bound to pay to his principal all sums received on his account.", "l": 0}], "ills": []}, {"h": "S.219 When agent's remuneration becomes due", "paras": [{"t": "In the absence of any special contract, payment for the performance of any act is not due to the agent until the completion of such act; but an agent may detain moneys received by him on account of goods sold, although the whole of the goods consigned to him for sale may not have been sold, or although the sale may not be actually complete.", "l": 0}], "ills": []}, {"h": "S.220 Agent not entitled to remuneration for business misconducted", "paras": [{"t": "An agent who is guilty of misconduct in the business of the agency is not entitled to any remuneration in respect of that part of the business which he has misconducted.", "l": 0}], "ills": [{"t": "(a) A employs B to recover 1,00,000 Rupees from C, and to lay it out on good security. B recovers the 1,00,000 Rupees and lays out 90,000 Rupees on good security, but lays out 10,000 Rupees on security which he ought to have known to be bad, whereby A loses 2,000 Rupees. B is entitled to remuneration for recovering the 1,00,000 Rupees and for investing the 90,000 Rupees. He is not entitled to any remuneration for investing the 10,000 Rupees, and he must make good the 2,000 Rupees to B.", "l": 0}, {"t": "(b) A employs B to recover 1,000 Rupees from C. Through B's misconduct the money is not recovered. B is entitled to no remuneration for his services, and must make good the loss.", "l": 0}]}, {"h": "S.221 Agent's lien on principal's property Principal’s Duty to Agent", "paras": [{"t": "In the absence of any contract to the contrary, an agent is entitled to retain goods, papers and other property, whether moveable or immoveable, of the principal received by him, until the amount due to himself for commission, disbursements and services in respect of the same has been paid or accounted for to him.", "l": 0}], "ills": []}]}, {"secs": ["222", "223", "224", "225"], "code": "S.222–225", "term": "Principal’s duties: indemnity and compensation", "sub": "lawful acts; good faith acts; no indemnity for crimes; injury from neglect", "hook": "The principal stands behind lawful and honest acts, but not crimes.", "plain": "<b>S.222:</b> the employer must <b>indemnify</b> the agent against consequences of <b>all lawful acts</b> done in exercise of authority. <b>S.223:</b> an agent acting <b>in good faith</b> is indemnified though the act injures third persons’ rights (an execution officer seizing a third party’s goods on the decree-holder’s representation). <b>S.224:</b> no indemnity where the act is <b>criminal</b> (hiring someone to beat C; a libel published at A’s request). <b>S.225:</b> the principal must <b>compensate the agent for injury</b> caused by the principal’s <b>neglect or want of skill</b> (a scaffolding put up unskilfully).", "cases": [], "links": [{"l": "S.124–125: indemnity", "m": 12, "sec": "S.124"}, {"l": "S.221", "m": 14, "sec": "S.217–221"}], "blocks": [{"h": "S.222 Agent to be indemnified against consequences of lawful acts", "paras": [{"t": "The employer of an agent is bound to indemnify him against the consequences of all lawful acts done by such agent in exercise of the authority conferred upon him.", "l": 0}], "ills": [{"t": "(a) B, at Singapur, under instructions from A of [Karachi], contracts with C to deliver certain goods to him. A does not send the goods to B, and C sues B for breach of contract. B informs A of the suit, and A authorizes him to defend the suit. B defends the suit, and is compelled to pay damages and costs, and incurs expenses. A is liable to B for such damages, costs and expenses.", "l": 0}, {"t": "(b) B, a broker at [Karachi] by the orders of A, a merchant there contracts with C for the purchases of 10 casks of oil for A. Afterwards A refuses to receive the oil, and C sues B. B informs A, who repudiates the contract altogether. B defends, but unsuccessfully, and has to pay damages and costs and incurs expenses. A is liable to B for such damages, costs and expenses.", "l": 0}]}, {"h": "S.223 Agent to be indemnified against consequences of acts done in good faith", "paras": [{"t": "Where one person employs another to do an act, and the agent does the act in good faith, the employer is liable to indemnify the agent against the consequences of that act, though it cause an injury to the rights of third persons.", "l": 0}], "ills": [{"t": "(a) A, a decree-holder and entitled to execution of B's goods, requires the officer of the Court to seize certain goods, representing them to be the goods of B. The officer seizes the goods, and is sued by C, the true owner of the goods. A is liable to indemnify the officer for the sum which he is compelled to pay to C, in consequence of obeying A's directions.", "l": 0}, {"t": "(b) B, at the request of A, sells goods in the possession of A, but which A had no right to dispose of. B does not know this, and hands over the proceeds of the sale to A. Afterwards C, the true owner of the goods, sues B and recovers the value of the goods and costs. A is liable to indemnify B for what he has been compelled to pay to C and for B's own expenses.", "l": 0}]}, {"h": "S.224 Non-liability of employer of agent to do a criminal act", "paras": [{"t": "Where one person employs another to do an act which is criminal, the employer is not liable to the agent, either upon an express or an implied promise, to indemnify him against the consequences of that Act .", "l": 0}], "ills": [{"t": "(a) A employs B to beat C, and agrees to indemnify him against all consequences of act. B thereupon beats C, and has to pay damages to C for so doing. A is not liable to indemnify B for those damages.", "l": 0}, {"t": "(b) B, the proprietor of a newspaper, publishes, at A's request, liable upon C in the paper, and A agrees to indemnify B against the consequences of the publication, and all costs and damages of any action in respect thereof. B is sued by C and has to pay damages, and also incurs expenses. A is not liable to B upon the indemnity.", "l": 0}]}, {"h": "S.225 Compensation to agent for injury caused by principal's neglect", "paras": [{"t": "The principal must make compensation to his agent in respect of injury caused to such agent by the principal's neglect or want of skill.", "l": 0}], "ills": [{"t": "A employs B as a bricklayer in building a house, and puts up the scaffolding himself. The scaffolding is unskilfully put up, and B is in consequence hurt. A must make compensation to B.", "l": 0}]}]}, {"secs": ["226", "227", "228", "229"], "code": "S.226–229", "term": "Effect of agency on contracts with third persons", "sub": "as if the principal acted; excess authority; notice to agent", "hook": "Through the agent, the principal is the contracting party.", "plain": "<b>S.226:</b> contracts entered through an agent, and obligations from his acts, are enforced as if made or done by the <b>principal in person</b> (payment to an authorised agent discharges the debtor). <b>S.227:</b> where an agent <b>exceeds authority</b> and the authorised part is <b>separable</b>, only that part binds the principal. <b>S.228:</b> where the excess is <b>not separable</b>, the principal need not recognise the transaction (500 sheep and 200 lambs for one sum). <b>S.229:</b> <b>notice or information</b> given to or obtained by the agent in the course of the business has the same consequences as if given to the principal.", "cases": [], "links": [{"l": "S.237", "m": 14, "sec": "S.237"}, {"l": "S.230", "m": 14, "sec": "S.230"}], "blocks": [{"h": "S.226 Enforcement and consequences of agent's contracts", "paras": [{"t": "Contracts entered into through an agent, and obligations arising from acts done by an agent, may be enforced in the same manner, and will have the same legal consequences, as if the contracts had been entered into and the acts done by the principal in person.", "l": 0}], "ills": [{"t": "(a) A buys goods from B, knowing that he is an agent for their sale, but not knowing who is the principal. B's principal is the person entitled to claim from A the price of the goods, and A cannot, in a suit by the principal, set off against that claim a debt due to himself from B.", "l": 0}, {"t": "(b) A, being B's agent with authority to receive money on his behalf, receives from C a sum of money due to B. C is discharged of his obligation to pay the sum in question to B.", "l": 0}]}, {"h": "S.227 Principal how far bound, when agent exceeds authority", "paras": [{"t": "When an agent does more than he is authorized to do, and when the part of what he does, which is within his authority, can be separated from the part which is beyond his authority, so much only of what he does as is within his authority is binding as between him and his principal.", "l": 0}], "ills": [{"t": "A, being owner of a ship and cargo, authorizes B to procure an insurance for 4,000 Rupees on the ship. B procures a policy for 4,000 Rupees on the ship, and another for the like sum on the cargo. A is bound to pay the premium for the policy on the ship, but not the premium for the policy on the cargo.", "l": 0}]}, {"h": "S.228 Principal not bound when excess of agent's authority is not separable", "paras": [{"t": "Where an agent does more than he is authorized to do, and what he does beyond the scope of his authority cannot be separated from what is within it, the principal is not bound to recognize the transaction.", "l": 0}], "ills": [{"t": "A authorizes B to buy 500 sheep for him. B buys 500 sheep and 200 lambs for one sum of 6,000 Rupees. A may repudiate the whole transaction.", "l": 0}]}, {"h": "S.229 Consequences of notice given to agent", "paras": [{"t": "Any notice given to or information obtained by the agent, provided it be given or obtained in the course of the business transacted by him for the principal, shall, as between the principal and third parties, have the same legal consequences as if it had been given to or obtained by the principal.", "l": 0}], "ills": [{"t": "(a) A is employed by B to buy from C certain goods, of which C is the apparent owner, and buys them accordingly. In the course of the treaty for the sale, A learns that the goods really belonged to D, but B is ignorant of that fact, B is not entitled to set off a debt owing to him from C against the price of the goods.", "l": 0}, {"t": "(b) A is employed by B to buy from C goods of which C is the apparent owner. A was, before he was so employed, a servant of C, and then learnt that goods really belonged to D, but B is ignorant of that fact. In spite of the knowledge of his agent, B may set off against the price of the goods a debt owing to him from C.", "l": 0}]}]}, {"secs": ["230"], "code": "S.230", "term": "Agent not personally bound, nor entitled to sue", "sub": "the rule and its three presumed exceptions", "hook": "The agent usually disappears from the contract, except when the contract says otherwise or the principal is hidden, foreign or unsuable.", "plain": "Absent contract to the contrary, an agent <b>cannot personally enforce</b> contracts made for his principal, <b>nor is he personally bound</b>. A contract to the contrary is <b>presumed</b> where: (1) the contract is for the <b>sale or purchase of goods for a merchant resident abroad</b>; (2) the agent <b>does not disclose the principal’s name</b>; (3) the principal, though disclosed, <b>cannot be sued</b>.", "cases": [], "links": [{"l": "S.231–232: undisclosed principal", "m": 14, "sec": "S.231–234"}, {"l": "S.233", "m": 14, "sec": "S.231–234"}], "blocks": [{"h": "S.230 Agent cannot personally enforce, nor be bound by, contracts on behalf of principal", "paras": [{"t": "In the absence of any contract to that effect, an agent cannot personally enforce contracts entered into by him on behalf of his principal, nor is he personally bound by them.", "l": 0}, {"t": "Presumption of contract to contrary.– Such a contract shall be presumed to exist in the following cases:–", "l": 0}, {"t": "(1) where the contract is made by an agent for the sale or purchase of goods for a merchant resident abroad:", "l": 1}, {"t": "(2) where the agent does not disclose the name of his principal:", "l": 1}, {"t": "(3) where the principal, though disclosed, cannot be sued.", "l": 1}], "ills": []}]}, {"secs": ["231", "232", "233", "234"], "code": "S.231–234", "term": "Undisclosed principal; election of defendants", "sub": "principal may enforce subject to equities; third party may choose", "hook": "The unseen principal can sue, but the third party keeps every defence he had against the agent.", "plain": "<b>S.231:</b> if an agent contracts with someone who <b>neither knows nor suspects</b> he is an agent, the principal may require performance, but the other party has the <b>same rights against the principal as against the agent</b>; if the principal discloses himself before completion, the other party may refuse to perform if he can show he would not have contracted had he known. <b>S.232:</b> the principal gets performance only <b>subject to rights and obligations between the agent and the other party</b> (set-off of the agent’s debt). <b>S.233:</b> where the agent is personally liable, the third party may hold <b>the agent, the principal, or both</b> liable. <b>S.234:</b> if the third party induces the agent or principal to act on the belief that only the other will be held, he <b>cannot afterwards</b> hold the other liable.", "cases": [], "links": [{"l": "S.230", "m": 14, "sec": "S.230"}], "blocks": [{"h": "S.231 Rights of parties to a contract made by agent not disclosed", "paras": [{"t": "If an agent makes a contract with a person who neither knows, nor has reason to suspect, that he is an agent, his principal may require the performance of the contract; but the other contracting party has, as against the principal, the same rights as he would have had as against the agent if the agent had been principal.", "l": 0}, {"t": "If the principal discloses himself before the contract is completed, the other contracting party may refuse to fulfil the contract, if he can show that, if he had known who was the principal in the contract, or if he had known that the agent was not a principal, he would not have entered into the contract.", "l": 0}], "ills": []}, {"h": "S.232 Performance of contract with agent supposed to be principal", "paras": [{"t": "Where one man makes a contract with another, neither knowing nor having reasonable ground to suspect that the other is an agent, the principal, if he requires the performance of the contract, can only obtain such performance subject to the rights and obligations subsisting between the agent and the other party to the contract.", "l": 0}], "ills": [{"t": "A, who owes 500 Rupees to B, sells 1,000 Rupees, worth of rice to B. A is acting as agent for C in the transaction, but B has no knowledge nor reasonable ground of suspicion that such is the case. C cannot compel B to take the rice without allowing him to set off A's debt.", "l": 0}]}, {"h": "S.233 Right of person dealing with agent personally liable", "paras": [{"t": "In cases where the agent is personally liable, a person dealing with him may hold either him or his principal, or both of them, liable.", "l": 0}], "ills": [{"t": "A enters into a contract with B to sell him 100 bales of cotton, and afterwards discovers that B was acting as agent for C. A may sue either B or C, or both, for the price of the cotton.", "l": 0}]}, {"h": "S.234 Consequence of inducing agent or principal to act on belief that principal or agent will be held exclusively liable", "paras": [{"t": "When a person who has made a contract with an agent induces the agent to act upon the belief that the principal only will be held liable, or induces the principal to act upon the belief that the agent only will be held liable, he cannot afterwards hold liable the agent or principal respectively.", "l": 0}], "ills": []}]}, {"secs": ["235", "236"], "code": "S.235–236", "term": "Pretended agent", "sub": "liable for loss; cannot require performance", "hook": "Pretend to be an agent and you pay for it, and you cannot demand performance.", "plain": "<b>S.235:</b> a person who <b>untruly represents himself to be an authorised agent</b>, and thereby induces a third person to deal, is liable to compensate for loss if the alleged employer <b>does not ratify</b>. <b>S.236:</b> a person contracting as agent who was in reality acting on <b>his own account</b> cannot require performance.", "cases": [], "links": [{"l": "S.196: ratification", "m": 14, "sec": "S.196–197"}, {"l": "S.18: misrepresentation", "m": 4, "sec": "S.18"}], "blocks": [{"h": "S.235 Liability of pretended agent", "paras": [{"t": "A person untruly representing himself to be the authorized agent of another, and thereby inducing a third person to deal with him as such agent, is liable, if his alleged employer does not ratify his acts, to make compensation to the other in respect of any loss or damage which he has incurred by so dealing.", "l": 0}], "ills": []}, {"h": "S.236 Person falsely contracting as agent not entitled to performance", "paras": [{"t": "A person with whom a contract has been entered into in the character of agent is not entitled to require the performance of it if he was in reality acting, not as agent, but on his own account.", "l": 0}], "ills": []}]}, {"secs": ["237"], "code": "S.237", "term": "Holding out: principal induces belief in authority", "sub": "bound by acts within the apparent authority", "hook": "Let a third party reasonably think the agent is authorised and you are bound.", "plain": "Where an agent, <b>without authority</b>, does acts or incurs obligations on the principal’s behalf, the principal is <b>bound</b> if by his <b>words or conduct</b> he induced third persons to believe they were within the agent’s authority. Illustrations: goods consigned with a reserved price; negotiable instruments endorsed in blank sold in breach of private orders.", "cases": [{"n": "Freeman & Lockyer v Buckhurst Park Properties", "c": "[1964] 2 QB 480 (CA)", "t": "A director who acted as managing director, with the board’s knowledge and acquiescence, had apparent authority, so the company was bound to pay the architects.", "v": 1}], "links": [{"l": "S.178: pledge by mercantile agent", "m": 13, "sec": "S.178–179"}, {"l": "S.196", "m": 14, "sec": "S.196–197"}], "blocks": [{"h": "S.237 Liability of principal inducing belief that agent's unauthorized acts were authorized", "paras": [{"t": "When an agent has, without authority, done acts or incurred obligations to third persons on behalf of his principal, the principal is bound by such acts or obligations if he has by his words or conduct induced such third persons to believe that such acts and obligations were within the scope of the agent's authority.", "l": 0}], "ills": [{"t": "(a) A consigns goods to B for sale, and gives him instructions not to sell under a fixed price.– C, being ignorant of B's instructions, enters into a contract with B to buy the goods at a price lower than the reserved price. A is bound by the contract.", "l": 0}, {"t": "(b) A entrusts B with negotiable instruments endorsed in blank. B sells them to C in violation of private orders from A. The sale is good.", "l": 0}]}]}, {"secs": ["238"], "code": "S.238", "term": "Misrepresentation or fraud by agent", "sub": "the principal is treated as having made it, if within the agent’s authority", "hook": "What the agent says in the course of business, the principal is taken to have said.", "plain": "Misrepresentations or frauds by agents <b>acting in the course of their business</b> have the same effect on agreements as if made by the <b>principals</b>; those in matters <b>outside their authority</b> do not affect the principals. Illustrations: a sale agent’s unauthorised misrepresentation (contract voidable at C’s option, as between B and C); a ship captain’s bills of lading for goods never received (void as between B and the pretended consignor). <b>Source note:</b> a schedule marker follows S.238 in the extraction and was dropped.", "cases": [], "links": [{"l": "S.17: fraud", "m": 4, "sec": "S.17"}, {"l": "S.18", "m": 4, "sec": "S.18"}, {"l": "S.19", "m": 4, "sec": "S.19"}], "blocks": [{"h": "S.238 Effect, on agreement, of misrepresentation or fraud by agent.", "paras": [{"t": "Misrepresentations made, or frauds committed, by agents acting in the course of their business for their principals, have the same effect on agreements made by such agents as if such misrepresentations or frauds had been made or committed by the principals; but misrepresentations made, or frauds committed, by agents, in matters which do not fall within their authority, do not affect their principals.", "l": 0}], "ills": [{"t": "(a) A, being B's agent for the sale of goods, induces C to buy them by a misrepresentation, which he was not authorized by B to make. The contract is voidable, as between B and C, at the option of C.", "l": 0}, {"t": "(b) A, the captain of B's ship, signs bills of lading without having received on board the goods mentioned therein. The bills of lading are void as between B and the pretended consignor.", "l": 0}]}]}], "spar": [{"q": "A, a minor, is appointed B’s agent and buys goods from C for B. Is the contract with C binding on B? Can B sue A for negligence?", "a": "<b>Binding on B</b>: S.184 says that, as between principal and third persons, <b>any person</b> may be an agent. <b>No claim against A</b>: a minor cannot become an agent so as to be <b>responsible to his principal</b> under the Act. So the third party is protected, and the principal’s remedy against the minor agent is limited. S.185: no consideration is needed."}, {"q": "A, a stranger, signs a contract as B’s agent without authority. B hears of it and says nothing for a month. Is B bound?", "a": "<b>Possibly.</b> Ratification may be <b>express or implied from conduct</b> (S.197), but S.198 requires <b>full knowledge of the facts</b>. Silence alone is not clearly conduct; no Pakistani case has been checked here. <b>Open to argument.</b> If B ratifies, he ratifies the <b>whole transaction</b> (S.199), and cannot use ratification to prejudice a third person (S.200)."}, {"q": "An agent is told to sell A’s estate. He finds a mine, conceals it, and buys the estate himself. What can A do?", "a": "<b>Repudiate the sale</b> (S.215): the agent dealt on his own account, without disclosure, and dishonestly concealed a material fact (illustration (b)). A may also claim the <b>benefit</b> the agent gained (S.216). The duty is one of loyalty: the agent cannot profit from his position without the principal’s informed consent."}, {"q": "A, an undisclosed principal, authorises B to sell goods to C. C does not know B is an agent. May A sue C? What defences does C have?", "a": "<b>Yes, A may sue</b> (S.231), but C has the <b>same rights against A as he had against B</b>, such as set-off of a debt owed by B (S.232). If A discloses himself before completion, C may refuse if he can show he would not have contracted with A. Under S.230, because B did not disclose a principal, a contract binding B personally is <b>presumed</b>."}, {"q": "A principal revokes the agent’s authority by letter; before the agent receives it, the agent sells goods. Valid?", "a": "<b>Yes, as against the principal.</b> S.208: termination does not take effect as regards the agent <b>before it becomes known to him</b> (illustration (a)); as regards third persons, not before it becomes known to them. Compare S.203 (revocation before exercise) and S.204 (no revocation after part exercise)."}, {"q": "A employs B to beat C and promises to indemnify him. B pays damages to C. May B recover from A?", "a": "<b>No.</b> S.224: no indemnity for a <b>criminal act</b>, express or implied (illustration (a)). Contrast S.222 (lawful acts) and S.223 (good-faith acts), where the principal indemnifies even though a third person is hurt."}]}, "15": {"n": 15, "intro": "Part II begins: the Sale of Goods Act, 1930. This module covers the formation of the contract of sale: what a sale is and how it differs from an agreement to sell (S.4), how it is made (S.5), what may be sold (S.6), what happens if the goods perish (S.7–8), and how the price is found (S.9–10). S.2 gives the definitions, and S.3 makes the Contract Act the background law.", "boundary": "<b>Boundary.</b> Conditions and warranties are in Module 16, the passing of property in Module 17, delivery in Module 18, unpaid seller’s rights in Module 19 and suits for breach in Module 20.", "recall": "<b>Quick recall</b><b>Sale</b> = property passes now; <b>agreement to sell</b> = later or on condition (S.4). Future goods: agreement to sell only (S.6(3)). Specific goods perished: <b>before contract</b> void (S.7); <b>after, before risk passes, no fault</b> avoided (S.8). Price: fixed, method, dealing, or <b>reasonable</b> (S.9).", "rails": [{"secs": ["1"], "code": "S.1", "term": "Short title, extent and commencement", "sub": "the Act in force from 1 July 1930", "hook": "The year on the label: 1930, now extended to the whole of Pakistan.", "plain": "The Act is called the <b>Sale of Goods Act, 1930</b>, <b>extends to the whole of Pakistan</b>, and came into force on the <b>first day of July, 1930</b>. The asterisks in the printed text mark words omitted by later adaptation; kept as printed.", "cases": [], "links": [{"l": "S.3: Contract Act applies", "m": 15, "sec": "S.3"}], "blocks": [{"h": "S.1 Short title, extent and commencement", "paras": [{"t": "(1) This Act may be called the *** Sale of Goods Act, 1930.", "l": 1}, {"t": "[(2) It extends to the whole of Pakistan.]", "l": 0}, {"t": "(3) It shall come into force into force on the first day of July, 1930", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(1), (12)", "term": "“Buyer” and “seller”", "sub": "the people", "hook": "Whoever buys or agrees to buy is the buyer; whoever sells or agrees to sell is the seller.", "plain": "<b>Buyer:</b> a person who <b>buys or agrees to buy</b> goods. <b>Seller:</b> a person who <b>sells or agrees to sell</b> goods. Both definitions include the party who has only <b>agreed</b>, not yet completed the sale.", "cases": [], "links": [{"l": "S.4: sale vs agreement to sell", "m": 15, "sec": "S.4"}], "pidx": [0, 1, 12], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(1) \"buyer\" means a person who buys or agrees to buy goods;", "l": 1}, {"t": "(12) \"Seller\" means a person who sells or agrees to sell goods;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(2), (3)", "term": "“Delivery” and “document of title to goods”", "sub": "voluntary transfer of possession; bills of lading and the like", "hook": "Delivery is handing over possession voluntarily; a document of title is a paper that stands for the goods.", "plain": "<b>Delivery:</b> <b>voluntary transfer of possession</b> from one person to another; goods are in a <b>deliverable state</b> when the buyer would under the contract be bound to take delivery. <b>Document of title:</b> includes a bill of lading, dock-warrant, warehouse keeper’s or wharfingers’ certificate, railway receipt, or any warrant or order for delivery, or other document used in the ordinary course of business as proof of possession or control of goods, which authorises its holder, by endorsement or delivery, to <b>transfer or receive the goods</b>.", "cases": [], "links": [{"l": "S.34: how delivery is made", "m": 18, "sec": "S.34–35"}, {"l": "S.26: right of disposal", "m": 17, "sec": "S.26"}, {"l": "S.178 Contract Act: pledge", "m": 13, "sec": "S.178–179"}], "pidx": [0, 2, 3], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(2) \"delivery\" means voluntary transfer of possession from one person to another; to be in a \"deliverable state\" when they are in such state that the buyer would under the contract be bound to take delivery of them;", "l": 1}, {"t": "(3) \"document of title to goods\" includes a bill of lading, dock- warrant, warehouse keeper's certificate, wharfingers' certificate, railway receipt, warrant or order for the delivery of goods and any other document used in ordinary course of business as proof of the possession or control of goods, or authorising or purporting to authorise, either by endorsement or by delivery, the possessor of the document to transfer or receive goods thereby represented;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(4), (7)", "term": "“Fault” and “insolvent”", "sub": "wrongful act or default; unable to pay debts as they fall due", "hook": "Insolvency here is a cash-flow test, not a court order.", "plain": "<b>Fault:</b> <b>wrongful act or default</b>. <b>Insolvent:</b> a person who has <b>ceased to pay his debts in the ordinary course of business</b>, or <b>cannot pay them as they fall due</b>, <b>whether or not he has committed an act of insolvency</b>.", "cases": [], "links": [{"l": "S.46: unpaid seller (insolvent buyer)", "m": 19, "sec": "S.46"}], "pidx": [0, 4, 7], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(4) \"fault\" means wrongful act or default;", "l": 1}, {"t": "(7) a person is said to be \"insolvent\" who has ceased to pay his debts in the ordinary course of business, or cannot pay his debts as they become due, whether he has committed and act of insolvency or not;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(5), (6)", "term": "“Future goods” and “goods”", "sub": "what can be sold", "hook": "Goods are movables, but not money or lawsuits; crops and fixtures count if they are to be severed.", "plain": "<b>Future goods:</b> goods to be <b>manufactured, produced or acquired</b> by the seller <b>after the contract is made</b>. <b>Goods:</b> <b>every kind of movable property other than actionable claims and money</b>, and including <b>electricity, water, gas</b> (in the bracketed words), <b>stock and shares</b>, <b>growing crops, grass</b>, and things attached to or forming part of the land <b>agreed to be severed</b> before sale or under the contract.", "cases": [], "links": [{"l": "S.6: existing or future goods", "m": 15, "sec": "S.6"}, {"l": "S.24: unascertained or future goods", "m": 17, "sec": "S.24"}], "pidx": [0, 5, 6], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(5) \"future goods\" means goods to be manufactured or produced or acquired by the seller after the making of the contract of sale;", "l": 1}, {"t": "(6) \"goods\" means every kind of movable property other than actionable claims and money; and includes [electricity, water, gas,] stock and shares, growing crops, grass, and things attached to or forming part of the land which are agreed to be severed before sale or under the contract of sale;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(8)", "term": "“Mercantile agent”", "sub": "an agent with authority to sell, consign, buy or raise money on goods", "hook": "The agent trusted with goods in the course of business, whose acts bind the owner in good-faith deals.", "plain": "A mercantile agent having, in the <b>customary course of business as such agent</b>, authority either to <b>sell goods</b>, <b>consign goods for sale</b>, <b>buy goods</b>, or <b>raise money on the security of goods</b>. The definition is borrowed by S.178 of the Contract Act (Module 13) and used in the exceptions to <i>nemo dat</i> (S.28, Module 17).", "cases": [], "links": [{"l": "S.178 Contract Act", "m": 13, "sec": "S.178–179"}, {"l": "S.28: sale by non-owner", "m": 17, "sec": "S.28"}], "pidx": [0, 8], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(8) \"mercantile agent\" means a mercantile agent having in the customary course of business as such agent authority either to sell goods, or to consign goods for the purposes of sale, or to buy goods, or to raise money on the security of goods;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(9)–(11)", "term": "“Price”, “property”, “quality of goods”", "sub": "money consideration; general property; state or condition", "hook": "Property here means ownership, not just possession or a lien.", "plain": "<b>Price:</b> the <b>money consideration</b> for a sale of goods. <b>Property:</b> the <b>general property</b> in goods, <b>not merely a special property</b>. <b>Quality of goods:</b> includes their <b>state or condition</b>.", "cases": [], "links": [{"l": "S.4: what a sale transfers", "m": 15, "sec": "S.4"}, {"l": "S.17: quality and fitness", "m": 16, "sec": "S.17"}, {"l": "S.19–26: passing of property", "m": 17, "sec": "S.19"}], "pidx": [0, 9, 10, 11], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(9) \"price\" means the money consideration for a sale of goods;", "l": 1}, {"t": "(10) \"property\" means the general property in goods, and not merely a special property;", "l": 1}, {"t": "(11) \"quality of goods\" includes their state or condition;", "l": 1}], "ills": []}]}, {"secs": ["2"], "code": "S.2(13), (14)", "term": "“Specific goods”; expressions defined in the Contract Act", "sub": "identified and agreed upon at contract; borrowed definitions", "hook": "Specific goods are the ones you pointed at when you made the deal.", "plain": "<b>Specific goods:</b> goods <b>identified and agreed upon at the time a contract of sale is made</b>. <b>Other expressions</b> used but not defined in this Act, and defined in the Contract Act, 1872, have the <b>meanings given there</b>.", "cases": [], "links": [{"l": "S.7–8: perishing of specific goods", "m": 15, "sec": "S.7"}, {"l": "S.19–21", "m": 17, "sec": "S.19"}, {"l": "S.3: Contract Act applies", "m": 15, "sec": "S.3"}], "pidx": [0, 13, 14], "blocks": [{"h": "S.2 Definitions", "paras": [{"t": "In this Act, unless there is anything repugnant in the subject or context,–", "l": 0}, {"t": "(13) \"specific goods\" means goods identified and agreed upon at the time a contract of sale is made; and", "l": 1}, {"t": "(14) expressions used but not defined in this act and defined in the Contract Act, 1872 (IX of 1872), have the meanings assigned to them in that Act.", "l": 1}], "ills": []}]}, {"secs": ["3"], "code": "S.3", "term": "Application of the Contract Act, 1872", "sub": "still applies unless inconsistent", "hook": "The Contract Act is the general law; this Act is the special law, and special beats general.", "plain": "The <b>unrepealed provisions of the Contract Act, 1872</b> continue to apply to contracts for the sale of goods, <b>save in so far as they are inconsistent</b> with the express provisions of this Act. So offer, acceptance, consideration, free consent, capacity, mistake and remedies for breach come from Part I of this app unless the Sale of Goods Act says otherwise.", "cases": [], "links": [{"l": "S.10–14 Contract Act: essentials", "m": 3, "sec": "S.10"}, {"l": "S.73 Contract Act: damages", "m": 11, "sec": "S.73"}], "blocks": [{"h": "S.3 Application of provisions of Act of 1872", "paras": [{"t": "The unrepealed provisions of the Contract Act, 1872 (IX of 1872), save in so far as they are inconsistent with the express provisions of this Act, shall continue to apply to contracts for the sale of goods.", "l": 0}], "ills": []}]}, {"secs": ["4"], "code": "S.4", "term": "Sale and agreement to sell", "sub": "transfer of property now (sale) or later (agreement to sell)", "hook": "A sale hands over ownership now; an agreement to sell promises it for later.", "plain": "<b>S.4(1):</b> a contract of sale of goods is a contract whereby the seller <b>transfers or agrees to transfer the property</b> in goods to the buyer <b>for a price</b>; there may be a sale between part-owners. <b>S.4(2):</b> it may be absolute or conditional. Where property is transferred at once, it is a <b>sale</b>; where transfer is at a <b>future time or on a later condition</b>, it is an <b>agreement to sell</b>. <b>S.4(3):</b> an agreement to sell <b>becomes a sale</b> when the time elapses or the conditions are fulfilled. A side-heading, “Formalities of the Contract”, was printed at the end of this section and is not part of its text.", "cases": [], "links": [{"l": "S.2(10): property", "m": 15, "sec": "S.2(9)–(11)"}, {"l": "S.19–26", "m": 17, "sec": "S.19"}, {"l": "S.56–57: remedies", "m": 20, "sec": "S.56"}], "exam": 1, "blocks": [{"h": "S.4 Sale and agreement to sell", "paras": [{"t": "(1) A contract of sale of goods is a contract whereby the seller transfers or agrees to transfer the property in goods to the buyer for a price. There may be a contract of sale between one part-owner and another.", "l": 1}, {"t": "(2) A contract of sale may be absolute or conditional Where under a contract of sale the property in the goods is transferred from the seller to the buyer, the contract is called a sale, but where the transfer of the property in the goods is to take place at a future time or subject to some condition thereafter to be fulfilled, the contract is called in agreement to sell.", "l": 1}, {"t": "(3) An agreement to sell becomes a sale when the time elapses or the conditions are fulfilled subject to which the property in the goods is to be transferred.", "l": 1}], "ills": []}]}, {"secs": ["5"], "code": "S.5", "term": "How a contract of sale is made", "sub": "offer and acceptance; no required form", "hook": "The usual rules of offer and acceptance apply; it may be written, spoken or inferred.", "plain": "<b>S.5(1):</b> a contract of sale is made by an <b>offer to buy or sell goods for a price and its acceptance</b>. Delivery and payment may be <b>immediate</b>, by <b>instalments</b>, or <b>postponed</b>. <b>S.5(2):</b> subject to any law in force, it may be <b>in writing, by word of mouth, partly both, or implied from conduct</b>. A side-heading, “Subject-matter of Contract”, was printed at the end of this section and is not part of its text.", "cases": [], "links": [{"l": "S.2(a)–(e) Contract Act", "m": 1, "sec": "S.2(a)"}, {"l": "S.9 Contract Act: promises express and implied", "m": 2, "sec": "S.9"}], "blocks": [{"h": "S.5 Contract of sale how made", "paras": [{"t": "(1) A contract of sale is made by an offer to buy or sell goods for a price and the acceptance of such offer. The contract may provide for the immediate delivery of the goods or immediate payment of the price or both, or for the delivery or payment by instalments, or that the delivery or payment or both shall be postponed.", "l": 1}, {"t": "(2) Subject to the provisions of any law for the time being in force a contract of sale may be made in writing or by word of mouth, or partly in writing and party by word of mouth or may be implied from the conduct of the parties.", "l": 1}], "ills": []}]}, {"secs": ["6"], "code": "S.6", "term": "Existing or future goods", "sub": "goods owned, to be acquired, or contingent", "hook": "You can sell what you do not yet have, but the sale operates as an agreement to sell.", "plain": "<b>S.6(1):</b> goods may be <b>existing</b> (owned or possessed by the seller) or <b>future</b>. <b>S.6(2):</b> a contract may be for goods whose acquisition by the seller <b>depends on a contingency</b>. <b>S.6(3):</b> where the seller <b>purports to effect a present sale of future goods</b>, the contract operates as an <b>agreement to sell</b>.", "cases": [], "links": [{"l": "S.2(5): future goods", "m": 15, "sec": "S.2(5), (6)"}, {"l": "S.4", "m": 15, "sec": "S.4"}, {"l": "S.24: unascertained or future goods", "m": 17, "sec": "S.24"}], "blocks": [{"h": "S.6 Existing or future goods", "paras": [{"t": "(1) The goods which form the subject of a contract of sale may be either existing goods, owned or possessed by the seller, or future goods.", "l": 1}, {"t": "(2) There may be a contract for the sale of goods the acquisition of which by the seller depends upon a contingency which may or may not happen.", "l": 1}, {"t": "(3) Where by a contract of sale the seller purports to effect a present sale of future goods, the contract operates as an agreement to sell the goods.", "l": 1}], "ills": []}]}, {"secs": ["7"], "code": "S.7", "term": "Goods perishing before the contract", "sub": "void if specific goods have perished without the seller’s knowledge", "hook": "If the goods were already gone when you signed, the contract never lived.", "plain": "Where there is a contract for the sale of <b>specific goods</b>, the contract is <b>void</b> if the goods, <b>without the seller’s knowledge</b>, have at the time of making <b>perished</b> or become so damaged as <b>no longer to answer to their description</b>. This is the sale-of-goods version of the mistake rule in S.20 of the Contract Act.", "cases": [{"n": "Couturier v Hastie", "c": "(1856) 5 HL Cas 673 (HL)", "t": "A cargo of corn was sold while it was already gone. There was nothing to sell, so the buyer was not liable. This is the case behind the rule in S.7.", "v": 1}, {"n": "McRae v Commonwealth Disposals Commission", "c": "(1951) 84 CLR 377 (High Court of Australia)", "t": "The buyers were promised a tanker wreck that never existed. They recovered damages, because the seller had promised the tanker existed and carried that risk; this distinguishes Couturier, where both parties shared the mistake.", "v": 1}], "links": [{"l": "S.20 Contract Act: mistake", "m": 4, "sec": "S.20"}, {"l": "S.8: perishing after agreement", "m": 15, "sec": "S.8"}], "exam": 1, "blocks": [{"h": "S.7 Goods perishing before making of contract", "paras": [{"t": "Where there is a contract for the sale of specific goods, the contract is void if the goods without the knowledge of the seller have, at the time when the contract was made, perished or become so damaged as no longer to answer to their description in the contract.", "l": 0}], "ills": []}]}, {"secs": ["8"], "code": "S.8", "term": "Goods perishing after agreement to sell but before risk passes", "sub": "agreement avoided if no fault by either party", "hook": "If the goods are destroyed through nobody’s fault before the risk passes, the agreement ends.", "plain": "Where there is an <b>agreement to sell specific goods</b> and, afterwards, the goods <b>perish or are so damaged as no longer to answer to their description</b>, <b>without fault of seller or buyer</b>, <b>before the risk passes to the buyer</b>, the agreement is <b>avoided</b>. A side-heading, “The Price”, was printed at the end of this section and is not part of its text.", "cases": [], "links": [{"l": "S.27: risk passes with property", "m": 17, "sec": "S.27"}, {"l": "S.56 Contract Act: impossibility", "m": 8, "sec": "S.56"}], "exam": 1, "blocks": [{"h": "S.8 Goods perishing before sale but after agreement to sell", "paras": [{"t": "Where there is an agreement to sell specific goods, and subsequently the goods without any fault on the part of the seller or buyer perish or become so damaged as no longer to answer to their description in the agreement before the risk passes to the buyer, the agreement is thereby avoided.", "l": 0}], "ills": []}]}, {"secs": ["9"], "code": "S.9", "term": "Ascertainment of price", "sub": "fixed by contract, by agreed method, by course of dealing; otherwise reasonable", "hook": "If the price is not fixed or fixable, the buyer pays a reasonable one.", "plain": "<b>S.9(1):</b> the price may be <b>fixed by the contract</b>, <b>left to be fixed in an agreed manner</b>, or determined by the <b>course of dealing</b>. <b>S.9(2):</b> otherwise, the buyer pays a <b>reasonable price</b>, which is a <b>question of fact</b> depending on the circumstances.", "cases": [{"n": "May and Butcher v R", "c": "[1934] 2 KB 17n (HL)", "t": "An agreement to sell tentage on terms to be agreed later was not a binding contract, because the price was left to future agreement. S.9 is the Act’s answer where the parties have an agreed method or a course of dealing.", "v": 2}], "links": [{"l": "S.29 Contract Act: uncertainty", "m": 5, "sec": "S.29"}, {"l": "S.10: valuation by third party", "m": 15, "sec": "S.10"}], "blocks": [{"h": "S.9 Ascertainment of price", "paras": [{"t": "(1) The price in a contract of sale may be fixed by the contract or may be left to be fixed in manner thereby agreed or may be determined by the course of dealing between the parties.", "l": 1}, {"t": "(2) Where the price is not determined in accordance with the foregoing provisions, the buyer shall pay the seller a reasonable price. What is a reasonable price is a question of fact dependent on the circumstances of each particular case.", "l": 1}], "ills": []}]}, {"secs": ["10"], "code": "S.10", "term": "Agreement to sell at valuation", "sub": "avoided if the third party fails; reasonable price if goods already appropriated", "hook": "If the valuer cannot value, the deal fails, unless the buyer already took and used the goods.", "plain": "<b>S.10(1):</b> where the price is to be fixed by <b>valuation of a third party</b> who cannot or does not value, the agreement is <b>avoided</b>; but if goods have been <b>delivered to and appropriated by the buyer</b>, he pays a <b>reasonable price</b>. <b>S.10(2):</b> if the third party is <b>prevented by the fault of seller or buyer</b>, the party not in fault may <b>sue for damages</b>. A side-heading, “Conditions and Warranties”, was printed at the end of this section and is not part of its text.", "cases": [], "links": [{"l": "S.9", "m": 15, "sec": "S.9"}, {"l": "S.73 Contract Act", "m": 11, "sec": "S.73"}], "blocks": [{"h": "S.10 Agreement to sell at valuation", "paras": [{"t": "(1) Where there is an agreement to sell goods on the terms that the price is to be fixed by the valuation of a third party and such third party cannot or does not make such valuation, the agreement is thereby avoided: Provided that, if the goods or any part have been delivered to and appropriated by the buyer, he shall pay a reasonable price thereof.", "l": 1}, {"t": "(2) Where such third party is prevented from making the valuation by the fault of the seller or buyer, the party not in fault may maintain a suit for damages against the party in fault.", "l": 1}], "ills": []}]}], "spar": [{"q": "A promises B in writing to “sell B my next harvest of wheat” at a price to be fixed. Is it a sale or an agreement to sell? Does the Act prevent the contract?", "a": "<b>An agreement to sell.</b> The harvest is <b>future goods</b> (S.2(5)), and a purported present sale of future goods operates as an agreement to sell (S.6(3)). Property cannot pass until the goods exist and are appropriated (Module 17). The price rule is S.9: fixed, fixable by method or dealing, or reasonable. The Act does not forbid the contract."}, {"q": "A sells B a specific car. Unknown to A, it was destroyed in a fire the night before. Is the contract binding? What if the fire happened after the contract but before delivery?", "a": "<b>Before the contract: void</b> under S.7 (specific goods, perished without the seller’s knowledge). <b>After the agreement to sell, before the risk passes, with no fault: avoided</b> under S.8. If <b>risk had already passed</b>, S.8 does not apply and the buyer bears the loss (S.27). So the question is always: when did the goods perish, and who held the risk?"}, {"q": "A sells B 100 bags of rice at “a fair price” without fixing it. B refuses to pay anything above Rs 1,000. What does the Act say?", "a": "S.9(2): where the price is not otherwise determined, B pays a <b>reasonable price</b>, and what that is is <b>a question of fact</b> on the circumstances. If it were an agreement to sell at a third party’s valuation and the valuer failed, S.10 would avoid it unless the goods were appropriated by B. <b>Open to argument:</b> whether “fair price” reads as fixing a method or leaves it to S.9(2)."}, {"q": "Why does the Sale of Goods Act say the Contract Act still applies? Give an example of something answered by the Contract Act.", "a": "S.3 makes the Contract Act the <b>background law</b> unless inconsistent with express provisions of this Act. Example: whether B’s consent was free (S.14–22 of the Contract Act, Module 4) or whether B had capacity (S.11). The Sale of Goods Act itself says little on those points."}]}, "16": {"n": 16, "intro": "the terms the Act treats as conditions and warranties. S.11 deals with time; S.12–13 draw the line between condition and warranty; S.14–15 imply undertakings as to title; S.16 implies correspondence with description; S.16-A imposes a disclosure duty; S.17 implies fitness and merchantable quality; S.18 covers sale by sample.", "boundary": "<b>Boundary.</b> Formation of the sale is Module 15. Passing of property, risk and title is Module 17. Remedies for breach of condition or warranty are in Modules 19–20.", "recall": "<b>Quick recall</b><b>Condition</b> = reject + repudiate; <b>warranty</b> = damages only (S.12). Accepting goods in a non-severable contract turns a condition into a warranty (S.13(2)). Implied terms: <b>title</b> (S.14), <b>description</b> (S.16), <b>fitness and merchantable quality</b> (S.17), <b>sample</b> (S.18). S.16-A: <b>disclose defects</b>.", "rails": [{"secs": ["11"], "code": "S.11", "term": "Stipulations as to time", "sub": "payment time not of the essence unless intended; other time terms depend on the contract", "hook": "In sales, a late payment is not a deal-breaker unless the contract says so.", "plain": "Unless a different intention appears, <b>stipulations as to time of payment are not of the essence</b> of a contract of sale. Whether <b>any other stipulation as to time</b> is of the essence depends on the <b>terms of the contract</b>.", "cases": [], "links": [{"l": "S.55 Contract Act: time of the essence", "m": 7, "sec": "S.55"}, {"l": "S.12: condition or warranty", "m": 16, "sec": "S.12"}], "blocks": [{"h": "S.11 Stipulation as to time", "paras": [{"t": "Unless a different intention appears from the terms of the contract, stipulations as to time of payment are not deemed to be of the essence of a contract of sale. Whether any other stipulation as to time is of the essence of the contract or not depends on the terms of the contract.", "l": 0}], "ills": []}]}, {"secs": ["12"], "code": "S.12", "term": "Condition and warranty", "sub": "repudiation versus damages", "hook": "A condition goes to the root: break it and you may walk away. A warranty is a side promise: break it and you only claim damages.", "plain": "<b>S.12(1):</b> a stipulation about the goods may be a <b>condition</b> or a <b>warranty</b>. <b>S.12(2):</b> a <b>condition</b> is a stipulation <b>essential to the main purpose</b> of the contract; breach gives a right to treat the contract as <b>repudiated</b>. <b>S.12(3):</b> a <b>warranty</b> is <b>collateral</b> to the main purpose; breach gives a claim for <b>damages</b> but not a right to reject the goods and treat the contract as repudiated. <b>S.12(4):</b> which it is depends on <b>construction of the contract</b>; a stipulation <b>may be a condition though called a warranty</b>. The printed text of S.12(1) reads “condition of a warranty”, evidently for “or a warranty”; kept as printed.", "cases": [{"n": "Poussard v Spiers and Pond", "c": "(1876) 1 QBD 410 (QB)", "t": "A singer’s absence from the opening nights was a breach going to the root of the contract, which discharged the other side. A familiar example of a condition-type term in a contract of service.", "v": 1}], "links": [{"l": "S.13: condition treated as warranty", "m": 16, "sec": "S.13"}, {"l": "S.39 Contract Act: refusal to perform", "m": 7, "sec": "S.39"}], "exam": 1, "blocks": [{"h": "S.12 Condition and warranty", "paras": [{"t": "(1) A stipulation in a contract of sale with reference to goods which are the subject thereof may be a condition of a warranty.", "l": 1}, {"t": "(2) A condition is a stipulation essential to the main purpose of the contract, the breach of which gives rise to a right to treat the contact as repudiated.", "l": 1}, {"t": "(3) A warranty is a stipulation collateral to the main purpose of the contract, the breach of which gives rise to claim for damages but not to a right to reject the goods and treat the contract as repudiated.", "l": 1}, {"t": "(4) Whether a stipulation in contract of sale is a condition or a warranty depends in each cease on the construction of the contract. A stipulation may be a condition, though called a warranty in the contract.", "l": 1}], "ills": []}]}, {"secs": ["13"], "code": "S.13", "term": "When a condition is treated as a warranty", "sub": "waiver, election, acceptance of non-severable contract", "hook": "The buyer who accepts the goods may lose the right to reject.", "plain": "<b>S.13(1):</b> where the seller must fulfil a condition, the buyer may <b>waive</b> it or <b>elect to treat the breach as a breach of warranty</b>. <b>S.13(2):</b> where a contract is <b>not severable</b> and the buyer <b>has accepted the goods or part</b>, breach of a condition by the seller can <b>only be treated as breach of warranty</b>, unless a term of the contract, express or implied, says otherwise. <b>S.13(3):</b> nothing affects a condition or warranty whose fulfilment is <b>excused by law</b> by reason of impossibility or otherwise.", "cases": [], "links": [{"l": "S.12", "m": 16, "sec": "S.12"}, {"l": "S.43: acceptance", "m": 18, "sec": "S.42–44"}, {"l": "S.57–58: damages", "m": 20, "sec": "S.57–58"}], "exam": 1, "blocks": [{"h": "S.13 When condition to be treated as warranty", "paras": [{"t": "(1) Where a contract of sale is subject to any condition to be fulfilled by the seller, the buyer may waive the condition or elect to treat the breach of the condition as a breach of warranty and not as a ground for treating the contract as repudiated.", "l": 1}, {"t": "(2) Where a contract of sale is not severable and the buyer has accepted the goods are part thereof *** the breach of any condition to be fulfilled by the seller can only be treated as a breach of warranty and not as a ground for rejecting the goods and treating the contract as repudiated, unless there is a term of the contract, express or implied, to that effect.", "l": 1}, {"t": "(3) Nothing in this section shall affect the case of any condition or warranty fulfilment of which is excused by law by reason of impossibility or otherwise.", "l": 1}], "ills": []}]}, {"secs": ["14", "15"], "code": "S.14–15", "term": "Implied undertakings as to title, quiet possession and freedom from encumbrance", "sub": "seller’s right to sell; buyer’s quiet possession; no undeclared charges", "hook": "The seller promises that the goods are his to sell, that you can enjoy them, and that no one else has a charge on them.", "plain": "<b>S.14:</b> unless a different intention appears, there is <b>(a)</b> an implied <b>condition</b> that the seller has a <b>right to sell</b> the goods (or, in an agreement to sell, will have it when property is to pass). <b>S.15 as printed</b> (headed “The words and comma”) then contains two implied <b>warranties</b>: <b>(a)</b> the buyer shall have and enjoy <b>quiet possession</b>; <b>(b)</b> the goods shall be <b>free from any charge or encumbrance</b> in favour of a third party not declared or known to the buyer at the time of contract. <b>Flag:</b> the printed S.15 has a note that words were omitted by the 1962 Ordinance and appears to be the continuation of S.14; this is the supplied text’s numbering and heading, not my reading of what the law should say. Check against an official copy before relying on section numbers.", "cases": [{"n": "Rowland v Divall", "c": "[1923] 2 KB 500 (CA)", "t": "A buyer who used a car for months, then lost it because it was stolen, could recover the whole price. The seller had no right to sell, so the buyer got none of what he had paid for.", "v": 1}], "links": [{"l": "S.28–30: sale by non-owner", "m": 17, "sec": "S.28"}, {"l": "S.12", "m": 16, "sec": "S.12"}, {"l": "S.65 Contract Act: restitution", "m": 9, "sec": "S.65"}], "exam": 1, "blocks": [{"h": "S.14 Implied undertaking, as to title, etc.", "paras": [{"t": "In a contract of sale, unless the circumstances of the contract are such as to show a different intention there is–", "l": 0}, {"t": "(a) an implied condition on the part of the seller that, in the case of sale, he has a right to sell the goods and that, in the case of an agreement to sell, he will have a right to sell the goods at the time when the property is to pass;", "l": 1}], "ills": []}, {"h": "S.15 The words and comma", "paras": [{"t": "\"or where the contract is for specific goods the property in which has passed to the buyer,\"", "l": 0}, {"t": "(a) an implied warranty that the buyer shall have and enjoy quiet possession of the goods;", "l": 1}, {"t": "(b) an implied warranty that the goods shall be free from any charge or encumbrance in favour of any third party not declared or known to the buyer before or at the time when the contract is made.", "l": 1}], "ills": []}]}, {"secs": ["16"], "code": "S.16", "term": "Sale by description", "sub": "implied condition that goods correspond with description", "hook": "If you buy it by description, it must be what the description says, even if the bulk matches the sample.", "plain": "Where goods are sold <b>by description</b>, there is an implied <b>condition</b> that the goods <b>correspond with the description</b>. If the sale is <b>by sample as well as by description</b>, it is <b>not sufficient</b> that the bulk corresponds with the sample if the goods do not also correspond with the description.", "cases": [{"n": "Arcos v Ronaasen", "c": "[1933] AC 470 (HL)", "t": "Staves ordered to a stated thickness were slightly thicker. The buyers could reject them even though the staves were still usable for their purpose; strict correspondence with description is required.", "v": 1}, {"n": "Beale v Taylor", "c": "[1967] 1 WLR 1193 (CA)", "t": "A car assembled from two cars did not correspond with its description, so partial correspondence was not enough.", "v": 1}, {"n": "Varley v Whipp", "c": "[1900] 1 QB 513 (QB)", "t": "A buyer who had not seen the machine relied on the seller’s description; the sale was by description.", "v": 1}], "links": [{"l": "S.16-A: duty to inform of defects", "m": 16, "sec": "S.16-A"}, {"l": "S.17", "m": 16, "sec": "S.17"}, {"l": "S.18: sample", "m": 16, "sec": "S.18"}], "exam": 1, "blocks": [{"h": "S.16 Sale by description 16-A. Seller to inform buyer to defect in goods sold", "paras": [{"t": "Where there is a contract for the sale of goods by description there is an implied condition that the goods shall correspond with the description; and, if the sale is by sample as well as by description, it is not sufficient that the bulk of the goods corresponds with the sample if the goods do not also correspond with the description.", "l": 0}], "ills": []}]}, {"secs": ["16-A"], "code": "S.16-A", "term": "Seller to inform buyer of defects", "sub": "duty to disclose defects not obvious to buyer", "hook": "Under the Pakistani amendment, a seller must tell the buyer about defects in the goods, unless the buyer already knows.", "plain": "Notwithstanding S.16, and <b>save where the parties agree to the contrary</b>, the seller is under an <b>obligation to inform the buyer of any defect in the goods</b> at the time of contract, <b>except where the defect is obviously known to the buyer</b>. The printed footnote says S.16-A was <b>inserted by the Sale of Goods (Amendment) Act (XVIII of 1994)</b>, with effect from 23-10-1994. It sets a disclosure duty beyond the traditional caveat emptor position.", "cases": [], "links": [{"l": "S.16", "m": 16, "sec": "S.16"}, {"l": "S.150 Contract Act: bailor’s duty to disclose", "m": 13, "sec": "S.150"}, {"l": "S.143 Contract Act: concealment in guarantee", "m": 12, "sec": "S.142–143"}], "blocks": [{"h": "S.16-A Seller to inform buyer to defect in goods sold", "paras": [{"t": "Notwithstanding anything contained in section 16, and save where the parties have entered into a agreement to the contrary, the seller shall be under an obligation to inform the buyer of any defect in the goods sold at the time of the contract, except in a case where the defect the defect is obviously known to the buyer.]", "l": 0}], "ills": []}]}, {"secs": ["17"], "code": "S.17", "term": "Implied conditions as to quality or fitness", "sub": "no implied terms except these four", "hook": "Caveat emptor is the rule, and the Act lists the exceptions: fitness, merchantable quality, usage of trade, and the effect of express terms.", "plain": "There is <b>no implied warranty or condition</b> as to quality or fitness for a particular purpose except as follows. <b>(1) Fitness:</b> where the buyer makes known, expressly or by implication, the <b>particular purpose</b> and <b>relies on the seller’s skill or judgment</b>, and the goods are of a description the seller <b>supplies in the course of business</b>, there is an implied condition that the goods are <b>reasonably fit</b> (proviso: a <b>specified article under a patent or trade name</b> carries no fitness condition). <b>(2) Merchantable quality:</b> goods bought <b>by description from a seller who deals in goods of that description</b> must be of <b>merchantable quality</b>; if the buyer has <b>examined</b> the goods, no implied condition as to defects the examination <b>ought to have revealed</b>. <b>(3) Usage of trade</b> may annex an implied term. <b>(4)</b> an express term does not negate an implied term <b>unless inconsistent</b>.", "cases": [{"n": "Grant v Australian Knitting Mills", "c": "[1936] AC 85 (PC)", "t": "A buyer got dermatitis from woollen underwear that contained a chemical left by the manufacturer. The goods were unfit for the purpose and not of merchantable quality, even though the buyer had not stated the purpose specifically, since wearing underwear was the obvious use.", "v": 1}], "links": [{"l": "S.16", "m": 16, "sec": "S.16"}, {"l": "S.16-A", "m": 16, "sec": "S.16-A"}, {"l": "S.18", "m": 16, "sec": "S.18"}], "exam": 1, "blocks": [{"h": "S.17 Implied conditions as to quality or fitness", "paras": [{"t": "Subject to the provisions of this Act and of any other law for the time being in force, thee is no implied warranty or condition as to the quality or fitness for any particular purpose of goods supplied under a contract of sale, except as follows:–", "l": 0}, {"t": "(1) Where the buyer, expressly or by implication, makes known to the seller the particular purpose for which the goods are required, so as to show that the buyer relies on the seller's skill or judgment, and the goods are of a description which it is in the course of the seller's business to supply (whether he is the manufacturer or products or not), there is an implied condition that the goods shall be reasonably fit for such purposes: Provided that, in the case of a contract for the sale of a specified article under its patent or other trade name, there is no implied condition as to its fitness for any particular purpose", "l": 1}, {"t": "(2) Where goods are bought by description from a seller who deals in goods of that description (whether he is the manufacturer or producer or not), there is an implied condition that the goods shall be of merchantable quality: Provided that, if the buyer has examined the goods, there shall be no implied condition as regards defects which such examination ought to have revealed.", "l": 1}, {"t": "(3) An implied warranty or condition as to quality or fitness for a particular purpose may be annexed by the usage of trade.", "l": 1}, {"t": "(4) An express warranty or condition does not negative a warranty or condition implied by this Act unless inconsistent therewith.", "l": 1}], "ills": []}]}, {"secs": ["18"], "code": "S.18", "term": "Sale by sample", "sub": "bulk must correspond; opportunity to compare; no hidden defects", "hook": "A sample is a promise about the whole bulk.", "plain": "<b>S.18(1):</b> a contract is for sale <b>by sample</b> where a term, express or implied, says so. <b>S.18(2):</b> there are implied conditions that (a) the <b>bulk shall correspond with the sample in quality</b>; (b) the buyer shall have a <b>reasonable opportunity of comparing</b> the bulk with the sample; (c) the goods shall be <b>free from any defect rendering them unmerchantable</b> that would not be apparent on reasonable examination of the sample. The printed text of (a) reads “inquality”; kept as printed.", "cases": [], "links": [{"l": "S.16", "m": 16, "sec": "S.16"}, {"l": "S.17(2)", "m": 16, "sec": "S.17"}, {"l": "S.42: examination", "m": 18, "sec": "S.42–44"}], "blocks": [{"h": "S.18 Sale by sample", "paras": [{"t": "(1) A contract of sale is a contract for sale by sample where there is a term in the contract, express or implied, to that effect.", "l": 1}, {"t": "(2) In the case of a contract for sale by sample there is an implied condition–", "l": 1}, {"t": "• That the bulk shall correspond with the sample inquality;", "l": 1}, {"t": "• that the buyer shall have a reasonable opportunity of comparing the bulk with the sample;", "l": 1}, {"t": "• that the goods shall be free from any defect, rendering them unmerchantable which would not be apparent on reasonable examination of the sample.", "l": 1}], "ills": []}]}], "spar": [{"q": "A buys a second-hand car from B, a dealer, “as described in your advertisement: a 1990 model, good condition”. It turns out to be a 1985 model. What are A’s rights? Compare a defect A could have seen.", "a": "<b>Sale by description</b> (S.16): the car must correspond with the description; the implied term is a <b>condition</b> (S.12(2)), so A may <b>reject and treat the contract as repudiated</b>, unless S.13 blocks him (he has accepted a non-severable contract). The seller’s separate duty to inform of defects is in S.16-A. For a defect A <b>examined and ought to have seen</b>, S.17(2) proviso removes the merchantable-quality condition; it does not touch S.16."}, {"q": "A buys a washing machine from B, telling B it will be used in a hospital. It breaks down in a week. Which implied condition, and what must A show?", "a": "<b>S.17(1), fitness for purpose.</b> A must show: (i) the <b>particular purpose</b> was made known; (ii) A <b>relied on B’s skill or judgment</b>; (iii) the goods are of a type B supplies in the course of business. The proviso excludes purchases under a patent or trade name. If those are shown, the implied condition is that the goods are <b>reasonably fit</b>; breach lets A reject unless S.13 intervenes. <b>Open to argument:</b> how courts treat reliance when the buyer chose by brand."}, {"q": "A buys “1,000 sacks of basmati like this sample”. The bulk is of a lower quality. B says A should have inspected it. Is A out of luck?", "a": "<b>No.</b> S.18(2): in a sale by sample there is an implied <b>condition</b> that the bulk corresponds with the sample in quality and that the buyer has a reasonable opportunity to compare. A <b>may reject</b> subject to S.13 (waiver or acceptance of a non-severable contract). A buyer’s duty to inspect arises under the proviso to S.17(2) only for defects an examination <b>ought to have revealed</b>."}, {"q": "The seller, unaware of a lien on the goods, sells them. What implied terms does the Act give the buyer, and what kind of terms are they?", "a": "S.14(a): an implied <b>condition</b> that the seller has the <b>right to sell</b>. As printed, S.15 adds two implied <b>warranties</b>: <b>quiet possession</b> and <b>freedom from undeclared encumbrance</b>. A third-party charge unknown to the buyer breaches the second warranty: damages only, unless the facts also show a failure of title, which is a condition. <b>Flag:</b> the section numbering of the supplied text is unusual; check it."}, {"q": "Under the Act, is a late payment by the buyer a ground for the seller to cancel the sale?", "a": "<b>Not by default.</b> S.11: stipulations as to time of payment are <b>not of the essence</b> unless a different intention appears. Other time stipulations (delivery date, say) depend on the contract. Compare S.55 of the Contract Act (Module 7), which makes time essential in a different way."}]}, "17"
