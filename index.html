ble.", "l": 0}, {"t": "[*******]", "l": 0}]}]}, {"secs": ["22"], "code": "S.22", "term": "Contract caused by mistake of one party as to matter of fact", "sub": "unilateral mistake alone does not make it voidable", "hook": "“Merely” is the whole section: one party’s private error is not a ticket out.", "plain": "A contract is <b>not voidable merely</b> because <b>one</b> party was mistaken about a fact. The mistake must be coupled with something more (e.g. misrepresentation or fraud by the other party, S.17–19), or fall under S.20 (both mistaken). One short sentence, but it caps how far unilateral mistake can go.", "cases": [{"n": "Smith v Hughes", "c": "(1871) LR 6 QB 597 (QB)", "t": "A buyer thought the oats were old and the seller delivered new ones. The seller had not misled him, so the buyer’s private mistake as to quality did not avoid the contract.", "v": 1}], "links": [{"l": "S.20: bilateral mistake", "m": 4, "sec": "S.20"}, {"l": "S.19: when misrepresentation or fraud adds more", "m": 4, "sec": "S.19"}], "feeds": "Free consent", "blocks": [{"h": "S.22 Contract caused by mistake of one party as to matter of fact.", "paras": [{"t": "A contract is not voidable merely because it was caused by one of the parties to it being under a mistake as to a matter of fact.", "l": 0}], "ills": []}]}], "spar": [{"q": "A refuses to hand back B’s motorcycle, which he holds as security for a debt already paid, until B signs a new agreement. B signs and later wants out. Under which limb of S.15, and what is B’s remedy under S.19?", "a": "<b>S.15, second limb:</b> “the unlawful detaining, or threatening to detain, any property” with the intention of causing a person to enter into an agreement. Once the debt is paid, A’s continued detention is unlawful. <b>S.19:</b> the agreement is a contract voidable at B’s option. B may rescind it (and see S.64 on what follows). <i>Open to argument</i> whether the debt really was discharged; the answer turns on that fact."}, {"q": "A is B’s village money-lender. B, already in debt, takes a fresh loan on terms that look unconscionable. In a separate case, a banker lends to C at a very high rate during a money-market squeeze. Why does S.16 treat them differently?", "a": "<b>Illustration (c) vs (d).</b> In (c) the money-lender is in a position to dominate the will of an indebted villager (S.16(2)), and the terms look unconscionable, so under S.16(3) the burden shifts: <b>A must prove the contract was not induced by undue influence</b>. In (d) the banker holds no domination over C; he is simply pricing a tight market, so it is an ordinary commercial bargain and <b>not</b> undue influence. The difference is the <i>relationship</i>, not the interest rate alone."}, {"q": "Three sellers say nothing about a defect: (1) at an auction, to a stranger; (2) to his own daughter, just of age; (3) to a buyer who said “If you do not deny it, I shall assume the horse is sound.” In which is the silence fraud?", "a": "<b>(1) Not fraud</b> (illustration (a) to S.17): no duty to speak. <b>(2) Fraud</b>, because the relationship makes it the seller’s <b>duty to speak</b> (illustration (b)). <b>(3) Fraud</b>, because the silence is “in itself, equivalent to speech” (illustration (c)). Mere silence is not fraud; silence plus a duty to speak, or silence as speech, is."}, {"q": "A misrepresents an indigo factory’s output. B could have checked the accounts but did not. In another case A <i>fraudulently</i> conceals a vein of ore. May B avoid the contract in each? Read the Exception to S.19 closely.", "a": "<b>First case:</b> the Exception removes voidability where consent was caused by <b>misrepresentation</b> (or fraudulent <b>silence</b>) and the party had the <b>means of discovering the truth with ordinary diligence</b>; B’s remedy fails. <b>Second case:</b> illustration (d) to S.19 shows active concealment of the vein of ore makes the contract voidable at A’s option; the Exception, as worded, names only misrepresentation and fraudulent silence, not active fraud. <i>Open to argument</i> how far a court would stretch the Exception to active fraud."}, {"q": "Classify: (1) both parties believe a horse is alive; it was dead; (2) both overestimate the value of a painting; (3) both wrongly believe a debt is barred by the Pakistani law of limitation.", "a": "<b>(1) Void under S.20</b> (illustration (b)): mistake of fact essential to the agreement. <b>(2) Valid:</b> the Explanation to S.20 says an erroneous opinion as to <b>value</b> is not a mistake of fact. <b>(3) Not voidable under S.21:</b> mistake as to a law in force in Pakistan (illustration: debt barred by the law of limitation). A mistake as to <i>foreign</i> law would be treated as one of fact."}]}, "5": {"n": 5, "intro": "The second half of S.10’s recipe: which consideration and objects are lawful (S.23, S.24), when no consideration is fatal (S.25), and the list of agreements the Act expressly declares void: restraint of marriage, trade and legal proceedings, uncertain agreements, and wagers.", "boundary": "<b>Boundary.</b> S.2(d) (what consideration is) sits in Module 1; this module covers when its absence or unlawfulness is fatal. S.56–58, which deal with impossible and partly illegal acts, sit in Module 8.", "recall": "<b>Quick recall</b>Lawful consideration and object (S.23) · unlawful in part spoils all (S.24) · no consideration void, except love + writing + registration, past voluntary service, time-barred debt in writing (S.25) · express voids: marriage (S.26), trade (S.27), legal proceedings (S.28), uncertainty (S.29), wagers (S.30–30C).", "rails": [{"secs": ["23"], "code": "S.23", "term": "What considerations and objects are lawful", "sub": "five grounds of unlawfulness; unlawful means void", "hook": "Two things must be clean: what is paid, and what it is paid for. If either is dirty the agreement is void.", "plain": "Consideration <b>or</b> object is <b>unlawful</b> if it: (1) is <b>forbidden by law</b>; (2) would, if permitted, <b>defeat the provisions of any law</b>; (3) is <b>fraudulent</b>; (4) <b>involves or implies injury</b> to the person or property of another; or (5) the Court regards it as <b>immoral or opposed to public policy</b>. <b>Consequence:</b> every agreement with an unlawful object or consideration is <b>void</b>. The first illustrations (a)–(d) show lawful consideration; (e)–(k) show void ones: fraud-sharing, buying public-service jobs, secret commissions, compounding a robbery prosecution, evading a statutory bar, a mukhtar selling influence, and concubinage (void as immoral even if not punishable).", "cases": [], "links": [{"l": "S.10: lawful consideration and object", "m": 3, "sec": "S.10"}, {"l": "S.24: unlawful in part", "m": 5, "sec": "S.24"}], "ess": "Lawful consideration and object", "exam": 1, "blocks": [{"h": "S.23 What considerations and objects are lawful and what not.", "paras": [{"t": "The consideration or object of an agreement is lawful, unless- it is forbidden by law; or is of such a nature that, if permitted, it would defeat the provisions of any law; or is fraudulent; or involves or implies injury to the person or property of another; or the Court regards it as immoral, or opposed to public policy.", "l": 0}, {"t": "In each of these cases, the consideration or object of an agreement is said to be unlawful. Every agreement of which the object or consideration is unlawful is void.", "l": 0}], "ills": [{"t": "(a) A agrees to sell his house to B for 10,000 Rupees. Here B's promise to pay the sum of 10,000 Rupees is the consideration for A's promise to sell the house, and A's promise to sell the house is the consideration for B's promise to pay the 10,000 Rupees. These are lawful considerations.", "l": 0}, {"t": "(b) A promises to pay B 1,000 Rupees at the end of six months; if C, who owes that sum to B, fails to pay it. B promises to grant time to C accordingly. Here the promise of each party is the consideration for the promise of the other party and they are lawful considerations.", "l": 0}, {"t": "(c) A promises, for a certain sum paid to him by B, to make good to B the value of his ship if it is wrecked on a certain voyage. Here A's promise is the consideration for B's payment and B's payment is the consideration for A's promise and these are lawful considerations.", "l": 0}, {"t": "(d) A promises to maintain B's child and B's promises to pay A 1,000 Rupees yearly for the purpose. Here the promise of each party is the consideration for the promise of the other party. They are lawful considerations.", "l": 0}, {"t": "(e) A, B and C enter into an agreement for the division among them of gains acquired, or to be acquired, by them by fraud. The agreement is void, as its object is unlawful.", "l": 0}, {"t": "(f) A promises to obtain for B an employment in the public service, and B promises to pay 1,000 Rupees to A. The agreement is void, as the consideration for it is unlawful.", "l": 0}, {"t": "(g) A, being agent for a landed proprietor, agrees for money, without the knowledge of his principal, to obtain for B a lease of land belonging to his principal. The agreement between A and B is void, as it implies a fraud by concealment by A, on his principal.", "l": 0}, {"t": "(h) A promises B to drop a prosecution which he has instituted against B for robbery, and B promises to restore the value of the things taken. The agreement is void, as its object is unlawful.", "l": 0}, {"t": "(i) A's estate is sold for arrears of revenue under the provisions of an Act of the Legislature, by which the defaulter is prohibited from purchasing the estate. B, upon an understanding with A, becomes the purchaser, and agrees to convey the estate to A upon receiving from him the price which B has paid. The agreement is void, as it renders the transaction, in effect, a purchase by the defaulter, and would so defeat the object of the law.", "l": 0}, {"t": "(j) A, who is B's mukhtar, promises to exercise his influence, as such, with B in favour of C, and C promises to pay 1,000 Rupees to A. The agreement is void, because it is immoral.", "l": 0}, {"t": "(k) A agrees to let her daughter to hire to B for concubinage. The agreement is void, because it is immoral, though the letting may not be punishable under the Pakistan Penal Code.", "l": 0}]}]}, {"secs": ["24"], "code": "S.24", "term": "Agreements void if considerations and objects unlawful in part", "sub": "one bad part spoils the agreement", "hook": "One rotten apple, and the Act throws out the whole basket.", "plain": "If <b>any part</b> of a single consideration for one or more objects, or any one or part of several considerations for a single object, is unlawful, the <b>whole agreement is void</b>. The illustration joins a legal indigo business with illegal traffic for one salary: void. Contrast the severability rule for reciprocal promises in S.57–58 (Module 8).", "cases": [], "links": [{"l": "S.57–58: severable promises (Module 8)", "m": 8, "sec": "S.57"}, {"l": "S.23: unlawful consideration or object", "m": 5, "sec": "S.23"}], "feeds": "Lawful object; Not expressly void", "blocks": [{"h": "S.24 Agreements void, if considerations and objects unlawful in part.", "paras": [{"t": "If any part of a single consideration for one or more objects, or any one or any part of any one of several considerations for a single object, is unlawful, the agreement is void.", "l": 0}], "ills": [{"t": "A promises to superintend, on behalf of B, a legal manufacture of indigo, and an illegal traffic in other articles. B promises to pay to A a salary of 10,000 Rupees a year. The agreement is void, the object of A's promise and the considerations for B's promise being in part unlawful.", "l": 0}]}]}, {"secs": ["25"], "code": "S.25", "term": "Agreement without consideration void, unless…", "sub": "three exceptions, plus two Explanations", "hook": "No price, no promise, except for love, gratitude and old debts.", "plain": "General rule: <b>no consideration = void</b>. Three exceptions where it <b>is a contract</b>: (1) <b>natural love and affection</b> between parties in a <b>near relation</b>, expressed in <b>writing and registered</b>; (2) a promise to <b>compensate</b> a person who has <b>already voluntarily done</b> something for the promisor, or something the promisor was <b>legally compellable</b> to do (illustrations: finding a purse; supporting an infant son); (3) a <b>written, signed</b> promise to pay a <b>time-barred debt</b>, wholly or in part. <b>Explanation 1:</b> completed gifts are not affected. <b>Explanation 2:</b> inadequacy of consideration does not make an agreement void if consent was free, though a court may weigh it when deciding whether consent was free (illustrations (f), (g): horse worth Rs 1,000 sold for Rs 10).", "cases": [], "links": [{"l": "S.2(d): consideration defined", "m": 1, "sec": "S.2(d)"}, {"l": "S.19: free consent and inadequacy", "m": 4, "sec": "S.19"}], "feeds": "Lawful consideration; Not expressly void", "exam": 1, "blocks": [{"h": "S.25 Agreement without consideration void, unless it is in writing and registered, or is a promise to compensate for something done, or is a promise to pay a debt barred by limitation law.", "paras": [{"t": "An agreement made without consideration is void, unless–", "l": 0}, {"t": "(1) it is expressed in writing and registered under the law for the time being in force for the registration of [documents], and is made on account of natural love and affection between parties standing in a near relation to each other; or unless", "l": 1}, {"t": "(2) it is a promise to compensate, wholly or in part, a person who has already voluntarily done something for the promisor, or something which the promisor was legally compellable to do; or unless", "l": 1}, {"t": "(3) it is a promise, made in writing and signed by the person to be charged therewith, or by his agent generally or specially authorized in that behalf, to pay wholly or in part a debt of which the creditor might have enforced payment but for the law for the limitation of suits.", "l": 1}, {"t": "In any of these cases, such an agreement is a contract.", "l": 0}, {"t": "Explanation 1.– Nothing in this section shall affect the validity, as between the donor and donee, of any gift actually made.", "l": 0}, {"t": "Explanation 2.– An agreement to which the consent of the promisor is freely given is not void merely because the consideration is inadequate; but the inadequacy of the consideration may be taken into account by the Court in determining the question whether the consent of the promisor was freely given.", "l": 0}], "ills": [{"t": "(a) A promises, for no consideration, to give to B Rupees 1,000. This is a void agreement.", "l": 0}, {"t": "(b) A, for natural love and affection, promises to give his son, B, Rupees 1,000. A puts his promise to B into writing and registers it. This is a contract.", "l": 0}, {"t": "(c) A finds B's purse and gives it to him. B promises to give A Rupees 50. This is a contract.", "l": 0}, {"t": "(d) A supports B's infant son. B promises to pay A's expenses in so doing. This is a contract.", "l": 0}, {"t": "(e) A owes B Rupees 1,000, but the debt is barred by the Limitation Act. A signs a written promise to pay B Rupees 500 on account of the debt. This is a contract.", "l": 0}, {"t": "(f) A agrees to sell a horse worth Rupees 1,000 for Rupees 10. A's consent to the agreement was freely given. The agreement is a contract notwithstanding the inadequacy of the consideration.", "l": 0}, {"t": "(g) A agrees to sell a horse worth Rupees 1,000 for Rupees 10. A denies that his consent to the agreement was freely given. The inadequacy of the consideration is a fact which the Court should take into account in considering whether or not A's consent was freely given.", "l": 0}]}]}, {"secs": ["26"], "code": "S.26", "term": "Agreement in restraint of marriage void", "sub": "every person other than a minor", "hook": "A promise never to marry is a promise the law will not keep.", "plain": "<b>Every</b> agreement in restraint of the marriage of <b>any person other than a minor</b> is void. Note the carve-out: the section does not strike down restraints on a <b>minor’s</b> marriage. The text prints “restrain” for “restraint” in one place; kept as in the source.", "cases": [], "links": [{"l": "S.23: public policy", "m": 5, "sec": "S.23"}], "feeds": "Not expressly void", "blocks": [{"h": "S.26 Agreement in restraint of marriage void.", "paras": [{"t": "Every agreement in restrain of the marriage of any person, other than a minor, is void.", "l": 0}], "ills": []}]}, {"secs": ["27"], "code": "S.27", "term": "Agreement in restraint of trade void", "sub": "void “to that extent”; goodwill exception", "hook": "You may sell your shop and its name, but not your right to earn a living.", "plain": "Any agreement restraining a person from a <b>lawful profession, trade or business</b> is <b>void to that extent</b>. <b>Exception 1:</b> one who <b>sells the goodwill</b> of a business may agree not to carry on a <b>similar business within specified local limits</b>, so long as the buyer (or his successor) carries on a like business there, and the limits appear <b>reasonable to the Court</b>. The Act has no general “reasonableness” defence outside this Exception. The second Exception is shown as “[* * *]” (repealed).", "cases": [{"n": "Nordenfelt v Maxim Nordenfelt Guns and Ammunition Co", "c": "[1894] AC 535 (HL)", "t": "A worldwide 25-year restraint on the seller of a business was upheld as reasonable between the parties, because of the large price paid for the goodwill. The unreasonable parts could be severed.", "v": 1}], "links": [{"l": "S.23: public policy", "m": 5, "sec": "S.23"}], "feeds": "Not expressly void", "exam": 1, "blocks": [{"h": "S.27 Agreement in restraint of trade void. Saving of agreement not to carry on business of which good- will is sold.", "paras": [{"t": "Every agreement by which any one is restrained from exercising a lawful profession, trade or business of any kind, is to that extent void.", "l": 0}, {"t": "Exception 1.– One who sells the good-will of a business may agree with the buyer to refrain from carrying on a similar business, within specified local limits, so long as the buyer, or any person deriving title to the good-will from him, carries on a like business therein: Provided that such limits appear to the Court reasonable, regard being had to the nature of the business.", "l": 0}, {"t": "[* * * * * * * * * * * * ]", "l": 0}], "ills": []}]}, {"secs": ["28"], "code": "S.28", "term": "Agreements in restraint of legal proceedings void", "sub": "arbitration saved", "hook": "You may choose your judge, but you cannot sign away the courthouse door.", "plain": "An agreement that <b>absolutely restricts</b> a party from enforcing his rights by the usual legal proceedings, or <b>shortens the time</b> to enforce them, is <b>void to that extent</b>. <b>Exception 1:</b> a contract to refer <b>future disputes to arbitration</b>, making only the amount awarded recoverable, is saved; a suit lies for its specific performance, and the existence of the contract <b>bars</b> other suits on the referred subject. <b>Exception 2:</b> a <b>written</b> contract to refer a question that has <b>already arisen</b> to arbitration is also saved.", "cases": [{"n": "Scott v Avery", "c": "(1856) 5 HL Cas 811 (HL)", "t": "A clause making an arbitral award a condition precedent to any court action was upheld, as it did not oust the court’s jurisdiction. The citation page differs between sources, so check it before quoting.", "v": 2}], "links": [{"l": "S.23: public policy", "m": 5, "sec": "S.23"}], "feeds": "Not expressly void", "blocks": [{"h": "S.28 Agreements in restraint of legal proceedings void. Saving of contract to refer to arbitration dispute that may arise. Suits barred by such contracts. Savings of contracts to refer questions that have already arisen.", "paras": [{"t": "Every agreement, by which any party thereto is restricted absolutely from enforcing his rights under or in respect of any contract, by the usual legal proceedings in the ordinary tribunals, or which limits the time within which he may thus enforce his rights, is void to that extent.", "l": 0}, {"t": "Exception 1.– Saving of contract to refer to arbitration dispute that may arise.", "l": 0}, {"t": "This section shall not render illegal a contract by which two or more persons agree that any dispute which may arise between them in respect of any subject or class of subjects shall be referred to arbitration, and that only the amount awarded in such arbitration shall be recoverable in respect of the dispute so referred.", "l": 0}, {"t": "Suits barred by such Contracts.", "l": 0}, {"t": "When such a contract has been made, a suit may be brought for its specific performance, and if a suit, other than for such specific performance, or for the recovery of the amount so awarded, is brought by one party to such contract against any other such party in respect of any subject which they have so agreed to refer, the existence of such contract shall be bar to the suit.", "l": 0}, {"t": "Exception 2.– Saving of contract to refer questions that have already arisen.", "l": 0}, {"t": "Nor shall this section render illegal any contract in writing, by which two or more persons agree to refer to arbitration any question between them which has already arisen, or affect any provision of any law in force for the time being as to references to arbitration .", "l": 0}], "ills": []}]}, {"secs": ["29"], "code": "S.29", "term": "Agreements void for uncertainty", "sub": "certain, or capable of being made certain", "hook": "“A hundred tons of oil”: which oil? If the answer cannot be found, there is nothing to enforce.", "plain": "Agreements whose meaning is <b>not certain</b> and <b>not capable of being made certain</b> are void. Two outcomes: (1) <b>uncertain and no way to fix it</b> (illustration (a): “a hundred tons of oil”; (f): white horse for Rs 500 <i>or</i> Rs 1,000) is void; (2) <b>capable of being made certain</b> is valid (a specified oil known in commerce; a dealer in coconut oil only; “all the grain in my granary”; a price fixed by a named person).", "cases": [{"n": "Scammell v Ouston", "c": "[1941] AC 251 (HL)", "t": "A van was to be supplied “on hire-purchase terms” with no further detail. The agreement was too vague to enforce.", "v": 1}], "links": [{"l": "S.9: express and implied promises", "m": 2, "sec": "S.9"}], "feeds": "Not expressly void", "exam": 1, "blocks": [{"h": "S.29 Agreements void for uncertainty.", "paras": [{"t": "Agreements, the meaning of which is not certain, or capable of being made certain, are void.", "l": 0}], "ills": [{"t": "(a) A agrees to sell to B \"a hundred tons of oil\". There is nothing whatever to show what kind of oil was intended. The agreement is void for uncertainty.", "l": 0}, {"t": "(b) A agrees to sell to B one hundred tons of oil of a specified description, known as an article of commerce. There is no uncertainty here to make the agreement void.", "l": 0}, {"t": "(c) A, who is a dealer in coconut-oil only, agrees to sell to B \"one hundred tons of oil\". The nature of A's trade affords an indication of the meaning of the words, and A has entered into a contract for the sale of one hundred tons of Coconut-oil.", "l": 0}, {"t": "(d) A agrees to sell B \"all the grain in my granary at [Rahim Yar Khan]\". There is no uncertainty here to make the agreement void.", "l": 0}, {"t": "(e) A agrees to sell to B \"one thousand mounds of rice at a price to be fixed by C\". As the price is capable of being made certain, there is no uncertainty here to make the agreement void.", "l": 0}, {"t": "(f) A agrees to sell to B \"my white horse for Rupees five hundred or Rupees one thousand\". There is nothing to show which of the two prices was to be given. The agreement is void.", "l": 0}]}]}, {"secs": ["30"], "code": "S.30", "term": "Agreements by way of wager void", "sub": "no suit; horse-racing prize exception", "hook": "A bet is a promise the law will not hold you to, and will not help you collect on either.", "plain": "Wagers are <b>void</b>, and <b>no suit</b> lies to recover anything alleged to be won on a wager, or entrusted to a person to abide the result of a game or uncertain event. <b>Exception:</b> a subscription or contribution toward a <b>plate, prize or sum of Rs 500 or upwards</b> to be awarded to the winner of a <b>horse race</b>. <b>Saving:</b> the section does not legalise any transaction connected with horse-racing to which s.294-A of the Pakistan Penal Code applies.", "cases": [{"n": "Gherulal Parakh v Mahadeodas Maiya", "c": "AIR 1959 SC 781 (Supreme Court of India)", "t": "A wagering agreement is void under S.30, but it is not “forbidden by law” under S.23, so a partnership formed to carry on wagering transactions is not unlawful on that ground.", "v": 1}], "links": [{"l": "S.30A: collateral agreements", "m": 5, "sec": "S.30A"}], "feeds": "Not expressly void", "exam": 1, "blocks": [{"h": "S.30 Agreements by way of wager void. Exception in favour of certain prizes for horse-racing. Section 294A of the Pakistan Penal Code not affected.", "paras": [{"t": "Agreements by way of wager are void; and no suit shall be brought for recovering anything alleged to be own on any wager, or entrusted to any person to abide the result of any game or other uncertain event on which wager is made.", "l": 0}, {"t": "Exception in favour of certain prices for horse-racing.– This section shall not be deemed to render unlawful a subscription, or contribution, or agreement to subscribe or contribute, made or entered into for or toward any plate, prize or sum of money, of the value or amount of five hundred Rupees or upwards, to be awarded to the winner or winners of any horse race .", "l": 0}, {"t": "Section 294-A of the Pakistan Penal Code not affected.– Nothing in this section shall be deemed to legalize any transaction connected with horse-racing, to which the provisions of section 294-A of the Pakistan Penal Code apply.", "l": 0}], "ills": []}]}, {"secs": ["30A"], "code": "S.30A", "term": "Agreements collateral to wagering agreements void", "sub": "knowingly furthering or securing a wager", "hook": "If the bet is void, so is everything built around it.", "plain": "All agreements <b>knowingly made</b> to <b>further or assist</b> entering into, effecting or carrying out, or to <b>secure or guarantee</b> the performance of, an agreement void under S.30 are void. Extends the S.30 rule to brokers, financiers and guarantors who know what they are helping. (This section, with 30B and 30C, appears in square brackets in the printed text, marking it as an insertion.)", "cases": [], "links": [{"l": "S.30: wagers void", "m": 5, "sec": "S.30"}, {"l": "S.30B: no suit for commission", "m": 5, "sec": "S.30B"}], "feeds": "Not expressly void", "blocks": [{"h": "S.30A Agreements collateral to wagering agreements void.", "paras": [{"t": "All agreements knowingly made to further or assist the entering into, effecting or carrying out, or to secure or guarantee the performance, of any agreement void under section 30, are void.", "l": 0}], "ills": []}]}, {"secs": ["30B"], "code": "S.30B", "term": "No suit for recovery of money, commission etc., in respect of void agreements", "sub": "sums paid, commissions, brokerage", "hook": "No suit for the bet, none for the broker’s cut, none for the middleman’s fee.", "plain": "No suit or proceeding lies for: (a) any <b>sum paid or payable</b> in respect of an agreement void under S.30A; (b) any <b>commission, brokerage, fee or reward</b> for knowingly effecting or aiding such an agreement; (c) any sum knowingly paid on account of a person by way of commission, brokerage, fee, reward or other claim in respect of such an agreement.", "cases": [], "links": [{"l": "S.30A: collateral agreements", "m": 5, "sec": "S.30A"}, {"l": "S.30C: guardian, executor", "m": 5, "sec": "S.30C"}], "blocks": [{"h": "S.30B No suit for recovery of money, commission etc., in respect of void agreements.", "paras": [{"t": "No suit or other proceeding shall lie for the recovery of –", "l": 0}, {"t": "(a) any sum of money paid or payable in respect of any agreement void under section 30A, or", "l": 1}, {"t": "(b) any commission, brokerage, fee, or reward in respect of knowingly effecting or carrying out, or aiding in effecting or carrying out, of any such agreement or of any sum of money otherwise claimed or claimable in respect thereof, or", "l": 1}, {"t": "(c) any sum of money knowingly paid or payable on account of any person by way of commission, brokerage, fee, reward or other claim in respect of any such agreement.", "l": 1}], "ills": []}]}, {"secs": ["30C"], "code": "S.30C", "term": "Payment by guardian, executor, etc., in respect of void agreements not to be allowed credit", "sub": "no credit in the accounts", "hook": "A fiduciary who pays a gambling debt cannot charge it to the estate.", "plain": "No <b>guardian, executor, administrator, heir or personal representative</b> of a minor or deceased person may be <b>allowed credit in his account</b> for payments made on that person’s behalf in respect of agreements, commissions, brokerage, fees or claims referred to in S.30A and S.30B.", "cases": [], "links": [{"l": "S.30B: no suit for commission", "m": 5, "sec": "S.30B"}], "blocks": [{"h": "S.30C Payment by guardian, executor, etc., in respect of void agreements not to be allowed credit", "paras": [{"t": "No guardian, executor, administrator, heir or personal representative of any minor or deceased person, as the case may be, shall be entitled to or allowed any credit in his account for or in respect of any payment made by him on behalf of such minor or deceased person in respect of any such agreement, or any such commission, brokerage, fee, reward or claim as is referred to in sections 30A and 30B.]", "l": 0}], "ills": []}]}], "spar": [{"q": "A promises to get B a government job in return for Rs 1,000 from B. A fails and B sues for the job; A sues for the money. What does S.23 say, and on which ground?", "a": "<b>Void.</b> Illustration (f) to S.23: the agreement is void “as the consideration for it is unlawful”. The consideration (procuring public employment for a price) falls within the grounds in S.23: it would <b>defeat the provisions of any law</b> or be <b>opposed to public policy</b>. Neither party can enforce it. <i>Open to argument</i> which limb a court would name first; the illustration points to the unlawful consideration."}, {"q": "A, out of friendship, signs and registers a written promise to give B Rs 1,000. B is not A’s relative. Is the promise a contract under S.25(1)?", "a": "<b>No.</b> S.25(1) requires <b>(i)</b> writing, <b>(ii)</b> registration, <b>and (iii)</b> that the promise is made on account of <b>natural love and affection between parties standing in a near relation to each other</b>. Friendship without a near relation does not qualify, so the general rule applies and the agreement is void. Illustration (b) (father to son, written and registered) is the contrasting example that does qualify."}, {"q": "A owes B Rs 1,000, but the debt is time-barred. (1) A orally promises to pay Rs 500. (2) A signs a written promise to pay Rs 500. Which is a contract under S.25?", "a": "<b>Only (2).</b> S.25(3) requires a promise <b>made in writing and signed</b> by the person to be charged (or his authorised agent), to pay <b>wholly or in part</b> a debt that was enforceable but for the law of limitation. An oral promise falls outside; the agreement is void. Illustration (e) mirrors (2): the written promise to pay Rs 500 of a barred Rs 1,000 debt is a contract."}, {"q": "A sells his bakery’s goodwill to B and promises never to open a bakery anywhere in Pakistan. Is the promise enforceable?", "a": "<b>Probably only in part.</b> S.27 voids restraints of trade “to that extent”. Exception 1 saves a goodwill seller’s promise not to carry on a similar business <b>within specified local limits</b>, for as long as the buyer carries on the business, <b>if the limits appear reasonable to the Court</b>, having regard to the nature of the business. A country-wide, indefinite ban on a bakery is unlikely to look reasonable. <i>Open to argument:</i> how a court would trim an over-wide restraint, since the Act says only “to that extent void”."}, {"q": "A and B bet on a cricket match. A loses and refuses to pay. B’s broker C also claims his commission for placing the bet. May either sue?", "a": "<b>Neither.</b> S.30: wagers are void and <b>no suit</b> lies to recover anything alleged to be won. S.30A makes agreements <b>knowingly made to further</b> the wager void, and S.30B bars any suit for <b>commission, brokerage, fee or reward</b> for knowingly effecting or aiding such an agreement. C’s claim falls squarely within S.30B(b)."}]}, "6": {"n": 6, "intro": "Chapter III: contracts whose performance hangs on a collateral event. S.31 defines the idea; S.32 and S.33 give the mirror-image rules for events that happen and events that do not; S.34 and S.35 handle conduct-based events and fixed time limits; S.36 voids contingent agreements on impossible events.", "boundary": "<b>Boundary.</b> Wagers (S.30) are in Module 5. Supervening impossibility of a <i>performance</i> (S.56) is in Module 8; this module is about impossibility of the <i>event</i>.", "recall": "<b>Quick recall</b>S.32: happening, enforce <b>after</b> the event, void if it becomes impossible. S.33: not happening, enforce when the event becomes <b>impossible</b>. S.35: add a deadline. S.36: impossible event, void, known or not.", "rails": [{"secs": ["31"], "code": "S.31", "term": "“Contingent contract” defined", "sub": "performance depends on a collateral event", "hook": "“I will pay if your house burns”: the promise sleeps until the event wakes it.", "plain": "A contract to do or not to do something <b>if some event, collateral to such contract, does or does not happen</b>. Two features: (1) the event is <b>collateral</b>, not part of the promises being exchanged; (2) performance is <b>conditional</b> on it. Illustration: a promise to pay Rs 10,000 if B’s house is burnt. A contingent contract differs from a <b>wager</b> (S.30) in the usual teaching, where the parties have no interest beyond the stake; the Act itself does not define that line, so that distinction is textbook synthesis, not statutory text.", "cases": [], "links": [{"l": "S.30: wagers", "m": 5, "sec": "S.30"}, {"l": "S.32: event happening", "m": 6, "sec": "S.32"}], "exam": 1, "blocks": [{"h": "S.31 \"Contingent contract\" defined.", "paras": [{"t": "A \"contingent contract\" is a contract to do or not to do something, if some event, collateral to such contract, does or does not happen.", "l": 0}], "ills": [{"t": "A contracts to pay B Rupees 10,000 if B's house is burnt. This is a contingent contract.", "l": 0}]}]}, {"secs": ["32"], "code": "S.32", "term": "Enforcement of contracts contingent on an event happening", "sub": "not enforceable until the event happens", "hook": "The contract is a seed: nothing grows until the event waters it. If the event becomes impossible, the seed is dead.", "plain": "If the contract depends on an uncertain future event <b>happening</b>: (1) it <b>cannot be enforced unless and until</b> that event has happened; (2) if the event <b>becomes impossible</b>, the contract <b>becomes void</b>. Illustrations: buy a horse if A survives C (enforceable only when C dies in A’s lifetime); sell a horse if C refuses to buy (enforceable only when C refuses); pay B when B marries C, and C dies unmarried to B (void).", "cases": [], "links": [{"l": "S.33: event not happening", "m": 6, "sec": "S.33"}, {"l": "S.2(j): contract that becomes void", "m": 1, "sec": "S.2(j)"}], "blocks": [{"h": "S.32 Enforcement of contracts contingent on an event happening.", "paras": [{"t": "Contingent contracts to do or not to do anything if an uncertain future event happens cannot be enforced by law unless and until that event has happened.", "l": 0}, {"t": "If the event becomes impossible, such contracts become void.", "l": 0}], "ills": [{"t": "(a) A makes a contract with B to buy B's horse if A survives C. This contract cannot be enforced by law unless and until C dies in A's lifetime.", "l": 0}, {"t": "(b) A makes a contract with B to sell a horse to B at a specified price, if C, to whom the horse has been offered, refuses to buy him. The contract cannot be enforced by law unless and until C refuses to buy the horse.", "l": 0}, {"t": "(c) A contracts to pay B a sum of money when B marries C. C dies without being married to B. The contract becomes void.", "l": 0}]}]}, {"secs": ["33"], "code": "S.33", "term": "Enforcement of contracts contingent on an event not happening", "sub": "enforceable when the event becomes impossible", "hook": "The mirror image of S.32: here the contract wakes up only when the event can no longer happen.", "plain": "If the contract depends on an uncertain future event <b>not happening</b>, it can be enforced when the happening of that event <b>becomes impossible</b>, <b>and not before</b>. Illustration: pay B if a certain ship does not return; the ship is sunk; the contract can be enforced when the ship sinks.", "cases": [], "links": [{"l": "S.32: event happening", "m": 6, "sec": "S.32"}, {"l": "S.34: when conduct-based events become impossible", "m": 6, "sec": "S.34"}], "blocks": [{"h": "S.33 Enforcement of contracts contingent on an event not happening.", "paras": [{"t": "Contingent contracts to do or not to do anything if an uncertain future event does not happen can be enforced when the happening of that event becomes impossible, and not before.", "l": 0}], "ills": [{"t": "A agrees to pay B a sum of money if a certain ship does not return. The ship is sunk. The contract can be enforced when the ship sinks.", "l": 0}]}]}, {"secs": ["34"], "code": "S.34", "term": "When event is deemed impossible, if it is the future conduct of a living person", "sub": "impossible once he acts so as to rule it out", "hook": "A person’s future conduct is “impossible” the moment he does something that closes the door, even if the door could in theory be reopened.", "plain": "Where the event is <b>how a person will act at an unspecified time</b>, it is considered impossible when he does anything that <b>renders it impossible that he should so act within any definite time</b>, <b>or otherwise than under further contingencies</b>. Illustration: pay B if B marries C; C marries D. B’s marrying C is now <b>impossible</b>, even though D might die and C might later marry B.", "cases": [], "links": [{"l": "S.32: event becomes impossible", "m": 6, "sec": "S.32"}], "blocks": [{"h": "S.34 When event on which contract is contingent to be deemed impossible, if it is the future conduct of a living person.", "paras": [{"t": "If the future event on which a contract is contingent is the way in which a person will act at an unspecified time, the event shall be considered to become impossible when such person does anything which renders it impossible that he should so act within any definite time, or otherwise than under further contingencies.", "l": 0}], "ills": [{"t": "A agrees to pay B a sum of money if B marries C. C marries D. The marriage of B to C must now be considered impossible, although it is possible that D may die and that C may afterwards marry B.", "l": 0}]}]}, {"secs": ["35"], "code": "S.35", "term": "Contracts contingent on an event within (or not within) a fixed time", "sub": "void or enforceable at the end of the period", "hook": "A deadline attached to the event: miss the window, and the contract lapses (or ripens).", "plain": "<b>Event must happen within a fixed time</b>: the contract <b>becomes void</b> if at the end of the period the event has not happened, or if before then it becomes impossible. <b>Event must not happen within a fixed time</b>: the contract <b>may be enforced</b> when the time has expired without the event, or earlier if it becomes <b>certain</b> that it will not happen. Illustrations: pay if a ship returns within a year (enforceable if it returns; void if burnt); pay if a ship does <i>not</i> return within a year (enforceable if it does not return or is burnt). The printed text carries a second side-head within the section; kept as printed.", "cases": [], "links": [{"l": "S.32–33: the basic rules", "m": 6, "sec": "S.32"}], "blocks": [{"h": "S.35 When contracts become void which are contingent on happening of specified event within fixed time. event not happening within fixed time.", "paras": [{"t": "Contingent contracts to do or not to do anything if a specified uncertain event happens within a fixed time become void if, at the expiration of the time fixed, such event has not happened, or if, before the time fixed, such event becomes impossible.", "l": 0}, {"t": "When contracts may be enforced which are contingent on specified event not happening within fixed time.– Contingent contracts to do or not to do anything if a specified uncertain event does not happen within a fixed time may be enforced by law when the time fixed has expired and such event has not happened or, before the time fixed has expired, if it becomes certain that such event will not happen.", "l": 0}], "ills": [{"t": "(a) A promises to pay B a sum of money if a certain ship returns within a year. The contract may be enforced if the ship returns within the year, and becomes void if the ship is burnt within the year.", "l": 0}, {"t": "(b) A promises to pay B a sum of money if a certain ship does not return within a year. The contract may be enforced if the ship does not return within the year, or is burnt within the year.", "l": 0}]}]}, {"secs": ["36"], "code": "S.36", "term": "Agreement contingent on impossible events void", "sub": "void whether or not the parties knew", "hook": "If the condition could never be met, the promise was never real, even if nobody knew.", "plain": "A contingent agreement to do or not to do something, if an <b>impossible event</b> happens, is <b>void</b>, <b>whether or not the impossibility is known</b> to the parties when made. Illustrations: pay Rs 1,000 if two straight lines enclose a space; pay Rs 1,000 if B marries C, who was already dead (void).", "cases": [], "links": [{"l": "S.56: agreement to do an impossible act (Module 8)", "m": 8, "sec": "S.56"}, {"l": "S.20: mistake as to an essential fact", "m": 4, "sec": "S.20"}], "feeds": "Not expressly void", "blocks": [{"h": "S.36 Agreement contingent on impossible events void.", "paras": [{"t": "Contingent agreements to do or not to do anything, if an impossible event happens, are void, whether the impossibility of the event is known or not to the parties to the agreement at the time when it is made.", "l": 0}], "ills": [{"t": "(a) A agrees to pay B 1,000 Rupees if two straight lines should enclose a space. The agreement is void.", "l": 0}, {"t": "(b) A agrees to pay B 1,000 Rupees if B will marry A's daughter C. C was dead at the time of the agreement. The agreement is void.", "l": 0}]}]}], "spar": [{"q": "A promises B Rs 10,000 if B’s house is burnt. C and D bet Rs 10,000 on whether it will rain on Saturday. Which is a contingent contract under S.31, and what does the Act itself tell you about the difference?", "a": "<b>A–B is the example given in S.31’s illustration:</b> a promise to pay on a collateral event. <b>C–D is a wager</b> and void under S.30. <b>What the Act does not say:</b> it does not define the dividing line. The usual teaching distinguishes them by interest: in a contingent contract the parties (or at least one) have a real interest in the event, whereas a wager has none beyond the stake. That is textbook synthesis, <i>open to argument</i> at the margin (insurance is the usual test case)."}, {"q": "A promises to pay B Rs 50,000 “if B’s ship returns”, and separately “if B’s ship does not return”. The ship is lost at sea. Apply S.32 and S.33 to each promise.", "a": "<b>First promise (event happening, S.32):</b> the event (return) has become <b>impossible</b>, so the contract is <b>void</b>. <b>Second promise (event not happening, S.33):</b> it can be enforced <b>when the happening of the event becomes impossible, and not before</b>: the ship is lost, so B may now enforce. The two provisions are mirror images: S.32 waits for the event; S.33 waits for the event to become impossible."}, {"q": "A promises B Rs 1,000 if B marries C. C marries D. Years later D dies and C is free to marry B. Can B enforce the promise?", "a": "<b>No, on the Act’s illustration.</b> S.34 treats the event as <b>impossible</b> once C does something that rules out the marriage, even though D may later die. Because the promise is contingent on the event <b>happening</b>, S.32 second paragraph then makes the contract <b>void</b>. The contrary result is not available from the text. <i>Open to argument</i> if the parties fixed a longer period; the illustration speaks of an unspecified time."}, {"q": "A promises B Rs 1,000 if B marries A’s daughter C. C was dead when the agreement was made; neither party knew. Is it enforceable? Distinguish S.36 from S.20.", "a": "<b>Void under S.36</b> (illustration (b)): a contingent agreement on an impossible event is void <i>whether or not</i> the parties knew of the impossibility. <b>Compare S.20</b> (bilateral mistake of fact): that section also avoids agreements where both are mistaken about an essential fact; S.36 is the specific rule for <i>contingent</i> agreements and does not turn on mistake at all. The outcome is the same; the route differs."}]}, "7": {"n": 7, "intro": "Chapter IV, the largest block of Part I: who must perform and when (S.37–50), the rules for reciprocal promises (S.51–54), and what happens when time is of the essence (S.55). S.56 onward (impossibility) is Module 8; appropriation and discharge (S.59–67) is Module 9.", "boundary": "<b>Boundary.</b> S.56–58 (impossibility) are in Module 8 and S.59–67 (appropriation, novation, rescission) in Module 9. Compensation for breach (S.73–75) is in Module 11. The Sale of Goods Act gives its own rules on delivery and payment in Module 18.", "recall": "<b>Quick recall</b>Perform or offer to perform (S.37–38) · refusal/disablement lets the promisee end it (S.39) · personal vs delegable (S.40–41) · joint promisors (S.42–45) · time and place (S.46–50) · reciprocal promises: simultaneous (S.51), in order (S.52), prevented (S.53), prior default (S.54) · time of the essence (S.55).", "rails": [{"secs": ["37"], "code": "S.37", "term": "Obligation of parties to contracts", "sub": "perform or offer to perform; binds representatives", "hook": "The contract is a debt of honour that survives death, unless the job was personal.", "plain": "Parties must <b>perform, or offer to perform</b>, their promises unless performance is <b>dispensed with or excused</b> under the Act or any other law. Promises also <b>bind the representatives</b> of a dead promisor unless a contrary intention appears. Illustrations: delivering goods on payment (representatives bound); painting a picture (personal, so neither side’s representatives can enforce).", "cases": [], "links": [{"l": "S.40: who must perform", "m": 7, "sec": "S.40"}, {"l": "S.38: offer of performance", "m": 7, "sec": "S.38"}], "exam": 1, "blocks": [{"h": "S.37 Obligation of parties to contracts.", "paras": [{"t": "The parties to a contract must either perform, or offer to perform, their respective promises, unless such performance is dispensed with or excused under the provisions of this Act, or of any other law.", "l": 0}, {"t": "Promises bind the representatives of the promisors in case of the death of such promisors before performance, unless a contrary intention appears from the contract.", "l": 0}], "ills": [{"t": "(a) A promises to deliver goods to B on a certain day on payment of Rupees 1,000. A dies before that day. A's representatives are bound to deliver the goods to B, and B is bound to pay the Rupees 1,000 to A's representatives.", "l": 0}, {"t": "(b) A promises to paint a picture for B by a certain day, at a certain price. A dies before the day. The contract cannot be enforced either by A's representatives or by B.", "l": 0}]}]}, {"secs": ["38"], "code": "S.38", "term": "Effect of refusal to accept offer of performance", "sub": "a valid tender protects the promisor", "hook": "If you tender properly and the other side refuses, you lose nothing and owe nothing.", "plain": "If a promisor <b>offers performance</b> and the promisee does not accept, the promisor is <b>not responsible for non-performance</b> and does <b>not lose his rights</b>. The offer must satisfy three conditions: (1) <b>unconditional</b>; (2) made at a <b>proper time and place</b>, giving a reasonable opportunity to ascertain that the person is <b>able and willing</b> to do the whole there and then; (3) if delivering a thing, the promisee must have a <b>reasonable opportunity of seeing</b> that it is the thing promised. An offer to one of several joint promisees has the same effect as to all.", "cases": [], "links": [{"l": "S.37: obligation to perform", "m": 7, "sec": "S.37"}, {"l": "S.37, S.45 SGA: tender and delivery (Module 18)", "m": 18, "sec": ""}], "blocks": [{"h": "S.38 Effect of refusal to accept offer of performance.", "paras": [{"t": "Where a promisor has made an offer of performance to the promisee, and the offer has not been accepted, the promisor is not responsible for non- performance, nor does he thereby lose his rights under the contract.", "l": 0}, {"t": "Every such offer must fulfil the following conditions:–", "l": 0}, {"t": "(1) it must be unconditional:", "l": 1}, {"t": "(2) it must be made at a proper time and place, and under such circumstances that the person to whom it is made may have a reasonable opportunity of ascertaining that the person by whom it is made is able and willing there and then to do the whole of what he is bound by his promise to do:", "l": 1}, {"t": "(3) if the offer is an offer to deliver anything to the promisee, the promisee must have a reasonable opportunity of seeing that the thing offered is the thing which the promisor is bound by his promise to deliver.", "l": 1}, {"t": "An offer to one of several joint promisees has the same legal consequences as an offer to all of them.", "l": 0}], "ills": [{"t": "A contracts to deliver to B at his warehouse, on the 1st March, 1873, 100 bales of cotton of a particular quality. In order to make an offer of a performance with the effect stated in this section, A must bring the cotton to B's warehouse, on the appointed day, under such circumstances that B may have a reasonable opportunity of satisfying himself that the thing offered is cotton of the quality contracted for, and that there are 100 bales.", "l": 0}]}]}, {"secs": ["39"], "code": "S.39", "term": "Effect of refusal of party to perform promise wholly", "sub": "repudiation or self-disablement: promisee may end the contract", "hook": "When one side walks off the stage, the other may close the theatre, unless he lets the show go on.", "plain": "If a party <b>refuses to perform</b>, or <b>disables himself</b> from performing, his promise <b>in its entirety</b>, the promisee may <b>put an end to the contract</b>, unless he has signified <b>acquiescence in its continuance</b> by words or conduct. Illustrations (a), (b): a singer wilfully absents herself on the sixth night; the manager may end the contract (a), but if he lets her sing on the seventh night with his assent he has acquiesced and may only claim <b>compensation</b> for the missed night (b). Note this section turns on <b>refusal or disablement as to the whole</b>.", "cases": [{"n": "Hochster v De la Tour", "c": "(1853) 2 E & B 678 (QB)", "t": "A courier was told before the start date that he would not be needed. He could sue at once for repudiation without waiting for the performance date.", "v": 1}, {"n": "Poussard v Spiers and Pond", "c": "(1876) 1 QBD 410 (QB)", "t": "An opera singer’s illness kept her from the opening nights, and the management hired a replacement. Her absence went to the root of the contract, so they were discharged.", "v": 1}], "links": [{"l": "S.51–54: reciprocal promises", "m": 7, "sec": "S.51"}, {"l": "S.73: compensation for breach (Module 11)", "m": 11, "sec": "S.73"}], "exam": 1, "blocks": [{"h": "S.39 Effect of refusal of party to perform promise wholly.", "paras": [{"t": "When a party to a contract has refused to perform, or disabled himself from performing his promise in its entirety, the promisee may put an end to the contract, unless he has signified, by words or conduct, his acquiescence in its continuance.", "l": 0}], "ills": [{"t": "(a) A, a singer, enters into a contract with B, the manager of a theatre, to sing at his theater two nights in every week during the next two months, and B engages to pay her 100 Rupees for each nights performance. On the sixth night A wilfully absents herself from the theatre. B is at liberty to put an end to the contract.", "l": 0}, {"t": "(b) A, a singer, enters into a contract with B, the manager of a theatre, to sing at his theatre two nights in every week during the next two months, and B engages to pay her at the rate of 100 Rupees for each night. On the sixth night A wilfully absents herself. With the assent of B, A sings on the seventh night. B has signified his acquiescence in the continuance of the contract, and cannot now put an end to it, but is entitled to compensation for the damage sustained by him through A's failure to sing on the sixth night.", "l": 0}]}]}, {"secs": ["40"], "code": "S.40", "term": "Person by whom promise is to be performed", "sub": "personal promises vs delegable ones", "hook": "A painter must paint; a debtor may have someone else pay.", "plain": "If the nature of the case shows the parties intended the promisor to perform <b>personally</b>, he must. In <b>other cases</b> the promisor or his representatives may employ a <b>competent person</b>. Illustrations: a promise to pay money may be performed by another; a promise to paint a picture must be performed personally.", "cases": [], "links": [{"l": "S.37: representatives bound", "m": 7, "sec": "S.37"}, {"l": "S.41: performance by a third person", "m": 7, "sec": "S.41"}], "blocks": [{"h": "S.40 Person by whom promise is to be performed.", "paras": [{"t": "If it appears from the nature of the case that it was the intention of the parties to any contract that any promise contained in it should be performed by the promisor himself, such promise must be performed by the promisor. In other cases, the promisor or his representatives may employ a competent person to perform it.", "l": 0}], "ills": [{"t": "(a) A promises to pay B a sum of money. A may perform this promise, either by personally paying the money to B or by causing it to be paid to B by another; and, if A dies before the time appointed for payment, his representatives must perform the promise, or employ some proper person to do so.", "l": 0}, {"t": "(b) A promises to paint a picture for B. A must perform this promise personally.", "l": 0}]}]}, {"secs": ["41"], "code": "S.41", "term": "Effect of accepting performance from third person", "sub": "promisee who accepts cannot later sue the promisor", "hook": "Once you take payment from a stranger, you cannot send the bill to the original debtor.", "plain": "If the promisee <b>accepts performance from a third person</b>, he <b>cannot afterwards enforce</b> the promise against the promisor. One sentence: acceptance of the substitute performance discharges the promisor.", "cases": [], "links": [{"l": "S.40: who performs", "m": 7, "sec": "S.40"}], "blocks": [{"h": "S.41 Effect of accepting performance from third person.", "paras": [{"t": "When a promisee accepts performance of the promise from a third person, he cannot afterwards enforce it against the promisor.", "l": 0}], "ills": []}]}, {"secs": ["42"], "code": "S.42", "term": "Devolution of joint liabilities", "sub": "joint promisors: all, then survivors, then representatives", "hook": "Joint promises travel down the family tree: the living pay, then the estates, jointly.", "plain": "Unless a contrary intention appears: all joint promisors <b>during their joint lives</b>; after the death of any, <b>his representative jointly with the survivor(s)</b>; after the death of the last survivor, the <b>representatives of all jointly</b>, must fulfil the promise.", "cases": [], "links": [{"l": "S.43: any one may be compelled", "m": 7, "sec": "S.43"}, {"l": "S.45: joint rights", "m": 7, "sec": "S.45"}], "blocks": [{"h": "S.42 Devolution of joint liabilities.", "paras": [{"t": "When two or more persons have made a joint promise, then, unless a contrary intention appears by the contract, all such persons during their joint lives, and after the death of any of them his representative jointly with the survivor or survivors, and after the death of the last survivor, the representatives of all jointly, must fulfil the promise.", "l": 0}], "ills": []}]}, {"secs": ["43"], "code": "S.43", "term": "Any one of joint promisors may be compelled to perform", "sub": "one pays all, then claims contribution", "hook": "The creditor picks his debtor; the debtors then settle up among themselves.", "plain": "The promisee may, absent contrary agreement, <b>compel any one or more</b> of joint promisors to perform the <b>whole</b>. <b>Contribution:</b> each joint promisor may compel every other to contribute <b>equally</b> unless a contrary intention appears. <b>Default in contribution:</b> if one defaults, the rest <b>share the loss equally</b>. <b>Explanation:</b> a surety’s right to recover from his principal is not affected. Illustrations work the arithmetic: C pays all 3,000; A’s estate pays half of A’s share; B pays the larger part (illustration (b)).", "cases": [], "links": [{"l": "S.42: joint liabilities", "m": 7, "sec": "S.42"}, {"l": "S.140: surety’s rights on payment (Module 12)", "m": 12, "sec": "S.140–141"}], "blocks": [{"h": "S.43 Any one of joint promisors may be compelled to perform. Each promisor may compel contribution. Sharing of loss by default in contribution.", "paras": [{"t": "When two or more persons make a joint promise, the promisee may, in the absence of express agreement to the contrary, compel any [one or more] of such joint promisors to perform the whole of the promise.", "l": 0}, {"t": "Each promiser may compel contribution. – Each of two or more joint promisors may compel every other joint promisor to contribute equally with himself to the performance of the promise, unless a contrary intention appears from the contract.", "l": 0}, {"t": "Sharing of loss by default in contribution. – If any one of two or more joint promisors makes default in such contribution, the remaining joint promisors must bear the loss arising from such default in equal shares.", "l": 0}, {"t": "Explanation.– Nothing in this section shall prevent a surety from recovering from his principal, payments made by the surety on behalf of the principal, or entitle the principal to recover anything from the surety on account of payments made by the principal.", "l": 0}], "ills": [{"t": "(a) A, B and C jointly promise to pay D 3,000 rupees. D may compel either A or B or C to pay him 3,000 rupees.", "l": 0}, {"t": "(b) A, B and C jointly promise to pay D the sum of 3,000 rupees. C is compelled to pay the whole. A is insolvent, but his assets are sufficient to pay one- half of his debts. C is entitled to receive 500 rupees from A's estate, and 1,250 rupees from B.", "l": 0}, {"t": "(c) A, B and C are under a joint promise to pay D 3,000 rupees. C is unable to pay anything, and A is compelled to pay the whole. A is entitled to receive 1,500 rupees from B.", "l": 0}, {"t": "(d) A, B and C are under a joint promise to pay D 3,000 rupees, A and B being only sureties for C. C fails to pay. A and B are compelled to pay the whole sum. They are entitled to recover it from C.", "l": 0}]}]}, {"secs": ["44"], "code": "S.44", "term": "Effect of release of one joint promisor", "sub": "release of one does not discharge the others", "hook": "Letting one debtor off does not let the rest off, and does not free him from his co-debtors.", "plain": "A <b>release of one</b> joint promisor by the promisee <b>does not discharge the others</b>, and it does <b>not free the released promisor</b> from responsibility to the other joint promisors (so contribution under S.43 survives).", "cases": [], "links": [{"l": "S.43: contribution", "m": 7, "sec": "S.43"}], "blocks": [{"h": "S.44 Effect of release of one joint promisor.", "paras": [{"t": "Where two or more persons have made a joint promise, a release of one of such joint promisors by the promisee does not discharge the other joint promisor or joint promisors; neither does it free the joint promisors so released from responsibility to the other joint promisor or joint promisors.", "l": 0}], "ills": []}]}, {"secs": ["45"], "code": "S.45", "term": "Devolution of joint rights", "sub": "promise to several persons jointly", "hook": "The mirror of S.42: the right to claim passes among the creditors, then their estates.", "plain": "When a promise is made to <b>two or more persons jointly</b>, unless a contrary intention appears, the right to claim performance rests with them <b>during their joint lives</b>, then with the <b>representative of a deceased one jointly with the survivor(s)</b>, and finally with the representatives of all. Illustration: B and C lend Rs 5,000 jointly; on B’s death the right rests with B’s representative jointly with C.", "cases": [], "links": [{"l": "S.42: joint liabilities", "m": 7, "sec": "S.42"}], "blocks": [{"h": "S.45 Devolution of joint rights.", "paras": [{"t": "When a person has made a promise to two or more persons jointly, then, unless a contrary intention appears from the contract, the right to claim performance rests, as between him and them, with them during their joint lives, and, after the death of any of them, with the representative of such deceased person jointly with the survivor or survivors, and, after the death of the last survivor, with the representatives of all jointly .", "l": 0}], "ills": [{"t": "A, in consideration of 5,000 Rupees lent to him by B and C, promises B and C jointly to repay them that sum with interest on a day specified. B dies. The right to claim performance rests with B's representative jointly with C during C's life, and after the death of C with the representatives of B and C jointly.", "l": 0}]}]}, {"secs": ["46"], "code": "S.46", "term": "Time for performance where no application is to be made and no time is specified", "sub": "within a reasonable time", "hook": "“Whenever” in a contract means “within a reasonable time”.", "plain": "Where the promisor is to perform <b>without application</b> by the promisee and <b>no time is specified</b>, the engagement must be performed <b>within a reasonable time</b>. <b>Explanation:</b> what is reasonable is a <b>question of fact</b> in each case.", "cases": [], "links": [{"l": "S.47: time specified", "m": 7, "sec": "S.47"}, {"l": "S.6: reasonable time lapse of proposal", "m": 2, "sec": "S.6"}], "blocks": [{"h": "S.46 Time for performance of promise where no application is to be made and no time is specified.", "paras": [{"t": "Where, by the contract, a promisor is to perform his promise without application by the promisee, and no time for performance is specified, the engagement must be performed within a reasonable time.", "l": 0}, {"t": "Explanation.– The question \"what is a reasonable time\" is, in each particular case, a question of fact.", "l": 0}], "ills": []}]}, {"secs": ["47"], "code": "S.47", "term": "Time and place for performance where time is specified and no application to be made", "sub": "any time during usual business hours on the day", "hook": "The shop is closing at six; arrive at six-fifteen and you have not delivered.", "plain": "If the promise is to be performed <b>on a certain day</b> without application, the promisor may perform it <b>at any time during the usual hours of business on such day</b> and at the <b>proper place</b>. Illustration: goods brought to the warehouse after closing time, not received: <b>not performed</b>.", "cases": [], "links": [{"l": "S.48: when application is required", "m": 7, "sec": "S.48"}, {"l": "S.46: no time specified", "m": 7, "sec": "S.46"}], "blocks": [{"h": "S.47 Time and place for performance of promise where time is specified and no application to be made.", "paras": [{"t": "When promise is to be performed on a certain day, and the promisor has undertaken to perform it without application by the promisee, the promisor may perform it at any time during the usual hours of business on such day and at the place at which the promise ought to be performed.", "l": 0}], "ills": [{"t": "A promises to deliver goods at B's warehouse on the first January. On that day A brings the goods to B's warehouse, but after the usual hour for closing it, and they are not received. A has not performed his promise.", "l": 0}]}]}, {"secs": ["48"], "code": "S.48", "term": "Application for performance on certain day to be at proper time and place", "sub": "the promisee must ask at the proper time and place", "hook": "If the debtor need not come to you, you must go to him, in business hours.", "plain": "Where the promise is to be performed on a certain day and the promisor has <b>not</b> undertaken to perform <b>without application</b>, it is the <b>promisee’s duty to apply</b> at a proper place and within the usual hours of business. <b>Explanation:</b> what is a proper time and place is a question of fact.", "cases": [], "links": [{"l": "S.47: no application needed", "m": 7, "sec": "S.47"}], "blocks": [{"h": "S.48 Application for performance on certain day to be at proper time and place.", "paras": [{"t": "When a promise is to be performed on a certain day, and the promisor has not undertaken to perform it without application by the promisee, it is the duty of the promisee to apply for performance at a proper place and within the usual hours of business.", "l": 0}, {"t": "Explanation.– The question \"what is a proper time and place\" is, in each particular case, a question of fact.", "l": 0}], "ills": []}]}, {"secs": ["49"], "code": "S.49", "term": "Place for performance where no application to be made and no place fixed", "sub": "promisor asks the promisee to appoint a reasonable place", "hook": "If nobody picked the place, the delivering party must ask where.", "plain": "Where performance is to be <b>without application</b> and <b>no place is fixed</b>, the <b>promisor must apply</b> to the promisee to <b>appoint a reasonable place</b> and perform there. Illustration: a thousand maunds of jute on a fixed day; A must ask B to appoint a place.", "cases": [], "links": [{"l": "S.47: time and place", "m": 7, "sec": "S.47"}], "blocks": [{"h": "S.49 Place for performance of promise where no application to be made and no place fixed for performance.", "paras": [{"t": "When a promise is to be performed without application by the promisee, and no place is fixed for the performance of it, it is the duty of the promisor to apply to the promisee to appoint a reasonable place for the performance of the promise, and to perform it at such place.", "l": 0}], "ills": [{"t": "A undertakes to deliver a thousand maunds of jute to B on a fixed day. A must apply to B to appoint a reasonable place for the purpose of receiving it, and must deliver it to him at such place.", "l": 0}]}]}, {"secs": ["50"], "code": "S.50", "term": "Performance in manner or at time prescribed or sanctioned by promisee", "sub": "the promisee may waive the ordinary way", "hook": "The creditor can name the postbox, the bank or the barter.", "plain": "A promise may be performed <b>in any manner, or at any time, which the promisee prescribes or sanctions</b>. Illustrations: payment through the creditor’s bank (valid even if the bank later fails); set-off of mutual debts; part payment by accepting goods; payment by posting a note (debt discharged on posting).", "cases": [], "links": [{"l": "S.4: postal acceptance and communication", "m": 2, "sec": "S.4"}], "blocks": [{"h": "S.50 Performance in manner or at time prescribed or sanctioned by promisee.", "paras": [{"t": "The performance of any promise may be made in any manner, or at any time which the promisee prescribes or sanctions.", "l": 0}], "ills": [{"t": "(a) B owes A 2,000 Rupees. A desires B to pay the amount to A's account with C, a banker. B, who also banks with C, orders the amount to be transferred from his account to A's credit, and this is done by C. Afterwards, and before A knows of the transfer, C fails. There has been a good payment by B.", "l": 0}, {"t": "(b) A and B are mutually indebted. A and B settle an account by setting off one item against another, and B pays A the balance found to be due from him upon such settlement. This amounts to a payment by A and B, respectively, of the sums which they owed to each other.", "l": 0}, {"t": "(c) A owes B 2,000 Rupees. B accepts some of A's goods in reduction of the debt. The delivery of the goods operates as a part payment.", "l": 0}, {"t": "(d) A desires B, who owes him Rupees 100, to send him a note for Rupees 100 by post. The debt is discharged as soon as B puts into the post a letter containing the note duly addressed to A.", "l": 0}]}]}, {"secs": ["51"], "code": "S.51", "term": "Promisor not bound to perform unless reciprocal promisee ready and willing", "sub": "simultaneous reciprocal promises", "hook": "Hand-over: neither side lets go first unless the other is holding out the price.", "plain": "In reciprocal promises to be <b>simultaneously performed</b>, no promisor need perform <b>unless the promisee is ready and willing</b> to perform his reciprocal promise. Illustrations: goods to be paid for on delivery; instalment contracts where the first instalment is due on delivery.", "cases": [], "links": [{"l": "S.2(f): reciprocal promises", "m": 1, "sec": "S.2(f)"}, {"l": "S.52: order of performance", "m": 7, "sec": "S.52"}, {"l": "S.32 SGA: payment and delivery concurrent (Module 18)", "m": 18, "sec": ""}], "blocks": [{"h": "S.51 Promisor not bound to perform, unless reciprocal promisee ready and willing to perform.", "paras": [{"t": "When a contract consists of reciprocal promises to be simultaneously performed, no promisor need perform his promise unless the promisee is ready and willing to perform his reciprocal promise.", "l": 0}], "ills": [{"t": "(a) A and B contract that A shall deliver goods to B to be paid for by B on delivery. A need not deliver the goods, unless B is ready and willing to pay for the goods on delivery. B need not pay for the goods, unless A is ready and willing to deliver them on payment.", "l": 0}, {"t": "(b) A and B contract that A shall deliver goods to B at a price to be paid by installments, the first installment to be paid on delivery. A need not deliver, unless B is ready and willing to pay the first installment on delivery. B need not pay the first installment, unless A is ready and willing to deliver the goods on payment of the first instalment.", "l": 0}]}]}, {"secs": ["52"], "code": "S.52", "term": "Order of performance of reciprocal promises", "sub": "as fixed by the contract, else as the nature of the transaction requires", "hook": "The builder builds first; the buyer of a stock-in-trade secures first.", "plain": "If the contract <b>expressly fixes the order</b>, follow it; if not, perform in the order <b>the nature of the transaction requires</b>. Illustrations: building a house (build, then pay); transferring stock-in-trade against security (security first).", "cases": [], "links": [{"l": "S.51: simultaneous promises", "m": 7, "sec": "S.51"}, {"l": "S.54: default on the prior promise", "m": 7, "sec": "S.54"}], "blocks": [{"h": "S.52 Order of performance of reciprocal promises.", "paras": [{"t": "Where the order in which reciprocal promises are to be performed is expressly fixed by the contract, they shall be performed in that order; and, where the order is not expressly fixed by the contract, they shall be performed in that order which the nature of the transaction requires.", "l": 0}], "ills": [{"t": "(a) A and B contract that A shall build a house for B at a fixed price. A's promise to build the house must be performed before B's promise to pay for it.", "l": 0}, {"t": "(b) A and B contract that A shall make over his stock-in-trade to B at a fixed price, and B promises to give security for the payment of the money. A's promise need not be performed until the security is given, for the nature of the transaction requires that A should have security before he delivers up his stock.", "l": 0}]}]}, {"secs": ["53"], "code": "S.53", "term": "Liability of party preventing event on which the contract is to take effect", "sub": "prevention makes the contract voidable", "hook": "If you lock the door on a worker who is ready to work, he may treat the job as over and send the bill.", "plain": "If one party to a contract of reciprocal promises <b>prevents the other from performing</b>, the contract becomes <b>voidable at the option of the prevented party</b>, who may recover <b>compensation</b> for loss from non-performance. Illustration: A prevents B from executing the work; B may rescind and claim loss incurred.", "cases": [], "links": [{"l": "S.54: default as to the prior promise", "m": 7, "sec": "S.54"}, {"l": "S.64: consequences of rescission (Module 9)", "m": 9, "sec": "S.64"}], "blocks": [{"h": "S.53 Liability of party preventing event on which the contract is to take effect.", "paras": [{"t": "When a contract contains reciprocal promises, and one party to the contract prevents the other from performing his promise, the contract becomes voidable at the option of the party so prevented; and he is entitled to compensation from the other party for any loss which he may sustain in consequence of the non- performance of the contract.", "l": 0}], "ills": [{"t": "A and B contract that B shall execute certain work for A for a thousand Rupees. B is ready and willing to execute the work accordingly, but A prevents him from doing so. The contract is voidable at the option of B; and, if he elects to rescind it, he is entitled to recover from A compensation for any loss which he has incurred by its non-performance.", "l": 0}]}]}, {"secs": ["54"], "code": "S.54", "term": "Effect of default as to that promise which should be first performed", "sub": "the defaulter cannot demand performance and must compensate", "hook": "You cannot sue for the second act if you never did the first.", "plain": "Where one reciprocal promise <b>cannot be performed</b>, or its performance <b>cannot be claimed till the other has been performed</b>, and the promisor of the latter <b>fails</b>, he <b>cannot claim performance</b> of the other and must <b>compensate</b> the other for loss. Illustrations (a)–(d): no cargo for the hired ship; no scaffolding; late payment where delivery depended on it; non-delivery by the seller (buyer need not pay).", "cases": [], "links": [{"l": "S.52: order of performance", "m": 7, "sec": "S.52"}, {"l": "S.53: prevention", "m": 7, "sec": "S.53"}], "blocks": [{"h": "S.54 Effect of default as to that promise which should be first performed, in contract consisting of reciprocal promises.", "paras": [{"t": "When a contract consists of reciprocal promises, such that one of them cannot be performed, or that its performance cannot be claimed till the other has been performed, and the promisor of the promise last mentioned fails to perform it, such promisor cannot claim the performance of the reciprocal promise, and must make compensation to the other party to the contract for any loss which such other party may sustain by the non- performance of the contract.", "l": 0}], "ills": [{"t": "(a) A hires B's ship to take in and convey, from [Kararchi] to the Mauritius, a cargo to be provided by A, B receiving a certain freight for its conveyance. A does not provide any cargo for the ship. A cannot claim the performance of B's promise, and must make compensation to B for the loss which B sustains by the non- performance of the contract.", "l": 0}, {"t": "(b) A contracts with B to execute certain builder's work for a fixed price, B supplying the scaffolding and timber necessary for the work. B refuses to furnish any scaffolding or timber, and the work cannot be executed. A need not execute the work, and B is bound to make compensation to A for any loss caused to him by the non-performance of the contract.", "l": 0}, {"t": "(c) A contracts with B to deliver to him, at a specified price, certain merchandise on board a ship which cannot arrive for a month, and B engages to pay for the merchandise within a week from the date of the contract. B does not pay within the week. A's promise to deliver need not be performed, and B must make compensation.", "l": 0}, {"t": "(d) A promises B to sell him one hundred bales of merchandise, to be delivered next day, and B promises A to pay for them within a month. A does not deliver according to his promise. B's promise to pay need not be performed, and A must make compensation.", "l": 0}]}]}, {"secs": ["55"], "code": "S.55", "term": "Effect of failure to perform at fixed time, in contract in which time is essential", "sub": "time of the essence: voidable; otherwise compensation", "hook": "If the clock is the heart of the deal, the missed deadline lets the other side walk; if it is not, only the damages follow.", "plain": "Three limbs. (1) <b>Time of the essence</b> and failure to perform at or before the specified time: contract (or its unperformed part) <b>becomes voidable</b> at the promisee’s option. (2) <b>Time not of the essence</b>: contract <b>not voidable</b>, but promisee is <b>entitled to compensation</b> for loss. (3) <b>If promisee accepts late performance</b> of a voidable contract, he <b>cannot claim compensation</b> for the delay <b>unless he gives notice</b> of his intention to do so at the time of acceptance. The test is the <b>intention of the parties</b>.", "cases": [], "links": [{"l": "S.73: compensation for breach (Module 11)", "m": 11, "sec": "S.73"}, {"l": "S.11 SGA: stipulations as to time (Module 16)", "m": 16, "sec": ""}], "exam": 1, "blocks": [{"h": "S.55 Effect of failure to perform at fixed time, in contract in which time is essential. Effect of such failure when time is not essential.", "paras": [{"t": "When a party to a contract promises to do a certain thing at or before a specified time, or certain things at or before a specified times, and fails to do any such thing at or before the specified time, the contract, or so much of it as has not been performed, becomes voidable at the option of the promisee, if the intention of the parties was that time should be of the essence of the contract.", "l": 0}, {"t": "Effect of such failure when time is not essential.– If it was not the intention of the parties that time should be of the essence of the contract, the contract does not become voidable by the failure to do such thing at or before the specified time; but the promisee is entitled to compensation from the promisor for any loss occasioned to him by such failure.", "l": 0}, {"t": "Effect of acceptance of performance at time other than that agreed upon.– If, in case of a contract voidable on account of the promisor's failure to perform his promise at the time agreed, the promisee accepts performance of such promise at any time other than that agreed, the promisee cannot claim compensation for any loss occasioned by the non-performance of the promise at the time agreed, unless, at the time of such acceptance he gives notice to
