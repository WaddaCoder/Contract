<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Law of Contract Navigator — UI Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1520;--surface:#101E2E;--surface2:#0C1A28;--accent:#3A7BD5;--accent-dim:#1E3A5A;--gold:#C9A84C;--gold-dim:#4A3D1E;--text:#FFF;--text2:#FFF;--muted:#3A6A8A;--muted2:#2A4A6A;--border:#1A2E42;--radius:12px;--radius-sm:8px;--fs-xs:.65rem;--fs-sm:.75rem;--fs-base:.9rem;--fs-lg:1.05rem;--fs-xl:1.3rem;--fs-2xl:1.6rem}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:100%}
body{background:var(--bg);color:var(--text2);font-family:'Inter',sans-serif;font-size:var(--fs-base);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.hidden{display:none!important}
.header{padding:20px 18px 14px;border-bottom:.5px solid var(--border)}
.header-toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:#1A2838;border:1px solid #2A3A4A;color:#C8C8C8;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.app-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-2xl);font-weight:700;line-height:1.1}
.gold-word{color:var(--gold)}
.app-subtitle{font-size:var(--fs-sm);color:#C8C8C8;margin-top:6px;line-height:1.5}
.accent-line{height:2px;width:40px;background:var(--accent);border-radius:2px;margin-top:10px}
.search-wrap{padding:12px 16px 4px}
.search{width:100%;background:var(--surface);border:.5px solid var(--accent-dim);border-radius:var(--radius-sm);padding:10px 14px;color:#fff;font:inherit}
.search::placeholder{color:var(--muted2)}
.arc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 14px 4px}
.arc-card{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:11px 12px}
.arc-icon{font-size:16px;margin-bottom:4px}
.arc-title{font-family:'Cormorant Garamond',serif;font-size:.85rem;font-weight:600;color:#A8C4DC;margin-bottom:3px}
.arc-body{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}
.jump{display:flex;gap:8px;padding:10px 14px 0;position:sticky;top:0;z-index:5;background:var(--bg)}
.jump a{flex:1;text-align:center;font-size:var(--fs-sm);font-weight:700;padding:9px 6px;border-radius:20px;border:1px solid var(--accent-dim);color:#A8C4DC;cursor:pointer}
.jump a.g{border-color:var(--gold-dim);color:var(--gold)}
.section-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;padding:18px 18px 4px;scroll-margin-top:56px}
.section-label.gold{color:var(--gold)}
.section-sub{font-size:var(--fs-xs);color:#C8C8C8;padding:0 18px 8px;line-height:1.5}
.module-card{--c:#3A7BD5;margin:0 14px 10px;background:var(--surface);border:.5px solid var(--accent-dim);border-radius:var(--radius);padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.module-card:active{transform:scale(.98)}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.module-card.extra{border-style:dashed}
.module-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.module-section-tag{font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:5px;color:#10141C;background:color-mix(in srgb,var(--c) 55%,#fff)}
.module-chevron{color:var(--muted2);font-size:var(--fs-lg)}
.module-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);font-weight:700;margin-bottom:3px}
.module-hint{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}
.module-match{font-size:var(--fs-xs);color:var(--gold);margin-top:6px}
.module-pill{display:inline-block;margin-top:8px;font-size:var(--fs-xs);font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--gold);color:#1A1408;background:var(--gold)}
.module-pill.pending{background:transparent;color:var(--muted);border-color:var(--muted2)}
.module-pill.extra{background:transparent;color:var(--gold);border-color:var(--gold-dim)}
.no-match{margin:20px 16px;text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.ms-header{padding:16px 18px 14px;border-bottom:.5px solid var(--border)}
.ms-toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ms-home-btn{width:34px;height:34px;border-radius:9px;background:#E8E8E8;color:#0D1520;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
.ms-tag{font-size:var(--fs-xs);font-weight:700;color:#1A1408;background:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:3px 9px}
.ms-title{font-family:'Cormorant Garamond',serif;font-size:var(--fs-xl);font-weight:700}
.ms-intro{font-size:var(--fs-sm);color:#E8E8E8;line-height:1.6;padding:12px 18px 14px;border-bottom:.5px solid var(--border)}
.defs-search-wrap{padding:12px 16px;display:flex;gap:8px;align-items:center}
.defs-collapse-all{font-size:var(--fs-xs);color:var(--muted);border:.5px solid var(--accent-dim);border-radius:var(--radius-sm);padding:10px 12px;white-space:nowrap;cursor:pointer}
.rail{margin:6px 14px;background:var(--surface);border:1px solid var(--accent-dim);border-radius:10px;overflow:hidden}
.rail.priority{border-color:var(--gold-dim)}
.rail.expanded{background:#1A2838;border-color:var(--gold)}
.rail-header{padding:12px 14px;display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.rail-code{font-family:'Inter',monospace;font-size:var(--fs-xs);color:var(--muted);flex-shrink:0;width:40px;padding-top:2px}
.rail.expanded .rail-code{color:var(--gold)}
.rail-text{flex:1}
.rail-term{font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);font-weight:700;margin-bottom:2px}
.rail-star{color:var(--gold);font-size:var(--fs-xs);margin-right:4px}
.rail-sub{font-size:var(--fs-xs);color:#C8C8C8;line-height:1.4}.exam-tag{display:inline-block;margin-top:5px;margin-left:6px;padding:2px 8px;border:.5px solid var(--accent);border-radius:10px;font-size:var(--fs-xs);color:#8DB4EE;letter-spacing:.02em}.ess-tag{display:inline-block;margin-top:5px;padding:2px 8px;border:.5px solid var(--gold);border-radius:10px;font-size:var(--fs-xs);color:var(--gold);letter-spacing:.02em}.feeds-tag{display:inline-block;margin-top:5px;font-size:var(--fs-xs);color:#9AA8BC;font-style:italic}.ess-legend{margin:0 0 10px;padding:10px 14px;border:.5px solid var(--border);border-radius:8px;font-size:var(--fs-xs);color:#C8C8C8;line-height:1.5}.ess-legend b{color:var(--gold)}
.rail-chev{color:var(--muted2);font-size:var(--fs-sm);transition:transform .2s;margin-top:3px}
.rail.expanded .rail-chev{color:var(--gold);transform:rotate(90deg)}
.rail-body{border-top:.5px solid var(--accent-dim);display:none;padding-bottom:12px}
.rail.expanded .rail-body{display:block}
.hook{margin:12px 12px 0;background:#1A1608;border:1px solid var(--gold-dim);border-radius:10px;padding:10px 14px;font-size:var(--fs-sm);color:#D8C898;line-height:1.6}
.hook b{color:var(--gold);letter-spacing:1px;font-size:var(--fs-xs);text-transform:uppercase;display:block;margin-bottom:3px}
.pos{margin:10px 12px 0;border-radius:10px;overflow:hidden;border:1px solid var(--accent-dim)}
.pos-h{background:var(--accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px}
.pos-b{background:#F4F0E6;color:#1A1408;padding:14px}
.pos-t{font-size:var(--fs-base);line-height:1.7;margin-bottom:8px}
.pos-t.sub{padding-left:14px}
.pos-t b{color:#1A1408}
.ill-h{font-size:var(--fs-xs);font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8A7A3A;margin:12px 0 6px;border-top:1px dashed #C8BC9C;padding-top:10px}
.ill{font-size:var(--fs-sm);line-height:1.65;color:#3A3020;margin-bottom:6px;font-style:italic}
.plain{background:#E8E2D0;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:var(--fs-sm);line-height:1.65;color:#2A2418}
.plain b.l{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:#8A7A3A;margin-bottom:3px}
.xrow{margin-top:10px}
.xlink{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;color:#10141C;background:#C9A84C;border-radius:12px;padding:4px 11px;margin:2px 4px 2px 0;cursor:pointer}
.xlink.part2{background:#D4A24C}
.src{font-size:var(--fs-xs);color:#6A5A3A;margin-top:10px}
.cases-bar{margin:10px 12px 0;background:#1A1608;border:1px solid var(--gold-dim);border-radius:18px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cases-bar.open{border-radius:12px 12px 0 0}
.cases-bar-label{font-size:var(--fs-xs);font-weight:700;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.cases-bar-action{font-size:var(--fs-xs);color:#D8C898}
.cases-body{display:none;background:#1A1608;border:1px solid var(--gold-dim);border-top:none;border-radius:0 0 12px 12px;padding:12px;margin:0 12px}
.cases-body.open{display:block}
.case-sub{border:1px dashed var(--gold-dim);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.case-sub:last-child{margin-bottom:0}
.case-name{font-size:var(--fs-sm);font-weight:700;color:var(--gold);margin-bottom:2px}
.case-cite{font-size:var(--fs-xs);color:#A89868;margin-bottom:6px}
.case-teaser{font-size:var(--fs-sm);color:#D8D0C0;font-style:italic;line-height:1.6}
.case-flag{display:inline-block;margin-top:6px;font-size:var(--fs-xs);color:#8AD0A0;border:1px solid #1A4A2A;border-radius:10px;padding:1px 8px;font-style:normal}
.case-flag.warn{color:#E0A088;border-color:#5A3A2A}
.boundary{margin:14px 14px 4px;background:#1A1608;border:1px solid var(--gold-dim);border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);color:#D8C898;line-height:1.6}
.recall{margin:10px 14px 4px;background:#0D2A1A;border:1px solid #1A4A2A;border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);color:#BFE8CC;line-height:1.6}
.recall b{display:block;font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:#4ACA7A;margin-bottom:3px}
.spar-toggle{margin:14px 14px 0;background:var(--surface2);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.spar-label{font-weight:700;font-size:var(--fs-base);margin-bottom:2px}
.spar-state{font-size:var(--fs-xs);color:#C8C8C8}
.switch{width:54px;height:30px;border-radius:16px;background:#2A3A4A;position:relative;flex-shrink:0;transition:background .2s}
.switch.on{background:var(--gold)}
.knob{width:24px;height:24px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s}
.switch.on .knob{left:27px}
.spar{margin:10px 12px 0;border-radius:12px;overflow:hidden;border:1px solid var(--accent-dim)}
.spar-h{background:#2A3550;font-size:var(--fs-xs);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;display:flex;justify-content:space-between;cursor:pointer;gap:8px}
.spar-h span:last-child{color:#B8C4E0;text-transform:none;letter-spacing:.3px;font-weight:600}
.spar-b{background:#F4F0E6;color:#1A1408;padding:0 14px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
.spar-b.open{padding:4px 14px 14px;max-height:6000px}
.q{padding:14px 0;border-top:1px solid #D8D0BC}
.q:first-child{border-top:none}
.q-l{font-size:var(--fs-xs);font-weight:700;color:#8A7A3A;letter-spacing:1px;margin-bottom:6px}
.q-t{font-size:var(--fs-base);line-height:1.6;margin-bottom:10px}
.q-ta{width:100%;min-height:64px;border:1px solid #C8BC9C;border-radius:8px;background:#E8E2D0;padding:10px 12px;font:inherit;font-size:var(--fs-sm);color:#1A1408;resize:vertical;margin-bottom:10px}
.q-ta::placeholder{color:#8A8068}
.reveal{border:1px solid #8A7A5A;border-radius:8px;text-align:center;padding:10px;font-weight:600;color:#3A4A8A;cursor:pointer;font-size:var(--fs-sm)}
.q-a{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #C8BC9C;font-size:var(--fs-sm);line-height:1.7;color:#3A3020}
.q-a.open{display:block}
.q-a i{color:#6A5A3A}
details.notes{margin:14px 14px 6px;background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:0}
details.notes summary{cursor:pointer;padding:12px 14px;font-size:var(--fs-sm);font-weight:700;color:#A8C4DC;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:'›  ';color:var(--gold)}
details.notes[open] summary::before{content:'⌄  '}
.notes-b{padding:0 14px 14px;font-size:var(--fs-sm);color:#C8C8C8;line-height:1.65}
.notes-b h4{font-size:var(--fs-xs);letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin:10px 0 4px}
.notes-b li{margin-left:16px;margin-bottom:4px}
.blk-h{font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;color:#3A4A8A;margin:14px 0 6px;padding-top:10px;border-top:1px dashed #C8BC9C}.blk-h:first-child{margin-top:0;border-top:none;padding-top:0}.navrow{display:flex;justify-content:space-between;gap:8px;padding:14px 14px 4px}.stub{margin:30px 18px;text-align:center;color:#C8C8C8;font-size:var(--fs-sm);line-height:1.7;background:var(--surface);border:1px dashed var(--accent-dim);border-radius:12px;padding:24px 16px}
.stub b{display:block;font-family:'Cormorant Garamond',serif;font-size:var(--fs-lg);color:#fff;margin-bottom:6px}
.font-bar{background:var(--surface2);border-top:1px solid var(--border);padding:10px 0;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:auto}
.font-bar-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.font-size-display{font-family:'Inter',monospace;font-size:11px;color:#DDE3EE;min-width:36px;text-align:center}
.fp-btn{font-weight:700;border:1px solid var(--border);background:none;color:var(--muted);border-radius:4px;cursor:pointer;padding:5px 13px;font-size:16px}
.fp-btn:active{background:var(--gold);color:#1a1408;border-color:var(--gold)}
@media (min-width:1024px) and (orientation:landscape){.app{max-width:1280px;padding:0 24px}body{font-size:16px}.module-title{font-size:19px}.rail-term{font-size:19px}.ms-title{font-size:24px}.pos-t,.q-t{font-size:16px}.q-a,.ill,.plain{font-size:14px}}
</style>
</head>

<div class="app" id="app"></div>

var MODS=[{"p": 1, "n": 1, "c": "#8B7BDF", "s": "S.2", "t": "Definitions", "h": "Proposal, promise, promisor, consideration, agreement, void and voidable"}, {"p": 1, "n": 2, "c": "#3A7BD5", "s": "S.3–9", "t": "Formation & Communication", "h": "Communication, acceptance, revocation, absolute acceptance", "live": 1}, {"p": 1, "n": 3, "c": "#5AAFB0", "s": "S.10–14", "t": "Essentials of a Contract", "h": "Competence, sound mind, consent, free consent"}, {"p": 1, "n": 4, "c": "#C9856A", "s": "S.15–22", "t": "Vitiating Factors", "h": "Coercion, undue influence, fraud, misrepresentation, mistake"}, {"p": 1, "n": 5, "c": "#B05A6A", "s": "S.23–30", "t": "Void & Unlawful Agreements", "h": "Object, consideration, restraint of trade, wagering"}, {"p": 1, "n": 6, "c": "#5A9A6A", "s": "S.31–36", "t": "Contingent Contracts", "h": "Events happening, events not happening, impossible events"}, {"p": 1, "n": 7, "c": "#9A8A4A", "s": "S.37–55", "t": "Performance of Contracts", "h": "Who, when, where, reciprocal promises, time as essence"}, {"p": 1, "n": 8, "c": "#7A5AAF", "s": "S.56–58", "t": "Impossibility & Frustration", "h": "Agreements to do the impossible, later impossibility, severability"}, {"p": 1, "n": 9, "c": "#3A8BAF", "s": "S.59–67", "t": "Discharge & Appropriation", "h": "Appropriation of payments, novation, rescission, remission"}, {"p": 1, "n": 10, "c": "#AF5A8A", "s": "S.68–72", "t": "Quasi-Contract", "h": "Necessaries, reimbursement, finder of goods, mistaken payment", "x": 1}, {"p": 1, "n": 11, "c": "#5A7AAF", "s": "S.73–75", "t": "Breach & Remedies", "h": "Compensation, penalty clauses, rightful rescission"}, {"p": 1, "n": 12, "c": "#9A6A3A", "s": "S.124–147", "t": "Indemnity & Guarantee", "h": "Surety, continuing guarantee, discharge, co-sureties"}, {"p": 1, "n": 13, "c": "#5AAF6A", "s": "S.148–181", "t": "Bailment & Pledge", "h": "Bailee’s duties, liens, pledge, suits against wrongdoers"}, {"p": 1, "n": 14, "c": "#AF7A3A", "s": "S.182–238", "t": "Agency", "h": "Authority, sub-agents, ratification, termination, third parties"}, {"p": 2, "n": 15, "c": "#D4A24C", "s": "S.1–10", "t": "Formation of the Contract of Sale", "h": "Sale vs agreement to sell, goods, price, perishing goods"}, {"p": 2, "n": 16, "c": "#C9704A", "s": "S.11–18", "t": "Conditions & Warranties", "h": "Implied terms, description, quality, fitness, sample"}, {"p": 2, "n": 17, "c": "#A8B84A", "s": "S.19–31", "t": "Transfer of Property, Risk & Title", "h": "Passing of property, risk, nemo dat and its exceptions"}, {"p": 2, "n": 18, "c": "#4AA89A", "s": "S.32–45", "t": "Performance of the Contract", "h": "Delivery, acceptance, wrong quantity, instalments"}, {"p": 2, "n": 19, "c": "#8A6AC9", "s": "S.46–55", "t": "Rights of the Unpaid Seller", "h": "Lien, stoppage in transit, resale"}, {"p": 2, "n": 20, "c": "#C95A7A", "s": "S.56–62 (+63–65)", "t": "Breach & Remedies", "h": "Suit for price, damages, specific performance, auction"}];
var MD={"1": {"n": 1, "intro": "S.2 is the Act’s dictionary: ten definitions that every later chapter leans on. Read them as a chain, proposal → acceptance → promise → consideration → agreement → contract, with void and voidable as the exits.", "boundary": "<b>Boundary.</b> S.1 (short title, extent, commencement) is not examined and has no section here. This module covers only S.2’s definitions; the rules that apply them start at S.3 (Module 2).", "recall": "<b>Quick recall</b>Proposal → (accepted) promise → (with consideration) agreement → (enforceable) contract. Exits: void agreement (never enforceable), voidable (one party’s option), void contract (stops being enforceable).", "rails": [{"code": "S.2(a)", "term": "Proposal", "sub": "willingness signified, with a view to obtaining assent", "pidx": [0, 1], "hook": "A proposal is a hand held out. It only counts if it is held out so that the other person can take it.", "plain": "Three ingredients: (1) <b>signifies</b> willingness (so it must be communicated: S.3, S.4); (2) to <b>do or abstain</b> from something; (3) <b>with a view to obtaining the assent</b> of the other. A bare reply to a question, or a shop display, may signify no such willingness. Note that the Act uses “proposal” where English law says “offer”.", "cases": [{"n": "Harvey v Facey", "c": "[1893] AC 552 (PC)", "t": "A statement of the lowest price a seller would take, given in answer to an enquiry, was not an offer to sell. The buyer’s “acceptance” was therefore a new offer, never accepted.", "v": 1}, {"n": "Pharmaceutical Society of Great Britain v Boots Cash Chemists (Southern) Ltd", "c": "[1953] EWCA Civ 6 (CA)", "t": "Goods displayed on shelves with a price are an invitation to treat; the customer makes the offer at the till. Page checked online gave the neutral citation only.", "v": 1}], "links": [{"l": "S.3: how a proposal is communicated", "m": 2, "sec": "S.3"}, {"l": "S.4: when it is complete", "m": 2, "sec": "S.4"}], "secs": ["2"], "ess": "Agreement (offer)", "exam": 1, "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "In this Act the following words and expressions are used in the following senses, unless a contrary intention appears from the context:–", "l": 0}, {"t": "(a) When one person signifies to another his willingness to do or to abstain from doing anything, with a view to obtaining the assent of that other to such act or abstinence, he is said to make a proposal:", "l": 1}], "ills": []}]}, {"code": "S.2(b)", "term": "Acceptance, and promise", "sub": "assent turns a proposal into a promise", "pidx": [2], "hook": "Proposal plus “yes” equals promise. Nothing else changes the name.", "plain": "Acceptance is <b>signified assent</b> to the proposal. The accepted proposal <b>becomes a promise</b>. What counts as valid assent (absolute, unqualified, in the right manner) is in S.7.", "cases": [], "links": [{"l": "S.7: acceptance must be absolute", "m": 2, "sec": "S.7"}, {"l": "S.8: acceptance by conduct", "m": 2, "sec": "S.8"}], "secs": ["2"], "ess": "Agreement (acceptance)", "exam": 1, "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(b) When the person to whom the proposal is made signifies his assent thereto, the proposal is said to be accepted. A proposal, when accepted becomes a promise:", "l": 1}], "ills": []}]}, {"code": "S.2(c)", "term": "Promisor and promisee", "sub": "who makes the proposal, who accepts it", "pidx": [3], "hook": "Promisor promises; promisee receives the promise.", "plain": "Roles, not people. The person <b>making the proposal</b> is the promisor; the person <b>accepting</b> is the promisee. In a contract of reciprocal promises each party is both promisor and promisee.", "cases": [], "links": [], "secs": ["2"], "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(c) The person making the proposal is called the \"promisor\", and the person accepting the proposal is called the \"promisee\":", "l": 1}], "ills": []}]}, {"code": "S.2(d)", "term": "Consideration", "sub": "at the desire of the promisor: past, present or promised", "pidx": [4], "hook": "The price tag on a promise. Under this Act the price can be paid by a stranger, and it can be paid before the promise is made.", "plain": "Four features: (1) <b>at the desire of the promisor</b>: the act must be wanted by him; (2) done by <b>the promisee or any other person</b>, so a stranger’s act can be consideration; (3) <b>has done / does / promises to do</b>: past, present and future acts all qualify; (4) it may be an <b>abstinence</b> as well as an act. <b>Contrast English law</b>, where consideration must move from the promisee and past consideration is no consideration.", "cases": [{"n": "Currie v Misa", "c": "(1875) LR 10 Ex 153 (Ex Ch); (1875–76) LR 1 App Cas 554 (HL)", "t": "The classic English definition: a “right, interest, profit or benefit” to one party, or some “forbearance, detriment, loss or responsibility” given by the other. Comparative only; S.2(d) is worded differently.", "v": 1}, {"n": "Dunlop Pneumatic Tyre Co Ltd v Selfridge & Co Ltd", "c": "[1915] AC 847 (HL)", "t": "Dunlop could not enforce a price-maintenance promise against Selfridge, with whom it had no contract. English privity and consideration rules; the page checked did not itself state the “moves from the promisee” rule.", "v": 1}, {"n": "Chinnaya v Ramayya", "c": "Madras High Court (page checked gives 1876; ILR citation not verified)", "t": "Consideration may be furnished by a third person at the promisor’s desire, so the promisor was bound to pay the annuity. Cited in Indian sources for the “any other person” limb of S.2(d).", "v": 2}], "links": [{"l": "S.25: agreement without consideration", "m": 5, "sec": "S.25"}, {"l": "S.10: what makes an agreement a contract", "m": 3, "sec": "S.10"}], "secs": ["2"], "ess": "Lawful consideration", "exam": 1, "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(d) When, at the desire of the promisor, the promisee or any other person has done or abstained from doing, or does or abstains from doing, or promises to do or to abstain from doing, something, such act or abstinence or promise is called a consideration for the promise:", "l": 1}], "ills": []}]}, {"code": "S.2(e)", "term": "Agreement", "sub": "promises that are the consideration for each other", "pidx": [5], "hook": "Two promises that lean on each other like cards in a house of cards. Remove one and the other falls.", "plain": "Every <b>promise</b>, and every <b>set of promises forming the consideration for each other</b>, is an agreement. So an agreement is wider than a contract: not every agreement is enforceable (see S.2(g), S.2(h)).", "cases": [], "links": [{"l": "S.10: agreements that are contracts", "m": 3, "sec": "S.10"}], "secs": ["2"], "ess": "Agreement", "exam": 1, "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(e) Every promise and every set of promises, forming the consideration for each other, is an agreement:", "l": 1}], "ills": []}]}, {"code": "S.2(f)", "term": "Reciprocal promises", "sub": "promises that are consideration for each other", "pidx": [6], "hook": "“I’ll paint if you’ll pay”: each promise is the other’s price.", "plain": "Promises that form <b>the whole or part of the consideration</b> for each other. They drive the rules on order of performance and default in Ch. IV.", "cases": [], "links": [{"l": "S.51–54: reciprocal promises (Module 7)", "m": 7, "sec": "S.51"}], "secs": ["2"], "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(f) Promises which form the consideration or part of the consideration for each other are called reciprocal promises:", "l": 1}], "ills": []}]}, {"code": "S.2(g)", "term": "Void agreement", "sub": "not enforceable by law", "pidx": [7], "hook": "A void agreement is a cheque drawn on an account that never existed.", "plain": "An agreement <b>not enforceable by law</b>. Void from the start: no right can be built on it. Contrast S.2(j), where something that was a contract later <b>ceases</b> to be enforceable.", "cases": [], "links": [{"l": "S.2(j): contract that becomes void", "m": 1, "sec": "S.2(j)"}, {"l": "S.2(i): voidable contract", "m": 1, "sec": "S.2(i)"}], "secs": ["2"], "feeds": "Not expressly void", "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(g) An agreement not enforceable by law is said to be void:", "l": 1}], "ills": []}]}, {"code": "S.2(h)", "term": "Contract", "sub": "an agreement enforceable by law", "pidx": [8], "hook": "Agreement plus the law’s blessing equals contract.", "plain": "Only an <b>agreement enforceable by law</b> is a contract. S.10 says which agreements qualify: free consent, competent parties, lawful consideration, lawful object, and not expressly declared void.", "cases": [], "links": [{"l": "S.10: what agreements are contracts", "m": 3, "sec": "S.10"}], "secs": ["2"], "ess": "All six, together", "exam": 1, "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(h) An agreement enforceable by law is a contract:", "l": 1}], "ills": []}]}, {"code": "S.2(i)", "term": "Voidable contract", "sub": "enforceable at the option of one party only", "pidx": [9], "hook": "A voidable contract is a door only one party holds the key to.", "plain": "A contract enforceable at the <b>option of one or more parties but not of the other(s)</b>. Valid until the innocent party chooses to avoid it. Typical sources: coercion, undue influence, fraud, misrepresentation (S.19).", "cases": [], "links": [{"l": "S.19: voidability without free consent", "m": 4, "sec": "S.19"}, {"l": "S.64: consequences of rescission", "m": 9, "sec": "S.64"}], "secs": ["2"], "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(i) An agreement which is enforceable by law at the option of one or more of the parties thereto, but not at the option of the other or others, is a voidable contract:", "l": 1}], "ills": []}]}, {"code": "S.2(j)", "term": "Contract that becomes void", "sub": "ceases to be enforceable, then void", "pidx": [10], "hook": "A contract that was healthy when signed and fell ill afterwards: the law pronounces it void at the moment of failure.", "plain": "A <b>contract</b> (so it was enforceable) that <b>ceases to be enforceable</b> becomes void <b>when</b> it ceases. The clock matters: before that moment it was valid. Classic triggers are supervening impossibility (S.56) and contingent contracts failing (S.32, S.35).", "cases": [], "links": [{"l": "S.56: impossibility and frustration", "m": 8, "sec": "S.56"}, {"l": "S.2(g): void agreement", "m": 1, "sec": "S.2(g)"}], "secs": ["2"], "blocks": [{"h": "S.2 Interpretation-clause.", "paras": [{"t": "(j) A contract which ceases to be enforceable by law becomes void when it ceases to be enforceable.", "l": 1}], "ills": []}]}], "spar": [{"q": "A says to B: “My lowest price for the car is Rs 5,00,000.” B replies: “I accept.” Is there a promise under S.2(a) and (b)?", "a": "<b>Probably not.</b> S.2(a) requires that A <i>signify his willingness</i> to sell <i>with a view to obtaining B’s assent</i>. A statement of the lowest acceptable price, given in answer to an enquiry, is arguably only information (Harvey v Facey, comparative). B’s “I accept” then becomes a fresh proposal that A has not accepted. <i>Open to argument:</i> the Act’s wording does not mention invitations to treat, so the line is drawn by interpretation, not by text."}, {"q": "At B’s request, A paints B’s house. Weeks later B promises to pay Rs 5,000 for the painting. Is the painting consideration for B’s promise?", "a": "<b>Yes, on the text of S.2(d).</b> Consideration includes what the promisee “has done” <i>at the desire of the promisor</i>; the act is past but was done at B’s request. English law would call this “past consideration” and refuse it; S.2(d) is drafted wider. The desire must exist when the act is done, not be supplied afterwards."}, {"q": "A promises B Rs 1,000 if C, a stranger to the promise, repairs A’s wall. C repairs it at A’s desire. B sues A. Does the fact that B himself gave nothing defeat B on consideration?", "a": "<b>Not on S.2(d).</b> Consideration may be supplied by “the promisee or any other person”, so C’s act at A’s desire can suffice even though B did nothing. English law would reject this (consideration must move from the promisee). <b>But separate the issues:</b> consideration is one question; whether a stranger to the <i>contract</i> may sue (privity) is another, and S.2(d) does not answer it. <i>Open to argument</i> how far a Pakistani court would carry the point."}, {"q": "Classify each under S.2(g), (i) or (j): (1) a contract induced by coercion; (2) an agreement with a person of unsound mind; (3) a contract for goods that perish, without fault, before delivery.", "a": "<b>(1) Voidable, S.2(i):</b> enforceable at the option of the coerced party (S.19). <b>(2) Void agreement, S.2(g)</b>, because incompetence to contract (S.11, S.12) means no enforceable agreement arises; see Module 3. <b>(3) Void under S.2(j):</b> a contract that was valid becomes void when it ceases to be enforceable (impossibility, S.56). The test is the <i>timing</i>: void from the start, voidable at one party’s option, or valid until a later event."}]}, "2": {"n": 2, "intro": "Chapter I of the Act: how a proposal becomes a promise. When a proposal, an acceptance or a revocation is “made”, when it is “complete”, how a proposal dies, and what makes an acceptance absolute. Tap a section to open it.", "boundary": "<b>Boundary.</b> S.2 (definitions of proposal, promise, acceptance) sits in Module 1; S.10 onward (what makes an agreement a contract) in Module 3. This module covers only the mechanics of S.3–9.", "recall": "<b>Quick recall</b>The windows close crosswise. The proposer can revoke only until the acceptor posts; the acceptor can revoke only until the letter reaches the proposer. Posting is the proposer’s deadline, receipt is the acceptor’s.", "rails": [{"secs": ["3"], "code": "S.3", "term": "Communication, acceptance and revocation of proposals", "sub": "when a proposal, acceptance or revocation is “made”", "hook": "Words are not required. A nod, a wave or a keystroke counts if it was meant to communicate, or if it does communicate.", "plain": "Two tests, joined by “or”: the act or omission was <b>intended</b> to communicate, <b>or</b> it <b>has the effect</b> of communicating. Either is enough. Covers all three events: proposal, acceptance, revocation. Note “omission”, which matters for silence (see S.7 sparring).", "cases": [], "links": [{"l": "Module 1: S.2 definitions", "m": 1}, {"l": "SGA S.5: contract of sale how made", "m": 15}], "feeds": "Agreement", "blocks": [{"h": "S.3 Communication, acceptance and revocation of proposals.", "paras": [{"t": "The communication of proposals, the acceptance of proposals, and the revocation of proposals and acceptances, respectively, are deemed to be made by any act or omission of the party proposing, accepting or revoking by which he intends to communicate such proposal, acceptance or revocation, or which has the effect of communicating it.", "l": 0}], "ills": []}]}, {"secs": ["4"], "code": "S.4", "term": "Communication when complete", "sub": "three clocks: proposal, acceptance, revocation", "hook": "The postbox is a one-way door. Once the acceptance drops in, the acceptor cannot reach it; the proposer is bound at once. The acceptor himself is bound only when the proposer learns of it.", "plain": "Three events, each with a split clock. <b>Proposal:</b> complete on the offeree’s knowledge. <b>Acceptance:</b> against the proposer on posting; against the acceptor on the proposer’s knowledge. <b>Revocation:</b> against the revoker on despatch; against the other party on knowledge. “Out of the power of” the sender is the key phrase.", "cases": [{"n": "Adams v Lindsell", "c": "(1818) 1 B & Ald 681; 106 ER 250 (King’s Bench)", "t": "Acceptance posted: the contract was concluded at posting even though the letter arrived late through the offeror’s own misdirection. The origin of the postal rule that S.4 codifies.", "v": 1}, {"n": "Household Fire and Carriage Accident Insurance Co Ltd v Grant", "c": "(1879) 4 Ex D 216 (CA)", "t": "The postal rule carried to its limit: contract formed on posting even though the letter never arrived. Thesiger LJ for the majority; Bramwell LJ dissented (acceptance should bind only on arrival).", "v": 1}], "links": [{"l": "S.5: when each window closes", "m": 2, "sec": "S.5"}, {"l": "SGA S.5: contract of sale how made", "m": 15}], "feeds": "Agreement", "exam": 1, "blocks": [{"h": "S.4 Communication when complete.", "paras": [{"t": "The communication of a proposal is complete when it comes to the knowledge of the person to whom it is made.", "l": 0}, {"t": "The communication of an acceptance is complete,–", "l": 0}, {"t": "as against the proposer, when it is put in a course of transmission to him, so as to be out of the power of the acceptor;", "l": 1}, {"t": "as against the acceptor, when it comes to the knowledge of the proposer.", "l": 1}, {"t": "The communication of a revocation is complete,–", "l": 0}, {"t": "as against the person who makes it, when it is put into a course of transmission to the person to whom it is made, so as to be out of the power of the person who makes it;", "l": 1}, {"t": "as against the person to whom it is made, when it comes to his knowledge.", "l": 1}], "ills": [{"t": "(a) A proposes, by letter, to sell a house to B at a certain price. The communication of the proposal is complete when B receives the letter.", "l": 0}, {"t": "(b) B accepts A's proposal by a letter sent by post. The communication of the acceptance is complete,– as against A, when the letter is posted; as against B, when the letter is received by A.", "l": 0}, {"t": "(c) A revokes his proposal by telegram. The revocation is complete as against A when the telegram is despatched. It is complete as against B when B receives it. B revokes his acceptance by telegram. B's revocation is complete as against B when the telegram is dispatched, and as against A when it reaches him.", "l": 0}]}]}, {"secs": ["5"], "code": "S.5", "term": "Revocation of proposals and acceptances", "sub": "the window closes when acceptance is complete", "hook": "Two doors, two deadlines. The proposer must retract before the acceptor posts. The acceptor must retract before the letter lands on the proposer’s desk.", "plain": "Read S.5 with S.4: “complete as against the proposer” means posted; “complete as against the acceptor” means it reached the proposer. So the proposer’s window ends at posting; the acceptor’s ends at receipt. Between those two moments the acceptor alone can still withdraw.", "cases": [{"n": "Routledge v Grant", "c": "(1828) 4 Bing 653; 130 ER 920 (Common Pleas)", "t": "An offer can be withdrawn at any time before it is accepted, even if it was said to stay open for a stated period. Comparative support for S.5’s first paragraph.", "v": 2}], "links": [{"l": "S.4: the three clocks", "m": 2, "sec": "S.4"}, {"l": "S.6: how a proposal is revoked", "m": 2, "sec": "S.6"}], "feeds": "Agreement", "exam": 1, "blocks": [{"h": "S.5 Revocation of proposals and acceptances.", "paras": [{"t": "A proposal may be revoked at any time before the communication of its acceptance is complete as against the proposer, but not afterwards.", "l": 0}, {"t": "An acceptance may be revoked at any time before the communication of the acceptance is complete as against the acceptor, but not afterwards.", "l": 0}], "ills": [{"t": "A proposes, by a letter sent by post, to sell his house to B. B accepts the proposal by a letter sent by post. A may revoke his proposal at any time before or at the moment when B posts his letter of acceptance, but not afterwards. B may revoke his acceptance as any time before or at the moment when the letter communicating it reaches A, but not afterwards.", "l": 0}]}]}, {"secs": ["6"], "code": "S.6", "term": "Revocation how made", "sub": "four ways a proposal comes to an end", "hook": "A proposal dies in four ways: told, timed out, condition failed, or the proposer died or lost his mind and the acceptor knew.", "plain": "An exhaustive list of four. (1) Notice, which must be <b>communicated</b> (S.4). (2) Time: the stated period, else a <b>reasonable time</b>, which is a question of fact. (3) A <b>condition precedent</b> to acceptance not met. (4) Death or insanity of the proposer, but only if the acceptor <b>knew</b> before accepting. Counter-offer is not listed; it operates through S.7(1) (see Hyde v Wrench at S.7).", "cases": [], "links": [{"l": "S.4(c): communication of revocation", "m": 2, "sec": "S.4"}], "feeds": "Agreement", "blocks": [{"h": "S.6 Revocation how made.", "paras": [{"t": "A proposal is revoked–", "l": 0}, {"t": "(1) by the communication of notice of revocation by the proposer to the other party;", "l": 1}, {"t": "(2) by the laps of the time prescribed in such proposal for its acceptance, or, if no time is so prescribed, by the lapse of a reasonable time, without communication of the acceptance;", "l": 1}, {"t": "(3) by the failure of the acceptor to fulfil a condition precedent to acceptance; or", "l": 1}, {"t": "(4) by the death or insanity of the proposer, if the fact of his death or insanity comes to the knowledge of the acceptor before acceptance.", "l": 1}], "ills": []}]}, {"secs": ["7"], "code": "S.7", "term": "Acceptance must be absolute", "sub": "unqualified, and in the usual or prescribed manner", "hook": "Say “yes, but” and you have said “no”, and offered something new.", "plain": "<b>Limb 1:</b> any variation of terms is a counter-proposal, not an acceptance. <b>Limb 2:</b> manner. If the proposal prescribes a manner and the acceptor ignores it, the proposer has a <b>reasonable time</b> to insist; <b>silence by the proposer = he accepts the acceptance</b>. The prescribed manner is therefore for the proposer’s protection and can be waived.", "cases": [{"n": "Hyde v Wrench", "c": "(1840) 3 Beav 334; 49 ER 132 (Chancery)", "t": "A counter-offer of £950 rejected the £1,000 offer; the offeree could not later revive it by agreeing to £1,000. Shows S.7(1) at work.", "v": 1}, {"n": "Felthouse v Bindley", "c": "(1862) 11 CB (NS) 869; 142 ER 1037 (Common Pleas)", "t": "The uncle could not impose a sale on his nephew by declaring that silence would mean acceptance. Later cases (e.g. Brogden v Metropolitan Railway) qualified the rule.", "v": 1}], "links": [{"l": "S.6: counter-offer and revocation", "m": 2, "sec": "S.6"}, {"l": "Module 3: S.10 essentials", "m": 3}], "feeds": "Agreement", "exam": 1, "blocks": [{"h": "S.7 Acceptance must be absolute.", "paras": [{"t": "In order to convert a proposal into a promise, the acceptance must–", "l": 0}, {"t": "(1) be absolute and unqualified;", "l": 1}, {"t": "(2) be expressed in some usual and reasonable manner, unless the proposal prescribes the manner in which it is to be accepted. If the proposal prescribes a manner in which it is to be accepted, and the acceptance is not made in such manner, the proposer may, within a reasonable time after the acceptance is communicated to him, insist that his proposal shall be accepted in the prescribed manner, and not otherwise; but if he fails to do so, he accepts the acceptance.", "l": 1}], "ills": []}]}, {"secs": ["8"], "code": "S.8", "term": "Acceptance by performing conditions, or receiving consideration", "sub": "conduct as acceptance", "hook": "Sometimes the proposer asks for deeds, not words. Do the deed and you have accepted.", "plain": "Two routes to acceptance by conduct: <b>performing the conditions</b> of the proposal, or <b>accepting consideration</b> offered for a reciprocal promise. No separate notice is required by the section’s words; Carlill treats performance as sufficient acceptance for a unilateral offer.", "cases": [{"n": "Carlill v Carbolic Smoke Ball Co", "c": "[1893] 1 QB 256 (CA); [1892] EWCA Civ 1", "t": "An advertisement offering £100 to anyone who used the smoke ball as directed and caught influenza was an offer to the world, accepted by performing the conditions without notifying the company. Lindley, Bowen and A L Smith LJJ.", "v": 1}], "links": [{"l": "S.3: acts as communication", "m": 2, "sec": "S.3"}], "feeds": "Agreement", "blocks": [{"h": "S.8 Acceptance by performing, conditions, or receiving consideration.", "paras": [{"t": "Performance of the conditions of a proposal, or the acceptance of any consideration for a reciprocal promise which may be offered with a proposal, is an acceptance of the proposal.", "l": 0}], "ills": []}]}, {"secs": ["9"], "code": "S.9", "term": "Promises, express and implied", "sub": "in words, or otherwise than in words", "hook": "Boarding a bus without saying a word is still a promise to pay the fare.", "plain": "The test is the <b>mode</b> of proposal or acceptance, not the strength of the promise. In words (spoken or written): express. By conduct: implied. Both bind equally. The bus example is a teaching illustration, not authority.", "cases": [], "links": [{"l": "S.3: acts or omissions", "m": 2, "sec": "S.3"}, {"l": "S.8: acceptance by conduct", "m": 2, "sec": "S.8"}], "feeds": "Agreement", "blocks": [{"h": "S.9 Promises, express and implied.", "paras": [{"t": "In so far as the proposal or acceptance of any promise is made in words, the promise is said to be express. In so far as such proposal or acceptance is made otherwise than in words, the promise is said to be implied.", "l": 0}], "ills": []}]}], "spar": [{"q": "A offers to sell his house to B. On Sunday A posts a letter revoking the offer. On Monday B posts a letter accepting. The revocation reaches B on Tuesday. Is there a contract? Argue it from S.4 and S.5.", "a": "<b>Yes, on the Act’s wording.</b> S.5 lets A revoke only until B’s acceptance is complete <i>as against the proposer</i>. Under S.4(b) that is when B <b>posts</b>: Monday. A’s revocation, under S.4(c), is complete <i>as against B</i> only when it comes to B’s knowledge: Tuesday. On Monday B did not know, so the revocation was not yet complete against him; the acceptance was complete first. <i>Open to argument:</i> A’s posting on Sunday completes the revocation “as against the person who makes it” only, which does not bind B."}, {"q": "B posts his acceptance on Monday. On Tuesday morning he sends a telegram revoking it, and the telegram reaches A before the letter does. Is B bound?", "a": "<b>No.</b> S.5, second paragraph: an acceptance may be revoked until its communication is complete <i>as against the acceptor</i>, that is (S.4(b)) until the letter comes to A’s knowledge. The Act’s own illustration to S.5 says B may revoke “at any time before or at the moment when the letter communicating it reaches A”. The telegram arrives first, so B’s revocation is effective and no contract forms."}, {"q": "Why does the Act bind the proposer on posting but the acceptor only on the proposer’s knowledge? Whose risk is being allocated, and to whom?", "a": "<b>The logic:</b> a party is bound once the act is “out of the power of” the person who made it (S.4). The proposer chose to deal at a distance and so carries the risk of the post; he cannot recall the acceptance. The acceptor, by contrast, can still beat the letter with a faster message (S.5), so he is not bound until the proposer knows. <i>Open to argument:</i> this favours the acceptor; the dissent in Household Fire v Grant argued for the opposite rule. The statute settles the question in Pakistan; the cases are comparative."}, {"q": "A writes: “If I hear nothing from you by Friday, I shall take it that you accept.” B says nothing. Is there a contract? Use S.3 and S.7(1), and flag any tension.", "a": "<b>Ordinarily no.</b> S.7(1) requires an acceptance that is “absolute and unqualified”, and A cannot make B’s silence an acceptance (Felthouse v Bindley, comparative). <b>The tension:</b> S.3 says acceptance is made by “any act or omission” by which the acceptor intends to communicate it, or which has that effect. An omission can therefore accept if B <i>meant</i> it as acceptance. So the question is B’s intention, not A’s declaration. <i>Open to argument</i> how far S.3 departs from the English silence rule."}, {"q": "A’s proposal says: “Reply by registered post only.” B replies by email, accepting. What are A’s options under S.7(2), and what if A does nothing?", "a": "A may, <b>within a reasonable time after the acceptance is communicated to him</b>, insist that the proposal be accepted in the prescribed manner and not otherwise. If A <b>fails to do so, he accepts the acceptance</b> (S.7(2)), so the contract stands. The prescribed manner exists for the proposer’s benefit; he can waive it by silence. What counts as a “reasonable time” is a question of fact."}]}, "3": {"n": 3, "intro": "Chapter II begins. S.10 is the recipe for a contract; S.11 to S.14 explain two of its ingredients: parties competent to contract (S.11, S.12), and free consent (S.13, S.14). Consideration, object and the void list follow in Module 5.", "boundary": "<b>Boundary.</b> S.10 refers forward to S.23 (lawful consideration and object) and the other express voids (S.20, S.24–30A, S.36, S.56–57), which sit in Module 5, and to coercion, undue influence, fraud, misrepresentation and mistake (S.15–22), which sit in Module 4.", "recall": "<b>Quick recall</b>S.10’s five ingredients: free consent · competent parties · lawful consideration · lawful object · not expressly void. Competence = age + sound mind + not disqualified. Consent = same thing, same sense; free consent = not spoiled by the five S.14 factors.", "rails": [{"secs": ["10"], "code": "S.10", "term": "What agreements are contracts", "sub": "the five-ingredient test", "hook": "S.10 is the recipe: free consent + competent parties + lawful consideration + lawful object, and no express “void” label. Miss one and the dish is not a contract.", "plain": "An agreement is a contract (S.2(h)) only if <b>all</b> of these are present: (1) <b>free consent</b> of the parties (S.13–22); (2) parties <b>competent</b> to contract (S.11–12); (3) <b>lawful consideration</b> (S.23, S.25); (4) a <b>lawful object</b> (S.23); and (5) it is <b>not expressly declared void</b>. The Act declares void: S.20 (common mistake of fact), S.24 (unlawful in part), S.25 (no consideration, unless excepted), S.26 (restraint of marriage), S.27 (restraint of trade), S.28 (restraint of legal proceedings), S.29 (uncertainty), S.30 (wager) and S.30A (collateral to wager), S.36 (contingent on an impossible event), S.56 (impossible act) and S.57 (the illegal part of a mixed promise). <b>Second paragraph:</b> S.10 does not displace other laws that require a contract to be in writing, witnessed or registered; those requirements still have to be met.", "cases": [], "links": [{"l": "S.2(h): contract defined", "m": 1, "sec": "S.2(h)"}, {"l": "S.23: lawful consideration and object", "m": 5, "sec": "S.23"}], "ess": "All six: the master test", "exam": 1, "blocks": [{"h": "S.10 What agreements are contracts.", "paras": [{"t": "All agreements are contracts if they are made by the free consent of parties competent to contract, for a lawful consideration and with a lawful object, and are not hereby expressly declared to be void.", "l": 0}, {"t": "Nothing herein contained shall affect any law in force in [Pakistan], and not hereby expressly repealed, by which any contract is required to be made in writing or in the presence of witnesses, or any law relating to the registration of documents.", "l": 0}], "ills": []}]}, {"secs": ["11"], "code": "S.11", "term": "Who are competent to contract", "sub": "majority, sound mind, not disqualified", "hook": "Three gates: old enough, clear-headed, not barred. Fail any gate and the agreement does not become a contract.", "plain": "Competent means all three: (1) <b>age of majority</b> according to the law the person is subject to (the Majority Act, 1875 sets it, see caveats); (2) <b>sound mind</b> (S.12); (3) <b>not disqualified</b> by any law. If a party is incompetent there is no contract; the agreement falls under S.2(g) as void. See Mohori Bibee for the Privy Council’s treatment of a minor’s agreement.", "cases": [{"n": "Mohori Bibee v Dharmodas Ghose", "c": "[1903] UKPC 12; (1903) LR 30 IA 114 (PC)", "t": "A minor’s mortgage was “absolutely void” from the beginning, so he could not be made to repay the loan money he had received. The online page gave 4 March 1902 as the decision date but 1903 in the citation; the discrepancy was not resolved.", "v": 2}], "links": [{"l": "S.12: sound mind", "m": 3, "sec": "S.12"}, {"l": "S.68: necessaries supplied to a minor (Module 10)", "m": 10, "sec": "S.68"}, {"l": "S.65: restoring advantage under a void agreement", "m": 9, "sec": "S.65"}], "ess": "Competent parties", "exam": 1, "blocks": [{"h": "S.11 Who are competent to contract.", "paras": [{"t": "Every person is competent to contract who is of the age of majority according to the law to which he is subject , and who is of sound mind, and is not disqualified from contracting by any law to which he is subject.", "l": 0}], "ills": []}]}, {"secs": ["12"], "code": "S.12", "term": "What is a sound mind for contracting", "sub": "capable of understanding and forming a rational judgment", "hook": "Sound mind is judged at the moment of signing, not by the person’s general reputation.", "plain": "The test is <b>functional and time-specific</b>: at the moment of contracting, can he (1) <b>understand</b> the contract and (2) <b>form a rational judgment</b> on its effect on his interests? <b>Intermittent cases:</b> usually unsound but sometimes sound, may contract while sound; usually sound but sometimes unsound, may not contract while unsound. Illustration (b) lists delirium and drunkenness. The section says such a person “cannot contract”; whether the result is void or voidable is <i>open to argument</i>.", "cases": [], "links": [{"l": "S.11: competence", "m": 3, "sec": "S.11"}], "ess": "Competent parties", "blocks": [{"h": "S.12 What is a sound mind for the purposes of contracting.", "paras": [{"t": "A person is said to be of sound mind for the purpose of making a contract if, at the time when he makes it, he is capable of understanding it and of forming a rational judgment as to its effect upon his interests.", "l": 0}, {"t": "A person who is usually of unsound mind, but occasionally of sound mind, may make a contract when he is of sound mind.", "l": 0}, {"t": "A person who is usually of sound mind, but occasionally of unsound mind, may not make a contract when he is of unsound mind.", "l": 0}], "ills": [{"t": "(a) A patient in a lunatic asylum, who is at intervals of sound mind, may contract during those intervals.", "l": 0}, {"t": "(b) A sane man, who is delirious from fever or who is so drunk that he cannot understand the terms of a contract or form a rational judgment as to its effect on his interests, cannot contract whilst such delirium or drunkenness lasts.", "l": 0}]}]}, {"secs": ["13"], "code": "S.13", "term": "“Consent” defined", "sub": "the same thing in the same sense", "hook": "Two people nodding at two different ships have not agreed on anything.", "plain": "Consent is <b>agreement on the same thing in the same sense</b>: the Latin tag is <i>consensus ad idem</i>. Two parts: the <b>same thing</b> and the <b>same sense</b>. If each party means something different by the same words, there is no consent and so no agreement. This is the root of the mistake rules in S.20.", "cases": [{"n": "Raffles v Wichelhaus", "c": "(1864) 2 H & C 906 (Exch)", "t": "Two ships called Peerless, one sailing in October and one in December; each party meant a different ship. No meeting of minds, so no enforceable contract.", "v": 1}], "links": [{"l": "S.20: both parties under a mistake of fact", "m": 4, "sec": "S.20"}, {"l": "S.14: free consent", "m": 3, "sec": "S.14"}], "ess": "Free consent", "exam": 1, "blocks": [{"h": "S.13 \"Consent” defined.", "paras": [{"t": "Two or more persons are said to consent when they agree upon the same thing in the same sense.", "l": 0}], "ills": []}]}, {"secs": ["14"], "code": "S.14", "term": "“Free consent” defined", "sub": "not caused by coercion, undue influence, fraud, misrepresentation, mistake", "hook": "Consent can be given and still not be free. S.14 lists the five things that spoil it.", "plain": "Consent is free when it is <b>not caused by</b> (1) coercion (S.15), (2) undue influence (S.16), (3) fraud (S.17), (4) misrepresentation (S.18) or (5) mistake (S.20–22). The causal test: consent is “so caused” when it <b>would not have been given but for</b> the vitiating factor. The effect of unfree consent is in S.19: the contract is generally <b>voidable</b>.", "cases": [], "links": [{"l": "S.15: coercion", "m": 4, "sec": "S.15"}, {"l": "S.19: voidability", "m": 4, "sec": "S.19"}], "ess": "Free consent", "exam": 1, "blocks": [{"h": "S.14 \"Free consent\" defined.", "paras": [{"t": "Consent is said to be free when it is not caused by–", "l": 0}, {"t": "(1) coercion, as defined in section 15, or", "l": 1}, {"t": "(2) undue influence, as defined in section 16,or", "l": 1}, {"t": "(3) fraud, as defined in section 17, or", "l": 1}, {"t": "(4) misrepresentation, as defined in section 18, or", "l": 1}, {"t": "(5) mistake, subject to the provisions of sections 20, 21 and 22.", "l": 1}, {"t": "Consent is said to be so caused when it would not have been given but for the existence of such coercion, undue influence, fraud, misrepresentation or mistake.", "l": 0}], "ills": []}]}], "spar": [{"q": "A and B orally agree that A will sell his house to B for Rs 50 lakh. Both are adults, of sound mind, and acted freely. Has S.10 produced a contract?", "a": "<b>On S.10’s ingredients, yes:</b> free consent, competent parties, lawful consideration and object, and nothing expressly declared void. <b>But read the second paragraph:</b> S.10 does not displace any law that requires writing, witnesses or registration. If another law demands a registered document for a sale of immovable property, that law must also be satisfied. Which law and with what effect belongs to the property statutes, not to this Act. <i>Open to argument</i> how a court would characterise an oral sale that lacks a legally required form."}, {"q": "C, aged 17, signs a loan agreement. On turning 18 he says “I confirm it”. Is C bound? Argue from S.11 and S.2(g).", "a": "<b>Probably not.</b> Competence requires the age of majority (S.11). C was not competent, so no contract arose and the agreement is void under S.2(g). In Mohori Bibee the Privy Council treated a minor’s agreement as “absolutely void”. If void from the start, there is nothing to ratify; a fresh promise on majority would need its own consideration. <i>Open to argument:</i> the age of majority itself comes from the Majority Act, whose Pakistani text I could not verify (see caveats)."}, {"q": "D, who is a patient in a mental hospital but lucid at times, signs a contract during a lucid interval. E, a sane man, signs while delirious from fever. Who is bound?", "a": "<b>D is bound; E is not.</b> S.12(2) lets a usually-unsound person contract during a sound interval (illustration (a)). S.12(3) bars a usually-sound person from contracting while unsound (illustration (b): delirium or drunkenness). The test is <i>at the time he makes it</i>: capable of understanding and of forming a rational judgment as to its effect on his interests. <i>Open to argument:</i> whether E’s agreement is void or merely voidable at his option, since the section says only that he “cannot contract”."}, {"q": "A offers to sell cotton “arriving by the ship Peerless”. There are two ships of that name. A means the October ship; B means the December ship. B sues for non-delivery. What is the position under S.13?", "a": "<b>No contract.</b> S.13 requires agreement “upon the same thing in the same sense”; here there is no consent because each party attached a different meaning to the same words. Raffles v Wichelhaus reached the same result at common law. Under the Act, the mistake rules in S.20 (both parties under a mistake as to a fact essential to the agreement) would make the agreement void."}]}, "4": {"n": 4, "intro": "Chapter II continued. S.15 to S.18 define the four vitiating factors (coercion, undue influence, fraud, misrepresentation); S.19 and S.19A say what they do to a contract (voidable); S.20 to S.22 deal with mistake, the fifth item in the free-consent list of S.14.", "boundary": "<b>Boundary.</b> What a party can claim once a voidable contract is rescinded sits in S.64 (Module 9). Compensation for losses caused by breach is in S.73 (Module 11). S.19 is the pivot between this module and S.2(i) in Module 1.", "recall": "<b>Quick recall</b>Four vitiating factors plus mistake. Coercion, fraud, misrepresentation → voidable (S.19). Undue influence → voidable (S.19A). Bilateral mistake of fact → void (S.20). Unilateral mistake alone → nothing (S.22). Mistake of Pakistani law → nothing (S.21).", "rails": [{"secs": ["15"], "code": "S.15", "term": "“Coercion” defined", "sub": "forbidden act or unlawful detention, to force an agreement", "hook": "Coercion is the weapon on the table before the pen is picked up: a forbidden act, or hostage property.", "plain": "Two routes: (1) <b>committing or threatening</b> any act <b>forbidden by the Pakistan Penal Code</b>; (2) <b>unlawfully detaining or threatening to detain</b> any property. Both must be done <b>with the intention of causing a person to enter into an agreement</b>, and “to the prejudice of any person whatever” (the victim need not be the party). The Explanation: it does not matter whether the Code is in force where the coercion happens (illustration: criminal intimidation on an English ship on the high seas).", "cases": [], "links": [{"l": "S.19: coercion makes the contract voidable", "m": 4, "sec": "S.19"}, {"l": "S.72: money paid under coercion (Module 10)", "m": 10, "sec": "S.72"}], "feeds": "Free consent", "exam": 1, "blocks": [{"h": "S.15 \"Coercion\" defined.", "paras": [{"t": "\"Coercion\" is the committing, or threatening to commit, any act forbidden by the Pakistan Penal Code (XLV of 1860) or the unlawful detaining, or threatening to detain, any property, to the prejudice of any person whatever, with the intention of causing any person to enter into an agreement.", "l": 0}, {"t": "Explanation.– It is immaterial whether the Pakistan Penal Code (XLV of 1860) is or is not in force in the place where the coercion is employed.", "l": 0}], "ills": [{"t": "A, on board an English ship on the high seas, causes B to enter into an agreement by an act amounting to criminal intimidation under the Pakistan Penal Code . A afterwards sues B for breach of contract at [Karachi]. A has employed coercion, although his act is not an offence by the law of England, and although section 506 of the Pakistan Penal Code (XLV of 1860) was not in force at the time when or place where the act was done.", "l": 0}]}]}, {"secs": ["16"], "code": "S.16", "term": "“Undue influence” defined", "sub": "dominating the will and using it for unfair advantage", "hook": "Not a threat but a hold: the nurse, the guardian, the money-lender who can say “sign” and be obeyed.", "plain": "Three layers. (1) <b>Definition:</b> a position to <b>dominate the will</b> of the other <b>and use it to obtain an unfair advantage</b>. (2) <b>Deemed position of domination:</b> real or apparent authority, or fiduciary relation; or contracting with someone whose mental capacity is affected by age, illness or distress. (3) <b>Burden shift:</b> if a dominant party’s transaction looks <b>unconscionable</b>, he must prove it was <b>not</b> induced by undue influence. Illustration (c) (village money-lender) shows the burden shift; (d) (banker in a tight market) shows an ordinary commercial bargain that is <b>not</b> undue influence.", "cases": [{"n": "Allcard v Skinner", "c": "(1887) 36 Ch D 145 (CA)", "t": "Undue influence was found over a woman who joined a religious order and gave away her property, but relief was barred by her delay (laches) in challenging the gift.", "v": 1}], "links": [{"l": "S.19A: remedy for undue influence", "m": 4, "sec": "S.19A"}], "feeds": "Free consent", "exam": 1, "blocks": [{"h": "S.16 \"Undue influence\" defined.", "paras": [{"t": "(1) A contract is said to be induced by \"undue influence\" where the relations subsisting between the parties are such that one of the parties is in a position to dominate the will of the other and uses that position to obtain an unfair advantage over the other.", "l": 1}, {"t": "(2) In particular and without prejudice to the generality of the foregoing principle, a person is deemed to be in a position to dominate the will of another–", "l": 1}, {"t": "(a) where he holds a real or apparent authority over the other, or where he stands in a fiduciary relation to the other; or", "l": 1}, {"t": "(b) where he makes a contract with a person whose mental capacity is temporarily or permanently affected by reason of age, illness, or mental or bodily distress.", "l": 1}, {"t": "(3) Where a person who is in a position to dominate the will of another, enters into a contract with him, and the transaction appears, on the face of it or on the evidence adduced, to be unconscionable, the burden of proving that such contract was not induced by undue influence shall lie upon the person in a position to dominate the will of the other.", "l": 1}, {"t": "Nothing in this sub-section shall affect the provisions of section 111 of the Evidence Act, 1872 .]", "l": 0}], "ills": [{"t": "(a) A having advanced money to his son, B, during his minority, upon B's coming of age obtains, by misuse of parental influence, a bond from B for a greater amount than the sum due in respect of the advance. A employs undue influence.", "l": 0}, {"t": "(b) A, a man enfeebled by disease or age, is induced, by B's influence over him as his medical attendant, to agree to pay B an unreasonable sum for his professional services. B employs undue influence.", "l": 0}, {"t": "(c) A, being in debt to B, the money-lender of his village, contracts a fresh loan on terms which appear to be unconscionable. It lies on B to prove that the contract was not induced by undue influence.", "l": 0}, {"t": "(d) A applies to a banker for a loan at a time when there is stringency in the money market. The banker declines to make the loan except at an unusually high rate of interest. A accepts the loan on these terms. This is a transaction in the ordinary course of business, and the contract is not induced by undue influence.", "l": 0}]}]}, {"secs": ["17"], "code": "S.17", "term": "“Fraud” defined", "sub": "five acts done with intent to deceive; silence only when duty to speak", "hook": "Fraud is a lie with a purpose, a hidden fact kept hidden, or a promise made never meant.", "plain": "All five acts must be done <b>with intent to deceive</b> or to induce the contract, by a party, with his connivance, or by his agent: (1) asserting as fact what he does not believe true; (2) <b>active concealment</b> by one who knows or believes the fact; (3) a promise made <b>without any intention of performing</b> it; (4) any other act <b>fitted to deceive</b>; (5) any act or omission the law specially declares fraudulent. <b>Silence rule (Explanation):</b> mere silence is <b>not</b> fraud unless there is a <b>duty to speak</b> or the silence is <b>equivalent to speech</b>. Illustrations: seller of an unsound horse who says nothing (not fraud); father and daughter just of age (duty to speak); “if you do not deny it I shall assume” (silence is speech); traders with private price information (no duty).", "cases": [{"n": "Derry v Peek", "c": "(1889) 14 App Cas 337 (HL)", "t": "Directors honestly believed a tramway prospectus statement that steam power was permitted. No fraud without knowledge of falsity, no belief in truth, or recklessness; mere lack of reasonable grounds is not fraud.", "v": 1}], "links": [{"l": "S.18: misrepresentation", "m": 4, "sec": "S.18"}, {"l": "S.19: effect of fraud", "m": 4, "sec": "S.19"}], "feeds": "Free consent", "exam": 1, "blocks": [{"h": "S.17 \"Fraud\" defined.", "paras": [{"t": "\"Fraud\" means and includes any of the following acts committed by a party to a contract, or with his connivance, or by his agent, with intent to deceive another party thereto or his agent, or to induce him to enter into the contract:–", "l": 0}, {"t": "(1) the suggestion, as a fact, of that which is not true, by one who does not believe it to be true;", "l": 1}, {"t": "(2) the active concealment of a fact by one having knowledge or belief of the fact;", "l": 1}, {"t": "(3) a promise made without any intention of performing it;", "l": 1}, {"t": "(4) any other act fitted to deceive;", "l": 1}, {"t": "(5) any such act or omission as the law specially declares to be fraudulent.", "l": 1}, {"t": "Explanation.– Mere silence as to facts likely to affect the willingness of a person to enter into a contract is not fraud, unless the circumstances of the case are such that, regard being had to them, it is the duty of the person keeping silence to speak, or unless his silence is, in itself, equivalent to speech.", "l": 0}], "ills": [{"t": "(a) A sells, by auction, to B, a horse which A knows to be unsound. A says nothing to B about the horse's unsoundness. This is not fraud in A.", "l": 0}, {"t": "(b) B is A's daughter and has just come of age. Here, the relation between the parties would make it A's duty to tell B if the horse is unsound.", "l": 0}, {"t": "(c) B says to A- \"If you do not deny it, I shall assume that the horse is sound.\" A says nothing. Here, A's silence is equivalent to speech.", "l": 0}, {"t": "(d) A and B, being traders, enter upon a contract. A has private information of a change in prices which would affect B's willingness to proceed with the contract. A is not bound to inform B.", "l": 0}]}]}, {"secs": ["18"], "code": "S.18", "term": "“Misrepresentation” defined", "sub": "innocent but misleading: unwarranted assertion, breach of duty, innocent mistake induced", "hook": "Fraud lies on purpose; misrepresentation is honest but wrong, and still has consequences.", "plain": "Three heads, <b>none</b> requiring intent to deceive: (1) a <b>positive assertion, not warranted by the information</b> of the maker, of something untrue, <b>though he believes it true</b>; (2) <b>breach of duty</b> that, without intent to deceive, gains an advantage by misleading another to his prejudice; (3) <b>causing, however innocently</b>, a party to make a mistake <b>as to the substance</b> of the thing which is the subject of the agreement. Compare S.17: intent to deceive is what lifts fraud above misrepresentation.", "cases": [], "links": [{"l": "S.17: fraud", "m": 4, "sec": "S.17"}, {"l": "S.19: Exception on means of discovering truth", "m": 4, "sec": "S.19"}], "feeds": "Free consent", "exam": 1, "blocks": [{"h": "S.18 \"Misrepresentation\" defined.", "paras": [{"t": "“Misrepresentation\" means and includes–", "l": 0}, {"t": "(1) the positive assertion, in a manner not warranted by the information of the person making it, of that which is not true, though he believes it to be true;", "l": 1}, {"t": "(2) any breach of duty which, without an intent to deceive, gains an advantage to the person committing it, or any one claiming under him, by misleading another to his prejudice or to the prejudice of any one claiming under him;", "l": 1}, {"t": "(3) causing, however innocently, a party to an agreement to make a mistake as to the substance of the thing which is the subject of the agreement.", "l": 1}], "ills": []}]}, {"secs": ["19"], "code": "S.19", "term": "Voidability of agreements without free consent", "sub": "coercion, fraud, misrepresentation: voidable at the option of the deceived party", "hook": "The innocent party holds the switch: avoid the contract, or insist on it and be made whole.", "plain": "<b>Rule:</b> consent caused by coercion, fraud or misrepresentation makes the agreement <b>voidable at the option</b> of the party whose consent was so caused. <b>Alternative:</b> a party defrauded or misled may <b>insist on performance</b> and be put in the position as if the representations were true. <b>Exception:</b> where consent was caused by <b>misrepresentation or fraudulent silence</b> and the party <b>had the means of discovering the truth with ordinary diligence</b>, the contract is <b>not</b> voidable (note: active fraud is not named in the Exception). <b>Explanation:</b> if the fraud or misrepresentation did <b>not cause</b> the consent, nothing is voidable. The printed text shows “[***]” where “undue influence” was removed; it now lives in S.19A.", "cases": [{"n": "Redgrave v Hurd", "c": "(1881) 20 Ch D 1 (CA)", "t": "A solicitor overstated his practice’s income. The buyer could rescind for innocent misrepresentation and had no duty to check the documents he was offered.", "v": 1}], "links": [{"l": "S.19A: undue influence", "m": 4, "sec": "S.19A"}, {"l": "S.64: consequences of rescission (Module 9)", "m": 9, "sec": "S.64"}, {"l": "S.2(i): voidable contract", "m": 1, "sec": "S.2(i)"}], "feeds": "Free consent", "exam": 1, "blocks": [{"h": "S.19 Voidability of agreements without free consent. 19A. Power to set aside contract induced by undue influence.", "paras": [{"t": "When consent to an agreement is caused by coercion, [***] fraud or misrepresentation, the agreement is a contract viodable at the option of the party whose consent was so caused.", "l": 0}, {"t": "A party to a contract, whose consent was caused by fraud or misrepresentation, may, if he thinks fit, insist that the contract shall be performed, and that he shall be put in the position in which he would have been if the representations made had been true.", "l": 0}, {"t": "Exception.– If such consent was caused by misrepresentation or by silence, fraudulent within the meaning of section 17, the contract, nevertheless, is not voidable, if the party whose consent was so caused had the means of discovering the truth with ordinary diligence.", "l": 0}, {"t": "Explanation.– A fraud or misrepresentation which did not cause the consent to a contract of the party on whom such fraud was practised, or to whom such misrepresentation was made, does not render a contract voidable.", "l": 0}], "ills": [{"t": "(a) A, intending to deceive B, falsely represents that five hundred maunds of indigo are made annually at A's factory, and thereby induces B to buy the factory. The contract is voidable at the option of B.", "l": 0}, {"t": "(b) A, by a misrepresentation, leads B erroneously to believe that five hundred maunds of indigo are made annually at A's factory. B examines the accounts of the factory, which show that only four hundred maunds of indigo have been made. After this B buys the factory. The contract is not voidable on account of A's misrepresentation.", "l": 0}, {"t": "(c) A fraudulently informs B that A's estate is free from encumbrance. B thereupon buys the estate. The estate is subject to a mortgage. B may either avoid the contract, or may insist on its being carried out and the mortgage-debt redeemed.", "l": 0}, {"t": "(d) B, having discovered a vein of ore on the estate of A, adopts means to conceal, and does conceal, the existence of the ore from A. Through A's ignorance B is enabled to buy the estate at an under-value. The contract is voidable at the option of A.", "l": 0}, {"t": "(e) A is entitled to succeed to an estate at the death of B; B dies: C, having received intelligence of B's death, prevents the intelligence reaching A, and thus induces A to sell him his interest in the estate. The sale is voidable at the option of A.", "l": 0}]}]}, {"secs": ["19A"], "code": "S.19A", "term": "Power to set aside contract induced by undue influence", "sub": "voidable, and the court may set aside on just terms", "hook": "Undue influence gets its own section: avoid it, and the court tidies up the accounts.", "plain": "A contract induced by undue influence is <b>voidable at the option</b> of the party whose consent was so caused. The court may set it aside <b>absolutely</b> or, if that party has <b>received a benefit</b>, <b>on such terms and conditions as the court thinks just</b> (illustration (b): bond for Rs 200 set aside, borrower to repay the Rs 100 actually advanced with just interest). The section was <b>inserted in 1899</b> (see the source footnote noted in the project text).", "cases": [{"n": "Lloyds Bank v Bundy", "c": "[1975] QB 326 (CA)", "t": "A farmer guaranteed his son’s company debt with his only asset, the family home, on the bank’s advice and without independent advice. The guarantee was set aside; Lord Denning’s wider “inequality of bargaining power” principle has not been followed as such.", "v": 1}], "links": [{"l": "S.16: undue influence defined", "m": 4, "sec": "S.16"}, {"l": "S.178A: pledge under a voidable contract (Module 13)", "m": 13, "sec": "S.178A"}], "feeds": "Free consent", "blocks": [{"h": "S.19A Power to set aside contract induced by undue influence.", "paras": [{"t": "When consent to an agreement is caused by undue influence, the agreement is a contract voidable at the option of the party whose consent was so caused.", "l": 0}, {"t": "Any such contract may be set aside either absolutely or, if the party who was entitled to avoid it has received any benefit thereunder, upon such terms and conditions as to the Court may seem just.", "l": 0}], "ills": [{"t": "(a) A's son has forged B's name to a promissory note. B, under threat of prosecuting A's son, obtains a bond from A for the amount of the forged note. If B sues on this bond, the Court may set the bond aside.", "l": 0}, {"t": "(b) A, a money-lender, advances Rupees 100 to B, an agriculturist, and, by undue influence, induces B to execute a bond for Rupees 200 with interest at 6 per cent. per month. The Court may set the bond aside, ordering B to repay the Rupees 100 with such interest as may seem just.]", "l": 0}]}]}, {"secs": ["20"], "code": "S.20", "term": "Agreement void where both parties are under mistake as to matter of fact", "sub": "bilateral mistake about an essential fact", "hook": "If the horse was dead before the handshake, there was never a horse to sell.", "plain": "Three conditions for <b>void</b>: (1) <b>both</b> parties are mistaken (bilateral); (2) the mistake is about a <b>matter of fact</b>; (3) the fact is <b>essential to the agreement</b>. <b>Explanation:</b> an erroneous opinion as to <b>value</b> is <b>not</b> a mistake of fact. Illustrations: cargo already lost at sea; horse already dead; life estate ended by the death of the measuring life.", "cases": [{"n": "Bell v Lever Bros", "c": "[1932] AC 161 (HL)", "t": "Two executives were paid off, unaware that they had breached their duties. The House of Lords held the mistake was not fundamental enough to void the payment contracts.", "v": 1}, {"n": "Couturier v Hastie", "c": "(1856) 5 HL Cas 673 (HL)", "t": "A cargo of corn was sold while both sides thought it was at sea; it had already been sold off as it was decaying. The buyer was not liable for the price because the subject-matter no longer existed.", "v": 1}], "links": [{"l": "S.13: consent, the same thing in the same sense", "m": 3, "sec": "S.13"}, {"l": "S.56: later impossibility (Module 8)", "m": 8, "sec": "S.56"}], "feeds": "Free consent; Not expressly void", "exam": 1, "blocks": [{"h": "S.20 Agreement void where both parties are under mistake as to matter of fact.", "paras": [{"t": "Where both the parties to an agreement are under a mistake as to a matter of fact essential to the agreement, the agreement is void.", "l": 0}, {"t": "Explanation.– An erroneous opinion as to the value of the thing which forms the subject-matter of the agreement is not to be deemed a mistake as to a matter of fact.", "l": 0}], "ills": [{"t": "(a) A agrees to sell to B a specific cargo of goods supposed to be on its way from England to [Karachi]. It turns out that, before the day of the bargain, the ship conveying the cargo had been cast away and the goods lost. Neither party was aware of the facts. The agreement is void.", "l": 0}, {"t": "(b) A agrees to buy from B a certain horse. It turns out that the horse was dead at the time of the bargain, though neither party was aware of the fact. The agreement is void.", "l": 0}, {"t": "(c) A, being entitled to an estate for the life of B, agrees to sell it to C. B was dead at the time of the agreement, but both parties were ignorant of the fact. The agreement is void.", "l": 0}]}]}, {"secs": ["21"], "code": "S.21", "term": "Effect of mistakes as to law", "sub": "Pakistani law: no relief; foreign law: treated as fact", "hook": "Ignorance of our own law excuses no one. Ignorance of a foreign law is just a fact you did not know.", "plain": "<b>Two rules:</b> (1) a contract is <b>not voidable</b> because of a mistake as to a <b>law in force in Pakistan</b>; (2) a mistake as to a law <b>not</b> in force in Pakistan has the <b>same effect as a mistake of fact</b> (so S.20 can apply if both parties made it). Illustration: both parties wrongly believe a debt is time-barred; the contract is not voidable. The text shows “[*******]” where original wording was removed.", "cases": [], "links": [{"l": "S.20: mistake of fact", "m": 4, "sec": "S.20"}], "feeds": "Free consent", "blocks": [{"h": "S.21 Effect of mistakes as to law.", "paras": [{"t": "A contract is not voidable because it was caused by a mistake as to any law in force in [Pakistan]; but a mistake as to a law not in force in [Pakistan] has the same effect as a mistake of fact.", "l": 0}, {"t": "[*******]", "l": 0}], "ills": [{"t": "A and B make a contract grounded on the erroneous belief that a particular debt is barred by the [Pakistan] Law of Limitation: the contract is not voida
